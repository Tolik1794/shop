ize="13" lengthAdjust="spacing" textLength="142.6445" x="818.05" y="377.4666">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.895" x="818.05" y="392.7772">- Purchase entity exists with most fields from Database.puml.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.835" x="818.05" y="408.0877">- PurchaseStatus enum is updated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.0083" x="818.05" y="423.3983">- No admin Purchase CRUD/workflow is implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4097" x="818.05" y="438.7088">- Supplier entity/relation is not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="818.05" y="454.0194">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="818.05" y="469.3299">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.1372" x="818.05" y="484.6405">- Purchase number must be generated per store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.4761" x="818.05" y="499.951">- Currency/exchange rate are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.313" x="818.05" y="515.2616">- Supplier fields must be copied into snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.2266" x="818.05" y="530.5721">- Totals and base totals must be calculated from entries.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="818.05" y="545.8827">- Delivery cost distribution strategy must be defined.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="89" id="ent0024"><path d="M309.8,821.5983 L309.8,923.4616 L762.1994,923.4616 L762.1994,831.5983 L752.1994,821.5983 L309.8,821.5983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M752.1994,821.5983 L752.1994,831.5983 L762.1994,831.5983 L752.1994,821.5983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="315.8" y="839.1666">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.4023" x="315.8" y="854.4772">- Product name/code/unit are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.0649" x="315.8" y="869.7877">- unitCostBase uses exchangeRateToBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.8584" x="315.8" y="885.0983">- Receiving should create InventoryDocument and StockMovement,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.9912" x="324.0266" y="900.4088">not manually update WarehouseStock in controller.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.3994" x="315.8" y="915.7194">- receivedQuantity and returnedQuantity are cached progress fields.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="98" id="ent0027"><path d="M331.53,1110.4183 L331.53,1258.2132 L740.4734,1258.2132 L740.4734,1120.4183 L730.4734,1110.4183 L331.53,1110.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M730.4734,1110.4183 L730.4734,1120.4183 L740.4734,1120.4183 L730.4734,1110.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="337.53" y="1127.9866">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="337.53" y="1143.2972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.1787" x="337.53" y="1158.6077">1. Complete Supplier stage first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6465" x="337.53" y="1173.9183">2. Add PurchaseManager:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.6035" x="349.8698" y="1189.2288">create draft, add/update/remove entries, recalculate totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.3262" x="337.53" y="1204.5394">3. Add Purchase CRUD with entries collection.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.9873" x="337.53" y="1219.8499">4. Add receiving action later:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.5249" x="349.8698" y="1235.1605">create purchase_receipt InventoryDocument.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.3735" x="337.53" y="1250.471">5. Add tests for totals, snapshots and status transitions.</text></g><!--link Supplier to Purchase--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="64" id="lnk6"><path codeLine="64" d="M539,168.2683 C539,194.9983 539,210.1783 539,260.3983" fill="none" id="Supplier-Purchase" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="539" x2="539" y1="164.2683" y2="153.2683"/><ellipse cx="539" cy="164.2683" fill="none" rx="4" ry=
 y="532.3166">amount: decimal(14,4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="247.38" cy="545.0138" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.3652" x="256.38" y="548.8048">amountBase: decimal(14,4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="247.38" cy="561.5021" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.9551" x="256.38" y="565.2931">currency: Currency</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="247.38" cy="577.9904" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.6172" x="256.38" y="581.7814">exchangeRateToBase: decimal(18,8)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.5742" x="256.38" y="598.2697">paidAt: DateTimeImmutable?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="256.38" y="614.758">comment: text?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="247.38" cy="627.4552" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="256.38" y="631.2462">createdAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="247.38" cy="643.9435" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.1572" x="256.38" y="647.7345">updatedAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.4785" x="256.38" y="664.2228">deletedAt: DateTimeImmutable?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="247.38" cy="676.9201" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="256.38" y="680.7111">store: Store</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.3779" x="256.38" y="697.1994">order: Order?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.2041" x="256.38" y="713.6877">purchase: Purchase?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.7764" x="256.38" y="730.1759">createdBy: User?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.3887" x="256.38" y="746.6642">updatedBy: User?</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="50" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="307.24" y="278.8783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="310.24" y="297.4134">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="308.24" x2="347.1443" y1="305.3666" y2="305.3666"/><line style="stroke:#181818;stroke-width:0.5;" x1="308.24" x2="347.1443" y1="313.3666" y2="313.3666"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="51" id="ent0008"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="383.29" y="278.8783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="386.29" y="297.4134">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="384.29" x2="449.0957" y1="305.3666" y2="305.3666"/><line style="stroke:#181818;stroke-width:0.5;" x1="384.29" x2="449.0957" y1="313.3666" y2="313.3666"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="52" id="ent0010"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="485.22" y="278.8783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="488.22" y="297.4134">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="486.22" x2="529.1643" y1="305.3666" y2="305.3666"/><line style="stroke:#181818;stroke-width:0.5;" x1="486.22" x2="529.1643" y1="313.3666" y2="313.3666"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="53" id="ent0012"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="565.35" y="278.8783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="568.35" y="297.4134">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="566.35" x2="631.0326" y1="305.3666" y2="305.3666"/><line style="stroke:#181818;stroke-width:0.5;" x1="566.35" x2="631.0326" y1="313.3666" y2="313.3666"/></g><g class="entity" data-qualified-name="GMN18" data-source-line="60" id="ent0019"><path d="M541.8,480.0483 L541.8,704.3959 L959.5793,704.3959 L959.5793,490.0483 L949.5793,480.0483 L541.8,480.0483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M949.5793,480.0483 L949.5793,490.0483 L959.5793,490.0483 L949.5793,480.0483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="547.8" y="497.6166">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.3647" x="547.8" y="512.9272">- Payment entity is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.9712" x="547.8" y="528.2377">- PaymentDirection and PaymentType are not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.875" x="547.8" y="543.5483">- PaymentStatusEnum exists because Order/Purchase use it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.7793" x="547.8" y="558.8588">- Order/Purchase have paidAmountBase/paymentStatus fields,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.6123" x="556.0266" y="574.1694">but there is no payment recalculation service.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="547.8" y="589.4799">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="547.8" y="604.7905">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.8052" x="547.8" y="620.101">- Payment can belong to Order or Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.2832" x="547.8" y="635.4116">- Incoming payments usually apply to Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.9956" x="547.8" y="650.7221">- Outgoing payments usually apply to Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.2241" x="547.8" y="666.0327">- Refunds must be explicit payment rows,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.5986" x="556.0266" y="681.3432">not direct negative edits to totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.7065" x="547.8" y="696.6538">- amountBase is calculated by exchangeRateToBase.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="77" id="ent0022"><path d="M563.56,813.6183 L563.56,1022.6554 L937.8325,1022.6554 L937.8325,823.6183 L927.8325,813.6183 L563.56,813.6183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M927.8325,813.6183 L927.8325,823.6183 L937.8325,823.6183 L927.8325,813.6183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="569.56" y="831.1866">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="569.56" y="846.4972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.7266" x="569.56" y="861.8077">1. Add Payment entity, enums, repository and manager.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.1489" x="569.56" y="877.1183">2. Add Payment CRUD scoped by Store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.2725" x="569.56" y="892.4288">3. Add payments tab in Order show and Purchase show.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.3726" x="569.56" y="907.7394">4. Add PaymentManager recalculation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.8281" x="581.8998" y="923.0499">- Order.paidAmountBase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.0137" x="581.8998" y="938.3605">- Purchase.paidAmountBase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.6982" x="581.8998" y="953.671">- paymentStatus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.3193" x="569.56" y="968.9816">5. Add tests for unpaid, partially_paid, paid,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.9443" x="581.8998" y="984.2921">overpaid and refunded states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="569.56" y="999.6027">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.8218" x="569.56" y="1014.9132">Do this after Order/Purchase base CRUD exists.</text></g><!--link Store to Payment--><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="50" id="lnk7"><path codeLine="50" d="M327.69,329.5983 C327.69,353.7083 327.69,369.1583 327.69,412.4683" fill="none" id="Store-Payment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="323.69" x2="331.69" y1="325.5983" y2="325.5983"/><line style="stroke:#181818;stroke-width:1;" x1="323.69" x2="331.69" y1="328.5983" y2="328.5983"/><line style="stroke:#181818;stroke-width:1;" x1="327.69" x2="327.69" y1="329.5983" y2="321.5983"/><line style="stroke:#181818;stroke-width:1;" x1="327.69" x2="333.69" y1="422.4683" y2="430.4683"/><line style="stroke:#181818;stroke-width:1;" x1="327.69" x2="321.69" y1="422.4683" y2="430.4683"/><line style="stroke:#181818;stroke-width:1;" x1="327.69" x2="327.69" y1="422.4683" y2="430.4683"/><ellipse cx="327.69" cy="416.4683" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0771" x="328.69" y="372.6066">has payments</text></g><!--link Currency to Payment-
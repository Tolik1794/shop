" x="1927.0181" y="767.3483"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1925.0181" y="769.3483"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1925.0181" y="773.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.0381" x="1797.98" y="795.8834">Stock reservations</text></g><!--entity Production recipes and production orders--><g class="entity" data-qualified-name="Todo.Production recipes and production orders" data-source-line="25" id="ent0018"><rect fill="#F1F1F1" height="46.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="322.9395" x="930.53" y="957.7683"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1233.4695" y="962.7683"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1231.4695" y="964.7683"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1231.4695" y="968.7683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.9395" x="945.53" y="991.3034">Production recipes and production orders</text></g><!--entity Status history and audit UI--><g class="entity" data-qualified-name="Todo.Status history and audit UI" data-source-line="26" id="ent0019"><rect fill="#F1F1F1" height="46.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.5186" x="1288.24" y="957.7683"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1487.7586" y="962.7683"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1485.7586" y="964.7683"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1485.7586" y="968.7683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.5186" x="1303.24" y="991.3034">Status history and audit UI</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="32" id="ent0022"><path d="M894.14,43.4883 L894.14,298.457 L1307.8631,298.457 L1307.8631,53.4883 L1297.8631,43.4883 L894.14,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1297.8631,43.4883 L1297.8631,53.4883 L1307.8631,53.4883 L1297.8631,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.1509" x="900.14" y="61.0566">What is already in the project:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="900.14" y="76.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.8203" x="900.14" y="91.6777">- Entity mappings exist for Store, User, Currency, Unit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.3477" x="908.3666" y="106.9883">Category, Product, Warehouse, WarehouseStock,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.4185" x="908.3666" y="122.2988">Order, OrderEntry, Purchase and PurchaseEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.0557" x="900.14" y="137.6094">- Admin CRUD exists for Store, Category, Product,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5811" x="908.3666" y="152.9199">Warehouse and WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.0264" x="900.14" y="168.2305">- Fixtures exist for users, stores, currencies, units,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.4966" x="908.3666" y="183.541">category tree, product parameter names and many products.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2856" x="900.14" y="198.8516">- Database migrations were rebuilt and schema validates.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="900.14" y="214.1621">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.6919" x="900.14" y="229.4727">Important limitation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.4653" x="900.14" y="244.7832">Some entities already have fields from Database.puml,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.5557" x="900.14" y="260.0938">but business workflows are not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.8413" x="900.14" y="275.4043">Example: Order has totals/currency/status fields,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.2612" x="900.14" y="290.7148">but no order CRUD and no stock posting logic.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="51" id="ent0025"><path d="M2028.08,358.4583 L2028.08,613.427 L2411.912,613.427 L2411.912,368.4583 L2401.912,358.4583 L2028.08,358.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2401.912,358.4583 L2401.912,368.4583 L2411.912,368.4583 L2401.912,358.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5444" x="2034.08" y="376.0266">Recommended execution order:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2034.08" y="391.3372">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.0645" x="2034.08" y="406.6477">01_Core_Store_User_Reference_Data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.8384" x="2034.08" y="421.9583">02_Catalog_Product_And_Pricing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.8345" x="2034.08" y="437.2688">03_Parties_Customers_And_Suppliers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4258" x="2034.08" y="452.5794">04_Warehouse_Stock_Base</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0381" x="2034.08" y="467.8899">05_Sales_Orders</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9155" x="2034.08" y="483.2005">06_Purchases</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.0337" x="2034.08" y="498.511">07_Payments</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.9468" x="2034.08" y="513.8216">08_Inventory_Documents_And_Movements</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.4063" x="2034.08" y="529.1321">09_Stock_Reservations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.0127" x="2034.08" y="544.4427">10_Production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7769" x="2034.08" y="559.7532">11_Status_History_Audit_And_Deletions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2034.08" y="575.0638">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.832" x="2034.08" y="590.3743">The order matters because later modules depend on data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.1211" x="2034.08" y="605.6848">and workflows from earlier modules.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="70" id="ent0028"><path d="M2003.17,673.4183 L2003.17,897.7659 L2480.8394,897.7659 L2480.8394,683.4183 L2470.8394,673.4183 L2003.17,673.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2470.8394,673.4183 L2470.8394,683.4183 L2480.8394,683.4183 L2470.8394,673.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.231" x="2009.17" y="690.9866">Implementation rules for all stages:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2009.17" y="706.2972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.604" x="2009.17" y="721.6077">1. Do not rename existing routes/selectors/form field names</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.1001" x="2021.5098" y="736.9183">unless the task explicitly asks for it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.9688" x="2009.17" y="752.2288">2. Keep CRUD and business logic separate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.0254" x="2021.5098" y="767.5394">controllers stay thin, managers/services perform posting,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.9497" x="2021.5098" y="782.8499">recalculation and workflow transitions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.6753" x="2009.17" y="798.1605">3. Add fixtures only for base dictionaries and repeatable test data.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="456.6694" x="2009.17" y="813.471">4. For stock and money flows, write tests before changing posting logic.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.6938" x="2009.17" y="828.7816">5. After each stage run:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.7397" x="2021.5098" y="844.0921">- doctrine:schema:validate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3354" x="2021.5098" y="859.4027">- lint:container</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.2461" x="2021.5098" y="874.7132">- focused PHPUnit tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.3511" x="2021.5098" y="890.0238">- fixtures load when fixtures changed</text></g><!--link Done to Todo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" data-link-type="dependency" data-source-line="29" id="lnk20"><path d="M867.3114,328.2583 C867.7302,328.2583 868.1642,328.2583 868.6133,328.2583 C869.5115,328.2583 870.4702,328.2583 871.4883,328.2583 C879.6328,328.2583 891.5781,328.2583 906.7813,328.2583 C937.1875,328.2583 980.625,328.2583 1032.75,328.2583 C1137,328.2583 1276,328.2583 1415,328.2583 C1693,328.2583 1971,328.2583 1971,328.2583 C1971,328.2583 1971,364.6583 1971,402.4808 C1971,407.2086 1971,411.9586 1971,416.6626 C1971,417.2506 1971,417.8379 1971,418.4243 C1971,418.7175 1971,413.0105 1971,413.3032" fill="none" id="Done-to-Todo" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1971,419.3032,1975,410.3032,1971,414.3032,1967,410.3032,1971,419.3032" style="st
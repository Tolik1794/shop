<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="713px" preserveAspectRatio="none" style="width:880px;height:713px;background:#FFFFFF;" version="1.1" viewBox="0 0 880 713" width="880px" zoomAndPan="magnify"><title>09. Stock reservations and availability</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.75" x="295.6395" y="23.5352">09. Stock reservations and availability</text></g><!--class StockReservationStatus--><g class="entity" data-qualified-name="StockReservationStatus" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="108.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="163.165" x="7" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.165" x="10" y="63.0234">StockReservationStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="169.165" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.2314" x="13" y="88.5117">active</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.3467" x="13" y="105">completed</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.2197" x="13" y="121.4883">canceled</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.584" x="13" y="137.9766">expired</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="169.165" y1="144.9297" y2="144.9297"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="14" id="ent0003"><rect fill="#F1F1F1" height="190.8828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:
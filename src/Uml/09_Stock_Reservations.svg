family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.3926" x="132.32" y="380.6214">canceledAt: DateTimeImmutable?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="123.32" cy="393.3187" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.583" x="132.32" y="397.1097">orderEntry: OrderEntry</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="123.32" cy="409.807" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.4277" x="132.32" y="413.598">warehouseStock: WarehouseStock</text></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="27" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="204.83" y="77.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="207.83" y="96.0034">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="205.83" x2="283.33" y1="103.9566" y2="103.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="205.83" x2="283.33" y1="111.9566" y2="111.9566"/></g><!--class WarehouseStock--><g class="entity" data-qualified-name="WarehouseStock" data-source-line="28" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="116.8789" x="319.14" y="77.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.8789" x="322.14" y="96.0034">WarehouseStock</text><line style="stroke:#181818;stroke-width:0.5;" x1="320.14" x2="435.0189" y1="103.9566" y2="103.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="320.14" x2="435.0189" y1="111.9566" y2="111.9566"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="32" id="ent0010"><path d="M412.13,212.9383 L412.13,437.2859 L873.0289,437.2859 L873.0289,222.9383 L863.0289,212.9383 L412.13,212.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M863.0289,212.9383 L863.0289,222.9383 L873.0289,222.9383 L863.0289,212.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="418.13" y="230.5066">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.5391" x="418.13" y="245.8172">- StockReservation is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6162" x="418.13" y="261.1277">- WarehouseStock.reservedQuantity exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.2012" x="418.13" y="276.4383">- OrderEntry exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.7617" x="418.13" y="291.7488">- Store.allowBackorders exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="418.13" y="307.0594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="418.13" y="322.3699">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="439.8989" x="418.13" y="337.6805">- Active reservations contribute to WarehouseStock.reservedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="417.4854" x="418.13" y="352.991">- Completed/canceled/expired reservations must not be counted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.5332" x="418.13" y="368.3016">- Reservation cannot exceed available quantity:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.3755" x="426.3566" y="383.6121">quantityOnHand - reservedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.25" x="418.13" y="398.9227">- If Store.allowBackorders = true,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.1367" x="426.3566" y="414.2332">OrderEntry can exist without reservation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.6821" x="418.13" y="429.5438">- Reservation completion usually happens on shipment posting.</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="49" id="ent0013"><path d="M430.53,497.2783 L430.53,706.3154 L854.6443,706.3154 L854.6443,507.2783 L844.6443,497.2783 L430.53,497.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M844.6443,497.2783 L844.6443,507.2783 L854.6443,507.2783 L844.6443,497.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="436.53" y="514.8466">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="436.53" y="530.1572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.5146" x="436.53" y="545.4677">1. Add StockReservation entity, enum and repository.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.1909" x="436.53" y="560.7783">2. Add ReservationService:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.5059" x="448.8698" y="576.0888">reserve(orderEntry, warehouseStock, quantity),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.5117" x="448.8698" y="591.3994">release(reservation),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9688" x="448.8698" y="606.7099">complete(reservation),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.1846" x="448.8698" y="622.0205">expireOldReservations().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.3765" x="436.53" y="637.331">3. Update Order confirmation workflow to reserve stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.1143" x="436.53" y="652.6416">4. Update Inventory shipment posting to complete reservations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.4565" x="436.53" y="667.9521">5. Add tests for over-reservation, release and backorders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="436.53" y="683.2627">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.73" x="436.53" y="698.5732">Do this after InventoryDocument shipment flow is available.</text></g><!--link OrderEntry to StockReservation--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="27" id="lnk5"><path codeLine="27" d="M244.58,128.4183 C244.58,153.6583 244.58,171.0083 244.58,211.3283" fill="none" id="OrderEntry-StockReservation" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="240.58" x2="248.58" y1="124.4183" y2="124.4183"/><line style="stroke:#181818;stroke-width:1;" x1="240.58" x2="248.58" y1="127.4183" y2="127.4183"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="244.58" y1="128.4183" y2="120.4183"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="250.58" y1="221.3283" y2="229.3283"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="238.58" y1="221.3283" y2="229.3283"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="244.58" y1="221.3283" y2="229.3283"/><ellipse cx="244.58" cy="215.3283" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.3491" x="191.58" y="171.4466">reserves</text></g><!--link WarehouseStock to StockReservation--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="28" id="lnk7"><path codeLine="28" d="M347.99,128.4183 C347.99,153.6583 347.99,171.0083 347.99,211.3283" fill="none" id="WarehouseStock-StockReservation" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="343.99" x2="351.99" y1="124.4183" y2="124.4183"/><line style="stroke:#181818;stroke-width:1;" x1="343.99" x2="351.99" y1="127.4183" y2="127.4183"/><line style="stroke:#181818;stroke-width:1;" x1="347.99" x2="347.99" y1="128.4183" y2="120.4183"/><line style="stroke:#181818;stroke-width:1;" x1="347.99" x2="353.99" y1="221.3283" y2="229.3283"/><line style="stroke:#181818;stroke-width:1;" x1="347.99" x2="341.99" y1="221.3283" y2="229.3283"/><line style="stroke:#181818;stroke-width:1;" x1="347.99" x2="347.99" y1="221.3283" y2="229.3283"/><ellipse cx="347.99" cy="215.3283" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.2388" x="258.99" y="171.4466">reserved from</text></g><!--link StockReservationStatus to StockReservation--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="29" id="l
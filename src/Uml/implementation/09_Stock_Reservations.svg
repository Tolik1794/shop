<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="774px" preserveAspectRatio="none" style="width:866px;height:774px;background:#FFFFFF;" version="1.1" viewBox="0 0 866 774" width="866px" zoomAndPan="magnify"><title>09. Stock reservations and availability</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.75" x="288.9381" y="23.5352">09. Stock reservations and availability</text></g><!--class StockReservationStatus--><g class="entity" data-qualified-name="StockReservationStatus" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="108.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="163.165" x="7" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.165" x="10" y="63.0234">StockReservationStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="169.165" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.2314" x="13" y="88.5117">active</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.3467" x="13" y="105">completed</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.2197" x="13" y="121.4883">canceled</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.584" x="13" y="137.9766">expired</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="169.165" y1="144.9297" y2="144.9297"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="14" id="ent0003"><rect fill="#F1F1F1" height="157.9063" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="255.4277" x="116.87" y="261.4583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5957" x="186.786" y="279.9934">StockReservation</text><line style="stroke:#181818;stroke-width:0.5;" x1="117.87" x2="371.2977" y1="287.9466" y2="287.9466"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="127.87" cy="301.6907" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="136.87" y="305.4817">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="117.87" x2="371.2977" y1="312.4348" y2="312.4348"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="127.87" cy="326.179" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.3838" x="136.87" y="329.97">quantity: decimal(14,4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="127.87" cy="342.6673" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.1904" x="136.87" y="346.4583">status: StockReservationStatus</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="127.87" cy="359.1555" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3174" x="136.87" y="362.9466">reservedAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.082" x="136.87" y="379.4348">expiresAt: DateTimeImmutable?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="127.87" cy="392.1321" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.583" x="136.87" y="395.9231">orderEntry: OrderEntry</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="127.87" cy="408.6204" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.4277" x="136.87" y="412.4114">warehouseStock: WarehouseStock</text></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="25" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="204.83" y="77.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="207.83" y="96.0034">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="205.83" x2="283.33" y1="103.9566" y2="103.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="205.83" x2="283.33" y1="111.9566" y2="111.9566"/></g><!--class WarehouseStock--><g class="entity" data-qualified-name="WarehouseStock" data-source-line="26" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="116.8789" x="319.14" y="77.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.8789" x="322.14" y="96.0034">WarehouseStock</text><line style="stroke:#181818;stroke-width:0.5;" x1="320.14" x2="435.0189" y1="103.9566" y2="103.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="320.14" x2="435.0189" y1="111.9566" y2="111.9566"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="30" id="ent0010"><path d="M407.22,212.9283 L407.22,467.897 L839.9417,467.897 L839.9417,222.9283 L829.9417,212.9283 L407.22,212.9283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M829.9417,212.9283 L829.9417,222.9283 L839.9417,222.9283 L829.9417,212.9283" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="413.22" y="230.4966">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.5391" x="413.22" y="245.8072">- StockReservation is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6162" x="413.22" y="261.1177">- WarehouseStock.reservedQuantity exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.2012" x="413.22" y="276.4283">- OrderEntry exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.7617" x="413.22" y="291.7388">- Store.allowBackorders exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="413.22" y="307.0494">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="413.22" y="322.3599">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="413.22" y="337.6705">- quantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.0366" x="413.22" y="352.981">- active reservations contribute to reservedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.6602" x="413.22" y="368.2916">- completed/canceled/expired reservations do not count.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6631" x="413.22" y="383.6021">- active reservations must not exceed available stock:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.3755" x="421.4466" y="398.9127">quantityOnHand - reservedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.5044" x="413.22" y="414.2232">- Backorders are allowed at OrderEntry level only;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.2393" x="421.4466" y="429.5338">WarehouseStock itself must never go negative.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.7217" x="413.22" y="444.8443">- OrderEntry can remain unreserved when allowBackorders=true.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.5996" x="413.22" y="460.1548">- Shipment posting completes matching reservations.</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="49" id="ent0013"><path d="M387.53,527.8983 L387.53,767.5565 L859.6262,767.5565 L859.6262,537.8983 L849.6262,527.8983 L387.53,527.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M849.6262,527.8983 L849.6262,537.8983 L859.6262,537.8983 L849.6262,527.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="393.53" y="545.4666">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="393.53" y="560.7772">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.5146" x="393.53" y="576.0877">1. Add StockReservation entity, enum and repository.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.1909" x="393.53" y="591.3983">2. Add ReservationService:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.5059" x="405.8698" y="606.7088">reserve(orderEntry, warehouseStock, quantity),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.5117" x="405.8698" y="622.0194">release(reservation),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9688" x="405.8698" y="637.3299">complete(reservation),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.1846" x="405.8698" y="652.6405">expireOldReservations().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.4541" x="393.53" y="667.951">3. Update Order confirmation workflow to reserve available stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.1143" x="393.53" y="683.2616">4. Update Inventory shipment posting to complete reservations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.0962" x="393.53" y="698.5721">5. Re-evaluate awaiting_stock/ready_to_ship after reservation changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.5786" x="393.53" y="713.8827">6. Add tests for over-reservation, partial reservation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.1489" x="405.8698" y="729.1932">release, expiration, shipment completion and backorders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="393.53" y="744.5038">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="441.7842" x="393.53" y="759.8143">Do this after InventoryDocuments and 08.1 progress synchronization.</text></g><!--link OrderEntry to StockReservation--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="25" id="lnk5"><path codeLine="25" d="M244.58,128.1583 C244.58,159.5283 244.58,193.5583 244.58,243.0383" fill="none" id="OrderEntry-StockReservation" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="240.58" x2="248.58" y1="124.1583" y2="124.1583"/><line style="stroke:#181818;stroke-width:1;" x1="240.58" x2="248.58" y1="127.1583" y2="127.1583"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="244.58" y1="128.1583" y2="120.1583"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="250.58" y1="253.0383" y2="261.0383"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="238.58" y1="253.0383" y2="261.0383"/><line style="stroke:#181818;stroke-width:1;" x1="244.58" x2="244.58" y1="253.0383" y2="261.0383"/><ellipse cx="244.58" cy="247.0383" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.3491" x="191.58" y="187.1666">reserves</text></g><!--link WarehouseStock to StockReservation--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="26" id="lnk7"><path codeLine="26" d="M345.72,128.1583 C345.72,159.5283 345.72,193.5583 345.72,243.0383" fill="none" id="WarehouseStock-StockReservation" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="341.72" x2="349.72" y1="124.1583" y2="124.1583"/><line style="stroke:#181818;stroke-width:1;" x1="341.72" x2="349.72" y1="127.1583" y2="127.1583"/><line style="stroke:#181818;stroke-width:1;" x1="345.72" x2="345.72" y1="128.1583" y2="120.1583"/><line style="stroke:#181818;stroke-width:1;" x1="345.72" x2="351.72" y1="253.0383" y2="261.0383"/><line style="stroke:#181818;stroke-width:1;" x1="345.72" x2="339.72" y1="253.0383" y2="261.0383"/><line style="stroke:#181818;stroke-width:1;" x1="345.72" x2="345.72" y1="253.0383" y2="261.0383"/><ellipse cx="345.72" cy="247.0383" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.2388" x="256.72" y="187.1666">reserved from</text></g><!--link StockReservationStatus to StockReservation--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="27" id="lnk8"><path codeLine="27" d="M143.52,161.2583 C143.52,193.1383 143.52,207.9483 143.52,243.3083" fill="none" id="StockReservationStatus-StockReservation" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="139.52" x2="147.52" y1="157.2583" y2="157.2583"/><line style="stroke:#181818;stroke-width:1;" x1="139.52" x2="147.52" y1="160.2583" y2="160.2583"/><line style="stroke:#181818;stroke-width:1;" x1="143.52" x2="143.52" y1="161.2583" y2="153.2583"/><line style="stroke:#181818;stroke-width:1;" x1="143.52" x2="149.52" y1="253.3083" y2="261.3083"/><line style="stroke:#181818;stroke-width:1;" x1="143.52" x2="137.52" y1="253.3083" y2="261.3083"/><line style="stroke:#181818;stroke-width:1;" x1="143.52" x2="143.52" y1="253.3083" y2="261.3083"/><ellipse cx="143.52" cy="247.3083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.2637" x="91.52" y="203.8466">controls</text></g><!--link StockReservation to GMN9--><g class="link" data-entity-1="ent0003" data-entity-2="ent0010" data-link-type="association" data-source-line="30" id="lnk11"><path d="M372.63,340.5583 C383.8,340.5583 395.29,340.5583 406.92,340.5583" fill="none" id="StockReservation-GMN9" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link GMN9 to GMN12--><g class="link" data-entity-1="ent0010" data-entity-2="ent0013" data-link-type="association" data-source-line="49" id="lnk14"><path d="M623.58,468.0783 C623.58,487.8683 623.
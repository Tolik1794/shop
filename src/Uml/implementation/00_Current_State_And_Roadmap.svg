234">Production recipes and production orders</text></g><!--entity Status history and audit UI--><g class="entity" data-qualified-name="Todo.Status history and audit UI" data-source-line="27" id="ent0020"><rect fill="#F1F1F1" height="46.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.5186" x="1544.24" y="988.3883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1743.7586" y="993.3883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1741.7586" y="995.3883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1741.7586" y="999.3883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.5186" x="1559.24" y="1021.9234">Status history and audit UI</text></g><!--entity Universal status transition service--><g class="entity" data-qualified-name="Todo.Universal status transition service" data-source-line="28" id="ent0021"><rect fill="#F1F1F1" height="46.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="268.6484" x="1798.68" y="988.3883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="2047.3284" y="993.3883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="2045.3284" y="995.3883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="2045.3284" y="999.3883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.6484" x="1813.68" y="1021.9234">Universal status transition service</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="34" id="ent0024"><path d="M894.14,43.4883 L894.14,298.457 L1307.8631,298.457 L1307.8631,53.4883 L1297.8631,43.4883 L894.14,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1297.8631,43.4883 L1297.8631,53.4883 L1307.8631,53.4883 L1297.8631,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.1509" x="900.14" y="61.0566">What is already in the project:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="900.14" y="76.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.8203" x="900.14" y="91.6777">- Entity mappings exist for Store, User, Currency, Unit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.3477" x="908.3666" y="106.9883">Category, Product, Warehouse, WarehouseStock,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.4185" x="908.3666" y="122.2988">Order, OrderEntry, Purchase and PurchaseEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.0557" x="900.14" y="137.6094">- Admin CRUD exists for Store, Category, Product,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5811" x="908.3666" y="152.9199">Warehouse and WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.0264" x="900.14" y="168.2305">- Fixtures exist for users, stores, currencies, units,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.4966" x="908.3666" y="183.541">category tree, product parameter names and many products.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2856" x="900.14" y="198.8516">- Database migrations were rebuilt and schema validates.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="900.14" y="214.1621">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.6919" x="900.14" y="229.4727">Important limitation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.4653" x="900.14" y="244.7832">Some entities already have fields from Database.puml,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.5557" x="900.14" y="260.0938">but business workflows are not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.8413" x="900.14" y="275.4043">Example: Order has totals/currency/status fields,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.2612" x="900.14" y="290.7148">but no order CRUD and no stock posting logic.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="53" id="ent0027"><path d="M2148.08,358.4483 L2148.08,644.0381 L2531.912,644.0381 L2531.912,368.4483 L2521.912,358.4483 L2148.08,358.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2521.912,358.4483 L2521.912,368.4483 L2531.912,368.4483 L2521.912,358.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5444" x="2154.08" y="376.0166">Recommended execution order:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2154.08" y="391.3272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.0645" x="2154.08" y="406.6377">01_Core_Store_User_Reference_Data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.8384" x="2154.08" y="421.9483">02_Catalog_Product_And_Pricing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.8345" x="2154.08" y="437.2588">03_Parties_Customers_And_Suppliers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4258" x="2154.08" y="452.5694">04_Warehouse_Stock_Base</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0381" x="2154.08" y="467.8799">05_Sales_Orders</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.106" x="2154.08" y="483.1905">05.1_Order_Comments_And_History</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9155" x="2154.08" y="498.501">06_Purchases</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.0337" x="2154.08" y="513.8116">07_Payments</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.9468" x="2154.08" y="529.1221">08_Inventory_Documents_And_Movements</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.4063" x="2154.08" y="544.4327">09_Stock_Reservations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.0127" x="2154.08" y="559.7432">10_Production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7769" x="2154.08" y="575.0538">11_Status_History_Audit_And_Deletions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.8574" x="2154.08" y="590.3643">11.1_Universal_Status_Transition_Service</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2154.08" y="605.6748">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.832" x="2154.08" y="620.9854">The order matters because later modules depend on data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.1211" x="2154.08" y="636.2959">and workflows from earlier modules.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="74" id="ent0030"><path d="M2123.17,704.0383 L2123.17,928.3859 L2600.8394,928.3859 L2600.8394,714.0383 L2590.8394,704.0383 L2123.17,704.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2590.8394,704.0383 L2590.8394,714.0383 L2600.8394,714.0383 L2590.8394,704.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.231" x="2129.17" y="721.6066">Implementation rules for all stages:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2129.17" y="736.9172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.604" x="2129.17" y="752.2277">1. Do not rename existing routes/selectors/form field names</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.1001" x="2141.5098" y="767.5383">unless the task explicitly asks for it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.9688" x="2129.17" y="782.8488">2. Keep CRUD and business logic separate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.0254" x="2141.5098" y="798.1594">controllers stay thin, managers/services perform posting,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.9497" x="2141.5098" y="813.4699">recalculation and workflow transitions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.6753" x="2129.17" y="828.7805">3. Add fixtures only for base dictionaries and repeatable test data.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="456.6694" x="2129.17" y="844.091">4. For stock and money flows, write tests before changing posting logic.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.6938" x="2129.17" y="859.4016">5. After each stage run:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.7397" x="2141.5098" y="874.7121">- doctrine:schema:validate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3354" x="2141.5098" y="890.0227">- lint:container</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.2461" x="2141.5098" y="905.3332">- focused PHPUnit tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.3511" x="2141.5098" y="920.6438">- fixtures load when fixtures changed</text></g><!--link Done to Todo--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" data-link-type="dependency" data-source-line="31" id="lnk22"><path d="M868.2083,417.8783 C868.6723,417.8783 869.1531,417.8783 869.6507,417.8783 C870.6459,417.8783 871.708,417.8783 872.8359,417.8783 C881.8594,417.8783 895.0938,417.8783 911.9375,417.8783 C945.625,417.8783 993.75,417.8783 1051.5,417.8783 C1167,417.8783 1321,417.8783 1475,417.8783 C1783,417.8783 2091,417.8783 2091,417.8783 C2091,417.8783 2091,422.612 2091,429.8236 C2091,430.725 2091,431.6652 2091,432.6397 C2091,433.1269 2091,433.6227 2091,434.1266 C2091,434.3785 2091,428.6324 2091,428.8883" fill="none" id="Done-to-Todo" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="2091,434.8883,2095,425.8883,2091,429.8883,2087,425.8883,2091,434.8883" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.1523" x="1327.32" y="414.4466">next tasks</text></g><!--link Done to GMN23--><g class="link" data-entity-1="ent0002" data-entity-2="ent0024" data-link-type="association" data-source-line="34" id="lnk25"><path d="M867.0378,170.8783 C868.2638,170.8783 869.6178,170.8783 871.0913,170.8783 C876.985,170.8783 884.79,170.8783 893.96,170.8783" fill="none" id="Done-GMN23" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link Todo to GMN26--><g class="link" data-entity-1="ent0009" data-entity-2="ent0027" data-link-type="association" data-source-line="53" id="lnk28"><path d="M2099.1415,500.8783 C2099.1938,500.8783 2099.2463,500.8783 2099.2991,500.8783 C2099.7211,500.8783 2100.1579,500.8783 2100.609,500.8783 C2101.5113,500.8783 2102.471,500.8783 2103.4856,500.8783 C2105.5147,500.8783 2107.7631,500.8783 2110.21,500.8783 C2119.9975,500.8783 2132.96,500.8783 2147.76,500.8783" fill="none" id="Todo-GMN26" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link GMN26 to GMN29--><g class="link" data-entity-1="ent0027" data-entity-2="ent0030" data-link-type="association" data-source-line="74" id="lnk31"><path d="M2340,644.4483 C2340,664.2683 2340,684.3983 2340,703.5683" fill="none" id="GMN26-GMN29" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src VLPDRziu43slVyMWPyT9-h4VFYoGJLgqM1GR92bwM1G2GuqjRYXH8AaaHh7_VTyC9TbEWRtOqd0uV3Fpvb7PPSzqThQYoo56xZAbR3AJwMfoRU-vXSra5pgAmTIjwHUBnjLCraNhUP4UNDURQ5hohkEywvb2p4rOB2BRRBejeh-wy95DlTi7v1fUr8QK_P7r5Pb4Lw5Z-hxuwU_R728lwKlYM7xLy0qh1QlTmTovh1Q0teQuK-1z3FLWCoampXoJk5oFrdkJd2LhOYtMhoPo4uPKKfxVS9HzaFM_Oitnz7g8jZ5m0aoN7IS1ccp3hQ7G-TstnRz76NzsARbkIvl1U_nqLYfelCixJV4kr45JVF-CiDsMAGB_4Se-EilKk8ISToLdFBR8HO6ceU-z6pDJZ7Hvy-LAruA-FeNuiF7XQUzWGojbJWTEsRKiZTEJfnpdGFraEOnrRNOQHPu_TOzubBBNmGxxu4cgX_u-ykog1QN8QEEZykamMwKNMzTpEcoWc1Nd6C7a8KqbKJypr2xJbq-o32OymjDuPJ0SSpHTSXf43aKvjKjAhvEJtqiJrjJnSwPi
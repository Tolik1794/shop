ce-line="113" id="ent0010"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="504.29" y="118.6883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="507.29" y="137.2234">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="505.29" x2="544.1943" y1="145.1766" y2="145.1766"/><line style="stroke:#181818;stroke-width:0.5;" x1="505.29" x2="544.1943" y1="153.1766" y2="153.1766"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="119" id="ent0017"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="1266.34" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="1269.34" y="396.3434">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="1267.34" x2="1332.1457" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="1267.34" x2="1332.1457" y1="412.2966" y2="412.2966"/></g><!--class Product--><g class="entity" data-qualified-name="Product" data-source-line="124" id="ent0023"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="57.9736" x="690.75" y="760.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.9736" x="693.75" y="779.1334">Product</text><line style="stroke:#181818;stroke-width:0.5;" x1="691.75" x2="747.7236" y1="787.0866" y2="787.0866"/><line style="stroke:#181818;stroke-width:0.5;" x1="691.75" x2="747.7236" y1="795.0866" y2="795.0866"/></g><!--class Warehouse--><g class="entity" data-qualified-name="Warehouse" data-source-line="125" id="ent0025"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="80.1494" x="783.66" y="760.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.1494" x="786.66" y="779.1334">Warehouse</text><line style="stroke:#181818;stroke-width:0.5;" x1="784.66" x2="862.8094" y1="787.0866" y2="787.0866"/><line style="stroke:#181818;stroke-width:0.5;" x1="784.66" x2="862.8094" y1="795.0866" y2="795.0866"/></g><!--class WarehouseStock--><g class="entity" data-qualified-name="WarehouseStock" data-source-line="126" id="ent0027"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="116.8789" x="2013.3" y="760.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.8789" x="2016.3" y="779.1334">WarehouseStock</text><line style="stroke:#181818;stroke-width:0.5;" x1="2014.3" x2="2129.1789" y1="787.0866" y2="787.0866"/><line style="stroke:#181818;stroke-width:0.5;" x1="2014.3" x2="2129.1789" y1="795.0866" y2="795.0866"/></g><!--class WarehouseStockBatch--><g class="entity" data-qualified-name="WarehouseStockBatch" data-source-line="128" id="ent0030"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="153.7588" x="1934.86" y="1168.1183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7588" x="1937.86" y="1186.6534">WarehouseStockBatch</text><line style="stroke:#181818;stroke-width:0.5;" x1="1935.86" x2="2087.6188" y1="1194.6066" y2="1194.6066"/><line style="stroke:#181818;stroke-width:0.5;" x1="1935.86" x2="2087.6188" y1="1202.6066" y2="1202.6066"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="129" id="ent0032"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="1368.27" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="1371.27" y="396.3434">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="1369.27" x2="1412.2143" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="1369.27" x2="1412.2143" y1="412.2966" y2="412.2966"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="130" id="ent0034"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="1448.4" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="1451.4" y="396.3434">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="1449.4" x2="1514.0826" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="1449.4" x2="1514.0826" y1="412.2966" y2="412.2966"/></g><!--class ProductionOrder--><g class="entity" data-qualified-name="ProductionOrder" data-source-line="131" id="ent0036"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="118.2529" x="1549.61" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2529" x="1552.61" y="396.3434">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="1550.61" x2="1666.8629" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="1550.61" x2="1666.8629" y1="412.2966" y2="412.2966"/></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="132" id="ent0038"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="898.99" y="760.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="901.99" y="779.1334">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="899.99" x2="977.49" y1="787.0866" y2="787.0866"/><line style="stroke:#181818;stroke-width:0.5;" x1="899.99" x2="977.49" y1="795.0866" y2="795.0866"/></g><!--class PurchaseEntry--><g class="entity" data-qualified-name="PurchaseEntry" data-source-line="133" id="ent0040"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="101.2383" x="1013.12" y="760.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.2383" x="1016.12" y="779.1334">PurchaseEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="1014.12" x2="1113.3583" y1="787.0866" y2="787.0866"/><line style="stroke:#181818;stroke-width:0.5;" x1="1014.12" x2="1113.3583" y1="795.0866" y2="795.0866"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="134" id="ent0042"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="1702.56" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="1705.56" y="396.3434">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="1703.56" x2="1737.9252" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="1703.56" x2="1737.9252" y1="412.2966" y2="412.2966"/></g><g class="entity" data-qualified-name="GMN44" data-source-line="137" id="ent0045"><path d="M1503.49,662.0183 L1503.49,778.1483 L1450.89,782.1483 L1503.49,786.1483 L1503.49,901.6765 A0,0 0 0 0 1503.49,901.6765 L1977.9793,901.6765 A0,0 0 0 0 1977.9793,901.6765 L1977.9793,672.0183 L1967.9793,662.0183 L1503.49,662.0183 A0,0 0 0 0 1503.49,662.0183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1967.9793,662.0183 L1967.9793,672.0183 L1977.9793,672.0183 L1967.9793,662.0183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="1509.49" y="679.5866">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.7974" x="1509.49" y="694.8972">- InventoryDocument, InventoryDocumentLine, StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.5972" x="1517.7166" y="710.2077">and InventoryReason are not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3887" x="1509.49" y="725.5183">- WarehouseStock exists, but stock changes are still manual.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1509.49" y="740.8288">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="1509.49" y="756.1394">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.2588" x="1509.49" y="771.4499">- draft = editable and has no stock effect.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.6445" x="1509.49" y="786.7605">- posted = immutable and creates movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.3789" x="1509.49" y="802.071">- canceled = canceled through reversal logic, not destructive edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.2246" x="1509.49" y="817.3816">- only one of order, purchase or productionOrder is filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="453.4893" x="1509.49" y="832.6921">- postedBy/postedAt and canceledBy/canceledAt are filled by workflow.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.7739" x="1509.49" y="848.0027">- posted documents are corrected by reversal documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.064" x="1509.49" y="863.3132">- currency fields are optional for purely technical documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.0488" x="1509.49" y="878.6238">- reason is strongly recommended for adjustments, write-offs,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.2603" x="1517.7166" y="893.9343">returns, production loss and inventory count.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="155" id="ent0048"><path d="M285.73,355.7783 L285.73,395.1483 L250.98,399.1483 L285.73,403.1483 L285.73,442.331 A0,0 0 0 0 285.73,442.331 L737.7549,442.331 A0,0 0 0 0 737.7549,442.331 L737.7549,365.7783 L727.7549,355.7783 L285.73,355.7783 A0,0 0 0 0 285.73,355.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M727.7549,355.7783 L727.7549,365.7783 L737.7549,365.7783 L727.7549,355.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="291.73" y="373.3466">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.0249" x="291.73" y="388.6572">- Dictionary for consistent grouping and reporting of stock reasons.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.2354" x="291.73" y="403.9677">- Useful examples: damage, write-off, inventory count,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.6235" x="299.9566" y="419.2783">initial stock, customer return, production loss.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3403" x="291.73" y="434.5888">- Suggested uniqueness: store + type + name.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="163" id="ent0051"><path d="M1186.6,1123.1283 L1186.6,1185.1483 L1151.52,1189.1483 L1186.6,1193.1483 L1186.6,1255.6127 A0,0 0 0 0 1186.6,1255.6127 L1638.8788,1255.6127 A0,0 0 0 0 1638.8788,1255.6127 L1638.8788,1133.1283 L1628.8788,1123.1283 L1186.6,1123.1283 A0,0 0 0 0 1186.6,1123.1283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1628.8788,1123.1283 L1628.8788,1133.1283 L1638.8788,1133.1283 L1628.8788,1123.1283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="1192.6" y="1140.6966">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.981" x="1192.6" y="1156.0072">- quantity &gt; 0; direction defines IN/OUT.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.2788" x="1192.6" y="1171.3177">- monetary fields follow InventoryDocument currency when present.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.5942" x="1192.6" y="1186.6283">- sale_shipment uses OUT; purchase_receipt uses IN.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.0283" x="1192.6" y="1201.9388">- customer_return uses IN; supplier_return uses OUT.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="1192.6" y="1217.2494">- transfer uses paired OUT/IN lines.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.3472" x="1192.6" y="1232.5599">- One business line can be represented by multiple document lines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.373" x="1200.8266" y="1247.8705">over time for partial operations.</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="174" id="ent0054"><path d="M2095.45,1398.7383 L2095.45,1531.2227 L2530.0379,1531.2227 L2530.0379,1408.7383 L2520.0379,1398.7383 L2095.45,1398.7383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2520.0379,1398.7383 L2520.0379,1408.7383 L2530.0379,1408.7383 L2520.0379,1398.7383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="2101.45" y="1416.3066">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.9004" x="2101.45" y="1431.6172">- Created only from posted document lines.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.4634" x="2101.45" y="1446.9277">- quantityChange is signed: IN &gt; 0, OUT &lt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.166" x="2101.45" y="1462.2383">- Movements are append-only after posting.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.5879" x="2101.45" y="1477.5488">- OUT must not make WarehouseStock.quantityOnHand negative.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.0737" x="2101.45" y="1492.8594">- unitCost is stored in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.5313" x="2101.45" y="1508.1699">- average_cost uses a posting-time cost snapshot;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.4897" x="2109.6766" y="1523.4805">fifo may split one line into several batch movements.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="185" id="ent0057"><path d="M2088.25,1612.1783 L2088.25,1867.147 L2537.2344,1867.147 L2537.2344,1622.1783 L2527.2344,1612.1783 L2088.25,1612.1783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2527.2344,1612.1783 L2527.2344,1622.1783 L2537.2344,1622.1783 L2527.2344,1612.1783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="2094.25" y="1629.7466">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2094.25" y="1645.0572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.5293" x="2094.25" y="1660.3677">1. Add entities/enums/repositories for documents, reasons,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.252" x="2106.5898" y="1675.6783">lines and movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.3608" x="2094.25" y="1690.9888">2. Add InventoryPostingService:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.5864" x="2106.5898" y="1706.2994">post(document), cancel(document), createReversal(document).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.5381" x="2094.25" y="1721.6099">3. Implement stock_adjustment and inventory_count MVP first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.5166" x="2094.25" y="1736.9205">4. Then add purchase_receipt, sale_shipment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8442" x="2106.5898" y="1752.231">customer_return and supplier_return flows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.2002" x="2094.25" y="1767.5416">5. Add transfer and production document flows later.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="2094.25" y="1782.8521">6. Add tests for:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.1211" x="2106.5898" y="1798.1627">immutable posted docs, reversal logic, non-negative stock,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.8799" x="2106.5898" y="1813.4732">average-cost/FIFO rules, reason validation and audit fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.9844" x="2094.25" y="1828.7838">7. Continue with 08.1 to synchronize business-document progress.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2094.25" y="1844.0943">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.1021" x="2094.25" y="1859.4048">This is the central stock module.</text></g><!--link Store to InventoryDocument--><g class="link" data-entity-1="ent0010" data-entity-2="ent0006" data-link-type="crowfoot" data-source-line="113" id="lnk11"><path codeLine="113" d="M553.63,140.1483 C672.33,140.1483 1248.7,140.1483 1248.7,140.1483 C1248.7,140.1483 1248.7,358.5283 1248.7,544.3583" fill="none" id="Store-InventoryDocument" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="549.63" x2="549.63" y1="144.1483" y2="136.1483"/><line style="stroke:#181818;stroke-width:1;" x1="552.63" x2="552.63" y1="144.1483" y2="136.1483"/><line style="stroke:#181818;stroke-width:1;" x1="553.63" x2="545.63" y1="140.1483" y2="140.1483"/><line style="stroke:#181818;stroke-width:1;" x1="1248.7" x2="1254.7" y1="554.3583" y2="562.3583"/><line style="stroke:#181818;stroke-width:1
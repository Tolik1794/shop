e="14" lengthAdjust="spacing" textLength="163.0166" x="305.16" y="859.4097">fromCurrency: Currency</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="296.16" cy="872.107" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.3066" x="305.16" y="875.898">toCurrency: Currency</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.1709" x="305.16" y="892.3863">store: Store?</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="84" id="ent0013"><path d="M539.77,353.4483 L539.77,623.7276 L973.7168,623.7276 L973.7168,363.4483 L963.7168,353.4483 L539.77,353.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M963.7168,353.4483 L963.7168,363.4483 L973.7168,363.4483 L963.7168,353.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="545.77" y="371.0166">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.3677" x="545.77" y="386.3272">- Store entity is updated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.4351" x="545.77" y="401.6377">- Store CRUD exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.6714" x="545.77" y="416.9483">- Currency and Unit entities exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.7764" x="545.77" y="432.2588">- CurrencyFixtures and UnitFixtures exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.271" x="545.77" y="447.5694">- User entity and user/store relation exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="545.77" y="462.8799">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.6821" x="545.77" y="478.1905">Remaining work:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.9565" x="545.77" y="493.501">- Add admin CRUD for Currency if currencies must be editable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.6177" x="545.77" y="508.8116">- Add admin CRUD for Unit if units must be editable per store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.9468" x="545.77" y="524.1221">- Add ExchangeRate entity, repository, fixtures and admin CRUD.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.043" x="545.77" y="539.4327">- Add service for resolving exchange rate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.2598" x="553.9966" y="554.7432">document currency -&gt; store base currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.6533" x="545.77" y="570.0538">- Add validation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7808" x="553.9966" y="585.3643">fromCurrency != toCurrency,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.4976" x="553.9966" y="600.6748">rate &gt; 0,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.1753" x="553.9966" y="615.9854">no overlapping active intervals for the same pair/store.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="104" id="ent0016"><path d="M559.02,706.4483 L559.02,884.8643 L1010.4546,884.8643 L1010.4546,716.4483 L1000.4546,706.4483 L559.02,706.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1000.4546,706.4483 L1000.4546,716.4483 L1010.4546,716.4483 L1000.4546,706.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0933" x="565.02" y="724.0166">Suggested task order:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="565.02" y="739.3272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.8857" x="565.02" y="754.6377">1. Create ExchangeRate entity and migration.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.5508" x="565.02" y="769.9483">2. Create ExchangeRateRepository methods:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4077" x="577.3598" y="785.2588">findRateForDate(from, to, store, date).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.1328" x="565.02" y="800.5694">3. Add admin CRUD/filter for exchange rates.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.5591" x="565.02" y="815.8799">4. Add fixtures for common UAH/USD/EUR rates.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8057" x="565.02" y="831.1905">5. Add tests for rate resolution and fallback rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="565.02" y="846.501">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.5894" x="565.02" y="861.8116">This stage should be completed before Orders, Purchases,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.4346" x="565.02" y="877.1221">Payments and ProductPrice, because they need currency conversion.</text></g><!--link Store to Unit--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="77" id="lnk7"><path codeLine="77" d="M175.85,625.4783 C175.85,647.4683 175.85,644.1583 175.85,665.6683" fill="none" id="Store-Unit" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="171.85" x2="179.85" y1="621.4783" y2="621.4783"/><line style="stroke:#181818;stroke-width:1;" x1="171.85" x2="179.85" y1="624.4783" y2="624.4783"/><line style="stroke:#181818;stroke-width:1;" x1="175.85" x2="175.85" y1="625.4783" y2="617.4783"/><line style="stroke:#181818;stroke-width:1;" x1="175.85" x2="181.85" y1="675.6683" y2="683.6683"/><line style="stroke:#181818;stroke-width:1;" x1="175.85" x2="169.85" y1="675.6683" y2="683.6683"/><line style="stroke:#181818;stroke-width:1;" x1="175.85" x2="175.85" y1="675.6683" y2="683.6683"/><ellipse cx="175.85" cy="669.6683" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.8999" x="129.85" y="647.1466">defines</text></g><!--link Currency to Store--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="crowfoot" data-source-line="78" id="lnk8"><path codeLine="78" d="M307.8,252.3983 C307.8,285.7383 307.8,301.9583 307.8,341.8783" fill="none" id="Currency-Store" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="303.8" x2="311.8" y1="248.3983" y2="248.3983"/><line style="stroke:#181818;stroke-width:1;" x1="303.8" x2="311.8" y1="251.3983" y2="251.3983"/><line style="stroke:#181818;stroke-width:1;" x1="307.8" x2="307.8" y1="252.3983" y2="244.3983"/><line style="stroke:#181818;stroke-widt
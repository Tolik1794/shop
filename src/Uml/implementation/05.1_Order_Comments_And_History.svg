<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="1195px" preserveAspectRatio="none" style="width:1561px;height:1195px;background:#FFFFFF;" version="1.1" viewBox="0 0 1561 1195" width="1561px" zoomAndPan="magnify"><title>05.1. Order comments and order history</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="290.6162" x="628.4922" y="23.5352">05.1. Order comments and order history</text></g><!--class OrderHistorySource--><g class="entity" data-qualified-name="OrderHistorySource" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="91.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="138.8223" x="863.12" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.8223" x="866.12" y="63.0234">OrderHistorySource</text><line style="stroke:#181818;stroke-width:0.5;" x1="864.12" x2="1000.9423" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.957" x="869.12" y="88.5117">manual</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.6943" x="869.12" y="105">system</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.5322" x="869.12" y="121.4883">integration</text><line style="stroke:#181818;stroke-width:0.5;" x1="864.12" x2="1000.9423" y1="128.4414" y2="128.4414"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="13" id="ent0003"><rect fill="#F1F1F1" height="91.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="162.876" x="545.09" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="607.0558" y="63.0234">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="546.09" x2="706.966" y1="70.9766" y2="70.9766"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="556.09" cy="84.7207" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="565.09" y="88.5117">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="546.09" x2="706.966" y1="95.4648" y2="95.4648"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="556.09" cy="109.209" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.876" x="565.09" y="113">number: string(255)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="556.09" cy="125.6973" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.5391" x="565.09" y="129.4883">status: OrderStatus</text></g><!--class OrderComment--><g class="entity" data-qualified-name="OrderComment" data-source-line="20" id="ent0004"><rect fill="#F1F1F1" height="157.9063" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="249.0635" x="7" y="267.9383"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.0957" x="78.9839" y="286.4734">OrderComment</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="255.0635" y1="294.4266" y2="294.4266"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="308.1707" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="27" y="311.9617">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="255.0635" y1="318.9148" y2="318.9148"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="332.659" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2549" x="27" y="336.45">body: text</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="349.1473" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="27" y="352.9383">createdAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.0635" x="27" y="369.4266">updatedAt: DateTimeImmutable?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.4785" x="27" y="385.9148">deletedAt: DateTimeImmutable?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="398.6121" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.4717" x="27" y="402.4031">order: Order</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="415.1004" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.8975" x="27" y="418.8914">author: User</text></g><!--class OrderHistory--><g class="entity" data-qualified-name="OrderHistory" data-source-line="31" id="ent0005"><rect fill="#F1F1F1" height="256.8359" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="251.8389" x="806.61" y="218.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.2949" x="888.882" y="237.0034">OrderHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="807.61" x2="1057.4489" y1="244.9566" y2="244.9566"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="817.61" cy="258.7007" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="826.61" y="262.4917">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="807.61" x2="1057.4489" y1="269.4448" y2="269.4448"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="817.61" cy="283.189" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.1133" x="826.61" y="286.98">eventKey: string(100)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="817.61" cy="299.6773" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.8057" x="826.61" y="303.4683">source: OrderHistorySource</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="817.61" cy="316.1655" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.4551" x="826.61" y="319.9566">title: string(255)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.7012" x="826.61" y="336.4448">description: text?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.3945" x="826.61" y="352.9331">changes: json?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="826.61" y="369.4214">payload: json?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.0381" x="826.61" y="385.9097">relatedEntityType: string(100)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.8467" x="826.61" y="402.398">relatedEntityId: int?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="817.61" cy="415.0952" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.9648" x="826.61" y="418.8863">occurredAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.8389" x="826.61" y="435.3745">actorNameSnapshot: string(255)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="817.61" cy="448.0718" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.4717" x="826.61" y="451.8628">order: Order</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.5977" x="826.61" y="468.3511">actor: User?</text></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="50" id="ent0008"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="233.35" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="236.35" y="87.7534">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="234.35" x2="268.7152" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="234.35" x2="268.7152" y1="103.7066" y2="103.7066"/></g><g class="entity" data-qualified-name="GMN12" data-source-line="55" id="ent0013"><path d="M291.3,280.6483 L291.3,342.5183 L256.45,346.5183 L291.3,350.5183 L291.3,413.1327 A0,0 0 0 0 291.3,413.1327 L771.7561,413.1327 A0,0 0 0 0 771.7561,413.1327 L771.7561,290.6483 L761.7561,280.6483 L291.3,280.6483 A0,0 0 0 0 291.3,280.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M761.7561,280.6483 L761.7561,290.6483 L771.7561,290.6483 L761.7561,280.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.4302" x="297.3" y="298.2166">Goal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.9048" x="297.3" y="313.5272">replace the single Order.comment field with many comments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="297.3" y="328.8377">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="297.3" y="344.1483">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.6973" x="297.3" y="359.4588">- Different users can add separate comments to the same order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.3677" x="297.3" y="374.7694">- Comments remain discussion records, not audit history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.4561" x="297.3" y="390.0799">- Comment creation/edit/deletion should also create OrderHistory rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.1274" x="297.3" y="405.3905">- Soft delete can hide a comment without destroying the audit trail.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="66" id="ent0016"><path d="M1093.86,196.4383 L1093.86,497.3387 L1543.1935,497.3387 L1543.1935,206.4383 L1533.1935,196.4383 L1093.86,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1533.1935,196.4383 L1533.1935,206.4383 L1543.1935,206.4383 L1533.1935,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.4302" x="1099.86" y="214.0066">Goal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.002" x="1099.86" y="229.3172">dedicated append-only activity timeline for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1099.86" y="244.6277">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.2734" x="1099.86" y="259.9383">Why it is separate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.2866" x="1099.86" y="275.2488">generic StatusHistory is too narrow because Order needs to show</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.7642" x="1099.86" y="290.5594">every meaningful action, not only status transitions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1099.86" y="305.8699">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="1099.86" y="321.1805">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.9243" x="1099.86" y="336.491">- Store manual, system and integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.7129" x="1099.86" y="351.8016">- Keep eventKey stable for renderers and future automation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.7212" x="1099.86" y="367.1121">- Keep title/description as human-readable snapshots for UI.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.3467" x="1099.86" y="382.4227">- Keep changes as structured before/after field diffs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.521" x="1099.86" y="397.7332">- Keep payload for future order features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.9932" x="1108.0866" y="413.0437">delivery service, declaration generation, shipping payer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3535" x="1108.0866" y="428.3543">external integration data and similar extensions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.96" x="1099.86" y="443.6648">- actor can be null for automatic events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.4648" x="1099.86" y="458.9754">- actorNameSnapshot preserves what should be shown later.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.5674" x="1099.86" y="474.2859">- relatedEntityType/relatedEntityId can point to future</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.1069" x="1108.0866" y="489.5965">delivery/declaration-like entities without redesigning the timeline.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="88" id="ent0019"><path d="M1169.93,557.3383 L1169.93,888.8598 L1467.1292,888.8598 L1467.1292,567.3383 L1457.1292,557.3383 L1169.93,557.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1457.1292,557.3383 L1457.1292,567.3383 L1467.1292,567.3383 L1457.1292,557.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3843" x="1175.93" y="574.9066">Suggested event coverage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1175.93" y="590.2172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.0415" x="1175.93" y="605.5277">Core manual events:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.4844" x="1175.93" y="620.8383">- order.created</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.6958" x="1175.93" y="636.1488">- order.updated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.0273" x="1175.93" y="651.4594">- order.status_changed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.626" x="1175.93" y="666.7699">- order.comment_added / edited / deleted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3735" x="1175.93" y="682.0805">- order.entry_added / updated / removed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.7017" x="1175.93" y="697.391">- order.customer_changed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1175.93" y="712.7016">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.4341" x="1175.93" y="728.0121">Financial/warehouse events later:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.7905" x="1175.93" y="743.3227">- order.payment_registered / refunded</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1538" x="1175.93" y="758.6332">- order.reservation_created / released</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.0542" x="1175.93" y="773.9438">- order.shipment_created / posted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.9893" x="1175.93" y="789.2543">- order.return_created / posted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1175.93" y="804.5648">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0933" x="1175.93" y="819.8754">Future extensibility examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.2129" x="1175.93" y="835.1859">- order.delivery_service_selected</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.04" x="1175.93" y="850.4965">- order.delivery_payer_changed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.4575" x="1175.93" y="865.807">- order.delivery_declaration_generated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.1992" x="1175.93" y="881.1176">- order.integration_sync_succeeded / failed</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="112" id="ent0022"><path d="M1082.46,948.8583 L1082.46,1188.5165 L1554.6006,1188.5165 L1554.6006,958.8583 L1544.6006,948.8583 L1082.46,948.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1544.6006,948.8583 L1544.6006,958.8583 L1554.6006,958.8583 L1544.6006,948.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="1088.46" y="966.4266">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1088.46" y="981.7372">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.5708" x="1088.46" y="997.0477">1. Add OrderComment and OrderHistory entities/repositories.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.6567" x="1088.46" y="1012.3583">2. Remove the single editable Order.comment field from future forms.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.0117" x="1088.46" y="1027.6688">3. Add OrderCommentManager for create/edit/soft-delete operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.1743" x="1088.46" y="1042.9794">4. Add OrderHistoryRecorder service with small explicit helpers,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.7075" x="1100.7998" y="1058.2899">not ad-hoc writes from controllers.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.4868" x="1088.46" y="1073.6005">5. Record order creation, status changes, comment actions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.0591" x="1100.7998" y="1088.911">and entry mutations first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.1221" x="1088.46" y="1104.2216">6. Add timeline UI on Order show page with clear grouping by date</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.5156" x="1100.7998" y="1119.5321">and readable labels for manual/system/integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.4741" x="1088.46" y="1134.8427">7. Add tests for append-only history, actor attribution,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.8008" x="1100.7998" y="1150.1532">before/after changes, comment soft delete and future-safe payloads.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1088.46" y="1165.4638">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.2256" x="1088.46" y="1180.7743">Do this after the base Order CRUD from 05_Sales_Orders.</text></g><!--link Order to OrderComment--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="48" id="lnk6"><path codeLine="48" d="M536.97,124.5183 C425.83,124.5183 248.49,124.5183 248.49,124.5183 C248.49,124.5183 248.49,185.6883 248.49,249.5483" fill="none" id="Order-OrderComment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="540.97" x2="540.97" y1="120.5183" y2="128.5183"/><line style="stroke:#181818;stroke-width:1;" x1="537.97" x2="537.97" y1="120.5183" y2="128.5183"/><line style="stroke:#181818;stroke-width:1;" x1="536.97" x2="544.97" y1="124.5183" y2="124.5183"/><line style="stroke:#181818;stroke-width:1;" x1="248.49" x2="254.49" y1="259.5483" y2="267.5483"/><line style="stroke:#181818;stroke-width:1;" x1="248.49" x2="242.49" y1="259.5483" y2="267.5483"/><line style="stroke:#181818;stroke-width:1;" x1="248.49" x2="248.49" y1="259.5483" y2="267.5483"/><ellipse cx="248.49" cy="253.5483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.7046" x="233.21" y="138.0866">has comments</text></g><!--link Order to OrderHistory--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="49" id="lnk7"><path codeLine="49" d="M716.27,90.5183 C774.64,90.5183 834.87,90.5183 834.87,90.5183 C834.87,90.5183 834.87
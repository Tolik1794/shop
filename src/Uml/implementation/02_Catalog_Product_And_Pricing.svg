00" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="1393.37" y="378.8966">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.1191" x="1393.37" y="394.2072">- Category entity and CRUD exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.8989" x="1393.37" y="409.5177">- Product entity and CRUD exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.1924" x="1393.37" y="424.8283">- Unit relation, productKind, flags and baseSalePrice exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.249" x="1393.37" y="440.1388">- ProductDiscountRule and ProductDiscountTarget exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.3911" x="1393.37" y="455.4494">- Product discount CRUD exists under store Settings.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.7285" x="1393.37" y="470.7599">- Product parameter generation from category definitions exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.8848" x="1393.37" y="486.0705">- Product performance fixture creates many products.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1393.37" y="501.381">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.6821" x="1393.37" y="516.6916">Remaining work:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.2578" x="1393.37" y="532.0021">- Add ProductPrice entity/repository/manager.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.4932" x="1393.37" y="547.3127">- Add ProductPrice CRUD under Product show or as separate tab.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.5239" x="1393.37" y="562.6232">- Decide whether Product.baseSalePrice is only a shortcut</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.4883" x="1401.5966" y="577.9338">or must sync with active regular ProductPrice.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9561" x="1393.37" y="593.2443">- Add price interval validation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.0713" x="1401.5966" y="608.5548">no overlapping active intervals for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.748" x="1401.5966" y="623.8654">(store, product, type, currency).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.4121" x="1393.37" y="639.1759">- Add UI for current price and price history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.3037" x="1393.37" y="654.4865">- Extend discount cost basis with delivery/payment fees</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.5947" x="1401.5966" y="669.797">when those costs become attributable to order rows.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="137" id="ent0035"><path d="M1390.65,737.5383 L1390.65,992.507 L1816.5797,992.507 L1816.5797,747.5383 L1806.5797,737.5383 L1390.65,737.5383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1806.5797,737.5383 L1806.5797,747.5383 L1816.5797,747.5383 L1806.5797,737.5383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="1396.65" y="755.1066">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1396.65" y="770.4172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.7656" x="1396.65" y="785.7277">1. Create ProductPrice entity, repository and migration.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.4976" x="1396.65" y="801.0383">2. Add ProductPriceType enum.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7236" x="1396.65" y="816.3488">3. Add ProductPriceManager:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.9478" x="1408.9898" y="831.6594">- create/update price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.498" x="1408.9898" y="846.9699">- calculate priceBase using ExchangeRate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8838" x="1408.9898" y="862.2805">- close previous interval if needed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.4292" x="1396.65" y="877.591">4. Add product show tab: Prices.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.2114" x="1396.65" y="892.9016">5. Add fixtures for regular product prices.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.8926" x="1396.65" y="908.2121">6. Add tests for overlap prevention and priceBase calculation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.9297" x="1396.65" y="923.5227">7. Maintain discount resolver tests for product/category/default</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.6377" x="1408.9898" y="938.8332">discount selection.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1396.65" y="954.1438">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.9385" x="1396.65" y="969.4543">Do this after 01_Core_Store_User_Reference_Data,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.4043" x="1396.65" y="984.7648">because ProductPrice needs Currency and ExchangeRate.</text></g><!--link Category to Product--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="97" id="lnk14"><path codeLine="97" d="M495.38,268.5083 C485.15,268.5083 486.62,268.5083 486.62,268.5083 C486.62,268.5083 486.62,316.7183 486.62,381.1183" fill="none" id="Category-Product" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="499.38" x2="499.38" y1="264.5083" y2="272.5083"/><line style="stroke:#181818;stroke-width:1;" x1="496.38" x2="496.38" y1="264.5083" y2="272.5083"/><line style="stroke:#181818;stroke-width:1;" x1="495.38" x2="503.38" y1="268.5083" y2="268.5083"/><line style="stroke:#181818;stroke-width:1;" x1="486.62" x2="492.62" y1="391.1183" y2="399.1183"/><line style="stroke:#181818;stroke-width:1;" x1="486.62" x2="480.62" y1="391.1183" y2="399.1183"/><line style="stroke:#181818;stroke-width:1;" x1="486.62" x2="486.62" y1="391.1183" y2="399.1183"/><ellipse cx="486.62" cy="385.1183" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.0146" x="428.62" y="321.9966">classifies</text></g><
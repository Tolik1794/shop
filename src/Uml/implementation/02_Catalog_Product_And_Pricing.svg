ng" textLength="369.1924" x="652.84" y="424.8183">- Unit relation, productKind, flags and baseSalePrice exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.7285" x="652.84" y="440.1288">- Product parameter generation from category definitions exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.8848" x="652.84" y="455.4394">- Product performance fixture creates many products.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="652.84" y="470.7499">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.6821" x="652.84" y="486.0605">Remaining work:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.2578" x="652.84" y="501.371">- Add ProductPrice entity/repository/manager.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.4932" x="652.84" y="516.6816">- Add ProductPrice CRUD under Product show or as separate tab.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.5239" x="652.84" y="531.9921">- Decide whether Product.baseSalePrice is only a shortcut</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.4883" x="661.0666" y="547.3027">or must sync with active regular ProductPrice.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9561" x="652.84" y="562.6132">- Add price interval validation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.0713" x="661.0666" y="577.9237">no overlapping active intervals for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.748" x="661.0666" y="593.2343">(store, product, type, currency).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.4121" x="652.84" y="608.5448">- Add UI for current price and price history.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="110" id="ent0030"><path d="M658.64,684.2883 L658.64,908.6359 L1067.5326,908.6359 L1067.5326,694.2883 L1057.5326,684.2883 L658.64,684.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1057.5326,684.2883 L1057.5326,694.2883 L1067.5326,694.2883 L1057.5326,684.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="664.64" y="701.8566">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="664.64" y="717.1672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.7656" x="664.64" y="732.4777">1. Create ProductPrice entity, repository and migration.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.4976" x="664.64" y="747.7883">2. Add ProductPriceType enum.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7236" x="664.64" y="763.0988">3. Add ProductPriceManager:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.9478" x="676.9798" y="778.4094">- create/update price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.498" x="676.9798" y="793.7199">- calculate priceBase using ExchangeRate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8838" x="676.9798" y="809.0305">- close previous interval if needed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.4292" x="664.64" y="824.341">4. Add product show tab: Prices.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.2114" x="664.64" y="839.6516">5. Add fixtures for regular product prices.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.8926" x="664.64" y="854.9621">6. Add tests for overlap prevention and priceBase calculation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="664.64" y="870.2727">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.9385" x="664.64" y="885.5832">Do this after 01_Core_Store_User_Reference_Data,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.4043" x="664.64" y="900.8938">because ProductPrice needs Currency and ExchangeRate.</text></g><!--link Category to Product--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="77" id="lnk12"><path codeLine="77" d="M1097.07,268.6383 C888.95,268.6383 495.61,268.6383 495.61,268.6383 C495.61,268.6383 495.61,299.0183 495.61,350.4183" fill="none" id="Category-Product" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1101.07" x2="1101.07" y1="264.6383" y2="272.6383"/><line style="stroke:#181818;stroke-width:1;" x1="1098.07" x2="1098.07" y1="264.6383" y2="272.6383"/><line style="stroke:#181818;stroke-width:1;" x1="1097.07" x2="1105.07" y1="268.6383" y2="268.6383"/><line style="stroke:#181818;stroke-width:1;" x1="495.61" x2="501.61" y1="360.4183" y2="368.4183"/><line style="stroke:#181818;stroke-width:1;" x1="495.61" x2="489.61" y1="360.4183" y2="368.4183"/><line style="stroke:#181818;stroke-width:1;" x1="495.61" x2="
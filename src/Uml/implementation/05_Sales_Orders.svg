ne="86" id="ent0023"><path d="M968.18,419.4583 L968.18,588.4883 L933.18,592.4883 L968.18,596.4883 L968.18,766.2903 A0,0 0 0 0 968.18,766.2903 L1487.8201,766.2903 A0,0 0 0 0 1487.8201,766.2903 L1487.8201,429.4583 L1477.8201,419.4583 L968.18,419.4583 A0,0 0 0 0 968.18,419.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1477.8201,419.4583 L1477.8201,429.4583 L1487.8201,429.4583 L1477.8201,419.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="974.18" y="437.0266">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="498.6401" x="974.18" y="452.3372">- Order and OrderEntry entities exist with the main fields from Database.puml.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.7764" x="974.18" y="467.6477">- Customer relation and customer snapshot copying exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.1177" x="974.18" y="482.9583">- Order CRUD exists: index/show/form with entry collection UI.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.7378" x="974.18" y="498.2688">- OrderManager exists and currently supports draft creation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.9839" x="982.4066" y="513.5794">total recalculation, confirmation and cancellation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.8936" x="974.18" y="528.8899">- Payment recalculation, reservations and shipment/return posting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.8184" x="982.4066" y="544.2005">are not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="974.18" y="559.511">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="974.18" y="574.8216">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.1045" x="974.18" y="590.1321">- Order number is generated per store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.1533" x="974.18" y="605.4427">- Currency and exchangeRateToBase are financial snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5923" x="974.18" y="620.7532">- Totals are recalculated from entries, not typed manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.894" x="974.18" y="636.0638">- Normal discounts come from configured product/category rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.0879" x="974.18" y="651.3743">- Manual discounts and below-cost discounted lines require</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.3755" x="982.4066" y="666.6848">order.discount.override.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.2329" x="974.18" y="681.9954">- Customer snapshot fields remain stable after customer edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3125" x="974.18" y="697.3059">- Only draft orders are freely editable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.0005" x="974.18" y="712.6165">- Business status transitions are controlled by services,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1724" x="982.4066" y="727.927">not arbitrary form edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.2202" x="974.18" y="743.2376">- Multi-user comments and the rich activity timeline are added</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.1582" x="982.4066" y="758.5481">in 05.1_Order_Comments_And_History.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="111" id="ent0026"><path d="M1205.92,43.4883 L1205.92,174.4883 L1171.3,178.4883 L1205.92,182.4883 L1205.92,313.7676 A0,0 0 0 0 1205.92,313.7676 L1644.0816,313.7676 A0,0 0 0 0 1644.0816,313.7676 L1644.0816,53.4883 L1634.0816,43.4883 L1205.92,43.4883 A0,0 0 0 0 1205.92,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1634.0816,43.4883 L1634.0816,53.4883 L1644.0816,53.4883 L1634.0816,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.064" x="1211.92" y="61.0566">Recommended flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.0566" x="1211.92" y="76.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.0073" x="1211.92" y="91.6777">-&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1211.92" y="106.9883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.7319" x="1211.92" y="122.2988">Meaning:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.4673" x="1211.92" y="137.6094">- confirmed = accepted into work.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.7119" x="1211.92" y="152.9199">- awaiting_stock = stock is insufficient or not reserved yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.9541" x="1211.92" y="168.2305">- ready_to_ship = all shippable quantity is available.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.5093" x="1211.92" y="183.541">- partially_shipped/shipped are driven by posted shipment docs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.5571" x="1211.92" y="198.8516">- delivered means customer received the goods.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.6499" x="1211.92" y="214.1621">- completed means no normal fulfillment work remains.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.8325" x="1211.92" y="229.4727">- canceled stops an order before normal completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.0591" x="1211.92" y="244.7832">- partially_returned/returned are post-shipment return states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.3066" x="1211.92" y="260.0938">- confirmed can be returned to draft while no later workflow</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3696" x="1220.1466" y="275.4043">consequences exist yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.0615" x="1211.92" y="290.7148">- canceled rollback is intentionally deferred until status history</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.9351" x="1220.1466" y="306.0254">exists; later it must restore the previous status, not always draft.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="131" id="ent0029"><path d="M373.42,1008.3483 L373.42,1140.8327 L900.5758,1140.8327 L900.5758,1018.3483 L890.5758,1008.3483 L373.42,1008.3483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M890.5758,1008.3483 L890.5758,1018.3483 L900.5758,1018.3483 L890.5758,1008.3483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="379.42" y="1025.9166">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.2188" x="379.42" y="1041.2272">- Product name/code/unit and price are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="379.42" y="1056.5377">- quantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.1558" x="379.42" y="1071.8483">- shippedQuantity, returnedQuantity and canceledQuantity are progress caches.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.9692" x="379.42" y="1087.1588">- posted InventoryDocumentLine + StockMovement are the source of truth.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.0669" x="379.42" y="1102.4694">- Entry can specify warehouse or stay backordered.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.5322" x="379.42" y="1117.7799">- Entry stores discount rule/percent/mode snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3062" x="379.42" y="1133.0905">- OrderEntry never changes stock directly.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="142" id="ent0032"><path d="M403.28,1337.2083 L403.28,1607.4876 L870.7107,1607.4876 L870.7107,1347.2083 L860.7107,1337.2083 L403.28,1337.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M860.7107,1337.2083 L860.7107,1347.2083 L870.7107,1347.2083 L860.7107,1337.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="409.28" y="1354.7766">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="409.28" y="1370.0872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.6685" x="409.28" y="1385.3977">1. Keep current draft CRUD and calculator as the order base.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.7866" x="409.28" y="1400.7083">2. Add dedicated transition service:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.9048" x="421.6198" y="1416.0188">draft -&gt; confirmed -&gt; awaiting_stock/ready_to_ship,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.3237" x="421.6198" y="1431.3294">with explicit confirmed -&gt; draft rollback.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.0527" x="409.28" y="1446.6399">3. Freeze or explicitly guard post-confirm edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2051" x="409.28" y="1461.9505">4. Integrate payment recalculation after Payments stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.4258" x="409.28" y="1477.261">5. Apply ProductDiscountRule through OrderEntryDiscountService</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.2905" x="421.6198" y="1492.5716">before OrderCalculator totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.4194" x="409.28" y="1507.8821">6. Integrate reservation creation after Reservations stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.4307" x="409.28" y="1523.1927">7. Integrate shipment/return status updates after InventoryDocuments</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.4707" x="421.6198" y="1538.5032">and 08.1 progress synchronization stages.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.9834" x="409.28" y="1553.8138">8. Continue with 05.1 for comments and order timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="409.28" y="1569.1243">9. Add tests for:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.6655" x="421.6198" y="1584.4348">snapshots, totals, editable states, status transitions,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.3662" x="421.6198" y="1599.7454">backorders and cancellation rules.</text></g><!--link Customer to Order--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="75" id="lnk6"><path codeLine="75" d="M668.43,178.4883 C677.79,178.4883 670.29,178.4883 670.29,178.4883 C670.29,178.4883 670.29,256.1483 670.29,355.5483" fill="none" id="Customer-Order" style="stroke:#181818;stroke-width:1;"/><l
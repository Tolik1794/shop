font-size="13" lengthAdjust="spacing" textLength="312.9839" x="873.6966" y="536.5394">total recalculation, confirmation and cancellation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.8936" x="865.47" y="551.8499">- Payment recalculation, reservations and shipment/return posting</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.8184" x="873.6966" y="567.1605">are not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="865.47" y="582.471">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="865.47" y="597.7816">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.1045" x="865.47" y="613.0921">- Order number is generated per store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.1533" x="865.47" y="628.4027">- Currency and exchangeRateToBase are financial snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5923" x="865.47" y="643.7132">- Totals are recalculated from entries, not typed manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.2329" x="865.47" y="659.0238">- Customer snapshot fields remain stable after customer edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3125" x="865.47" y="674.3343">- Only draft orders are freely editable.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.0005" x="865.47" y="689.6448">- Business status transitions are controlled by services,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1724" x="873.6966" y="704.9554">not arbitrary form edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.2202" x="865.47" y="720.2659">- Multi-user comments and the rich activity timeline are added</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.1582" x="873.6966" y="735.5765">in 05.1_Order_Comments_And_History.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="103" id="ent0024"><path d="M1097.21,43.4883 L1097.21,174.9083 L1062.59,178.9083 L1097.21,182.9083 L1097.21,313.7676 A0,0 0 0 0 1097.21,313.7676 L1535.3716,313.7676 A0,0 0 0 0 1535.3716,313.7676 L1535.3716,53.4883 L1525.3716,43.4883 L1097.21,43.4883 A0,0 0 0 0 1097.21,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1525.3716,43.4883 L1525.3716,53.4883 L1535.3716,53.4883 L1525.3716,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.064" x="1103.21" y="61.0566">Recommended flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.0566" x="1103.21" y="76.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.0073" x="1103.21" y="91.6777">-&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1103.21" y="106.9883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.7319" x="1103.21" y="122.2988">Meaning:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.4673" x="1103.21" y="137.6094">- confirmed = accepted into work.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.7119" x="1103.21" y="152.9199">- awaiting_stock = stock is insufficient or not reserved yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.9541" x="1103.21" y="168.2305">- ready_to_ship = all shippable quantity is available.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.5093" x="1103.21" y="183.541">- partially_shipped/shipped are driven by posted shipment docs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.5571" x="1103.21" y="198.8516">- delivered means customer received the goods.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.6499" x="1103.21" y="214.1621">- completed means no normal fulfillment work remains.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.8325" x="1103.21" y="229.4727">- canceled stops an order before normal completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.0591" x="1103.21" y="244.7832">- partially_returned/returned are post-shipment return states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.3066" x="1103.21" y="260.0938">- confirmed can be returned to draft while no later workflow</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3696" x="1111.4366" y="275.4043">consequences exist yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.0615" x="1103.21" y="290.7148">- canceled rollback is intentionally deferred until status history</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.9351" x="1111.4366" y="306.0254">exists; later it must restore the previous status, not always draft.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="123" id="ent0027"><path d="M318.71,983.0283 L318.71,1100.2021 L845.8658,1100.2021 L845.8658,993.0283 L835.8658,983.0283 L318.71,983.0283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M835.8658,983.0283 L835.8658,993.0283 L845.8658,993.0283 L835.8658,983.0283" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="324.71" y="1000.5966">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.2188" x="324.71" y="1015.9072">- Product name/code/unit and price are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="324.71" y="1031.2177">- quantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.1558" x="324.71" y="1046.5283">- shippedQuantity, returnedQuantity and canceledQuantity are progress caches.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.9692" x="324.71" y="1061.8388">- posted InventoryDocumentLine + StockMovement are the source of truth.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.0669" x="324.71" y="1077.1494">- Entry can specify warehouse or stay backordered.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3062" x="324.71" y="1092.4599">- OrderEntry never changes stock directly.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="133" id="ent0030"><path d="M348.57,1271.2483 L348.57,1510.9065 L816.0007,1510.9065 L816.0007,1281.2483 L806.0007,1271.2483 L348.57,1271.2483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M806.0007,1271.2483 L806.0007,1281.2483 L816.0007,1281.2483 L806.0007,1271.2483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="354.57" y="1288.8166">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="354.57" y="1304.1272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.6685" x="354.57" y="1319.4377">1. Keep current draft CRUD and calculator as the order base.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.7866" x="354.57" y="1334.7483">2. Add dedicated transition service:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.9048" x="366.9098" y="1350.0588">draft -&gt; confirmed -&gt; awaiting_stock/ready_to_ship,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.3237" x="366.9098" y="1365.3694">with explicit confirmed -&gt; draft rollback.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.0527" x="354.57" y="1380.6799">3. Freeze or explicitly guard post-confirm edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2051" x="354.57" y="1395.9905">4. Integrate payment recalculation after Payments stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.4194" x="354.57" y="1411.301">5. Integrate reservation creation after Reservations stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.4307" x="354.57" y="1426.6116">6. Integrate shipment/return status updates after InventoryDocuments</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.4707" x="366.9098" y="1441.9221">and 08.1 progress synchronization stages.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.9834" x="354.57" y="1457.2327">7. Continue with 05.1 for comments and order timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="354.57" y="1472.5432">8. Add tests for:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.6655" x="366.9098" y="1487.8538">snapshots, totals, editable states, status transitions,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.3662" x="366.9098" y="1503.1643">backorders and cancellation rules.</text></g><!--link Customer to Order--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="71" id="lnk6"><path codeLine="71" d="M559.71,178.9083 C569.08,178.9083 561.57,178.9083 561.57,178.9083 C561.57,178.9083 561.57,256.2783 561.57,355.4683" fill="none" id="Customer-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="555.71" x2="544.71" y1="178.9083" y2="178.9083"/><ellipse cx="555.71" cy="178.9083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="548.71" x2="548.71" y1="182.9083" y2="174.9083"/><line style="stroke:#181818;stroke-width:1;" x1="561.57" x2="567.57" y1="365.4683" y2="373.4683"/><line style="stroke:#181818;stroke-width:1;" x1="561.57" x2="555.57" y1="365.4683" y2="373.4683"/><line style="stroke:#181818;stroke-width:1;" x1="561.57" x2="561.57" y1="365.4683" y2="373.4683"/><ellipse cx="561.57" cy="
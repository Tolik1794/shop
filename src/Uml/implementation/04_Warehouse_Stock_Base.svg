st="spacing" textLength="107.2285" x="146" y="522.6434">StockMovement</text><line style="stroke:#181818;stroke-width:0.5;" x1="144" x2="255.2285" y1="530.5966" y2="530.5966"/><line style="stroke:#181818;stroke-width:0.5;" x1="144" x2="255.2285" y1="538.5966" y2="538.5966"/></g><g class="entity" data-qualified-name="GMN15" data-source-line="54" id="ent0016"><path d="M569.52,397.8683 L569.52,521.6883 L534.65,525.6883 L569.52,529.6883 L569.52,652.837 A0,0 0 0 0 569.52,652.837 L1091.7246,652.837 A0,0 0 0 0 1091.7246,652.837 L1091.7246,407.8683 L1081.7246,397.8683 L569.52,397.8683 A0,0 0 0 0 569.52,397.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1081.7246,397.8683 L1081.7246,407.8683 L1091.7246,407.8683 L1081.7246,397.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="575.52" y="415.4366">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.4907" x="575.52" y="430.7472">- Warehouse entity and CRUD exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.5967" x="575.52" y="446.0577">- WarehouseStock entity and CRUD exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.5474" x="575.52" y="461.3683">- WarehouseStock fields were renamed to:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.5469" x="583.7466" y="476.6788">quantityOnHand, reservedQuantity, averageCost.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2622" x="575.52" y="491.9894">- Basic non-negative DB checks exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="575.52" y="507.2999">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.6821" x="575.52" y="522.6105">Remaining work:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.7065" x="575.52" y="537.921">- WarehouseStock should not normally be edited manually</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.9893" x="583.7466" y="553.2316">after InventoryDocument/StockMovement is implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.4902" x="575.52" y="568.5421">- Add service to find or create stock row by product+warehouse.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.21" x="575.52" y="583.8527">- Add rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.1489" x="583.7466" y="599.1632">quantityOnHand &gt;= 0,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8208" x="583.7466" y="614.4738">reservedQuantity &gt;= 0,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.978" x="583.7466" y="629.7843">reservedQuantity &lt;= quantityOnHand unless backorder rules allow otherwise.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.9702" x="575.52" y="645.0948">- Hide service-only fields from manual forms when posting exists.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="73" id="ent0019"><path d="M376.25,734.9683 L376.25,898.0738 L740.9883,898.0738 L740.9883,744.9683 L730.9883,734.9683 L376.25,734.9683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M730.9883,734.9683 L730.9883,744.9683 L740.9883,744.9683 L730.9883,734.9683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="382.25" y="752.5366">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.3394" x="382.25" y="767.8472">- Entity exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.2407" x="382.25" y="783.1577">- No CRUD/workflow is implemented for batches.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="382.25" y="798.4683">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="382.25" y="813.7788">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.7383" x="382.25" y="829.0894">- Batches are created by purchase receipt, production,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.7632" x="390.4766" y="844.3999">return, stock adjustment or initial stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.8218" x="382.25" y="859.7105">- For average_cost, batches are optional for costing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.7441" x="390.4766" y="875.021">but useful for traceability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.5054" x="382.25" y="890.3316">- remainingQuantity must not exceed initialQuantity.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="86" id="ent0022"><path d="M325.27,980.2083 L325.27,1112.6927 L791.977,1112.6927 L791.977,990.2083 L781.977,980.2083 L325.27,980.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M781.977,980.2083 L781.977,990.2083 L791.977,990.2083 L781.977,980.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="331.27" y="997.7766">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="331.27" y="1013.0872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.707" x="331.27" y="1028.3977">1. Keep current Warehouse and WarehouseStock CRUD as admin tools.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.917" x="331.27" y="1043.7083">2. Add WarehouseStockService:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8481" x="343.6098" y="1059.0188">findOrCreate(warehouse, product),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.6885" x="343.6098" y="1074.3294">increase/decrease/reserve/release.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.8647" x="331.27" y="1089.6399">3. Add tests for non-negative and unique product+warehouse.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.7725" x="331.27" y="1104.9505">4. Defer automatic stock changes until Inventory Documents stage.</text></g><!--link Store to Warehouse--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="crowfoot" data-source-line="46" id="lnk6"><path codeLine="46" d="M319.62,95.3983 C319.62,110.6983 319.62,106.3683 319.62,128.6783" fill="none" id="Store-Warehouse" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="315.62" x2="323.62" y1="91.3983" y2="91.3983"/><line style="stroke:#181818;stroke
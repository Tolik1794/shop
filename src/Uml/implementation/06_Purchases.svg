rif" font-size="13" lengthAdjust="spacing" textLength="380.5864" x="841.15" y="426.9372">- Purchase and PurchaseEntry entities exist as schema base.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.6909" x="841.15" y="442.2477">- Supplier entity/relation and supplier snapshot copying exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.5635" x="841.15" y="457.5583">- PurchaseStatus and payment snapshot fields exist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.1348" x="841.15" y="472.8688">- Admin Purchase CRUD/workflow is not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="841.15" y="488.1794">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="841.15" y="503.4899">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.29" x="841.15" y="518.8005">- Purchase number is generated per store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="841.15" y="534.111">- Currency/exchangeRateToBase are financial snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.7451" x="841.15" y="549.4216">- Supplier snapshot fields remain stable after supplier edits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.7358" x="841.15" y="564.7321">- Totals and base totals are calculated from entries.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.6323" x="841.15" y="580.0427">- Delivery cost allocation strategy must be explicit:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.2905" x="849.3766" y="595.3532">by quantity, by value, manual distribution, or another rule.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.7671" x="841.15" y="610.6637">- Status transitions are controlled by services.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="98" id="ent0026"><path d="M1075.68,57.7883 L1075.68,128.0683 L1041.35,132.0683 L1075.68,136.0683 L1075.68,205.5832 A0,0 0 0 0 1075.68,205.5832 L1522.3221,205.5832 A0,0 0 0 0 1522.3221,205.5832 L1522.3221,67.7883 L1512.3221,57.7883 L1075.68,57.7883 A0,0 0 0 0 1075.68,57.7883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1512.3221,57.7883 L1512.3221,67.7883 L1522.3221,67.7883 L1512.3221,57.7883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.064" x="1081.68" y="75.3566">Recommended flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.2617" x="1081.68" y="90.6672">draft -&gt; ordered -&gt; partially_received/received -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1081.68" y="105.9777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.7319" x="1081.68" y="121.2883">Meaning:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.2764" x="1081.68" y="136.5988">- ordered = purchase committed to supplier.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.0962" x="1081.68" y="151.9094">- partially_received/received are driven by posted receipt docs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.9595" x="1081.68" y="167.2199">- completed = purchasing work is fully closed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.501" x="1081.68" y="182.5305">- canceled stops a purchase before completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.6421" x="1081.68" y="197.841">- partially_returned/returned describe goods sent back to supplier.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="110" id="ent0029"><path d="M310.02,912.8683 L310.02,1030.0421 L807.9892,1030.0421 L807.9892,922.8683 L797.9892,912.8683 L310.02,912.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M797.9892,912.8683 L797.9892,922.8683 L807.9892,922.8683 L797.9892,912.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="316.02" y="930.4366">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.4023" x="316.02" y="945.7472">- Product name/code/unit are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.7769" x="316.02" y="961.0577">- unitCostBase uses exchangeRateToBase snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.3838" x="316.02" y="976.3683">- receivedQuantity and returnedQuantity are progress caches.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.9692" x="316.02" y="991.6788">- posted InventoryDocumentLine + StockMovement are the source of truth.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.6841" x="316.02" y="1006.9894">- Receiving creates InventoryDocument and StockMovement,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.0239" x="324.2466" y="1022.2999">not manual WarehouseStock edits in controllers.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="120" id="ent0032"><path d="M338.11,1209.3383 L338.11,1403.0648 L779.8961,1403.0648 L779.8961,1219.3383 L769.8961,1209.3383 L338.11,1209.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M769.8961,1209.3383 L769.8961,1219.3383 L779.8961,1219.3383 L769.8961,1209.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="344.11" y="1226.9066">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="344.11" y="1242.2172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.7861" x="344.11" y="1257.5277">1. Add PurchaseManager and Purchase CRUD with entry collection.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.3496" x="344.11" y="1272.8383">2. Decide and implement delivery cost distribution.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1836" x="344.11" y="1288.1488">3. Add transition service:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.3691" x="356.4498" y="1303.4594">draft -&gt; ordered -&gt; receipt-driven statuses.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.6001" x="344.11" y="1318.7699">4. Add receiving/return integration after InventoryDocuments</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.4707" x="356.4498" y="1334.0805">and 08.1 progress synchronization stages.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.9111" x="344.11" y="1349.391">5. Add payment recalculation after Payments stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="344.11" y="1364.7016">6. Add tests for:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.0029" x="356.4498" y="1380.0121">totals, supplier snapshots, cost conversion,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.5493" x="356.4498" y="1395.3227">delivery allocation and status transitions.</text></g><!--link Supplier to Purchase--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="70" id="lnk6"><path codeLine="70" d="M538.05,132.0683 C547.37,132.0683 540.17,132.0683 540.17,132.0683 C540.17,132.0683 540.17,182.3683 540.17,260.6083" fill="none" id="Supplier-Purchase" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="534.05" x2="523.05" y1="132.0683" y2="132.0683"/><ellipse cx="534.05" cy="132.0683" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="527.05" x2="527.05" y1="136.0683" y2="128.0683"/><line style="stroke:#181818;stroke-width:1;" x1="540.17" x2="546.17" y1="270.6083" y2="278.6083"/><line style="stroke:#181818;stroke-width:1;" x1="540.17" x2="534.17" y1="270.6083" y2="278.6083"/><line style="stroke:#181818;stroke-width:1;" x1="540.17" x2="540.17" y1="270.6083" y2="278.6083"/><ellipse cx="540.17" cy="264.6083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.4443" x="487.17" y="193.3466">supplies</text></g><!--link Purchase to Pu
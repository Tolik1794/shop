y="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="27" y="297.9314">createdAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="310.6287" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.1572" x="27" y="314.4197">updatedAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.4785" x="27" y="330.908">deletedAt: DateTimeImmutable?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="343.6052" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="27" y="347.3962">store: Store</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.7764" x="27" y="363.8845">createdBy: User?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.3887" x="27" y="380.3728">updatedBy: User?</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="39" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="210.29" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="213.29" y="63.0234">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="211.29" x2="250.1943" y1="70.9766" y2="70.9766"/><line style="stroke:#181818;stroke-width:0.5;" x1="211.29" x2="250.1943" y1="78.9766" y2="78.9766"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="41" id="ent0007"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="384.27" y="522.9383"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="387.27" y="541.4734">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="385.27" x2="428.2143" y1="549.4266" y2="549.4266"/><line style="stroke:#181818;stroke-width:0.5;" x1="385.27" x2="428.2143" y1="557.4266" y2="557.4266"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="42" id="ent0009"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="95.4" y="522.9383"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="98.4" y="541.4734">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="96.4" x2="161.0826" y1="549.4266" y2="549.4266"/><line style="stroke:#181818;stroke-width:0.5;" x1="96.4" x2="161.0826" y1="557.4266" y2="557.4266"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="43" id="ent0011"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="337.56" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="340.56" y="63.0234">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="338.56" x2="372.9252" y1="70.9766" y2="70.9766"/><line style="stroke:#181818;stroke-width:0.5;" x1="338.56" x2="372.9252" y1="78.9766" y2="78.9766"/></g><g class="entity" data-qualified-name="GMN14" data-source-line="47" id="ent0015"><path d="M563.36,177.9383 L563.36,263.0483 L528.79,267.0483 L563.36,271.0483 L563.36,356.3543 A0,0 0 0 0 563.36,356.3543 L980.1173,356.3543 A0,0 0 0 0 980.1173,356.3543 L980.1173,187.9383 L970.1173,177.9383 L563.36,177.9383 A0,0 0 0 0 563.36,177.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M970.1173,177.9383 L970.1173,187.9383 L980.1173,187.9383 L970.1173,177.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="569.36" y="195.5066">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.1343" x="569.36" y="210.8172">- Customer entity is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5088" x="569.36" y="226.1277">- Customer CRUD is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.0747" x="569.36" y="241.4383">- Order currently stores customer snapshot fields,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.0244" x="577.5866" y="256.7488">but has no Customer relation yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="569.36" y="272.0594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="569.36" y="287.3699">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.9609" x="569.36" y="302.6805">- Customer belongs to one Store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325" x="569.36" y="317.991">- Deletion should be soft delete through deletedAt.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.8511" x="569.36" y="333.3016">- Customer can be inactive without deleting historical orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.7573" x="569.36" y="348.6121">- Order must copy customer name/phone/email to snapshots.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="61" id="ent0018"><path d="M1015.15,177.9383 L1015.15,356.3543 L1444.3297,356.3543 L1444.3297,187.9383 L1434.3297,177.9383 L1015.15,177.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1434.3297,177.9383 L1434.3297,187.9383 L1444.3297,187.9383 L1434.3297,177.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="1021.15" y="195.5066">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.4097" x="1021.15" y="210.8172">- Supplier entity is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.7842" x="1021.15" y="226.1277">- Supplier CRUD is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.4971" x="1021.15" y="241.4383">- Purchase currently stores supplier snapshot fields,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2998" x="1029.3766" y="256.7488">but has no Supplier relation yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1021.15" y="272.0594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="1021.15" y="287.3699">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2363" x="1021.15" y="302.6805">- Supplier belongs to one Store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.1797" x="1021.15" y="317.991">- Purchase must copy supplier name/phone/email to snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.2012" x="1021.15" y="333.3016">- Historical purchases must remain readable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.8457" x="1029.3766" y="348.6121">even when supplier is edited or soft deleted.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="75" id="ent0021"><path d="M1008.98,447.3183 L1008.98,641.0448 L1450.5059,641.0448 L1450.5059,457.3183 L1440.5059,447.3183 L1008.98,447.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1440.5059,447.3183 L1440.5059,457.3183 L1450.5059,457.3183 L1440.5059,447.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="1014.98" y="464.8866">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1014.98" y="480.1972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.3447" x="1014.98" y="495.5077">1. Add Customer and Supplier entities/repositories/managers.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.5073" x="1014.98" y="510.8183">2. Add unique suggestions if needed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8271" x="1027.3198" y="526.1288">(store_id, email) where email is not null,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.7705" x="1027.3198" y="541.4394">(store_id, phone) where phone is not null.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8145" x="1014.98" y="556.7499">3. Add admin CRUD and filters for both.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.9585" x="1014.98" y="572.0605">4. Add fixtures with a few customers and suppliers.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.5259" x="1014.98" y="587.371">5. Update Order/Purchase forms later to select customer/supplier.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.9912" x="1014.98" y="602.6816">6. Add tests for store scoping and snapshot copying.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1014.98" y="617.9921">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.5845" x="1014.98" y="633.3027">Do this before Sales Orders and Purchases.</text></g><!--link Store to Customer--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="crowfoot" data-source-line="39" id="lnk5"><path codeLine="39" d="M259.48,66.0483 C283.34,66.0483 311.28,66.0483 311.28,66.0483 C311.28,66.0483 311.28,85.8583 311.28,128.6883" fill="none" id="Store-Customer" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="255.48" x2="255.48" y1="70.0483" y2="62.0483"/><line style="stroke:#181818;stroke-width:1;" x1="258.48" x2="258.48" y1="70.0483" y2="62.0483"/><line style="stroke:#181818;stroke-width:1;" x1="259.48" x2="251.48" y1="66.0483" y2="66.0483"/><line style="stroke:#181818;stroke-width:1;" x1="311.28" x2="317.28" y1="138.6883" y2="146.6883"/><line style="stroke:#181818;stroke-width:1;" x1="311.28" x2="305.28" y1="138.6883" y2="146.6883"/><line style="stroke:#181818;stroke-width:1;" x1="311.28" x2="311.28" y1="138.6883" y2="146.6883"/><ellipse cx="311.28" cy="132.6883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.5142" x="242.53" y="90.0366">has customers</t
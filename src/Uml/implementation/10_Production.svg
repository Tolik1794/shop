h d="M820.4783,146.9783 L820.4783,156.9783 L830.4783,156.9783 L820.4783,146.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="438.51" y="164.5466">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.1626" x="438.51" y="179.8572">- Production entities are not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.7144" x="438.51" y="195.1677">- Product already has canBeManufactured and productKind.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="438.51" y="210.4783">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="438.51" y="225.7888">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.9111" x="438.51" y="241.0994">- Recipe belongs to one produced product and one store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.0137" x="438.51" y="256.4099">- isDefault marks the main recipe for default creation flow.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1997" x="438.51" y="271.7205">- Recipe items are material/component products.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.2734" x="438.51" y="287.031">- wastePercent allows planned overconsumption.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.9683" x="438.51" y="302.3416">- Product with productKind=service should not normally be</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.1372" x="446.7366" y="317.6521">material or output unless rules explicitly allow it.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="103" id="ent0030"><path d="M1123.71,505.8683 L1123.71,576.0383 L1089.53,580.0383 L1123.71,584.0383 L1123.71,653.6632 A0,0 0 0 0 1123.71,653.6632 L1579.2769,653.6632 A0,0 0 0 0 1579.2769,653.6632 L1579.2769,515.8683 L1569.2769,505.8683 L1123.71,505.8683 A0,0 0 0 0 1123.71,505.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1569.2769,505.8683 L1569.2769,515.8683 L1579.2769,515.8683 L1569.2769,505.8683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="1129.71" y="523.4366">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9795" x="1129.71" y="538.7472">- Creating from recipe copies material rows into</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.5557" x="1137.9366" y="554.0577">ProductionOrderMaterial snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.5649" x="1129.71" y="569.3683">- Recipe edits later do not mutate existing production orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432.2881" x="1129.71" y="584.6788">- materials_reserved means stock is reserved but not consumed yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.1621" x="1129.71" y="599.9894">- in_progress requires reserved materials or explicit override.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.5669" x="1129.71" y="615.2999">- Actual consumption/output is posted through InventoryDocument.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.1763" x="1129.71" y="630.6105">- Losses and extra consumption are stock documents,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.521" x="1137.9366" y="645.921">not direct edits to material rows.</text></g><g class="entity" data-qualified-name="GMN32" data-source-line="115" id="ent0033"><path d="M1503.05,200.5583 L1503.05,271.8005 L1971.947,271.8005 L1971.947,210.5583 L1961.947,200.5583 L1503.05,200.5583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1961.947,200.5583 L1961.947,210.5583 L1971.947,210.5583 L1961.947,200.5583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.064" x="1509.05" y="218.1266">Recommended flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.897" x="1509.05" y="233.4372">draft -&gt; planned -&gt; materials_reserved -&gt; in_progress -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1509.05" y="248.7477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.0171" x="1509.05" y="264.0583">canceled is terminal for orders stopped before completion.</text></g><g class="entity" data-qualified-name="GMN35" data-source-line="122" id="ent0036"><path d="M1613.85,475.2383 L1613.85,684.2754 L2089.1454,684.2754 L2089.1454,485.2383 L2079.1454,475.2383 L1613.85,475.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2079.1454,475.2383 L2079.1454,485.2383 L2089.1454,485.2383 L2079.1454,475.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="1619.85" y="492.8066">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1619.85" y="508.1172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.4751" x="1619.85" y="523.4277">1. Add ProductionRecipe and ProductionRecipeItem CRUD.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.1616" x="1619.85" y="538.7383">2. Add ProductionOrder and ProductionOrderMaterial entities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0737" x="1619.85" y="554.0488">3. Add service to create ProductionOrder from recipe snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.5537" x="1619.85" y="569.3594">4. Add planning transitions and audit timestamps/users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.7813" x="1619.85" y="584.6699">5. Integrate material reservation after Reservations stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.2954" x="1619.85" y="599.9805">6. Integrate consumption/output documents after InventoryDocuments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="1619.85" y="615.291">7. Add tests for:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.0103" x="1632.1898" y="630.6016">recipe copy, waste planning, transition guards,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.856" x="1632.1898" y="645.9121">reservation integration and stock posting.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1619.85" y="661.2227">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.8955" x="1619.85" y="676.5332">This stage should be done after inventory and reservations.</text></g><!--link Store to ProductionRecipe--><g class="link" data-entity-1="ent0007" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="73" id="lnk8"><path codeLine="73" d="M339.49,95.3183 C339.49,111.1783 339.49,107.8583 339.49,130.7583" fill="none" id="Store-ProductionRecipe" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="335.49" x2="343.49" y1="91.3183" y2="91.3183"/><line style="stroke:#181818;stroke-width:1;" x1="335.49" x2="343.49" y1="94.3183" y2="94.3183"/><line style="stroke:#181818;stroke-width:1;" x1="339.49" x2="339.49" y1="95.3183" y2="87.3183"/><line style="stroke:#181818;stroke-width:1;" x1="339.49" x2="345.49" y1="140.7583" y2="148.7583"/><line style="stroke:#181818;stroke-width:1;" x1="339.49" x2="333.49" y1="140.7583" y2="148.7583"/><line style="stroke:#181818;stroke-width:1;" x1="339.49" x2="339.49" y1="140.7583" y2="148.7583"/><ellipse cx="339.49" cy="134.7583" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="306.49" y="114.6066">owns</text></g><!--link Store to ProductionOrder--><g class="link" data-entity-1="ent0007" data-entity-2="ent0006" data-link-type="crowfoot" data-source-line="74" id="lnk9"><path codeLine="74" d="M368.15,66.0383 C469.49,66.0383 901.21,66.0383 901.21,66.0383 C901.21,66.0383 901.21,221.7783 901.21,367.1783" fill="none" id="Store-ProductionOrder" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="364.15" x2="364.15" y1="70.0383" y2="62.0383"/><line style="stroke:#181818;stroke-width:1;" x1="367.15" x2="367.15" y1="70.0383" y2="62.0383"/><line style="stroke:#181818;stroke-width:1;" x1="368
<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="843px" preserveAspectRatio="none" style="width:1190px;height:843px;background:#FFFFFF;" version="1.1" viewBox="0 0 1190 843" width="1190px" zoomAndPan="magnify"><title>07. Payments</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="96.0859" x="540.3946" y="23.5352">07. Payments</text></g><!--class PaymentDirection--><g class="entity" data-qualified-name="PaymentDirection" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="75.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="125.3828" x="7" y="303.8583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.3828" x="10" y="322.3934">PaymentDirection</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="131.3828" y1="330.3466" y2="330.3466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.041" x="13" y="347.8817">incoming</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.3184" x="13" y="364.37">outgoing</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="131.3828" y1="371.3231" y2="371.3231"/></g><!--class PaymentType--><g class="entity" data-qualified-name="PaymentType" data-source-line="12" id="ent0003"><rect fill="#F1F1F1" height="141.418" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="105.6113" x="166.89" y="270.8883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.3574" x="174.517" y="289.4234">PaymentType</text><line style="stroke:#181818;stroke-width:0.5;" x1="167.89" x2="271.5013" y1="297.3766" y2="297.3766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.7275" x="172.89" y="314.9117">cash</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="29.4424" x="172.89" y="331.4">card</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.6113" x="172.89" y="347.8883">bank_transfer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.8701" x="172.89" y="364.3766">online</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.8643" x="172.89" y="380.8648">refund</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.0527" x="172.89" y="397.3531">other</text><line style="stroke:#181818;stroke-width:0.5;" x1="167.89" x2="271.5013" y1="404.3063" y2="404.3063"/></g><!--class PaymentStatusEnum--><g class="entity" data-qualified-name="PaymentStatusEnum" data-source-line="21" id="ent0004"><rect fill="#F1F1F1" height="124.9297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="143.1836" x="508.1" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.1836" x="511.1" y="63.0234">PaymentStatusEnum</text><line style="stroke:#181818;stroke-width:0.5;" x1="509.1" x2="650.2836" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.7783" x="514.1" y="88.5117">unpaid</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.0957" x="514.1" y="105">partially_paid</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="29.4014" x="514.1" y="121.4883">paid</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.7754" x="514.1" y="137.9766">overpaid</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4756" x="514.1" y="154.4648">refunded</text><line style="stroke:#181818;stroke-width:0.5;" x1="509.1" x2="650.2836" y1="161.418" y2="161.418"/></g><!--class Payment--><g class="entity" data-qualified-name="Payment" data-source-line="29" id="ent0005"><rect fill="#F1F1F1" height="322.7891" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="270.6172" x="281.38" y="513.7683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5791" x="387.899" y="532.3034">Payment</text><line style="stroke:#181818;stroke-width:0.5;" x1="282.38" x2="550.9972" y1="540.2566" y2="540.2566"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="554.0007" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="301.38" y="557.7917">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="282.38" x2="550.9972" y1="564.7448" y2="564.7448"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="578.489" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.3711" x="301.38" y="582.28">direction: PaymentDirection</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="594.9773" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.3789" x="301.38" y="598.7683">type: PaymentType</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="611.4655" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.6445" x="301.38" y="615.2566">amount: decimal(14,4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="627.9538" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.3652" x="301.38" y="631.7448">amountBase: decimal(14,4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="644.4421" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.668" x="301.38" y="648.2331">paidAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="301.38" y="664.7214">comment: text?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.3994" x="301.38" y="681.2097">externalReference: string(255)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="693.907" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.9551" x="301.38" y="697.698">currency: Currency</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="710.3952" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.6172" x="301.38" y="714.1863">exchangeRateToBase: decimal(18,8)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="726.8835" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="301.38" y="730.6745">store: Store</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.3779" x="301.38" y="747.1628">order: Order?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.2041" x="301.38" y="763.6511">purchase: Purchase?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.7764" x="301.38" y="780.1394">createdBy: User?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.3887" x="301.38" y="796.6277">updatedBy: User?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="809.3249" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="301.38" y="813.1159">createdAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="292.38" cy="825.8132" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.1572" x="301.38" y="829.6042">updatedAt: DateTimeImmutable</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="50" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="307.24" y="320.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="310.24" y="338.8834">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="308.24" x2="347.1443" y1="346.8366" y2="346.8366"/><line style="stroke:#181818;stroke-width:0.5;" x1="308.24" x2="347.1443" y1="354.8366" y2="354.8366"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="51" id="ent0008"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="383.29" y="320.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="386.29" y="338.8834">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="384.29" x2="449.0957" y1="346.8366" y2="346.8366"/><line style="stroke:#181818;stroke-width:0.5;" x1="384.29" x2="449.0957" y1="354.8366" y2="354.8366"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="52" id="ent0010"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="485.22" y="320.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="488.22" y="338.8834">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="486.22" x2="529.1643" y1="346.8366" y2="346.8366"/><line style="stroke:#181818;stroke-width:0.5;" x1="486.22" x2="529.1643" y1="354.8366" y2="354.8366"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="53" id="ent0012"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="565.35" y="320.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="568.35" y="338.8834">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="566.35" x2="631.0326" y1="346.8366" y2="346.8366"/><line style="stroke:#181818;stroke-width:0.5;" x1="566.35" x2="631.0326" y1="354.8366" y2="354.8366"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="58" id="ent0018"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="1147.51" y="320.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="1150.51" y="338.8834">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="1148.51" x2="1182.8752" y1="346.8366" y2="346.8366"/><line style="stroke:#181818;stroke-width:0.5;" x1="1148.51" x2="1182.8752" y1="354.8366" y2="354.8366"/></g><g class="entity" data-qualified-name="GMN20" data-source-line="61" id="ent0021"><path d="M586.74,555.3383 L586.74,671.5583 L552.25,675.5583 L586.74,679.5583 L586.74,794.9965 A0,0 0 0 0 586.74,794.9965 L1090.6379,794.9965 A0,0 0 0 0 1090.6379,794.9965 L1090.6379,565.3383 L1080.6379,555.3383 L586.74,555.3383 A0,0 0 0 0 586.74,555.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1080.6379,555.3383 L1080.6379,565.3383 L1090.6379,565.3383 L1080.6379,555.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="592.74" y="572.9066">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.3647" x="592.74" y="588.2172">- Payment entity is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.9712" x="592.74" y="603.5277">- PaymentDirection and PaymentType are not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.6406" x="592.74" y="618.8383">- PaymentStatusEnum already exists because Order/Purchase use it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.6997" x="592.74" y="634.1488">- Order/Purchase have paidAmountBase/paymentStatus cache fields,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.0464" x="600.9666" y="649.4594">but there is no recalculation service yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="592.74" y="664.7699">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="592.74" y="680.0805">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4321" x="592.74" y="695.391">- Exactly one of order or purchase is filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.2832" x="592.74" y="710.7016">- Incoming payments usually apply to Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.9956" x="592.74" y="726.0121">- Outgoing payments usually apply to Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.8306" x="592.74" y="741.3227">- Refunds are explicit payment rows, never direct edits to totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="482.8979" x="592.74" y="756.6332">- amount is in payment currency; amountBase uses exchangeRate snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.9219" x="592.74" y="771.9438">- Payment rows are the financial source of truth.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.1343" x="592.74" y="787.2543">- Order/Purchase payment fields are denormalized caches.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="79" id="ent0024"><path d="M686.61,48.3683 L686.61,165.5421 L1092.7731,165.5421 L1092.7731,58.3683 L1082.7731,48.3683 L686.61,48.3683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1082.7731,48.3683 L1082.7731,58.3683 L1092.7731,58.3683 L1082.7731,48.3683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.8496" x="692.61" y="65.9366">Derived state for Order/Purchase:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1099" x="692.61" y="81.2472">- unpaid: paidAmountBase = 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.085" x="692.61" y="96.5577">- partially_paid: 0 &lt; paidAmountBase &lt; totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.0166" x="692.61" y="111.8683">- paid: paidAmountBase = totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.2925" x="692.61" y="127.1788">- overpaid: paidAmountBase &gt; totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.1631" x="692.61" y="142.4894">- refunded: effective paid amount returned to 0 after refund,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.0327" x="700.8366" y="157.7999">when business rules need a distinct visible state.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="89" id="ent0027"><path d="M667.14,229.4183 L667.14,453.7659 L1112.2333,453.7659 L1112.2333,239.4183 L1102.2333,229.4183 L667.14,229.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1102.2333,229.4183 L1102.2333,239.4183 L1112.2333,239.4183 L1102.2333,229.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="673.14" y="246.9866">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="673.14" y="262.2972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.7266" x="673.14" y="277.6077">1. Add Payment entity, enums, repository and manager.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.1489" x="673.14" y="292.9183">2. Add Payment CRUD scoped by Store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.2725" x="673.14" y="308.2288">3. Add payment sections to Order show and Purchase show.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8198" x="673.14" y="323.5394">4. Add PaymentRecalculationService:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5918" x="685.4798" y="338.8499">- recalculate paidAmountBase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.7378" x="685.4798" y="354.1605">- recalculate paymentStatus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.1753" x="685.4798" y="369.471">- set paidAt when a document first becomes fully paid.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.0933" x="673.14" y="384.7816">5. Recalculate after create/update/delete/reversal-like corrections.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.2783" x="673.14" y="400.0921">6. Add tests for relation exclusivity, exchange-rate snapshots,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.4766" x="685.4798" y="415.4027">unpaid/partial/paid/overpaid/refunded states and refunds.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="673.14" y="430.7132">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.8218" x="673.14" y="446.0238">Do this after Order/Purchase base CRUD exists.</text></g><!--link Store to Payment--><g cl
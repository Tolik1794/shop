<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="1195px" preserveAspectRatio="none" style="width:868px;height:1195px;background:#FFFFFF;" version="1.1" viewBox="0 0 868 1195" width="868px" zoomAndPan="magnify"><title>11. Status history, audit fields and deletion rules</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="351.9414" x="251.1165" y="23.5352">11. Status history, audit fields and deletion rules</text></g><!--class StatusHistoryEntityType--><g class="entity" data-qualified-name="StatusHistoryEntityType" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="91.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="166.8086" x="7" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.8086" x="10" y="63.0234">StatusHistoryEntityType</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.7559" x="13" y="88.5117">purchase</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.4141" x="13" y="105">inventory_document</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.0498" x="13" y="121.4883">production_order</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="128.4414" y2="128.4414"/></g><!--class StatusHistory--><g class="entity" data-qualified-name="StatusHistory" data-source-line="13" id="ent0003"><rect fill="#F1F1F1" height="190.8828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="266.7686" x="96.02" y="228.4783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.9199" x="184.4443" y="247.0134">StatusHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="97.02" x2="361.7886" y1="254.9666" y2="254.9666"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="268.7107" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="116.02" y="272.5017">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="97.02" x2="361.7886" y1="279.4548" y2="279.4548"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="293.199" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.7686" x="116.02" y="296.99">entityType: StatusHistoryEntityType</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="309.6873" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.998" x="116.02" y="313.4783">entityId: int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.0225" x="116.02" y="329.9666">oldStatus: string(100)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="342.6638" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.9336" x="116.02" y="346.4548">newStatus: string(100)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="116.02" y="362.9431">comment: text?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="375.6404" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.8867" x="116.02" y="379.4314">changedAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1182" x="116.02" y="395.9197">changedBy: User?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="408.617" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="116.02" y="412.408">store: Store</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="26" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="208.95" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="211.95" y="87.7534">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="103.7066" y2="103.7066"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="27" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="285.22" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="288.22" y="87.7534">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="103.7066" y2="103.7066"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="31" id="ent0010"><path d="M397.85,196.4383 L397.85,451.407 L854.9657,451.407 L854.9657,206.4383 L844.9657,196.4383 L397.85,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M844.9657,196.4383 L844.9657,206.4383 L854.9657,206.4383 L844.9657,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="403.85" y="214.0066">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.6973" x="403.85" y="229.3172">- StatusHistory is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.4326" x="403.85" y="244.6277">- Many business entities already have status and audit fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5386" x="403.85" y="259.9383">- Status changes are not logged centrally.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.85" y="275.2488">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="403.85" y="290.5594">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.6255" x="403.85" y="305.8699">- Every business status transition creates a history row.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.1299" x="403.85" y="321.1805">- entityType + entityId are used intentionally for MVP flexibility.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.5103" x="403.85" y="336.491">- Application code validates that entityId exists for the type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8359" x="403.85" y="351.8016">- History rows are append-only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.0181" x="403.85" y="367.1121">- UI should show status timeline on Purchase,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.0239" x="412.0766" y="382.4227">InventoryDocument and ProductionOrder pages.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.7168" x="403.85" y="397.7332">- Order uses dedicated OrderHistory from stage 05.1,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.8892" x="412.0766" y="413.0437">because its timeline must store all actions, not only status changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.1621" x="403.85" y="428.3543">- Payment has audit requirements, but no business status workflow</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.5488" x="412.0766" y="443.6648">in the current model, so it is not part of StatusHistory yet.</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="50" id="ent0013"><path d="M396.64,511.4083 L396.64,965.4141 L856.1615,965.4141 L856.1615,521.4083 L846.1615,511.4083 L396.64,511.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M846.1615,511.4083 L846.1615,521.4083 L856.1615,521.4083 L846.1615,511.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.4316" x="402.64" y="528.9766">Shared deletion/audit policy:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="402.64" y="544.2872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3838" x="402.64" y="559.5977">Soft delete / archive:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.9194" x="402.64" y="574.9083">- Product, Category, Unit, Warehouse, Customer, Supplier,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.0054" x="410.8666" y="590.2188">ProductPrice and InventoryReason keep historical readability</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.812" x="410.8666" y="605.5294">through deletedAt/status rather than destructive removal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="402.64" y="620.8399">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.436" x="402.64" y="636.1505">Never hard delete once they have business impact:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.7979" x="402.64" y="651.461">- Order</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.9834" x="402.64" y="666.7716">- Purchase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.2051" x="402.64" y="682.0821">- InventoryDocument</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.1016" x="402.64" y="697.3927">- Payment</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.8701" x="402.64" y="712.7032">- ProductionOrder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.2051" x="402.64" y="728.0138">- InventoryDocumentLine</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2046" x="402.64" y="743.3243">- StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8398" x="402.64" y="758.6348">- WarehouseStockBatch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9741" x="402.64" y="773.9454">- StockReservation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.1323" x="402.64" y="789.2559">- StatusHistory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.6948" x="402.64" y="804.5665">- OrderHistory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="402.64" y="819.877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.2017" x="402.64" y="835.1876">Draft-only exception:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.3413" x="402.64" y="850.4981">- A draft business document may be hard deleted only when</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.7515" x="410.8666" y="865.8087">business rules allow it and it has no posted movements,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1226" x="410.8666" y="881.1192">payments or other dependent history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="402.64" y="896.4298">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.4131" x="402.64" y="911.7403">Audit fields:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.5215" x="402.64" y="927.0509">- createdBy/updatedBy/canceledBy/postedBy/startedBy/completedBy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.2891" x="410.8666" y="942.3614">are historical audit data, not a permission model.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.2344" x="402.64" y="957.672">- Fill them consistently in services or subscribers.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="82" id="ent0016"><path d="M391.63,1025.4083 L391.63,1188.5138 L861.1744,1188.5138 L861.1744,1035.4083 L851.1744,1025.4083 L391.63,1025.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M851.1744,1025.4083 L851.1744,1035.4083 L861.1744,1035.4083 L851.1744,1025.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="397.63" y="1042.9766">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="397.63" y="1058.2872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.6729" x="397.63" y="1073.5977">1. Add StatusHistory entity, enum and repository.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.8442" x="397.63" y="1088.9083">2. Add StatusHistoryService::record().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.2847" x="397.63" y="1104.2188">3. Keep Order on dedicated OrderHistory from stage 05.1.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.4268" x="397.63" y="1119.5294">4. Update Purchase transition service first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="417.8789" x="397.63" y="1134.8399">5. Then update InventoryDocument and ProductionOrder services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="448.5444" x="397.63" y="1150.1505">6. Add reusable Twig component for generic status timeline rendering.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.9702" x="397.63" y="1165.461">7. Add tests that every generic transition writes history exactly once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.2168" x="397.63" y="1180.7716">8. Add deletion-policy tests around posted documents and history.</text></g><!--link Store to StatusHistory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="26" id="lnk5"><path codeLine="26" d="M229.4,120.0083 C229.4,146.5383 229.4,167.3583 229.4,210.2483" fill="none" id="Store-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="116.0083" y2="116.0083"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="119.0083" y2="119.0083"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="120.0083" y2="112.0083"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="235.4" y1="220.2483" y2="228.2483"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="223.4" y1="220.2483" y2="228.2483"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="220.2483" y2="228.2483"/><ellipse cx="229.4" cy="214.2483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.8022" x="230.4" y="166.6966">has status logs</text></g><!--link User to StatusHistory--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="27" id="lnk7"><path codeLine="27" d="M303.4,127.0083 C303.4,153.5383 303.4,167.3583 303.4,210.2483" fill="none" id="User-StatusHistory" style="st
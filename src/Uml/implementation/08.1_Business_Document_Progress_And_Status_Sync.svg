<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="1298px" preserveAspectRatio="none" style="width:1364px;height:1298px;background:#FFFFFF;" version="1.1" viewBox="0 0 1364 1298" width="1364px" zoomAndPan="magnify"><title>08.1. Business document progress and status synchronization</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="448.8887" x="450.7356" y="23.5352">08.1. Business document progress and status synchronization</text></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="58.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="156.5391" x="352.76" y="820.1483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="411.5574" y="838.6834">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="353.76" x2="508.2991" y1="846.6366" y2="846.6366"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="363.76" cy="860.3807" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.5391" x="372.76" y="864.1717">status: OrderStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="353.76" x2="508.2991" y1="871.1248" y2="871.1248"/></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="11" id="ent0003"><rect fill="#F1F1F1" height="108.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="250.5742" x="658.74" y="1014.1583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="747.2771" y="1032.6934">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="659.74" x2="908.3142" y1="1040.6466" y2="1040.6466"/><line style="stroke:#181818;stroke-width:0.5;" x1="659.74" x2="908.3142" y1="1048.6466" y2="1048.6466"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="669.74" cy="1062.3907" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.3838" x="678.74" y="1066.1817">quantity: decimal(14,4)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.4609" x="678.74" y="1082.67">shippedQuantity: decimal(14,4)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.8359" x="678.74" y="1099.1583">returnedQuantity: decimal(14,4)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.5742" x="678.74" y="1115.6466">canceledQuantity: decimal(14,4)?</text></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="18" id="ent0004"><rect fill="#F1F1F1" height="58.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="178.2773" x="139.89" y="820.1483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="198.6874" y="838.6834">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="140.89" x2="317.1673" y1="846.6366" y2="846.6366"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="150.89" cy="860.3807" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.2773" x="159.89" y="864.1717">status: PurchaseStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="140.89" x2="317.1673" y1="871.1248" y2="871.1248"/></g><!--class PurchaseEntry--><g class="entity" data-qualified-name="PurchaseEntry" data-source-line="22" id="ent0005"><rect fill="#F1F1F1" height="91.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="249.8359" x="104.11" y="1022.3983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.2383" x="181.4088" y="1040.9334">PurchaseEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="105.11" x2="352.9459" y1="1048.8866" y2="1048.8866"/><line style="stroke:#181818;stroke-width:0.5;" x1="105.11" x2="352.9459" y1="1056.8866" y2="1056.8866"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="115.11" cy="1070.6307" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.3838" x="124.11" y="1074.4217">quantity: decimal(14,4)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.7578" x="124.11" y="1090.91">receivedQuantity: decimal(14,4)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.8359" x="124.11" y="1107.3983">returnedQuantity: decimal(14,4)?</text></g><!--class InventoryDocument--><g class="entity" data-qualified-name="InventoryDocument" data-source-line="28" id="ent0006"><rect fill="#F1F1F1" height="75.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="250.6699" x="1106.69" y="535.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0752" x="1165.4874" y="553.7434">InventoryDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="1107.69" x2="1356.3599" y1="561.6966" y2="561.6966"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1117.69" cy="575.4407" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.875" x="1126.69" y="579.2317">type: InventoryDocumentType</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1117.69" cy="591.929" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.6699" x="1126.69" y="595.72">status: InventoryDocumentStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="1107.69" x2="1356.3599" y1="602.6731" y2="602.6731"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="33" id="ent0007"><rect fill="#F1F1F1" height="108.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="232.3154" x="667.87" y="1182.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="703.4901" y="1201.1334">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="668.87" x2="899.1854" y1="1209.0866" y2="1209.0866"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="678.87" cy="1222.8307" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.127" x="687.87" y="1226.6217">direction: InventoryDirection</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.4893" x="687.87" y="1243.11">orderEntry: OrderEntry?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.3154" x="687.87" y="1259.5983">purchaseEntry: PurchaseEntry?</text><line style="stroke:#181818;stroke-width:0.5;" x1="668.87" x2="899.1854" y1="1266.5514" y2="1266.5514"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="678.87" cy="1280.2955" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.3838" x="687.87" y="1284.0866">quantity: decimal(14,4)</text></g><!--class InventoryPostingService--><g class="entity" data-qualified-name="InventoryPostingService" data-source-line="40" id="ent0008"><rect fill="#F1F1F1" height="56.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="166.8428" x="746.61" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52.7988" x="803.632" y="61.0898">&#171;service&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.8428" x="749.61" y="77.1563">InventoryPostingService</text><line style="stroke:#181818;stroke-width:0.5;" x1="747.61" x2="912.4528" y1="85.1094" y2="85.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="747.61" x2="912.4528" y1="93.1094" y2="93.1094"/></g><!--class DocumentProgressRecalculator--><g class="entity" data-qualified-name="DocumentProgressRecalculator" data-source-line="41" id="ent0009"><rect fill="#F1F1F1" height="56.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="217.1416" x="419.46" y="252.6283"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52.7988" x="501.6314" y="269.2298">&#171;service&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.1416" x="422.46" y="285.2962">DocumentProgressRecalculator</text><line style="stroke:#181818;stroke-width:0.5;" x1="420.46" x2="635.6016" y1="293.2494" y2="293.2494"/><line style="stroke:#181818;stroke-width:0.5;" x1="420.46" x2="635.6016" y1="301.2494" y2="301.2494"/></g><!--class BusinessDocumentStatusSynchronizer--><g class="entity" data-qualified-name="BusinessDocumentStatusSynchronizer" data-source-line="42" id="ent0010"><rect fill="#F1F1F1" height="56.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="264.0156" x="285.02" y="544.6383"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="52.7988" x="390.6284" y="561.2398">&#171;service&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.0156" x="288.02" y="577.3063">BusinessDocumentStatusSynchronizer</text><line style="stroke:#181818;stroke-width:0.5;" x1="286.02" x2="548.0356" y1="585.2594" y2="585.2594"/><line style="stroke:#181818;stroke-width:0.5;" x1="286.02" x2="548.0356" y1="593.2594" y2="593.2594"/></g><g class="entity" data-qualified-name="GMN23" data-source-line="58" id="ent0024"><path d="M671.72,161.1083 L671.72,277.0383 L636.71,281.0383 L671.72,285.0383 L671.72,400.7665 A0,0 0 0 0 671.72,400.7665 L1080.3333,400.7665 A0,0 0 0 0 1080.3333,400.7665 L1080.3333,171.1083 L1070.3333,161.1083 L671.72,161.1083 A0,0 0 0 0 671.72,161.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1070.3333,161.1083 L1070.3333,171.1083 L1080.3333,171.1083 L1070.3333,161.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.7368" x="677.72" y="178.6766">Missing implementation stage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.6392" x="677.72" y="193.9872">this bridge is required after InventoryDocuments exist,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.6133" x="677.72" y="209.2977">because business documents must reflect posted stock facts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="677.72" y="224.6083">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="677.72" y="239.9188">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.4746" x="677.72" y="255.2294">- Rebuild progress cache fields from posted document lines,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.5225" x="685.9466" y="270.5399">not by incrementing blind counters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.6353" x="677.72" y="285.8505">- Recalculation must be idempotent and safe after reversal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.3662" x="677.72" y="301.161">- Draft/canceled inventory docs do not contribute.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.9189" x="677.72" y="316.4716">- OrderEntry cache:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.1675" x="685.9466" y="331.7821">shippedQuantity, returnedQuantity, canceledQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.1045" x="677.72" y="347.0927">- PurchaseEntry cache:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.3955" x="685.9466" y="362.4032">receivedQuantity, returnedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.4038" x="677.72" y="377.7137">- Source of truth remains posted InventoryDocumentLine</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3525" x="685.9466" y="393.0243">plus resulting StockMovement.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="76" id="ent0027"><path d="M584.19,460.7683 L584.19,685.1159 L987.8648,685.1159 L987.8648,470.7683 L977.8648,460.7683 L584.19,460.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M977.8648,460.7683 L977.8648,470.7683 L987.8648,470.7683 L977.8648,460.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.4038" x="590.19" y="478.3366">Order rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.6748" x="590.19" y="493.6472">- no shipped quantity and stock missing =&gt; awaiting_stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.79" x="590.19" y="508.9577">- all shippable quantity available =&gt; ready_to_ship.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.5815" x="590.19" y="524.2683">- some shipped but not all =&gt; partially_shipped.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.5654" x="590.19" y="539.5788">- all non-canceled quantity shipped =&gt; shipped.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.417" x="590.19" y="554.8894">- returns after shipment =&gt; partially_returned/returned.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.9595" x="590.19" y="570.1999">- delivered/completed require explicit business action;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.5117" x="598.4166" y="585.5105">they are not inferred from stock alone.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="590.19" y="600.821">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.5894" x="590.19" y="616.1316">Purchase rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.8472" x="590.19" y="631.4421">- some received but not all =&gt; partially_received.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.7842" x="590.19" y="646.7527">- all expected quantity received =&gt; received.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.647" x="590.19" y="662.0632">- completion requires explicit business closure.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.499" x="590.19" y="677.3738">- supplier returns move to partially_returned/returned.</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="93" id="ent0030"><path d="M544.6,745.1183 L544.6,954.1554 L1001.4618,954.1554 L1001.4618,755.1183 L991.4618,745.1183 L544.6,745.1183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M991.4618,745.1183 L991.4618,755.1183 L1001.4618,755.1183 L991.4618,745.1183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="550.6" y="762.6866">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="550.6" y="777.9972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.1748" x="550.6" y="793.3077">1. Add recalculation service for order/purchase line progress.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.2529" x="550.6" y="808.6183">2. Add synchronizer that derives stock-driven statuses only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.4888" x="550.6" y="823.9288">3. Invoke both after InventoryPostingService post/cancel/reversal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.7749" x="550.6" y="839.2394">4. Keep manual business confirmations separate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.0337" x="562.9398" y="854.5499">delivery confirmation, final completion, explicit cancellation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.0391" x="550.6" y="869.8605">5. Add tests for partial/full shipment, partial/full receipt,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.522" x="562.9398" y="885.171">returns, reversals, idempotent recalculation and status downgrade.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="550.6" y="900.4816">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.8564" x="550.6" y="915.7921">Why this is separate from 08:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.7661" x="550.6" y="931.1027">stock posting changes inventory facts;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.2583" x="550.6" y="946.4132">this stage projects those facts back onto commercial documents.</text></g><!--link Order to OrderEntry--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="44" id="lnk11"><path codeLine="44" d="M431.62,887.3183 C431.62,936.1383 431.62,1020.0383 431.62,1020.0383 C431.62,1020.0383 539.09,1020.0383 640.29,1020.0383" fill="none" id="Order-OrderEntry" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="427.62" x2="435.62" y1="883.3183" y2="883.3183"/><line style="stroke:#181818;stroke-width:1;" x1="427.62" x2="435.62" y1="886.3183" y2="886.3183"/><line style="stroke:#18
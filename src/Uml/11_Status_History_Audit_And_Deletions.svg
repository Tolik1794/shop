<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="996px" preserveAspectRatio="none" style="width:867px;height:996px;background:#FFFFFF;" version="1.1" viewBox="0 0 867 996" width="867px" zoomAndPan="magnify"><title>11. Status history, audit fields and deletion rules</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="351.9414" x="250.8584" y="23.5352">11. Status history, audit fields and deletion rules</text></g><!--class StatusHistoryEntityType--><g class="entity" data-qualified-name="StatusHistoryEntityType" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="124.9297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="166.8086" x="7" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.8086" x="10" y="63.0234">StatusHistoryEntityType</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.668" x="13" y="88.5117">order</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.7559" x="13" y="105">purchase</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.4141" x="13" y="121.4883">inventory_document</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.0498" x="13" y="137.9766">production_order</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.6523" x="13" y="154.4648">payment</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="161.418" y2="161.418"/></g><!--class StatusHistory--><g class="entity" data-qualified-name="StatusHistory" data-source-line="15" id="ent0003"><rect fill="#F1F1F1" height="190.8828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="266.7686" x="96.02" y="229.4183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.9199" x="184.4443" y="247.9534">StatusHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="97.02" x2="361.7886" y1="255.9066" y2="255.9066"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="269.6507" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="116.02" y="273.4417">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="97.02" x2="361.7886" y1="280.3948" y2="280.3948"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="294.139" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.7686" x="116.02" y="297.93">entityType: StatusHistoryEntityType</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="310.6273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.998" x="116.02" y="314.4183">entityId: int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.1104" x="116.02" y="330.9066">fromStatus: string(255)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="343.6038" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.4941" x="116.02" y="347.3948">toStatus: string(255)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="116.02" y="363.8831">comment: text?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="376.5804" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.8867" x="116.02" y="380.3714">changedAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="393.0687" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="116.02" y="396.8597">store: Store</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1182" x="116.02" y="413.348">changedBy: User?</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="28" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="208.95" y="85.7083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="211.95" y="104.2434">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="112.1966" y2="112.1966"/><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="120.1966" y2="120.1966"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="29" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="285.22" y="85.7083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="288.22" y="104.2434">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="112.1966" y2="112.1966"/><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="120.1966" y2="120.1966"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="33" id="ent0010"><path d="M397.87,235.6583 L397.87,414.0743 L822.9428,414.0743 L822.9428,245.6583 L812.9428,235.6583 L397.87,235.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M812.9428,235.6583 L812.9428,245.6583 L822.9428,245.6583 L812.9428,235.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="403.87" y="253.2266">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.6973" x="403.87" y="268.5372">- StatusHistory is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.5347" x="403.87" y="283.8477">- Many entities already have status fields and audit columns.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5386" x="403.87" y="299.1583">- Status changes are not logged centrally.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.87" y="314.4688">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="403.87" y="329.7794">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.7998" x="403.87" y="345.0899">- Every business status transition should create a history row.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.0728" x="403.87" y="360.4005">- History stores entity type and entity id to avoid hard coupling.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8359" x="403.87" y="375.711">- History rows are append-only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.6543" x="403.87" y="391.0216">- UI should show history on Order, Purchase,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.7168" x="412.0966" y="406.3321">InventoryDocument, ProductionOrder and Payment pages.</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="47" id="ent0013"><path d="M404.06,480.2983 L404.06,796.5092 L816.7485,796.5092 L816.7485,490.2983 L806.7485,480.2983 L404.06,480.2983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M806.7485,480.2983 L806.7485,490.2983 L816.7485,490.2983 L806.7485,480.2983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.4316" x="410.06" y="497.8666">Shared deletion/audit policy:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="410.06" y="513.1772">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.3857" x="410.06" y="528.4877">Soft delete:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.9194" x="410.06" y="543.7983">- Product, Category, Unit, Warehouse, Customer, Supplier,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.7485" x="418.2866" y="559.1088">ProductPrice, Payment and other user-managed dictionaries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.4619" x="418.2866" y="574.4194">should use deletedAt where historical rows depend on them.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="410.06" y="589.7299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.9907" x="410.06" y="605.0405">Hard delete:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.0645" x="410.06" y="620.351">- Draft documents can usually be hard deleted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.4722" x="418.2866" y="635.6616">if they have no posted movements/payments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="410.06" y="650.9721">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.7559" x="410.06" y="666.2827">Never hard delete:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.4033" x="410.06" y="681.5932">- Posted InventoryDocument</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2046" x="410.06" y="696.9038">- StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.3345" x="410.06" y="712.2143">- Payment with accounting impact</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.1323" x="410.06" y="727.5248">- StatusHistory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="410.06" y="742.8354">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.4131" x="410.06" y="758.1459">Audit fields:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.5166" x="410.06" y="773.4565">- createdBy/updatedBy/canceledBy/postedBy/etc.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.0044" x="418.2866" y="788.767">should be set in services or subscribers consistently.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="70" id="ent0016"><path d="M360.15,856.5183 L360.15,989.0027 L860.6583,989.0027 L860.6583,866.5183 L850.6583,856.5183 L360.15,856.5183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M850.6583,856.5183 L850.6583,866.5183 L860.6583,866.5183 L850.6583,856.5183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="366.15" y="874.0866">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="366.15" y="889.3972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.6729" x="366.15" y="904.7077">1. Add StatusHistory entity, enum and repository.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.8442" x="366.15" y="920.0183">2. Add StatusHistoryService::record().</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.9131" x="366.15" y="935.3288">3. Update Order/Purchase status transition services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.5083" x="366.15" y="950.6394">4. Later update InventoryDocument, ProductionOrder and Payment services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.6172" x="366.15" y="965.9499">5. Add reusable Twig component for status timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.7319" x="366.15" y="981.2605">6. Add tests that transition services always write history.</text></g><!--link Store to StatusHistory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="28" id="lnk5"><path codeLine="28" d="M229.4,136.6483 C229.4,160.2783 229.4,173.7083 229.4,211.0483" fill="none" id="Store-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="132.6483" y2="132.6483"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="135.6483" y2="135.6483"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="136.6483" y2="128.6483"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="235.4" y1="221.0483" y2="229.0483"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="223.4" y1="221.0483" y2="229.0483"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="221.0483" y2="229.0483"/><ellipse cx="229.4" cy="215.0483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.8022" x="230.4" y="175.4166">has status logs</text></g><!--link User to StatusHistory--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="29" id="lnk7"><path codeLine="29" d="M303.4,143.6483 C303.4,167.2783 303.4,173.7083 303.4,211.0483" fill="none" id="User-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="303.4" y1="139.6483" y2="128.6483"/><ellipse cx="303.4" cy="139.6483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="299.4" x2="307.4" y1="132.6483" y2="132.6483"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="309.4" y1="221.0483" y2="229.0483"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="297.4" y1="221.0483" y2="229.0483"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="303.4" y1="221.0483" y2="229.0483"/><ellipse cx="303.4" cy="215.0483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.2881" x="208.4" y="192.4166">changes status</text></g><!--link StatusHistoryEntityType to StatusHistory--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="30" id="lnk8"><path codeLine="30" d="M134.91,177.6883 C134.91,196.2983 134.91,191.1183 134.91,211.3083" fill="none" id="StatusHistoryEntityType-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="130.91" x2="138.91" y1="173.6883" y2="173.6883"/><line style="stroke:#181818;stroke-width:1;" x1="130.91" x2="138.91" y1="176.6883" y2="176.6883"/><line style="stroke:#181818;stroke-width:1;" x1="134.91" x2="134.91" y1="177.6883" y2="169.6883"/><line style="stroke:#181818;stroke-width:1;" x1="134.91" x2="140.91" y1="221.3083" y2="229.3083"/><line style="stroke:#181818;stroke-width:1;" x1="134.91" x2="128.91" y1="221.3083" y2="229.3083"/><line style="stroke:#181818;stroke-width:1;" x1="134.91" x2="134.91" y1="221.3083" y2="229.3083"/><ellipse cx="134.91" cy="215.3083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.0146" x="76.91" y="196.0666">classifies</text></g><!--link StatusHistory to GMN9--><g class="link" data-entity-1="ent0003" data-entity-2="ent0010" data-link-type="association" data-source-line="33" id="lnk11"><path d="M363.19,324.9983 C374.45,324.9983 386,324.9983 397.66,324.9983" fill="none" id="StatusHistory-GMN9" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link GMN9 to GMN12--><g class="link" data-entity-1="ent0010" data-entity-2="ent0013" data-link-type="association" data-source-line="47" id="lnk14"><path d="M610.4,414.2883 C610.4,434.9283 610.4,457.4883 610.4,480.0783" fill
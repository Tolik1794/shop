mily="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.3359" x="814.43" y="473.4583">- PaymentStatusEnum exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.8228" x="814.43" y="488.7688">- No admin Order CRUD/workflow is implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.1343" x="814.43" y="504.0794">- Customer entity/relation is not implemented yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="814.43" y="519.3899">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="814.43" y="534.7005">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.9517" x="814.43" y="550.011">- Order number must be generated per store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.834" x="814.43" y="565.3216">- Currency and exchangeRateToBase are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.5146" x="814.43" y="580.6321">- Totals must be recalculated from entries.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.0376" x="814.43" y="595.9427">- Customer fields must be copied into snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.6401" x="814.43" y="611.2532">- Status changes must be controlled, not arbitrary edits.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="92" id="ent0022"><path d="M318.58,871.6583 L318.58,988.8321 L743.9955,988.8321 L743.9955,881.6583 L733.9955,871.6583 L318.58,871.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M733.9955,871.6583 L733.9955,881.6583 L743.9955,881.6583 L733.9955,871.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="324.58" y="889.2266">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.2188" x="324.58" y="904.5372">- Product name/code/unit and price are snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="324.58" y="919.8477">- quantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.4155" x="324.58" y="935.1583">- shippedQuantity + returned/canceled rules must be enforced.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.0313" x="324.58" y="950.4688">- Entry can specify warehouse or be backordered.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7949" x="324.58" y="965.7794">- OrderEntry should not directly change stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.5898" x="332.8066" y="981.0899">Stock changes happen through InventoryDocument.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="102" id="ent0025"><path d="M332.24,1159.8783 L332.24,1353.6048 L730.3479,1353.6048 L730.3479,1169.8783 L720.3479,1159.8783 L332.24,1159.8783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M720.3479,1159.8783 L720.3479,1169.8783 L730.3479,1169.8783 L720.3479,1159.8783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="338.24" y="1177.4466">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="338.24" y="1192.7572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.9033" x="338.24" y="1208.0677">1. Complete Customer stage first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.4609" x="338.24" y="1223.3783">2. Add OrderManager:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.7681" x="350.5798" y="1238.6888">create draft, add/update/remove entry, recalculate totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.2422" x="338.24" y="1253.9994">3. Add Order CRUD:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.7876" x="350.5798" y="1269.3099">index/show/form with entries collection.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.582" x="338.24" y="1284.6205">4. Add product select2 for order entries.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.5225" x="338.24" y="1299.931">5. Add status transition service:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.9048" x="350.5798" y="1315.2416">draft -&gt; confirmed -&gt; awaiting_stock/ready_to_ship.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.3735" x="338.24" y="1330.5521">6. Add tests for totals, snapshots and status transitions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.2715" x="338.24" y="1345.8627">7. Integrate shipment only after InventoryDocument stage.</text></g><!--link Customer to Order--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="67" id="lnk6"><path codeLine="67" d="M527.29,193.0083 C527.29,223.7083 527.29,249.9483 527.29,310.2883" fill="none" id="Customer-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="527.29" x2="527.29" y1="189.0083" y2="178.0083"/><ellipse cx="527.29" cy="189.0083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="523.29" x2="531.29" y1="182.0083" y2="182.0083"/><line style="stroke:#181818;stroke-width:1;" x1="527.29" x2="533.29" y1="320.2883" y2="328.2883"/><line style="stroke:#181818;stroke-width:1;" x1="527.29" x2="521.29" y1="320.2883" y2="328.2883"/><line style="stroke:#181818;stroke-width:1;" x1="527.29" x2="527.29" y1="320.2883" y2="328.2883"/><ellipse cx="527.29" cy="314.2883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.6475" x="487.29" y="249.7166">places</text></g><!--link Order to OrderEntry--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="68" id="lnk7"><path codeLine="68" d="M481.25,618.6083 C376.62,618.6083 260.47,618.6083 260.47,618.6083 C260.47,618.6083 260.47,669.3683 260.47,742.2883" fill="none" id="Order-OrderEntry" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="485.25" x2="485.25" y1="614.6083" y2="622.6083"/><line style="stroke:#181818;stroke-width:1;" x1="482.25" x2="482.25" y1="614.6083" y2="622.6083"/><line style="stroke:#181818;stroke-width:1;" x1="481.25" x2="489.25" y1="618.6083" y2="618.6083"/><line style="stroke:#181818;stroke-width:1;" x1="260.47" x2="266.47" y1="752.2883" y2="760.2883"/><line style="stroke:#181818;stroke-width:1;" x1="260.47" x2="254.47" y1="752.2883" y2="760.2883"/><line style="stroke:#181818;stroke-width:1;" x1="260.47" x2="260.47" y1="752.2883" y2="760.2883
h="36.3652" x="684.9" y="192.8783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="687.9" y="211.4134">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="685.9" x2="720.2652" y1="219.3666" y2="219.3666"/><line style="stroke:#181818;stroke-width:0.5;" x1="685.9" x2="720.2652" y1="227.3666" y2="227.3666"/></g><g class="entity" data-qualified-name="GMN38" data-source-line="209" id="ent0039"><path d="M850.6,548.3383 L850.6,626.0583 L816.14,630.0583 L850.6,634.0583 L850.6,711.4437 A0,0 0 0 0 850.6,711.4437 L1281.5507,711.4437 A0,0 0 0 0 1281.5507,711.4437 L1281.5507,558.3383 L1271.5507,548.3383 L850.6,548.3383 A0,0 0 0 0 850.6,548.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1271.5507,548.3383 L1271.5507,558.3383 L1281.5507,558.3383 L1271.5507,548.3383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.8955" x="856.6" y="565.9066">Legal entities (FOP / TOV) the business operates under.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="856.6" y="581.2172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.5088" x="856.6" y="596.5277">Store.legalEntity is a nullable FK and is the mapping source</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.9507" x="856.6" y="611.8383">"Payment.store -&gt; legal entity" for NEW income recognition only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.2402" x="856.6" y="627.1488">IncomeRecord stores its own legalEntity snapshot taken at</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.1323" x="856.6" y="642.4594">recognition time, so reassigning a store to another legal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.7695" x="856.6" y="657.7699">entity never rewrites already recognized income.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="856.6" y="673.0805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1553" x="856.6" y="688.391">taxNumber is unique among non-deleted entities</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.5566" x="856.6" y="703.7016">(partial unique index WHERE deleted_at IS NULL).</text></g><g class="entity" data-qualified-name="GMN41" data-source-line="222" id="ent0042"><path d="M1630.87,1193.1983 L1630.87,1309.0583 L1577.85,1313.0583 L1630.87,1317.0583 L1630.87,1432.8565 A0,0 0 0 0 1630.87,1432.8565 L2101.2841,1432.8565 A0,0 0 0 0 2101.2841,1432.8565 L2101.2841,1203.1983 L2091.2841,1193.1983 L1630.87,1193.1983 A0,0 0 0 0 1630.87,1193.1983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2091.2841,1193.1983 L2091.2841,1203.1983 L2101.2841,1203.1983 L2091.2841,1193.1983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.854" x="1636.87" y="1210.7666">Append-only projection of recognized income (cash method).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1636.87" y="1226.0772">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8276" x="1636.87" y="1241.3877">Mapping rules from Payment:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.8042" x="1636.87" y="1256.6983">- direction = incoming -&gt; candidate income, recognizedAt = paidAt.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.1284" x="1636.87" y="1272.0088">- reversal (reversesPayment filled) -&gt; refund record that reduces</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.2085" x="1645.0966" y="1287.3194">income in the reversal period, linked via refundOfIncomeRecord.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.5474" x="1636.87" y="1302.6299">- direction = outgoing with purchase -&gt; ignored (not income).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.5713" x="1636.87" y="1317.9405">- PaymentHistory is a display/audit feed, never a data source.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1636.87" y="1333.251">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.0127" x="1636.87" y="1348.5616">Deduplication: unique (sourceType, sourceId)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="449.4141" x="1636.87" y="1363.8721">(partial: WHERE source_id IS NOT NULL) makes recognition idempotent.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1636.87" y="1379.1827">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.9292" x="1636.87" y="1394.4932">amountUah uses the NBU rate on recognition date (UAH: rate = 1).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.8276" x="1636.87" y="1409.8037">Payment.amountBase uses a commercial rate snapshot and is NOT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.6733" x="1636.87" y="1425.1143">suitable for tax purposes unless the payment is already in UAH.</text></g><g class="entity" data-qualified-name="GMN44" data-source-line="240" id="ent0045"><path d="M1072.14,178.4983 L1072.14,210.0583 L1037.18,214.0583 L1072.14,218.0583 L1072.14,249.7405 A0,0 0 0 0 1072.14,249.7405 L1552.0248,249.7405 A0,0 0 0 0 1552.0248,249.7405 L1552.0248,188.4983 L1542.0248,178.4983 L1072.14,178.4983 A0,0 0 0 0 1072.14,178.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1542.0248,178.4983 L1542.0248,188.4983 L1552.0248,188.4983 L1542.0248,178.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="458.8848" x="1078.14" y="196.0666">Year-versioned reference values: minimum wage, subsistence minimum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.6699" x="1078.14" y="211.3772">single tax group limits and rates, ESV, military levy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.3467" x="1078.14" y="226.6877">No rates or limits are ever hardcoded in services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.0166" x="1078.14" y="241.9983">Seeded values are marked "verify before relying".</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="247" id="ent0048"><path d="M852.67,1292.7183 L852.67,1333.3394 L1241.4849,1333.3394 L1241.4849,1302.7183 L1231.4849,1292.7183 L852.67,1292.7183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1231.4849,1292.7183 L1231.4849,1302.7183 L1241.4849,1302.7183 L1231.4849,1292.7183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.8149" x="858.67" y="1310.2866">bankStatementRowId is a reserved link for the future bank</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.1865" x="858.67" y="1325.5972">statement module (tax payment matching). No FK yet.</text></g><!--link LegalEntity to Store--><g class="link" data-entity-1="ent0011" data-entity-2="ent0019" data-link-type="crowfoot" data-source-line="192" id="lnk20"><path codeLine="192" d="M831.29,746.0583 C1022.07,746.0583 1354.08,746.0583 1354.08,746.0583 C1354.08,746.0583 1354.08,875.4283 1354.08,931.8483" fill="none" id="LegalEntity-Store" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="827.29" x2="816.29" y1="746.0583" y2="746.0583"/><ellipse cx="827.29" cy="746.0583" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="820.29" x2="820.29" y1="750.0583" y2="742.0583"/><line style="stroke:#181818;stroke-width:1;" x1="1354.08" x2="1360.08" y1="941.8483" y2="949.8483"/><line style="stroke:#181818;stroke-width:1;" x1="1354.08" x2="1348.08" y1="941.8483" y2="949.8483"/><line style="stroke:#181818;stroke-width:1;" x1="1354.08" x2="1354.08" y1="941.8483" y2="949.8483"/><ellipse cx="1354.08" cy="935.8483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.4175" x="1089.08" y="742.6266">operates stores</text></g><!--link LegalEntity to IncomeRecord--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" data-link-type="crowfoot" data-source-line="193" id="lnk21"><path codeLine="193" d="M824.02,781.0583 C1002.94,781.0583 1307.59,781.0583 1307.59,781.0583 C1307.59,781.0583 1307.59,955.2483 1307.59,1108.5983" fill="none" id="LegalEntity-IncomeRecord" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="820.02" x2="820.02" y1="785.0583" y2="777.0583"/><line style="stroke:#181818;stroke-width:1;" x
lEntity</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1282.3173" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.0449" x="27" y="1286.1083">period: TaxReportingPeriod</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1298.8055" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.9189" x="27" y="1302.5966">reportType: string(64)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1315.2938" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.7881" x="27" y="1319.0848">formVersion: string(255)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="27" y="1335.5731">payload: json?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1348.2704" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.5918" x="27" y="1352.0614">generatedAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1364.7587" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234.1582" x="27" y="1368.5497">status: TaxReportDraftStatusEnum</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.7764" x="27" y="1385.038">createdBy: User?</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="191" id="ent0019"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="1333.63" y="941.9783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="1336.63" y="960.5134">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="1334.63" x2="1373.5343" y1="968.4666" y2="968.4666"/><line style="stroke:#181818;stroke-width:0.5;" x1="1334.63" x2="1373.5343" y1="976.4666" y2="976.4666"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="197" id="ent0026"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="863.68" y="941.9783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="866.68" y="960.5134">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="864.68" x2="929.4857" y1="968.4666" y2="968.4666"/><line style="stroke:#181818;stroke-width:0.5;" x1="864.68" x2="929.4857" y1="976.4666" y2="976.4666"/></g><!--class Payment--><g class="entity" data-qualified-name="Payment" data-source-line="199" id="ent0029"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="63.5791" x="1164.29" y="941.9783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5791" x="1167.29" y="960.5134">Payment</text><line style="stroke:#181818;stroke-width:0.5;" x1="1165.29" x2="1226.8691" y1="968.4666" y2="968.4666"/><line style="stroke:#181818;stroke-width:0.5;" x1="1165.29" x2="1226.8691" y1="976.4666" y2="976.4666"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="204" id="ent0035"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="684.9" y="192.8883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="687.9" y="211.4234">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="685.9" x2="720.2652" y1="219.3766" y2="219.3766"/><line style="stroke:#181818;stroke-width:0.5;" x1="685.9" x2="720.2652" y1="227.3766" y2="227.3766"/></g><g class="entity" data-qualified-name="GMN38" data-source-line="208" id="ent0039"><path d="M850.6,548.3483 L850.6,625.5783 L816.14,629.5783 L850.6,633.5783 L850.6,711.4537 A0,0 0 0 0 850.6,711.4537 L1281.5507,711.4537 A0,0 0 0 0 1281.5507,711.4537 L1281.5507,558.3483 L1271.5507,548.3483 L850.6,548.3483 A0,0 0 0 0 850.6,548.3483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1271.5507,548.3483 L1271.5507,558.3483 L1281.5507,558.3483 L1271.5507,548.3483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.8955" x="856.6" y="565.9166">Legal entities (FOP / TOV) the business operates under.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="856.6" y="581.2272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.5088" x="856.6" y="596.5377">Store.legalEntity is a nullable FK and is the mapping source</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.9507" x="856.6" y="611.8483">"Payment.store -&gt; legal entity" for NEW income recognition only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.2402" x="856.6" y="627.1588">IncomeRecord stores its own legalEntity snapshot taken at</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.1323" x="856.6" y="642.4694">recognition time, so reassigning a store to another legal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.7695" x="856.6" y="657.7799">entity never rewrites already recognized income.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="856.6" y="673.0905">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1553" x="856.6" y="688.401">taxNumber is unique among non-deleted entities</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.5566" x="856.6" y="703.7116">(partial unique index WHERE deleted_at IS NULL).</text></g><g class="entity" data-qualified-name="GMN41" data-source-line="221" id="ent0042"><path d="M1630.87,1176.7183 L1630.87,1292.5783 L1577.85,1296.5783 L1630.87,1300.5783 L1630.87,1416.3765 A0,0 0 0 0 1630.87,1416.3765 L2101.2841,1416.3765 A0,0 0 0 0 2101.2841,1416.3765 L2101.2841,1186.7183 L2091.2841,1176.7183 L1630.87,1176.7183 A0,0 0 0 0 1630.87,1176.7183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2091.2841,1176.7183 L2091.2841,1186.7183 L2101.2841,1186.7183 L2091.2841,1176.7183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.854" x="1636.87" y="1194.2866">Append-only projection of recognized income (cash method).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1636.87" y="1209.5972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8276" x="1636.87" y="1224.9077">Mapping rules from Payment:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.8042" x="1636.87" y="1240.2183">- direction = incoming -&gt; candidate income, recognizedAt = paidAt.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.1284" x="1636.87" y="1255.5288">- reversal (reversesPayment filled) -&gt; refund record that reduces</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.2085" x="1645.0966" y="1270.8394">income in the reversal period, linked via refundOfIncomeRecord.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.5474" x="1636.87" y="1286.1499">- direction = outgoing with purchase -&gt; ignored (not income).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.5713" x="1636.87" y="1301.4605">- PaymentHistory is a display/audit feed, never a data source.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1636.87" y="1316.771">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.0127" x="1636.87" y="1332.0816">Deduplication: unique (sourceType, sourceId)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="449.4141" x="1636.87" y="1347.3921">(partial: WHERE source_id IS NOT NULL) makes recognition idempotent.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1636.87" y="1362.7027">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.9292" x="1636.87" y="1378.0132">amountUah uses the NBU rate on recognition date (UAH: rate = 1).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.8276" x="1636.87" y="1393.3237">Payment.amountBase uses a commercial rate snapshot and is NOT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.6733" x="1636.87" y="1408.6343">suitable for tax purposes unless the payment is already in UAH.</text></g><g class="entity" data-qualified-name="GMN44" data-source-line="239" id="ent0045"><path d="M1072.14,178.5083 L1072.14,210.5783 L1037.18,214.5783 L1072.14,218.5783 L1072.14,249.7505 A0,0 0 0 0 1072.14,249.7505 L1552.0248,249.7505 A0,0 0 0 0 1552.0248,249.7505 L1552.0248,188.5083 L1542.0248,178.5083 L1072.14,178.5083 A0,0 0 0 0 1072.14,178.5083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1542.0248,178.5083 L1542.0248,188.5083 L1552.0248,188.5083 L1542.0248,178.5083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="458.8848" x="1078.14" y="196.0766">Year-versioned reference values: minimum wage, subsistence minimum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.6699" x="1078.14" y="211.3872">single tax group limits and rates, ESV, military levy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.3467" x="1078.14" y="226.6977">No rates or limits are ever hardcoded in services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.0166" x="1078.14" y="242.0083">Seeded values are marked "verify before relying".</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="246" id="ent0048"><path d="M852.67,1276.2383 L852.67,1316.8594 L1241.4849,1316.8594 L1241.4849,1286.2383 L1231.4849,1276.2383 L852.67,1276.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1231.4849,1276.2383 L1231.4849,1286.2383 L1241.4849,1286.2383 L1231.4849,1276.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.8149" x="858.67" y="1293.8066">bankStatementRowId is a reserved link for the future bank</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.1865" x="858.67" y="1309.1172">statement module (tax payment matching). No FK yet.</text></g><!--link LegalEntity to Store--><g class="link" data-entity-1="ent0011" data-entity-2="ent0019" data-link-type="crowfoot" data-source-line="191" id="lnk20"><path codeLine="191" d="M831.29,746.5783 C1022.07,746.5783 1354.08,746.5783 1354.08,746.5783 C1354.08,746.5783 1354.08,868.8583 1354.08,923.6583" fill="none" id="LegalEntity-Store" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="827.29" x2="816.29" y1="746.5783" y2="746.5783"/><ellipse cx="827.29" cy="746.5783" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="820.29" x2="820.29" y1="750.5783" y2="742.5783"/><line style="stroke:#181818;stroke-width:1;" x1="1354.08" x2="1360.08" y1="933.6583" y2="941.6583"/><line style="stroke:#181818;stroke-width:1;" x1="1354.08" x2="1348.08" y1="933.6583" y2="941.6583"/><line style="stroke:#181818;stroke-width:1;" x1="1354.08" x2="1354.08" y1="933.6583" y2="941.6583"/><ellipse cx="1354.08" cy="927.6583" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.4175" x="1084.72" y="743.1466">operates stores</text></g><!--link LegalEntity to IncomeRecord--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" data-link-type="crowfoot" data-source-line="192" id="lnk21"><path codeLine="192" d="M824.02,781.5783 C1002.94,781.5783 1307.59,781.5783 1307.59,781.5783 C1307.59,781.5783 1307.59,944.8283 1307.59,1092.2683" fill="none" id="LegalEntity-IncomeRecord" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="820.02" x2="820.02" y1="785.5783" y2="777.5783"/><line style="stroke:#181818;stroke-width:1;" x1="823.02" x2="823.02" y1="785.5783" y2="777.5783"/><line style="stroke:#181818;stroke-width:1;" x1="824.02" x2="816.02" y1="781.5783" y2="781.5783"/><line
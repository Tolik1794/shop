<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="412px" preserveAspectRatio="none" style="width:918px;height:412px;background:#FFFFFF;" version="1.1" viewBox="0 0 918 412" width="918px" zoomAndPan="magnify"><title>Shop database - Generic status history and audit policy</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402.6846" x="250.8413" y="23.5352">Shop database - Generic status history and audit policy</text></g><!--class StatusHistoryEntityType--><g class="entity" data-qualified-name="StatusHistoryEntityType" data-source-line="6" id="ent0002"><rect fill="#F1F1F1" height="91.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="166.8086" x="7" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.8086" x="10" y="63.0234">StatusHistoryEntityType</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.7559" x="13" y="88.5117">purchase</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.4141" x="13" y="105">inventory_document</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.0498" x="13" y="121.4883">production_order</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="128.4414" y2="128.4414"/></g><!--class StatusHistory--><g class="entity" data-qualified-name="StatusHistory" data-source-line="12" id="ent0003"><rect fill="#F1F1F1" height="190.8828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="266.7686" x="96.02" y="205.5183"/><text fill="#000000" font-family="sa
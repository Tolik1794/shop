<text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.8867" x="116.02" y="356.4714">changedAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1182" x="116.02" y="372.9597">changedBy: User?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="385.657" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="116.02" y="389.448">store: Store</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="26" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="208.95" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="211.95" y="87.7534">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="103.7066" y2="103.7066"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="27" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="285.22" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="288.22" y="87.7534">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="103.7066" y2="103.7066"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="31" id="ent0010"><path d="M397.44,196.4383 L397.44,296.4783 L363,300.4783 L397.44,304.4783 L397.44,405.4754 A0,0 0 0 0 397.44,405.4754 L911.3672,405.4754 A0,0 0 0 0 911.3672,405.4754 L911.3672,206.4383 L901.3672,196.4383 L397.44,196.4383 A0,0 0 0 0 397.44,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M901.3672,196.4383 L901.3672,206.4383 L911.3672,206.4383 L901.3672,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432.9927" x="403.44" y="214.0066">Universal status history table for business documents that only need</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.0098" x="403.44" y="229.3172">generic status audit:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.7192" x="403.44" y="244.6277">Purchase, InventoryDocument, ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.44" y="259.9383">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.0244" x="403.44" y="275.2488">Uses entityType + entityId intentionally for MVP flexibility.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="486.2876" x="403.44" y="290.5594">Important limitation: database cannot enforce foreign key to different tables.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.9272" x="403.44" y="305.8699">Application code must validate that entityId exists for the selected entityType.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.44" y="321.1805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.0522" x="403.44" y="336.491">Suggested rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.2251" x="403.44" y="351.8016">create a StatusHistory row every time document status changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.44" y="367.1121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="439.1816" x="403.44" y="382.4227">Order uses dedicated OrderHistory instead, because its timeline must</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.4458" x="403.44" y="397.7332">capture all user/system/integration actions, not only status changes.</text></g><!--link Store to StatusHistory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="26" id="lnk5"><path codeLine="26" d="M229.4,120.1983 C229.4,142.4683 229.4,152.6583 229.4,187.4183" fill="none" id="Store-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="116.1983" y2="116.1983"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="119.1983" y2="119.1983"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="120.1983" y2="112.1983"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="235.4" y1="197.4183" y2="205.4183"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="223.4" y1="197.4183" y2="205.4183"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="197.4183" y2="205.4183"/><ellipse cx="229.4" cy="191.4183" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.8022" x="230.4" y="155.3766">has status logs</text></g><!--link User to StatusHistory--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="27" id="lnk7"><path codeLine="27" d="M3
<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="443px" preserveAspectRatio="none" style="width:918px;height:443px;background:#FFFFFF;" version="1.1" viewBox="0 0 918 443" width="918px" zoomAndPan="magnify"><title>Shop database - Generic status history and audit policy</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402.6846" x="250.8413" y="23.5352">Shop database - Generic status history and audit policy</text></g><!--class StatusHistoryEntityType--><g class="entity" data-qualified-name="StatusHistoryEntityType" data-source-line="6" id="ent0002"><rect fill="#F1F1F1" height="91.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="166.8086" x="7" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.8086" x="10" y="63.0234">StatusHistoryEntityType</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.7559" x="13" y="88.5117">purchase</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.4141" x="13" y="105">inventory_document</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.0498" x="13" y="121.4883">production_order</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="172.8086" y1="128.4414" y2="128.4414"/></g><!--class StatusHistory--><g class="entity" data-qualified-name="StatusHistory" data-source-line="12" id="ent0003"><rect fill="#F1F1F1" height="190.8828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="266.7686" x="96.02" y="220.8283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.9199" x="184.4443" y="239.3634">StatusHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="97.02" x2="361.7886" y1="247.3166" y2="247.3166"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="261.0607" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="116.02" y="264.8517">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="97.02" x2="361.7886" y1="271.8048" y2="271.8048"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="285.549" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.7686" x="116.02" y="289.34">entityType: StatusHistoryEntityType</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="302.0373" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.998" x="116.02" y="305.8283">entityId: int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.0225" x="116.02" y="322.3166">oldStatus: string(100)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="335.0138" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.9336" x="116.02" y="338.8048">newStatus: string(100)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="116.02" y="355.2931">comment: text?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="367.9904" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.8867" x="116.02" y="371.7814">changedAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1182" x="116.02" y="388.2697">changedBy: User?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="107.02" cy="400.967" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="116.02" y="404.758">store: Store</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="26" id="ent0004"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="208.95" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="211.95" y="87.7534">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="209.95" x2="248.8543" y1="103.7066" y2="103.7066"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="27" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="285.22" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="288.22" y="87.7534">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="286.22" x2="320.5852" y1="103.7066" y2="103.7066"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="31" id="ent0010"><path d="M397.44,196.4383 L397.44,312.0983 L363,316.0983 L397.44,320.0983 L397.44,436.0965 A0,0 0 0 0 397.44,436.0965 L911.3672,436.0965 A0,0 0 0 0 911.3672,436.0965 L911.3672,206.4383 L901.3672,196.4383 L397.44,196.4383 A0,0 0 0 0 397.44,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M901.3672,196.4383 L901.3672,206.4383 L911.3672,206.4383 L901.3672,196.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432.9927" x="403.44" y="214.0066">Universal status history table for business documents that only need</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.0098" x="403.44" y="229.3172">generic status audit:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.7192" x="403.44" y="244.6277">Purchase, InventoryDocument, ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.44" y="259.9383">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.0244" x="403.44" y="275.2488">Uses entityType + entityId intentionally for MVP flexibility.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="486.2876" x="403.44" y="290.5594">Important limitation: database cannot enforce foreign key to different tables.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.9272" x="403.44" y="305.8699">Application code must validate that entityId exists for the selected entityType.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.44" y="321.1805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.0522" x="403.44" y="336.491">Suggested rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.2251" x="403.44" y="351.8016">create a StatusHistory row every time document status changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="403.44" y="367.1121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="439.1816" x="403.44" y="382.4227">Order uses dedicated OrderHistory instead, because its timeline must</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="436.4458" x="403.44" y="397.7332">capture all user/system/integration actions, not only status changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="489.2837" x="403.44" y="413.0438">Payment operations use PaymentHistory and are merged into Order/Purchase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="371.1855" x="403.44" y="428.3543">admin histories without overloading this status-only table.</text></g><!--link Store to StatusHistory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="26" id="lnk5"><path codeLine="26" d="M229.4,120.1183 C229.4,145.2283 229.4,162.3283 229.4,202.4783" fill="none" id="Store-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="116.1183" y2="116.1183"/><line style="stroke:#181818;stroke-width:1;" x1="225.4" x2="233.4" y1="119.1183" y2="119.1183"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="120.1183" y2="112.1183"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="235.4" y1="212.4783" y2="220.4783"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="223.4" y1="212.4783" y2="220.4783"/><line style="stroke:#181818;stroke-width:1;" x1="229.4" x2="229.4" y1="212.4783" y2="220.4783"/><ellipse cx="229.4" cy="206.4783" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.8022" x="230.4" y="162.8666">has status logs</text></g><!--link User to StatusHistory--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="27" id="lnk7"><path codeLine="27" d="M303.4,127.1183 C303.4,152.2283 303.4,162.3283 303.4,202.4783" fill="none" id="User-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="303.4" y1="123.1183" y2="112.1183"/><ellipse cx="303.4" cy="123.1183" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="299.4" x2="307.4" y1="116.1183" y2="116.1183"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="309.4" y1="212.4783" y2="220.4783"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="297.4" y1="212.4783" y2="220.4783"/><line style="stroke:#181818;stroke-width:1;" x1="303.4" x2="303.4" y1="212.4783" y2="220.4783"/><ellipse cx="303.4" cy="206.4783" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.2881" x="208.4" y="179.8666">changes status</text></g><!--link StatusHistoryEntityType to StatusHistory--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="crowfoot" data-source-line="28" id="lnk8"><path codeLine="28" d="M134.91,144.7083 C134.91,168.9583 134.91,173.6183 134.91,202.6983" fill="none" id="StatusHistoryEntityType-StatusHistory" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="130.91" x2="138.91" y1="140.7083" y2="140.7083"/><line style="stroke:#181818;stroke-width:1;" x1="130.91" x2="138.91" y1="143.7083" y2="143.7083"/><line style="stroke:#181818;stroke-width:1;" x1="134.91" x2="134.91" y
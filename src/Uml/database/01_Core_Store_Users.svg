x="92.82" cy="627.4673" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.1582" x="101.82" y="631.2583">validFrom: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.6123" x="101.82" y="647.7466">validTo: DateTimeImmutable?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.1191" x="101.82" y="664.2348">source: string(255)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="101.82" y="680.7231">comment: text?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.82" cy="693.4204" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="101.82" y="697.2114">createdAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.82" cy="709.9087" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.0166" x="101.82" y="713.6997">fromCurrency: Currency</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.82" cy="726.397" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.3066" x="101.82" y="730.188">toCurrency: Currency</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.1709" x="101.82" y="746.6763">store: Store?</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="142" id="ent0030"><path d="M470.66,245.6683 L470.66,353.6283 L436.21,357.6283 L470.66,361.6283 L470.66,470.0159 A0,0 0 0 0 470.66,470.0159 L934.1297,470.0159 A0,0 0 0 0 934.1297,470.0159 L934.1297,255.6683 L924.1297,245.6683 L470.66,245.6683 A0,0 0 0 0 470.66,245.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M924.1297,245.6683 L924.1297,255.6683 L934.1297,255.6683 L924.1297,245.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="476.66" y="263.2366">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.5586" x="476.66" y="278.5472">slug</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="476.66" y="293.8577">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.585" x="476.66" y="309.1683">baseCurrency is the main reporting/accounting currency of the store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.4556" x="476.66" y="324.4788">All *Base monetary fields are stored in this currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="476.66" y="339.7894">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.1938" x="476.66" y="355.0999">costingMethod defines how cost of goods is calculated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.647" x="476.66" y="370.4105">Recommended default for MVP: average_cost.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.8408" x="476.66" y="385.721">FIFO can be enabled later using WarehouseStockBatch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9878" x="476.66" y="401.0316">and batch-level StockMovement records.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="476.66" y="416.3421">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.1997" x="476.66" y="431.6527">allowBackorders=true means OrderEntry can be created</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3486" x="476.66" y="446.9632">even when there is no available stock yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="442.4697" x="476.66" y="462.2738">Reservation and shipment still cannot exceed available physical stock.</text></g><g class="entity" data-qualified-name="GMN32" data-source-line="159" id="ent0033"><path d="M238.58,86.6483 L238.58,102.6283 L203.96,106.6283 L238.58,110.6283 L238.58,127.2694 A0,0 0 0 0 238.58,127.2694 L564.2167,127.2694 A0,0 0 0 0 564.2167,127.2694 L564.2167,96.6483 L554.2167,86.6483 L238.58,86.6483 A0,0 0 0 0 238.58,86.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M554.2167,86.6483 L554.2167,96.6483 L564.2167,96.6483 L554.2167,86.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.6367" x="244.58" y="104.2166">code uses ISO 4217-like values: UAH, USD, EUR.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.5908" x="244.58" y="119.5272">Currency is a dictionary, not a per-store entity.</text></g><g class="entity" data-qualified-name="GMN35" data-source-line="164" id="ent0036"><path d="M356.06,583.6983 L356.06,645.6283 L321.27,649.6283 L356.06,653.6283 L356.06,716.1827 A0,0 0 0 0 356.06,716.1827 L786.7314,716.1827 A0,0 0 0 0 786.7314,716.1827 L786.7314,593.6983 L776.7314,583.6983 L356.06,583.6983 A0,0 0 0 0 356.06,583.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M776.7314,583.6983 L776.7314,593.6983 L786.7314,593.6983 L776.7314,583.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.9146" x="362.06" y="601.2666">rate means: 1 fromCurrency = rate toCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.4321" x="362.06" y="616.5772">Recommended use: document currency -&gt; Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="362.06" y="631.8877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.0283" x="362.06" y="647.1983">Store can override rates manually for accounting needs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.6714" x="362.06" y="662.5088">If store is null, the rate can be treated as a global/reference rate.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="362.06" y="677.8194">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.439" x="362.06" y="693.1299">Keep the rate snapshot on documents too, because historical</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.2378" x="362.06" y="708.4405">documents must not change when ExchangeRate is edited later.</text></g><g class="entity" data-qualified-name="GMN38" data-source-line="175" id="ent0039"><path d="M1484.74,299.2483 L1484.74,305.6283 L1220.53,309.6283 L1484.74,313.6283 L1484.74,416.4221 A0,0 0 0 0 1484.74,416.4221 L1918.0393,416.4221 A0,0 0 0 0 1918.0393,416.4221 L1918.0393,309.2483 L1908.0393,299.2483 L1484.74,299.2483 A0,0 0 0 0 1484.74,299.2483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1908.0393,299.2483 L1908.0393,309.2483 L1918.0393,309.2483 L1908.0393,299.2483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1490.74" y="316.8166">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.709" x="1490.74" y="332.1272">nickname</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="34.0742" x="1490.74" y="347.4377">email</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1490.74" y="362.7483">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.3398" x="1490.74" y="378.0588">roles is retained only for legacy Symfony/test compatibility.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.2993" x="1490.74" y="393.3694">Application authorization is based on permissions resolved from:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.2007" x="1490.74" y="408.6799">user groups + individual allow/deny overrides.</text></g><g class="entity" data-qualified-name="GMN41" data-source-line="185" id="ent0042"><path d="M2231.08,299.2483 L2231.08,353.6283 L2196.06,357.6283 L2231.08,361.6283 L2231.08,416.4221 A0,0 0 0 0 2231.08,416.4221 L2591.7177,416.4221 A0,0 0 0 0 2591.7177,416.4221 L2591.7177,309.2483 L2581.7177,299.2483 L2231.08,299.2483 A0,0 0 0 0 2231.08,299.2483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2581.7177,299.2483 L2581.7177,309.2483 L2591.7177,309.2483 L2581.7177,299.2483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.8057" x="2237.08" y="316.8166">code uses stable permission identifiers such as:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.7632" x="2237.08" y="332.1272">dashboard.view</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.207" x="2237.08" y="347.4377">order.edit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.0049" x="2237.08" y="362.7483">warehouse_stock.manage</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2237.08" y="378.0588">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6377" x="2237.08" y="393.3694">system.all grants all known permissions unless a user</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.249" x="2237.08" y="408.6799">has an explicit deny override for a permission.</text></g><g class="entity" data-qualified-name="GMN44" data-source-line="195" id="ent0045"><path d="M1518.06,614.3183 L1518.06,645.6283 L1483.51,649.6283 L1518.06,653.6283 L1518.06,685.5605 A0,0 0 0 0 1518.06,685.5605 L1894.7255,685.5605 A0,0 0 0 0 1894.7255,685.5605 L1894.7255,624.3183 L1884.7255,614.3183 L1518.06,614.3183 A0,0 0 0 0 1518.06,614.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1884.7255,614.3183 L1884.7255,624.3183 L1894.7255,624.3183 L1884.7255,614.3183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1524.06" y="631.8866">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.522" x="1524.06" y="647.1972">(user_id, permission_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="
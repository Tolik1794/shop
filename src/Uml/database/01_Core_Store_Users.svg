="213.1582" x="101.82" y="631.2583">validFrom: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.6123" x="101.82" y="647.7466">validTo: DateTimeImmutable?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.1191" x="101.82" y="664.2348">source: string(255)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="101.82" y="680.7231">comment: text?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.82" cy="693.4204" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="101.82" y="697.2114">createdAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.82" cy="709.9087" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.0166" x="101.82" y="713.6997">fromCurrency: Currency</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.82" cy="726.397" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.3066" x="101.82" y="730.188">toCurrency: Currency</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.1709" x="101.82" y="746.6763">store: Store?</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="95" id="ent0018"><path d="M470.66,245.6683 L470.66,353.6283 L436.21,357.6283 L470.66,361.6283 L470.66,470.0159 A0,0 0 0 0 470.66,470.0159 L934.1297,470.0159 A0,0 0 0 0 934.1297,470.0159 L934.1297,255.6683 L924.1297,245.6683 L470.66,245.6683 A0,0 0 0 0 470.66,245.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M924.1297,245.6683 L924.1297,255.6683 L934.1297,255.6683 L924.1297,245.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="476.66" y="263.2366">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.5586" x="476.66" y="278.5472">slug</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="476.66" y="293.8577">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.585" x="476.66" y="309.1683">baseCurrency is the main reporting/accounting currency of the store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.4556" x="476.66" y="324.4788">All *Base monetary fields are stored in this currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="476.66" y="339.7894">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.1938" x="476.66" y="355.0999">costingMethod defines how cost of goods is calculated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.647" x="476.66" y="370.4105">Recommended default for MVP: average_cost.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.8408" x="476.66" y="385.721">FIFO can be enabled later using WarehouseStockBatch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9878" x="476.66" y="401.0316">and batch-level StockMovement records.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="476.66" y="416.3421">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.1997" x="476.66" y="431.6527">allowBackorders=true means OrderEntry can be created</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3486" x="476.66" y="446.9632">even when there is no available stock yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="442.4697" x="476.66" y="462.2738">Reservation and shipment still cannot exceed available physical stock.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="112" id="ent0021"><path d="M238.58,86.6483 L238.58,102.6283 L203.96,106.6283 L238.58,110.6283 L238.58,127.2694 A0,0 0 0 0 238.58,127.2694 L564.2167,127.2694 A0,0 0 0 0 564.2167,127.2694 L564.2167,96.6483 L554.2167,86.6483 L238.58,86.6483 A0,0 0 0 0 238.58,86.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M554.2167,86.6483 L554.2167,96.6483 L564.2167,96.6483 L554.2167,86.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.6367" x="244.58" y="104.2166">code uses ISO 4217-like values: UAH, USD, EUR.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.5908" x="244.58" y="119.5272">Currency is a dictionary, not a per-store entity.</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="117" id="ent0024"><path d="M356.06,583.6983 L356.06,645.6283 L321.27,649.6283 L356.06,653.6283 L356.06,716.1827 A0,0 0 0 0 356.06,716.1827 L786.7314,716.1827 A0,0 0 0 0 786.7314,716.1827 L786.7314,593.6983 L776.7314,583.6983 L356.06,583.6983 A0,0 0 0 0 356.06,583.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M776.7314,583.6983 L776.7314,593.6983 L786.7314,593.6983 L776.7314,583.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.9146" x="362.06" y="601.2666">rate means: 1 fromCurrency = rate toCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.4321" x="362.06" y="616.5772">Recommended use: document currency -&gt; Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="362.06" y="631.8877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.0283" x="362.06" y="647.1983">Store can override rates manually for accounting needs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.6714" x="362.06" y="662.5088">If store is null, the rate can be treated as a global/reference rate.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="362.06" y="677.8194">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.439" x="362.06" y="693.1299">Keep the rate snapshot on documents too, because historical</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.2378" x="362.06" y="708.4405">documents must not change when ExchangeRate is edited later.</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="128" id="ent0027"><path d="M1268.54,329.8783 L1268.54,353.6283 L1216.42,357.6283 L1268.54,361.6283 L1268.54,385.8099 A0,0 0 0 0 1268.54,385.8099 L1350.249,385.8099 A0,0 0 0 0 1350.249,385.8099 L1350.249,339.8783 L1340.249,329.8783 L1268.54,329.8783 A0,0 0 0 0 1268.54,329.8783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1340.249,329.8783 L1340.249,339.8783 L1350.249,339.8783 L1340.249,329.8783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><te
<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2616px" preserveAspectRatio="none" style="width:3934px;height:2616px;background:#FFFFFF;" version="1.1" viewBox="0 0 3934 2616" width="3934px" zoomAndPan="magnify"><title>Shop database - Invariants, deletion policy and indexes</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="401.3037" x="1759.8436" y="23.5352">Shop database - Invariants, deletion policy and indexes</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="7" id="ent0003"><path d="M6,1305.3683 L6,1407.2316 L1180.2358,1407.2316 L1180.2358,1315.3683 L1170.2358,1305.3683 L6,1305.3683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1170.2358,1305.3683 L1170.2358,1315.3683 L1180.2358,1315.3683 L1170.2358,1305.3683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.1348" x="12" y="1322.9366">Final cleanup decisions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="571.3335" x="12" y="1338.2472">- ExchangeRate is a financial/reference entity and should not depend on InventoryReason.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="1153.2358" x="12" y="1353.5577">- Batch-level stock attribution should be handled through WarehouseStockBatch links on OrderEntry, StockReservation and StockMovement, not directly from InventoryDocumentLine.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="566.2998" x="12" y="1368.8683">- canceledAt is stored on Order, Purchase and ProductionOrder together with canceledBy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="688.6763" x="12" y="1384.1788">- Payment has updatedBy because payment records can be corrected while still preserving audit information.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="643.0112" x="12" y="1399.4894">- Keep technical stock tables controlled by posting/canceling documents, not by manual admin edits.</text></g><g class="start_entity" data-qualified-name="start" data-source-line="7" id="ent0004"><ellipse cx="2352.12" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN6" data-source-line="15" id="ent0007"><path d="M1200.71,103.4883 L1200.71,2609.1074 L2083.5313,2609.1074 L2083.5313,113.4883 L2073.5313,103.4883 L1200.71,103.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2073.5313,103.4883 L2073.5313,113.4883 L2083.5313,113.4883 L2073.5313,103.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="471.1929" x="1206.71" y="121.0566">Database constraints / invariants to implement in migrations and services:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="136.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.8623" x="1206.71" y="151.6777">Global numeric rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="587.5962" x="1206.71" y="166.9883">- Mutable business documents use optimistic version fields to reject stale form submissions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="559.749" x="1206.71" y="182.2988">- Status and stock-changing services should lock the current row before changing state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="690.8662" x="1206.71" y="197.6094">- All quantity fields must be &gt;= 0, except StockMovement.quantityChange which can be positive or negative.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="499.3193" x="1206.71" y="212.9199">- InventoryDocumentLine.quantity &gt; 0. Direction defines IN/OUT, not the sign.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.7549" x="1206.71" y="228.2305">- StockMovement.quantityChange != 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="684.6201" x="1206.71" y="243.541">- Monetary amount fields should be &gt;= 0 unless a special reversal/discount rule explicitly allows otherwise.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.7822" x="1206.71" y="258.8516">- Currency exchangeRateToBase &gt; 0 when currency is present.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="274.1621">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.0723" x="1206.71" y="289.4727">WarehouseStock:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.0464" x="1206.71" y="304.7832">- unique(store_id via warehouse, warehouse_id, product_id).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.7842" x="1206.71" y="320.0938">- quantityOnHand &gt;= 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4561" x="1206.71" y="335.4043">- reservedQuantity &gt;= 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.1567" x="1206.71" y="350.7148">- reservedQuantity &lt;= quantityOnHand.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="576.7163" x="1206.71" y="366.0254">- Backorders are allowed at OrderEntry level only; WarehouseStock must never go negative.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.3301" x="1206.71" y="381.3359">- averageCost &gt;= 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="607.2866" x="1206.71" y="396.6465">- Product with productKind=service should not create WarehouseStock or StockMovement rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="411.957">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.3179" x="1206.71" y="427.2676">WarehouseStockBatch:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3584" x="1206.71" y="442.5781">- initialQuantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.187" x="1206.71" y="457.8887">- remainingQuantity &gt;= 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7959" x="1206.71" y="473.1992">- remainingQuantity &lt;= initialQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.0884" x="1206.71" y="488.5098">- unitCost &gt;= 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="565.7666" x="1206.71" y="503.8203">- salePrice is optional and stored in Store.baseCurrency when copied from PurchaseEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.8135" x="1206.71" y="519.1309">- createdByMovement should normally reference an IN StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="534.4414">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.6831" x="1206.71" y="549.752">InventoryDocument:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3096" x="1206.71" y="565.0625">- unique(store_id, number).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="489.563" x="1206.71" y="580.373">- createdBy should be filled when document is created by authenticated user.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.2876" x="1206.71" y="595.6836">- postedBy is required when status=posted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.104" x="1206.71" y="610.9941">- canceledBy is required when status=canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.8872" x="1206.71" y="626.3047">- only one of order_id, purchase_id, production_order_id can be not null.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.8496" x="1206.71" y="641.6152">- postedAt is required when status=posted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.666" x="1206.71" y="656.9258">- canceledAt is required when status=canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.9087" x="1206.71" y="672.2363">- Only type=reversal should have reversedDocument filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.9526" x="1206.71" y="687.5469">- reversedDocument must point to a posted document.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.8408" x="1206.71" y="702.8574">- A document should not reverse itself.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="511.7861" x="1206.71" y="718.168">- Posted documents are immutable; corrections are done by reversal documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="733.4785">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.6831" x="1206.71" y="748.7891">InventoryDocumentLine:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.8271" x="1206.71" y="764.0996">- product.store must match inventoryDocument.store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.3179" x="1206.71" y="779.4102">- warehouse.store must match inventoryDocument.store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="444.374" x="1206.71" y="794.7207">- warehouseStock, when filled, must match line product + warehouse.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.3823" x="1206.71" y="810.0313">- For sale_shipment lines, direction should be out.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.1519" x="1206.71" y="825.3418">- For purchase_receipt lines, direction should be in.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.3208" x="1206.71" y="840.6523">- For customer_return lines, direction should be in.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.6475" x="1206.71" y="855.9629">- For supplier_return lines, direction should be out.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.4307" x="1206.71" y="871.2734">- For transfer documents, lines should be paired: one OUT and one IN for the same product and quantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="886.584">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.6826" x="1206.71" y="901.8945">StockMovement:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.77" x="1206.71" y="917.2051">- Must be created only from posted InventoryDocumentLine.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.2524" x="1206.71" y="932.5156">- quantityChange sign must match line direction: IN &gt; 0, OUT &lt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.1729" x="1206.71" y="947.8262">- warehouseStock must match the InventoryDocumentLine product and warehouse.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="484.104" x="1206.71" y="963.1367">- OUT movement must not make WarehouseStock.quantityOnHand negative.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="675.7334" x="1206.71" y="978.4473">- In FIFO mode, OUT movements using batches must not exceed WarehouseStockBatch.remainingQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="993.7578">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.4521" x="1206.71" y="1009.0684">StockReservation:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="1206.71" y="1024.3789">- quantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="574.1519" x="1206.71" y="1039.6895">- active reservations must not exceed available stock: quantityOnHand - reservedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="502.0552" x="1206.71" y="1055">- warehouseStockBatch, when filled, must belong to the same WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="544.5591" x="1206.71" y="1070.3105">- active batch reservations must not exceed WarehouseStockBatch.remainingQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="513.3794" x="1206.71" y="1085.6211">- Backordered OrderEntry rows should remain unreserved until stock is available.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="660.8608" x="1206.71" y="1100.9316">- completed/canceled/expired reservations should not be counted in WarehouseStock.reservedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="1116.2422">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.8428" x="1206.71" y="1131.5527">OrderEntry / PurchaseEntry:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="1206.71" y="1146.8633">- quantity &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.4297" x="1206.71" y="1162.1738">- OrderEntry can exist without stock when Store.allowBackorders=true.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="597.873" x="1206.71" y="1177.4844">- OrderEntry without stock must not automatically create StockReservation or StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="759.4844" x="1206.71" y="1192.7949">- OrderEntry.warehouseStockBatch, when filled, must match the entry product and warehouse through WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="693.6021" x="1206.71" y="1208.1055">- Product search should expose FIFO batches as separate stock options, ordered by receivedAt/id oldest first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.3374" x="1206.71" y="1223.416">- progress quantities must be &gt;= 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="659.9468" x="1206.71" y="1238.7266">- shippedQuantity, returnedQuantity, canceledQuantity, receivedQuantity are denormalized cache fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="525.4209" x="1206.71" y="1254.0371">- Source of truth for progress is posted InventoryDocumentLine + StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="539.6396" x="1206.71" y="1269.3477">- Recalculate progress cache after posting/canceling/reversing inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.8384" x="1206.71" y="1284.6582">- shippedQuantity should not exceed OrderEntry.quantity - canceledQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.2695" x="1206.71" y="1299.9688">- returnedQuantity should not exceed shippedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.73" x="1206.71" y="1315.2793">- receivedQuantity should not exceed PurchaseEntry.quantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.9512" x="1206.71" y="1330.5898">- PurchaseEntry.returnedQuantity should not exceed receivedQuantity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="647.7783" x="1206.71" y="1345.9004">- Snapshot fields should be filled at creation and not overwritten automatically when Product changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="1361.2109">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7021" x="1206.71" y="1376.5215">OrderComment:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.1626" x="1206.71" y="1391.832">- body must not be blank.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.9941" x="1206.71" y="1407.1426">- author_id is required for user comments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.8413" x="1206.71" y="1422.4531">- soft-deleted comments remain linked to Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="1437.7637">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.1729" x="1206.71" y="1453.0742">OrderHistory:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.6035" x="1206.71" y="1468.3848">- append-only: do not update/delete existing history rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.7637" x="1206.71" y="1483.6953">- source=manual should normally have actor_id filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1724" x="1206.71" y="1499.0059">- source=system/integration may have actor_id null.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.1113" x="1206.71" y="1514.3164">- eventKey should stay stable once used by the application.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="460.6304" x="1206.71" y="1529.627">- every order status transition must create order.status_changed history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="520.7808" x="1206.71" y="1544.9375">- important order mutations should store structured before/after data in changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.2554" x="1206.71" y="1560.248">- title/description are display snapshots; payload is machine-readable context.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.9966" x="1206.71" y="1575.5586">- comments, entry edits, payments, shipments, returns, delivery actions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="488.2363" x="1214.9366" y="1590.8691">and future integrations should all create history rows when they affect Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="1606.1797">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.5796" x="1206.71" y="1621.4902">Payment:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.8286" x="1206.71" y="1636.8008">- amount &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.355" x="1206.71" y="1652.1113">- amountBase &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3032" x="1206.71" y="1667.4219">- exchangeRateToBase &gt; 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.3501" x="1206.71" y="1682.7324">- exactly one of order_id or purchase_id should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="596.1528" x="1206.71" y="1698.043">- incoming payments usually belong to Order; outgoing payments usually belong to Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.3267" x="1206.71" y="1713.3535">- refund payments may intentionally use the opposite direction.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="452.061" x="1206.71" y="1728.6641">- Order/Purchase paidAmountBase and paymentStatus are cache fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.084" x="1206.71" y="1743.9746">- Source of truth is sum(Payment.amountBase) against document totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1099" x="1206.71" y="1759.2852">- unpaid: paidAmountBase = 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.085" x="1206.71" y="1774.5957">- partially_paid: 0 &lt; paidAmountBase &lt; totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.0166" x="1206.71" y="1789.9063">- paid: paidAmountBase = totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.2925" x="1206.71" y="1805.2168">- overpaid: paidAmountBase &gt; totalAmountBase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="748.668" x="1206.71" y="1820.5273">- refunded: use when effective paid amount returns to 0 after refund, if business rules require a separate visible state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="1835.8379">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4766" x="1206.71" y="1851.1484">PaymentHistory:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.6035" x="1206.71" y="1866.459">- append-only: do not update/delete existing history rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.3501" x="1206.71" y="1881.7695">- exactly one of order_id or purchase_id should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.958" x="1206.71" y="1897.0801">- documentType/documentId must match the filled order_id or purchase_id.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="538.8462" x="1206.71" y="1912.3906">- payment_id is required and should point to the payment row that caused the event.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.1113" x="1206.71" y="1927.7012">- eventKey should stay stable once used by the application.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.147" x="1206.71" y="1943.0117">- payment.recorded is created when a new Payment is saved.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="509.9326" x="1206.71" y="1958.3223">- payment.reversed is created when a linked refund/reversal Payment is created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="553.6553" x="1206.71" y="1973.6328">- Payment remains the financial source of truth; PaymentHistory is the audit/feed layer.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="1988.9434">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.4277" x="1206.71" y="2004.2539">ProductPrice / ExchangeRate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="613.9644" x="1206.71" y="2019.5645">- ProductPrice valid intervals should not overlap for the same store + product + type + currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="676.1396" x="1206.71" y="2034.875">- ExchangeRate valid intervals should not overlap for the same store/global + fromCurrency + toCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="675.689" x="1206.71" y="2050.1855">- fromCurrency and toCurrency should be different, unless explicitly storing rate=1 for the same currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="2065.4961">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.7012" x="1206.71" y="2080.8066">Deletion / archiving policy:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="766.981" x="1206.71" y="2096.1172">- Business documents should not be physically deleted: Order, Purchase, InventoryDocument, Payment, ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="831.8477" x="1206.71" y="2111.4277">- Stock history should not be physically deleted: InventoryDocumentLine, StockMovement, WarehouseStockBatch, StockReservation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.9097" x="1206.71" y="2126.7383">- OrderHistory should not be physically deleted or rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.1099" x="1206.71" y="2142.0488">- OrderComment can use soft delete when the UI must hide content.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="559.3745" x="1206.71" y="2157.3594">- Reference data can be deactivated via status=inactive and hidden from creation forms.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="614.6563" x="1206.71" y="2172.6699">- Reference data can use deletedAt for soft delete only when it is not needed in active workflows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="543.4355" x="1206.71" y="2187.9805">- Soft-deleted reference rows must remain readable from old documents and reports.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="814.8677" x="1206.71" y="2203.291">- Product, Customer, Supplier, Warehouse, Unit, Category, InventoryReason and ProductPrice use soft-delete/archiving behavior.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="861.8213" x="1206.71" y="2218.6016">- Currency and ExchangeRate should normally be disabled/expired, not deleted, because old financial documents may depend on them.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="2233.9121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3516" x="1206.71" y="2249.2227">Cancellation timestamps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.2231" x="1206.71" y="2264.5332">- Order.canceledAt should be filled when Order.status=canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="452.5942" x="1206.71" y="2279.8438">- Purchase.canceledAt should be filled when Purchase.status=canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.3677" x="1206.71" y="2295.1543">- ProductionOrder.canceledAt should be filled when ProductionOrder.status=canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="2310.4648">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.9404" x="1206.71" y="2325.7754">Status transitions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="834.5137" x="1206.71" y="2341.0859">- Order statuses should follow the recommended flow; do not jump to completed without delivered/shipped business confirmation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="614.7642" x="1206.71" y="2356.3965">- Purchase statuses should follow draft -&gt; ordered -&gt; partially_received/received -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.7769" x="1206.71" y="2371.707">- InventoryDocument can affect stock only when status=posted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="695.3794" x="1206.71" y="2387.0176">- ProductionOrder can become in_progress only after materials are reserved or an explicit override is allowed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.6841" x="1206.71" y="2402.3281">- Every Order status transition should create OrderHistory.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="634.7466" x="1206.71" y="2417.6387">- Every Purchase/InventoryDocument/ProductionOrder status transition should create StatusHistory.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="2432.9492">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.4131" x="1206.71" y="2448.2598">Audit fields:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="645.1694" x="1206.71" y="2463.5703">- createdBy/updatedBy/postedBy/canceledBy/startedBy/completedBy should reference existing users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="485.1323" x="1206.71" y="2478.8809">- Do not use these fields as permission model; they are historical audit data.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.5342" x="1206.71" y="2494.1914">- OrderHistory should preserve the detailed order timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="496.8501" x="1206.71" y="2509.502">- StatusHistory should still be created for generic document status transitions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1206.71" y="2524.8125">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.1855" x="1206.71" y="2540.123">Production:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.2197" x="1206.71" y="2555.4336">- ProductionOrder.product should usually have canBeManufactured=true.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.3613" x="1206.71" y="2570.7441">- ProductionRecipe.product should usually have canBeManufactured=true.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="726.1021" x="1206.71" y="2586.0547">- ProductionRecipeItem.material and ProductionOrderMaterial.material should usually not be productKind=service.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="792.8984" x="1206.71" y="2601.3652">- Production actual material usage is recorded via InventoryDocumentLine OUT lines, not by editing ProductionOrderMaterial.</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="180" id="ent0010"><path d="M2104,815.4283 L2104,1897.1666 A0,0 0 0 0 2104,1897.1666 L2600.2427,1897.1666 A0,0 0 0 0 2600.2427,1897.1666 L2600.2427,825.4283 L2590.2427,815.4283 L2359.45,815.4283 L2355.45,63.2283 L2351.45,815.4283 L2104,815.4283 A0,0 0 0 0 2104,815.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2590.2427,815.4283 L2590.2427,825.4283 L2600.2427,825.4283 L2590.2427,815.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.6172" x="2110" y="832.9966">Recommended indexes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5269" x="2110" y="848.3072">WarehouseStock(product_id, warehouse_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.8994" x="2110" y="863.6177">StockMovement(warehouse_stock_id, created_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.3179" x="2110" y="878.9283">StockMovement(inventory_document_line_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.8945" x="2110" y="894.2388">StockMovement(warehouse_stock_batch_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.7446" x="2110" y="909.5494">InventoryDocument(store_id, number)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.9536" x="2110" y="924.8599">InventoryDocument(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8071" x="2110" y="940.1705">InventoryDocument(store_id, type)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5894" x="2110" y="955.481">InventoryDocument(store_id, reason_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.1948" x="2110" y="970.7916">InventoryDocument(document_date)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.626" x="2110" y="986.1021">InventoryDocument(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.0205" x="2110" y="1001.4127">InventoryDocument(posted_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9287" x="2110" y="1016.7232">InventoryDocument(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.2236" x="2110" y="1032.0337">InventoryReason(store_id, type, name)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.062" x="2110" y="1047.3443">ProductPrice(store_id, product_id, type, currency_code, valid_from)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.3198" x="2110" y="1062.6548">ProductPrice(store_id, product_id, type, valid_from, valid_to)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.5396" x="2110" y="1077.9654">ExchangeRate(from_currency_code, to_currency_code, valid_from)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="475.2427" x="2110" y="1093.2759">ExchangeRate(store_id, from_currency_code, to_currency_code, valid_from)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.3433" x="2110" y="1108.5865">StatusHistory(store_id, entity_type, entity_id, changed_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.7012" x="2110" y="1123.897">StatusHistory(store_id, changed_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9878" x="2110" y="1139.2076">OrderComment(order_id, created_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4209" x="2110" y="1154.5181">OrderComment(author_id, created_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.2056" x="2110" y="1169.8287">OrderHistory(order_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.709" x="2110" y="1185.1392">OrderHistory(order_id, event_key, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.1616" x="2110" y="1200.4498">OrderHistory(actor_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.6177" x="2110" y="1215.7603">OrderHistory(source, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9922" x="2110" y="1231.0709">InventoryDocumentLine(inventory_document_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.1377" x="2110" y="1246.3814">InventoryDocumentLine(product_id, warehouse_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.9224" x="2110" y="1261.692">Unit(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.9399" x="2110" y="1277.0025">Customer(store_id, phone)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4683" x="2110" y="1292.313">Customer(store_id, email)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2959" x="2110" y="1307.6236">Supplier(store_id, name)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.3374" x="2110" y="1322.9341">Order(store_id, number)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.5093" x="2110" y="1338.2447">Order(store_id, payment_status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.5464" x="2110" y="1353.5552">Order(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.2188" x="2110" y="1368.8658">Order(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.5215" x="2110" y="1384.1763">Order(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.1489" x="2110" y="1399.4869">Order(canceled_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.1938" x="2110" y="1414.7974">OrderEntry(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.4028" x="2110" y="1430.108">OrderEntry(product_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.5752" x="2110" y="1445.4185">OrderEntry(warehouse_stock_batch_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.5229" x="2110" y="1460.7291">Purchase(store_id, number)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.6948" x="2110" y="1476.0396">Purchase(store_id, payment_status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.7319" x="2110" y="1491.3502">Purchase(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.4043" x="2110" y="1506.6607">Purchase(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.707" x="2110" y="1521.9712">Purchase(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.3345" x="2110" y="1537.2818">Purchase(canceled_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.6753" x="2110" y="1552.5923">PurchaseEntry(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.5884" x="2110" y="1567.9029">PurchaseEntry(product_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.4673" x="2110" y="1583.2134">Payment(store_id, paid_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.4102" x="2110" y="1598.524">Payment(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.7061" x="2110" y="1613.8345">Payment(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.5278" x="2110" y="1629.1451">Payment(store_id, direction, paid_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.5225" x="2110" y="1644.4556">Payment(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.7339" x="2110" y="1659.7662">Payment(updated_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.3765" x="2110" y="1675.0767">PaymentHistory(store_id, document_type, document_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4971" x="2110" y="1690.3873">PaymentHistory(store_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7212" x="2110" y="1705.6978">PaymentHistory(payment_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3071" x="2110" y="1721.0084">PaymentHistory(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.603" x="2110" y="1736.3189">PaymentHistory(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.2632" x="2110" y="1751.6295">PaymentHistory(actor_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.6187" x="2110" y="1766.94">ProductionOrder(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.291" x="2110" y="1782.2505">ProductionOrder(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5938" x="2110" y="1797.5611">ProductionOrder(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2212" x="2110" y="1812.8716">ProductionOrder(canceled_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2432" x="2110" y="1828.1822">ProductionOrderMaterial(production_order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0605" x="2110" y="1843.4927">ProductionOrderMaterial(material_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0669" x="2110" y="1858.8033">StockReservation(order_entry_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.666" x="2110" y="1874.1138">StockReservation(warehouse_stock_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.1162" x="2110" y="1889.4244">StockReservation(warehouse_stock_batch_id, status)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="253" id="ent0013"><path d="M2619.77,1274.7483 L2619.77,1437.8538 L3322.4575,1437.8538 L3322.4575,1284.7483 L3312.4575,1274.7483 L2619.77,1274.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3312.4575,1274.7483 L3312.4575,1284.7483 L3322.4575,1284.7483 L3312.4575,1274.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9551" x="2625.77" y="1292.3166">Deletion / archiving rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1307.6272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="529.6929" x="2625.77" y="1322.9377">Do not physically delete documents, payments, stock movements or posted history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="460.6938" x="2625.77" y="1338.2483">Use status transitions, reversal documents and refund payments instead.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.666" x="2625.77" y="1353.5588">OrderHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.9697" x="2625.77" y="1368.8694">PaymentHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7534" x="2625.77" y="1384.1799">OrderComment can be hidden by soft delete when needed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1399.4905">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="467.7207" x="2625.77" y="1414.801">For reference data, prefer status=inactive for hiding from new operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.6875" x="2625.77" y="1430.1116">Use deletedAt only as soft delete; old documents must still be able to display snapshots and linked records.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="265" id="ent0016"><path d="M3342.24,1297.7083 L3342.24,1414.8821 L3927.991,1414.8821 L3927.991,1307.7083 L3917.991,1297.7083 L3342.24,1297.7083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3917.991,1297.7083 L3917.991,1307.7083 L3927.991,1307.7083 L3917.991,1297.7083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.9141" x="3348.24" y="1315.2766">Audit fields rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.0928" x="3348.24" y="1330.5872">createdBy/updatedBy are stored on admin-managed reference data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.751" x="3348.24" y="1345.8977">(Product, ProductPrice, Warehouse, Customer, Supplier, Unit, InventoryReason, Category).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="549.6182" x="3348.24" y="1361.2083">Technical stock tables like WarehouseStock, WarehouseStockBatch and StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.7192" x="3348.24" y="1376.5188">should be created/updated by posting inventory documents, not manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.2178" x="3348.24" y="1391.8294">Their responsible user is traced through InventoryDocument, Payment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.6997" x="3348.24" y="1407.1399">PaymentHistory, OrderHistory or StatusHistory depending on the business object.</text></g><!--link start to GMN2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="association" data-source-line="7" id="lnk5"><path d="M2341.72,53.1083 C2226.39,53.1083 1190.47,53.1083 1190.47,53.1083 C1190.47,53.1083 1190.47,1356.1083 1190.47,1356.1083 C1190.47,1356.1083 1187.01,1356.1083 1180.6,1356.1083" fill="none" id="start-GMN2" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link start to GMN6--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="association" data-source-line="15" 
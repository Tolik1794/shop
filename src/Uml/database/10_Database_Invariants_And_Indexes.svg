mentHistory(store_id, document_type, document_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4971" x="2110" y="1805.2195">PaymentHistory(store_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7212" x="2110" y="1820.53">PaymentHistory(payment_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3071" x="2110" y="1835.8405">PaymentHistory(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.603" x="2110" y="1851.1511">PaymentHistory(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.2632" x="2110" y="1866.4616">PaymentHistory(actor_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.6187" x="2110" y="1881.7722">ProductionOrder(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.291" x="2110" y="1897.0827">ProductionOrder(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5938" x="2110" y="1912.3933">ProductionOrder(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2212" x="2110" y="1927.7038">ProductionOrder(canceled_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.3638" x="2110" y="1943.0144">ProductionOrder(source_order_entry_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2432" x="2110" y="1958.3249">ProductionOrderMaterial(production_order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0605" x="2110" y="1973.6355">ProductionOrderMaterial(material_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0669" x="2110" y="1988.946">StockReservation(order_entry_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.666" x="2110" y="2004.2566">StockReservation(warehouse_stock_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.1162" x="2110" y="2019.5671">StockReservation(warehouse_stock_batch_id, status)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="270" id="ent0013"><path d="M2619.77,1366.6083 L2619.77,1529.7138 L3322.4575,1529.7138 L3322.4575,1376.6083 L3312.4575,1366.6083 L2619.77,1366.6083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3312.4575,1366.6083 L3312.4575,1376.6083 L3322.4575,1376.6083 L3312.4575,1366.6083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9551" x="2625.77" y="1384.1766">Deletion / archiving rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1399.4872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="529.6929" x="2625.77" y="1414.7977">Do not physically delete documents, payments, stock movements or posted history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="576.875" x="2625.77" y="1430.1083">Use status transitions, reversal documents and reversal/refund payment directions instead.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.666" x="2625.77" y="1445.4188">OrderHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.9697" x="2625.77" y="1460.7294">PaymentHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7534" x="2625.77" y="1476.0399">OrderComment can be hidden by soft delete when needed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1491.3505">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="467.7207" x="2625.77" y="1506.661">For reference data, prefer status=inactive for hiding from new operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.6875" x="2625.77" y="1521.9716">Use deletedAt only as soft delete; old documents must still be able to display snapshots and linked records.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="282" id="ent0016"><path d="M3342.24,1389.5783 L3342.24,1506.7521 L3927.991,1506.7521 L3927.991,1399.5783 L3917.991,1389.5783 L3342.24,1389.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3917.991,1389.5783 L3917.991,1399.5783 L3927.991,1399.5783 L3917.991,1389.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.9141" x="3348.24" y="1407.1466">Audit fields rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.0928" x="3348.24" y="1422.4572">createdBy/updatedBy are stored on admin-managed reference data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.751" x="3348.24" y="1437.7677">(Product, ProductPrice, Warehouse, Customer, Supplier, Unit, InventoryReason, Category).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="549.6182" x="3348.24" y="1453.0783">Technical stock tables like WarehouseStock, WarehouseStockBatch and StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.7192" x="3348.24" y="1468.3888">should be created/updated by posting inventory documents, not manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.2178" x="3348.24" y="1483.6994">Their responsible user is traced through InventoryDocument, Payment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.6997" x="3348.24" y="1499.0099">PaymentHistory, OrderHistory or StatusHistory depending on the business object.</text></g><!--link start to GMN2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="association" data-source-line="7" id="lnk5"><path d="M2341.72,53.8383 C2226.39,53.8383 1190.47,53.8383 1190.47,53.8383 C1190.47,53.8383 1190.47,1447.8383 1190.47,1447.8383 C1190.47,1447.8383 1187.01,1447.8383 1180.6,1447.8383" fill="none" id="start-GMN2" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link start to GMN6--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="association" data-source-line="15" id="lnk8"><path d="M2348.78,63.3383 C2348.78,127.6883 2348.78,485.8383 2348.78,485.8383 C2348.78,485.8383 2226.63,485.8383 2083.89,485.8383" fill="none" id="start-GMN6" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link start to GMN12--><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" data-link-type="association" data-source-line="270" id="lnk14"><path d="M2361.84,56.8383 C2440.59,56.8383 2971.12,56.8383 2971.12,56.8383 C2971.12,56.8383 2971.12,1068.0883 2971.12,1366.3283" fill="none" id="start-GMN12" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><
</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.4102" x="2110" y="1743.9762">Payment(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.7061" x="2110" y="1759.2867">Payment(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.5278" x="2110" y="1774.5973">Payment(store_id, direction, paid_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.5225" x="2110" y="1789.9078">Payment(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.7339" x="2110" y="1805.2184">Payment(updated_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.3765" x="2110" y="1820.5289">PaymentHistory(store_id, document_type, document_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4971" x="2110" y="1835.8395">PaymentHistory(store_id, occurred_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7212" x="2110" y="1851.15">PaymentHistory(payment_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.3071" x="2110" y="1866.4605">PaymentHistory(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.603" x="2110" y="1881.7711">PaymentHistory(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.2632" x="2110" y="1897.0816">PaymentHistory(actor_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.6187" x="2110" y="1912.3922">ProductionOrder(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.291" x="2110" y="1927.7027">ProductionOrder(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5938" x="2110" y="1943.0133">ProductionOrder(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2212" x="2110" y="1958.3238">ProductionOrder(canceled_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.3638" x="2110" y="1973.6344">ProductionOrder(source_order_entry_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2432" x="2110" y="1988.9449">ProductionOrderMaterial(production_order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0605" x="2110" y="2004.2555">ProductionOrderMaterial(material_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0669" x="2110" y="2019.566">StockReservation(order_entry_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.666" x="2110" y="2034.8766">StockReservation(warehouse_stock_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.1162" x="2110" y="2050.1871">StockReservation(warehouse_stock_batch_id, status)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="274" id="ent0013"><path d="M2619.77,1397.2283 L2619.77,1560.3338 L3322.4575,1560.3338 L3322.4575,1407.2283 L3312.4575,1397.2283 L2619.77,1397.2283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3312.4575,1397.2283 L3312.4575,1407.2283 L3322.4575,1407.2283 L3312.4575,1397.2283" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9551" x="2625.77" y="1414.7966">Deletion / archiving rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1430.1072">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="529.6929" x="2625.77" y="1445.4177">Do not physically delete documents, payments, stock movements or posted history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="576.875" x="2625.77" y="1460.7283">Use status transitions, reversal documents and reversal/refund payment directions instead.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.666" x="2625.77" y="1476.0388">OrderHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.9697" x="2625.77" y="1491.3494">PaymentHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7534" x="2625.77" y="1506.6599">OrderComment can be hidden by soft delete when needed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1521.9705">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="467.7207" x="2625.77" y="1537.281">For reference data, prefer status=inactive for hiding from new operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.6875" x="2625.77" y="1552.5916">Use deletedAt only as soft delete; old documents must still be able to display snapshots and linked records.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="286" id="ent0016"><path d="M3342.24,1420.1983 L3342.24,1537.3721 L3927.991,1537.3721 L3927.991,1430.1983 L3917.991,1420.1983 L3342.24,1420.1983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3917.991,1420.1983 L3917.991,1430.1983 L3927.991,1430.1983 L3917.991,1420.1983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.9141" x="3348.24" y="1437.7666">Audit fields rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.0928" x="3348.24" y="1453.0772">createdBy/updatedBy are stored on admin-managed reference data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.751" x="3348.24" y="1468.3877">(Product, ProductPrice, Warehouse, Customer, Supplier, Unit, InventoryReason, Category).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="549.6182" x="3348.24" y="1483.6983">Technical stock tables like WarehouseStock, WarehouseStockBatch and StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.7192" x="3348.24" y="1499.0088">should be created/updated by posting inventory documents, not manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.2178" x="3348.24" y="1514.3194">Their responsible user is traced through InventoryDocument, Payment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.6997" x="3348.24" y="1529.6299">PaymentHistory, OrderHistory or StatusHistory depending on the business object.</text></g><!--link start to GMN2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="association" data-source-line="7" id="lnk5"><path d="M2341.72,53.0783 C2226.39,53.0783 1190.47,53.0783 1190.47,53.0783 C1190.47,53.078
acing" textLength="159.3071" x="2110" y="1828.1805">PaymentHistory(order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.603" x="2110" y="1843.4911">PaymentHistory(purchase_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.2632" x="2110" y="1858.8016">PaymentHistory(actor_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.6187" x="2110" y="1874.1122">ProductionOrder(store_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.291" x="2110" y="1889.4227">ProductionOrder(created_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5938" x="2110" y="1904.7333">ProductionOrder(canceled_by_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2212" x="2110" y="1920.0438">ProductionOrder(canceled_at)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2432" x="2110" y="1935.3544">ProductionOrderMaterial(production_order_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0605" x="2110" y="1950.6649">ProductionOrderMaterial(material_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0669" x="2110" y="1965.9755">StockReservation(order_entry_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.666" x="2110" y="1981.286">StockReservation(warehouse_stock_id, status)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.1162" x="2110" y="1996.5966">StockReservation(warehouse_stock_batch_id, status)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="267" id="ent0013"><path d="M2619.77,1351.2883 L2619.77,1514.3937 L3322.4575,1514.3937 L3322.4575,1361.2883 L3312.4575,1351.2883 L2619.77,1351.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3312.4575,1351.2883 L3312.4575,1361.2883 L3322.4575,1361.2883 L3312.4575,1351.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.9551" x="2625.77" y="1368.8566">Deletion / archiving rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1384.1672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="529.6929" x="2625.77" y="1399.4777">Do not physically delete documents, payments, stock movements or posted history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="460.6938" x="2625.77" y="1414.7883">Use status transitions, reversal documents and refund payments instead.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.666" x="2625.77" y="1430.0988">OrderHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.9697" x="2625.77" y="1445.4094">PaymentHistory is append-only and must not be rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7534" x="2625.77" y="1460.7199">OrderComment can be hidden by soft delete when needed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2625.77" y="1476.0305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="467.7207" x="2625.77" y="1491.341">For reference data, prefer status=inactive for hiding from new operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.6875" x="2625.77" y="1506.6516">Use deletedAt only as soft delete; old documents must still be able to display snapshots and linked records.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="279" id="ent0016"><path d="M3342.24,1374.2583 L3342.24,1491.4321 L3927.991,1491.4321 L3927.991,1384.2583 L3917.991,1374.2583 L3342.24,1374.2583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3917.991,1374.2583 L3917.991,1384.2583 L3927.991,1384.2583 L3917.991,1374.2583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.9141" x="3348.24" y="1391.8266">Audit fields rule:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.0928" x="3348.24" y="1407.1372">createdBy/updatedBy are stored on admin-managed reference data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.751" x="3348.24" y="1422.4477">(Product, ProductPrice, Warehouse, Customer, Supplier, Unit, InventoryReason, Category).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="549.6182" x="3348.24" y="1437.7583">Technical stock tables like WarehouseStock, WarehouseStockBatch and StockMovement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.7192" x="3348.24" y="1453.0688">should be created/updated by posting inventory documents, not manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.2178" x="3348.24" y="1468.3794">Their responsible user is traced through InventoryDocument, Payment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="514.6997" x="3348.24" y="1483.6899">PaymentHistory, OrderHistory or StatusHistory depending on the business object.</text></g><!--link start to GMN2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="association" data-source-line="7" id="lnk5"><path d="M2341.72,53.2083 C2226.39,53.2083 1190.47,53.2083 1190.47,53.2083 C1190.47,53.2083 1190.47,1433.2083 1190.47,1433.2083 C1190.47,1433.2083 1187.01,1433.2083 1180.6,1433.2083" fill="none" id="start-GMN2" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link start to GMN6--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="association" data-source-line="15" id="lnk8"><path d="M2348.78,63.2483 C2348.78,127.0583 2348.78,482.2083 2348.78,482.2083 C2348.78,482.2083 2226.63,482.2083 2083.89,482.2083" fill="none" id="start-GMN6" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link start to GMN12--><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" data-link-type="association" data-source-line="267" id="lnk14"><path d="M2361.84,57.2083 C2440.59,57.2083 2971.12,57.2083 2971.12,57.2083 C2971.12,57.2083 2971.12,1054.7683 2971.12,1350.9083" fill="none" id="start-GMN12" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link start to GMN15--><g class="link" data-entity-1="ent0004" data-entity-2="ent0016" data-link-type="association" data-source-line="279" id="lnk17"><path d="M2362.07,50.2083 C2481.49,50.2083 3635.12,50.2083 3635.12,50.2083 C3635.12,50.2083 3635.12,1109.9683 3635.12,1373.8783" fill="none" id="start-GMN15" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src hHl9SXitzgwlmDoa2aKwLpbobIt74rV6iUEbScI1tI29kDbezoAPy_NpDYoDRbAQ99U4RW0FRr-XtlQLKP_shb6bxlL6TqPTgxVrlMwjhljkeKfJcTwwMZMkiiLHwRfKjYxDTzDTNFpBraKrb4OjL-l27GwkNZR3eRgug5rlrCRrlJjSAFN6rhfIHMLqFS15fh0TGEnkOEbQ_VozsEjwPpvgE68xfTKMjjU5rTMgDLlJchemojIzxVdsRk-6gbHm1O1g37m1x01bsEBQuqUZEq23G
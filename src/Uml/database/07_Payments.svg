3.05" x2="827.4152" y1="128.4466" y2="128.4466"/></g><g class="entity" data-qualified-name="GMN27" data-source-line="93" id="ent0028"><path d="M1567.23,272.7483 L1567.23,310.4383 L600.02,314.4383 L1567.23,318.4383 L1567.23,558.3381 A0,0 0 0 0 1567.23,558.3381 L2119.2432,558.3381 A0,0 0 0 0 2119.2432,558.3381 L2119.2432,282.7483 L2109.2432,272.7483 L1567.23,272.7483 A0,0 0 0 0 1567.23,272.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2109.2432,272.7483 L2109.2432,282.7483 L2119.2432,282.7483 L2109.2432,272.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.124" x="1573.23" y="290.3166">Universal payment table for customer payments and supplier payments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1573.23" y="305.6272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.5024" x="1573.23" y="320.9377">Direction:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.1753" x="1573.23" y="336.2483">- incoming: money received, usually for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.688" x="1573.23" y="351.5588">- outgoing: money paid, usually for Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1573.23" y="366.8694">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.0288" x="1573.23" y="382.1799">Rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4702" x="1573.23" y="397.4905">- exactly one of order or purchase should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.9829" x="1573.23" y="412.801">- Order payments are usually incoming.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.5688" x="1573.23" y="428.1116">- Purchase payments are usually outgoing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.2803" x="1573.23" y="443.4221">- refunds can use type=refund with the opposite direction.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.1982" x="1573.23" y="458.7327">- reversal corrections are linked to the original payment and keep its snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0356" x="1573.23" y="474.0432">- every reversal stores an explicit business reason in comment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3008" x="1573.23" y="489.3538">- amount is in payment currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="531.0132" x="1573.23" y="504.6643">- amountBase is stored in Store.baseCurrency using exchangeRateToBase snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1573.23" y="519.9748">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.1553" x="1573.23" y="535.2854">Do not rely only on Order.paidAt for payment state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.458" x="1573.23" y="550.5959">Payment records are the source of truth for paid/remaining amounts.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="114" id="ent0031"><path d="M866.14,356.9583 L866.14,411.4383 L600,415.4383 L866.14,419.4383 L866.14,474.1321 A0,0 0 0 0 866.14,474.1321 L1532.3285,474.1321 A0,0 0 0 0 1532.3285,474.1321 L1532.3285,366.9583 L1522.3285,356.9583 L866.14,356.9583 A0,0 0 0 0 866.14,356.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1522.3285,356.9583 L1522.3285,366.9583 L1532.3285,366.9583 L1522.3285,356.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0737" x="872.14" y="374.5266">Payment records are the source of truth for financial payments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="872.14" y="389.8372">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="645.1885" x="872.14" y="405.1477">Order.paidAmountBase / Purchase.paidAmountBase and paymentStatus are denormalized cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3779" x="872.14" y="420.4583">for fast lists, filters, and dashboards.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="872.14" y="435.7688">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="631.5791" x="872.14" y="451.0794">They should be recalculated from Payment rows after creating payments or explicit linked reversals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.8306" x="872.14" y="466.3899">paidAt can store the date when the document became fully paid.</text></g><g class="entity" data-qualified-name="GMN33" data-source-line="124" id="ent0034"><path d="M623.01,734.4483 L623.01,827.4383 L588.65,831.4383 L623.01,835.4383 L623.01,928.1748 A0,0 0 0 0 623.01,928.1748 L1213.4646,928.1748 A0,0 0 0 0 1213.4646,928.1748 L1213.4646,744.4483 L1203.4646,734.4483 L623.01,734.4483 A0,0 0 0 0 623.01,734.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1203.4646,734.4483 L1203.4646,744.4483 L1213.4646,744.4483 L1203.4646,734.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="528.8994" x="629.01" y="752.0166">Append-only financial activity timeline for payments attached to Order or Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="629.01" y="767.3272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="494.9712" x="629.01" y="782.6377">It records payment.recorded and payment.reversed events for new operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.334" x="629.01" y="797.9483">Existing Payment rows are not automatically backfilled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="629.01" y="813.2588">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.4878" x="629.01" y="828.5694">documentType/documentId are denormalized timeline keys.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="487.7856" x="629.01" y="843.8799">order or purchase keeps the direct FK for current supported document types.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.6382" x="629.01" y="859.1905">Exactly one of order or purchase should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="629.01" y="874.501">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.0146" x="629.01" y="889.8116">title/description are display snapshots; payload keeps machine-readable context</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.5083" x="629.01" y="905.1221">such as original_payment_id and reversal reason.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="569.4546" x="629.01" y="920.4327">Payment rows remain the financial source of truth; PaymentHistory is the audit/feed layer.</text></g><!--link Store to Payment--><g class="link" data-entity-1="ent0007" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="76" id="lnk8"><path codeLine="76" d="M443.05,144.7983 C443.05,168.8783 443.05,184.1883 443.05,227.7383" fill="none" id="Store-Payment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="439.05" x2="447.05" y1="140.7983" y2="140.7983"/><line style="stroke:#181818;stroke-width:1;" x1="439.05" x2="447.05" y1="143.7983" y2="143.7983"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="443.05" y1="144.7983" y2="136.7983"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="449.05" y1="237.7383" y2="245.7383"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="437.05" y1="237.7383" y2="245.7383"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="443.05" y1="237.7383" y2="245.7383"/><ellipse cx="443.05" cy="231.7383" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0771" x="355.05" y="204.8366">has payments</text></g><!--link Currency to Payment--><g class="link" data-entity-1="ent0009" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="77" id="lnk10"><path codeLine="77" d="M525.24,144.7983 C525.24,168.8783 525.24,184.1883 525.24,227.7383" fill="none" id="Currency-Payment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#
="38.0288" x="1573.23" y="390.4299">Rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4702" x="1573.23" y="405.7405">- exactly one of order or purchase should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.9829" x="1573.23" y="421.051">- Order payments are usually incoming.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.5688" x="1573.23" y="436.3616">- Purchase payments are usually outgoing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.2803" x="1573.23" y="451.6721">- refunds can use type=refund with the opposite direction.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.1982" x="1573.23" y="466.9827">- reversal corrections are linked to the original payment and keep its snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0356" x="1573.23" y="482.2932">- every reversal stores an explicit business reason in comment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3008" x="1573.23" y="497.6038">- amount is in payment currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="531.0132" x="1573.23" y="512.9143">- amountBase is stored in Store.baseCurrency using exchangeRateToBase snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1573.23" y="528.2248">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.1553" x="1573.23" y="543.5354">Do not rely only on Order.paidAt for payment state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.458" x="1573.23" y="558.8459">Payment records are the source of truth for paid/remaining amounts.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="115" id="ent0031"><path d="M866.14,365.2083 L866.14,419.9283 L600,423.9283 L866.14,427.9283 L866.14,482.3821 A0,0 0 0 0 866.14,482.3821 L1532.3285,482.3821 A0,0 0 0 0 1532.3285,482.3821 L1532.3285,375.2083 L1522.3285,365.2083 L866.14,365.2083 A0,0 0 0 0 866.14,365.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1522.3285,365.2083 L1522.3285,375.2083 L1532.3285,375.2083 L1522.3285,365.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0737" x="872.14" y="382.7766">Payment records are the source of truth for financial payments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="872.14" y="398.0872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="645.1885" x="872.14" y="413.3977">Order.paidAmountBase / Purchase.paidAmountBase and paymentStatus are denormalized cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3779" x="872.14" y="428.7083">for fast lists, filters, and dashboards.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="872.14" y="444.0188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="631.5791" x="872.14" y="459.3294">They should be recalculated from Payment rows after creating payments or explicit linked reversals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.8306" x="872.14" y="474.6399">paidAt can store the date when the document became fully paid.</text></g><g class="entity" data-qualified-name="GMN33" data-source-line="125" id="ent0034"><path d="M623.01,750.9383 L623.01,843.9283 L588.65,847.9283 L623.01,851.9283 L623.01,944.6648 A0,0 0 0 0 623.01,944.6648 L1213.4646,944.6648 A0,0 0 0 0 1213.4646,944.6648 L1213.4646,760.9383 L1203.4646,750.9383 L623.01,750.9383 A0,0 0 0 0 623.01,750.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1203.4646,750.9383 L1203.4646,760.9383 L1213.4646,760.9383 L1203.4646,750.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="528.8994" x="629.01" y="768.5066">Append-only financial activity timeline for payments attached to Order or Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="629.01" y="783.8172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="494.9712" x="629.01" y="799.1277">It records payment.recorded and payment.reversed events for new operations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.334" x="629.01" y="814.4383">Existing Payment rows are not automatically backfilled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="629.01" y="829.7488">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.4878" x="629.01" y="845.0594">documentType/documentId are denormalized timeline keys.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="487.7856" x="629.01" y="860.3699">order or purchase keeps the direct FK for current supported document types.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.6382" x="629.01" y="875.6805">Exactly one of order or purchase should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="629.01" y="890.991">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.0146" x="629.01" y="906.3016">title/description are display snapshots; payload keeps machine-readable context</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.5083" x="629.01" y="921.6121">such as original_payment_id and reversal reason.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="569.4546" x="629.01" y="936.9227">Payment rows remain the financial source of truth; PaymentHistory is the audit/feed layer.</text></g><!--link Store to Payment--><g class="link" data-entity-1="ent0007" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="77" id="lnk8"><path codeLine="77" d="M443.05,144.8983 C443.05,168.9083 443.05,184.0183 443.05,227.7383" fill="none" id="Store-Payment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="439.05" x2="447.05" y1="140.8983" y2="140.8983"/><line style="stroke:#181818;stroke-width:1;" x1="439.05" x2="447.05" y1="143.8983" y2="143.8983"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="443.05" y1="144.8983" y2="136.8983"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="449.05" y1="237.7383" y2="245.7383"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="437.05" y1="237.7383" y2="245.7383"/><line style="stroke:#181818;stroke-width:1;" x1="443.05" x2="443.05" y1="237.7383" y2="245.7383"/><ellipse cx="443.05" cy="231.7383" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0771" x="355.05" y="204.8866">has payments</text></g><!--link Currency to Payment--><g cl
754" x="837.41" y="146.2266">overpaid</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.4756" x="837.41" y="162.7148">refunded</text><line style="stroke:#181818;stroke-width:0.5;" x1="832.41" x2="973.5936" y1="169.668" y2="169.668"/></g><!--class Payment--><g class="entity" data-qualified-name="Payment" data-source-line="28" id="ent0005"><rect fill="#F1F1F1" height="339.2773" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="275.0469" x="371.48" y="245.9083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5791" x="480.2139" y="264.4434">Payment</text><line style="stroke:#181818;stroke-width:0.5;" x1="372.48" x2="645.5269" y1="272.3966" y2="272.3966"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="286.1407" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="391.48" y="289.9317">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="372.48" x2="645.5269" y1="296.8848" y2="296.8848"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="310.629" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.4063" x="391.48" y="314.42">direction: PaymentDirectionEnum</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="327.1173" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.4141" x="391.48" y="330.9083">type: PaymentTypeEnum</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="343.6055" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.0742" x="391.48" y="347.3966">amount: decimal(14, 4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="360.0938" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.7949" x="391.48" y="363.8848">amountBase: decimal(14, 4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="376.5821" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.668" x="391.48" y="380.3731">paidAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="391.48" y="396.8614">comment: text?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.3994" x="391.48" y="413.3497">externalReference: string(255)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="426.047" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.9551" x="391.48" y="429.838">currency: Currency</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="442.5352" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="249.0469" x="391.48" y="446.3263">exchangeRateToBase: decimal(18, 8)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="459.0235" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="391.48" y="462.8145">store: Store</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.3779" x="391.48" y="479.3028">order: Order?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.2041" x="391.48" y="495.7911">purchase: Purchase?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.2998" x="391.48" y="512.2794">reversesPayment: Payment?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.7764" x="391.48" y="528.7677">createdBy: User?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.3887" x="391.48" y="545.2559">updatedBy: User?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="557.9532" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="391.48" y="561.7442">createdAt: DateTimeImmutable</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="382.48" cy="574.4415" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.1572" x="391.48" y="578.2325">updatedAt: DateTimeImmutable</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="52" id="ent0006"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="399.55" y="93.9583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="402.55" y="112.4934">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="400.55" x2="439.4543" y1="120.4466" y2="120.4466"/><line style="stroke:#181818;stroke-width:0.5;" x1="400.55" x2="439.4543" y1="128.4466" y2="128.4466"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="53" id="ent0008"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="475.6" y="93.9583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="478.6" y="112.4934">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="476.6" x2="541.4057" y1="120.4466" y2="120.4466"/><line style="stroke:#181818;stroke-width:0.5;" x1="476.6" x2="541.4057" y1="128.4466" y2="128.4466"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="54" id="ent0010"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="577.53" y="93.9583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="580.53" y="112.4934">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="578.53" x2="621.4743" y1="120.4466" y2="120.4466"/><line style="stroke:#181818;stroke-width:0.5;" x1="578.53" x2="621.4743" y1="128.4466" y2="128.4466"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="55" id="ent0012"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="657.66" y="93.9583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="660.66" y="112.4934">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="658.66" x2="723.3426" y1="120.4466" y2="120.4466"/><line style="stroke:#181818;stroke-width:0.5;" x1="658.66" x2="723.3426" y1="128.4466" y2="128.4466"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="57" id="ent0015"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="759.82" y="93.9583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="762.82" y="112.4934">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="760.82" x2="795.1852" y1="120.4466" y2="120.4466"/><line style="stroke:#181818;stroke-width:0.5;" x1="760.82" x2="795.1852" y1="128.4466" y2="128.4466"/></g><g class="entity" data-qualified-name="GMN19" data-source-line="62" id="ent0020"><path d="M1400.99,272.7583 L1400.99,311.1883 L646.99,315.1883 L1400.99,319.1883 L1400.99,558.3481 A0,0 0 0 0 1400.99,558.3481 L1953.0032,558.3481 A0,0 0 0 0 1953.0032,558.3481 L1953.0032,282.7583 L1943.0032,272.7583 L1400.99,272.7583 A0,0 0 0 0 1400.99,272.7583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1943.0032,272.7583 L1943.0032,282.7583 L1953.0032,282.7583 L1943.0032,272.7583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.124" x="1406.99" y="290.3266">Universal payment table for customer payments and supplier payments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1406.99" y="305.6372">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.5024" x="1406.99" y="320.9477">Direction:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.1753" x="1406.99" y="336.2583">- incoming: money received, usually for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.688" x="1406.99" y="351.5688">- outgoing: money paid, usually for Purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1406.99" y="366.8794">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.0288" x="1406.99" y="382.1899">Rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4702" x="1406.99" y="397.5005">- exactly one of order or purchase should be filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.9829" x="1406.99" y="412.811">- Order payments are usually incoming.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.5688" x="1406.99" y="428.1216">- Purchase payments are usually outgoing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.2803" x="1406.99" y="443.4321">- refunds can use type=refund with the opposite direction.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.1982" x="1406.99" y="458.7427">- reversal corrections are linked to the original payment and keep its snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0356" x="1406.99" y="474.0532">- every reversal stores an explicit business reason in comment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3008" x="1406.99" y="489.3638">- amount is in payment currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="531.0132" x="1406.99" y="504.6743">- amountBase is stored in Store.baseCurrency using exchangeRateToBase snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1406.99" y="519.9848">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.1553" x="1406.99" y="535.2954">Do not rely only on Order.paidAt for payment state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.458" x="1406.99" y="550.6059">Payment records are the source of truth for paid/remaining amounts.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="83" id="ent0023"><path d="M699.91,356.9583 L699.91,411.1883 L647.02,415.1883 L699.91,419.1883 L699.91,474.1321 A0,0 0 0 0 699.91,474.1321 L1366.0985,474.1321 A0,0 0 0 0 1366.0985,474.1321 L1366.0985,366.9583 L1356.0985,356.9583 L699.91,356.9583 A0,0 0 0 0 699.91,356.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1356.0985,356.9583 L1356.0985,366.9583 L1366.0985,366.9583 L1356.0985,356.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0737" x="705.91" y="374.5266">Payment records are the source of truth for financial payments.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="705.91" y="389.8372">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="645.1885" x="705.91" y="405.1477">Order.paidAmountBase / Purchase.paidAmountBase and paymentStatus are denormalized cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3779" x="705.91" y="420.4583">for fast lists, filters, and dashboards.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="705.91" y="435.7688">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="631.5791" x="705.91" y="451.0794">They should be recalculated from Payment rows after creating payments or explicit linked reversals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.8306" x="705.91" y="466.3899">paidAt can store the date when the document became fully paid.</text></g><!--link Store to Payment--><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="52" id="lnk7"><path codeLine="52" d="M420,144.7983 C420,168.8783 420,184.1883 420,227.7483" fill="none" id="Store-Payment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="416" x2="424" y1="140.7983" y2="140.7983"/><line style="stroke:#181818;stroke-width:1;" x1="416" x2="424" y1="143.7983" y2="143.7983"/><line style="stroke:#181818;stroke-width:1;" x1="420" x2="420" y1="144.7983" y2="136.7983"/><line style="stroke:#181818;stroke-width:1;" x1="420" x2="426" y1="237.7483" y2="245.7483"/><line style="stroke:#181818;stroke-width:1;" x1="420" x2="414" y1="237.7483" y2="245.7483"/><line style="stroke:#181818;stroke-width:1;" x1="420" x2="420" y1="237.7483" y2="245.7483"/><ellipse cx="420" cy="231.7483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0771" x="421" y="187.8466">has payments</text></g><!--link Currency to Payment--><g class="link" data-entity-1="ent0008" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="53" id="lnk9"><path codeLine="53" d="M509,144.7983 C509,168.8783 509,184.1883 509,227.7483" fill="none" id="Currency-Payment" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="505" x2="513" y1="140.7983" y2="140.7983"/><line style="stroke:#181818;stroke-width:1;" x1="505" x2="513" y1="143.7983" y2="143.7983"/><line style="stroke:#181818;stroke-width:1;" x1="509" x2="509" y1="144.7983" y2="136.7983"/><line style="stroke:#181818;stroke-width:1;" x1="509" x2="515" y1="237.7483" y2="245.7483"/><line style="stroke:#181818;stroke-width:1;" x1="509" x2="503" y1="237.7483" y2="245.7483"/><line style="stroke:#181818;stroke-width:1;" x1="509" x2="509" y1="237.7483" y2="245.7483"/><ellipse cx="509" cy="231.7483" fill="none" rx="4" ry="4" style="stroke
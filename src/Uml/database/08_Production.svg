; planned -&gt; materials_reserved -&gt; in_progress -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="640.73" y="288.5477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="569.9941" x="640.73" y="303.8583">materials_reserved means required stock was reserved but production has not started yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.5474" x="640.73" y="319.1688">Actual material consumption happens through InventoryDocument(type=production) OUT lines.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="105" id="ent0031"><path d="M1574.41,270.9783 L1574.41,279.4583 L1540.03,283.4583 L1574.41,287.4583 L1574.41,296.2888 A0,0 0 0 0 1574.41,296.2888 L1937.5931,296.2888 A0,0 0 0 0 1937.5931,296.2888 L1937.5931,280.9783 L1927.5931,270.9783 L1574.41,270.9783 A0,0 0 0 0 1574.41,270.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1927.5931,270.9783 L1927.5931,280.9783 L1937.5931,280.9783 L1927.5931,270.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.1831" x="1580.41" y="288.5466">Describes bill of materials for manufactured products.</text></g><g class="entity" data-qualified-name="GMN33" data-source-line="109" id="ent0034"><path d="M2114.89,621.3783 L2114.89,637.4583 L2009.3,641.4583 L2114.89,645.4583 L2114.89,661.9994 A0,0 0 0 0 2114.89,661.9994 L2485.1127,661.9994 A0,0 0 0 0 2485.1127,661.9994 L2485.1127,631.3783 L2475.1127,621.3783 L2114.89,621.3783 A0,0 0 0 0 2114.89,621.3783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2475.1127,621.3783 L2475.1127,631.3783 L2485.1127,631.3783 L2475.1127,621.3783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.2227" x="2120.89" y="638.9466">material is also Product, but with canBePurchased=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.4917" x="2120.89" y="654.2572">and usually canBeSold=false.</text></g><g class="entity" data-qualified-name="GMN36" data-source-line="114" id="ent0037"><path d="M2065.69,932.9183 L2065.69,987.4583 L2030.59,991.4583 L2065.69,995.4583 L2065.69,1050.0921 A0,0 0 0 0 2065.69,1050.0921 L2654.3101,1050.0921 A0,0 0 0 0 2654.3101,1050.0921 L2654.3101,942.9183 L2644.3101,932.9183 L2065.69,932.9183 A0,0 0 0 0 2065.69,932.9183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2644.3101,932.9183 L2644.3101,942.9183 L2654.3101,942.9183 L2644.3101,932.9183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.0791" x="2071.69" y="950.4866">Planned material list for a specific ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.7017" x="2071.69" y="965.7972">Usually copied from ProductionRecipeItem at the moment production is created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2071.69" y="981.1077">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4028" x="2071.69" y="996.4183">This preserves the plan even if the recipe changes later.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.1733" x="2071.69" y="1011.7288">Actual consumption is recorded by InventoryDocumentLine(direction=out).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.6138" x="2071.69" y="1027.0394">Plan/fact comparison:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="567.6201" x="2071.69" y="1042.3499">ProductionOrderMaterial.plannedQuantity vs actual OUT InventoryDocumentLine quantity.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="124" id="ent0040"><path d="M663.21,560.1383 L663.21,637.4583 L628.97,641.4583 L663.21,645.4583 L663.21,723.2438 A0,0 0 0 0 663.21,723.2438 L1336.7808,723.2438 A0,0 0 0 0 1336.7808,723.2438 L1336.7808,570.1383 L1326.7808,560.1383 L663.21,560.1383 A0,0 0 0 0 663.21,560.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1326.7808,560.1383 L1326.7808,570.1383 L1336.7808,570.1383 L1326.7808,560.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.6392" x="669.21" y="577.7066">ProductionOrder plans manufacturing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="652.5708" x="669.21" y="593.0172">createdBy/updatedBy/startedBy/completedBy/canceledBy are audit fields for production accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="669.21" y="608.3277">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="535.8438" x="669.21" y="623.6383">recipe is optional, because production can be based on a recipe or created manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="669.21" y="638.9488">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="523.7769" x="669.21" y="654.2594">ProductionOrderMaterial stores the planned material snapshot for this exact order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.8232" x="669.21" y="669.5699">InventoryDocument(type=production) posts actual stock movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="669.21" y="684.8805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="562.6118" x="669.21" y="700.191">sourceOrderEntry links make-to-order production to the sales position that requested it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="488.3315" x="669.21" y="715.5016">Only one linked production order may be active for one order entry at a time.</text></g><!--link Store to ProductionRecipe--><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="81" id="lnk9"><path codeLine="81" d="M1054,120.1683 C1054,153.2483 1054,204.4583 1054,204.4583 C1054,204.4583 1172.25,204.4583 1278.03,204.4583" fill="none" id="Store-ProductionRecipe" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1050" x2="1058" y1="116.1683" y2="116.1683"/><line style="stroke:#181818;stroke-width:1;" x1="1050" x2="1058" y1="119.1683" y2="119.1683"/><line style="stroke:#181818;stroke-width:1;" x1="1054" x2="1054" y1="120.1683" y2="112.1683"/><line style="stroke:#181818;stroke-width:1;" x1="1288.03" x2="1296.03" y1="204.4583" y2="198.4583"/><line style="stroke:#181818;stroke-width:1;" x1="1288.03" x2="1296.03" y1="204.4583" y2="210.4583"/><line style="stroke:#181818;stroke-width:1;" x1="1288.03" x2="1296.03" y1="204.4583" y2="204.4583"/><ellipse cx="1282.03" cy="204.4583" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="1095.87" y="201.0266">owns</text></g><!--link Store to ProductionOrder--><g class="link" data-entity-1=
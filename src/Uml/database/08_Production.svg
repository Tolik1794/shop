2" y1="971.7766" y2="971.7766"/></g><g class="entity" data-qualified-name="GMN25" data-source-line="94" id="ent0026"><path d="M1341.83,240.3683 L1341.83,311.4883 L1121.37,315.4883 L1341.83,319.4883 L1341.83,326.921 A0,0 0 0 0 1341.83,326.921 L1968.3774,326.921 A0,0 0 0 0 1968.3774,326.921 L1968.3774,250.3683 L1958.3774,240.3683 L1341.83,240.3683 A0,0 0 0 0 1341.83,240.3683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1958.3774,240.3683 L1958.3774,250.3683 L1968.3774,250.3683 L1958.3774,240.3683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.2461" x="1347.83" y="257.9366">Recommended production flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.897" x="1347.83" y="273.2472">draft -&gt; planned -&gt; materials_reserved -&gt; in_progress -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1347.83" y="288.5577">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="569.9941" x="1347.83" y="303.8683">materials_reserved means required stock was reserved but production has not started yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.5474" x="1347.83" y="319.1788">Actual material consumption happens through InventoryDocument(type=production) OUT lines.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="102" id="ent0029"><path d="M491.51,270.9883 L491.51,279.4883 L457.13,283.4883 L491.51,287.4883 L491.51,296.2988 A0,0 0 0 0 491.51,296.2988 L854.6931,296.2988 A0,0 0 0 0 854.6931,296.2988 L854.6931,280.9883 L844.6931,270.9883 L491.51,270.9883 A0,0 0 0 0 491.51,270.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M844.6931,270.9883 L844.6931,280.9883 L854.6931,280.9883 L844.6931,270.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.1831" x="497.51" y="288.5566">Describes bill of materials for manufactured products.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="106" id="ent0032"><path d="M394.99,604.8983 L394.99,621.4883 L360.2,625.4883 L394.99,629.4883 L394.99,645.5194 A0,0 0 0 0 394.99,645.5194 L765.2127,645.5194 A0,0 0 0 0 765.2127,645.5194 L765.2127,614.8983 L755.2127,604.8983 L394.99,604.8983 A0,0 0 0 0 394.99,604.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M755.2127,604.8983 L755.2127,614.8983 L765.2127,614.8983 L755.2127,604.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.2227" x="400.99" y="622.4666">material is also Product, but with canBePurchased=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.4917" x="400.99" y="637.7772">and usually canBeSold=false.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="111" id="ent0035"><path d="M381.79,899.9483 L381.79,954.4883 L346.69,958.4883 L381.79,962.4883 L381.79,1017.1221 A0,0 0 0 0 381.79,1017.1221 L970.4101,1017.1221 A0,0 0 0 0 970.4101,1017.1221 L970.4101,909.9483 L960.4101,899.9483 L381.79,899.9483 A0,0 0 0 0 381.79,899.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M960.4101,899.9483 L960.4101,909.9483 L970.4101,909.9483 L960.4101,899.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.0791" x="387.79" y="917.5166">Planned material list for a specific ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.7017" x="387.79" y="932.8272">Usually copied from ProductionRecipeItem at the moment production is created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="387.79" y="948.1377">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4028" x="387.79" y="963.4483">This preserves the plan even if the recipe changes later.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.1733" x="387.79" y="978.7588">Actual consumption is recorded by InventoryDocumentLine(direction=out).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.6138" x="387.79" y="994.0694">Plan/fact comparison:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="567.6201" x="387.79" y="1009.3799">ProductionOrderMaterial.plannedQuantity vs actual OUT InventoryDocumentLine quantity.</text></g><g class="entity" data-qualified-name="GMN37" data-source-line="121" id="ent0038"><path d="M1215.32,566.6283 L1215.32,621.4883 L1181.07,625.4883 L1215.32,629.4883 L1215.32,683.8021 A0,0 0 0 0 1215.32,683.8021 L1888.8908,683.8021 A0,0 0 0 0 1888.8908,683.8021 L1888.8908,576.6283 L1878.8908,566.6283 L1215.32,566.6283 A0,0 0 0 0 1215.32,566.6283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1878.8908,566.6283 L1878.8908,576.6283 L1888.8908,576.6283 L1878.8908,566.6283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.6392" x="1221.32" y="584.1966">ProductionOrder plans manufacturing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="652.5708" x="1221.32" y="599.5072">createdBy/updatedBy/startedBy/completedBy/canceledBy are audit fields for production accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1221.32" y="614.8177">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="535.8438" x="1221.32" y="630.1283">recipe is optional, because production can be based on a recipe or created manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1221.32" y="645.4388">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="523.7769" x="1221.32" y="660.7494">ProductionOrderMaterial stores the planned material snapshot for this exact order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.8232" x="1221.32" y="676.0599">InventoryDocument(type=production) posts actual stock movements.</text></g><!--link Store to ProductionRecipe--><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="79" id="lnk9"><path codeLine="79" d="M392.28,119.8783 C392.28,140.4083 392.28,146.7983 392.28,177.9483" fill="none" id="Store-ProductionRecipe" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="388.28" x2="396.28" y1="115.8783" y2="115.8783"/><line style="stroke:#181818;stroke-width:1;" x1="388.28" x2="396.28" y1="118.8783" y2="118.8783"/><line style="stroke:#181818;stroke-width:1;" x1="392.28" x2="392.28" y1="119.8783" y2="111.8783"/><line style="stroke:#181818;stroke-width:1;" x1="392.28" x2="398.28" y1="187.9483" y2="195.9483"/><line style="stroke:#181818;stroke-width:1;" x1="392.28" x2="386.28" y1="187.9483" y2="195.9483"/><line style="stroke:#181818;stroke-width:1;" x1="392.28" x2="392.28" y1="187.9483" y2="195.9483"/><ellipse cx="392.28" cy="181.9483" fill="none" rx="4" ry="4" style="stroke:#181818
y="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0752" x="1008.56" y="972.3034">InventoryDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="1006.56" x2="1143.6352" y1="980.2566" y2="980.2566"/><line style="stroke:#181818;stroke-width:0.5;" x1="1006.56" x2="1143.6352" y1="988.2566" y2="988.2566"/></g><g class="entity" data-qualified-name="GMN25" data-source-line="95" id="ent0026"><path d="M1341.83,240.3583 L1341.83,311.9683 L1121.37,315.9683 L1341.83,319.9683 L1341.83,326.911 A0,0 0 0 0 1341.83,326.911 L1968.3774,326.911 A0,0 0 0 0 1968.3774,326.911 L1968.3774,250.3583 L1958.3774,240.3583 L1341.83,240.3583 A0,0 0 0 0 1341.83,240.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1958.3774,240.3583 L1958.3774,250.3583 L1968.3774,250.3583 L1958.3774,240.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.2461" x="1347.83" y="257.9266">Recommended production flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.897" x="1347.83" y="273.2372">draft -&gt; planned -&gt; materials_reserved -&gt; in_progress -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1347.83" y="288.5477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="569.9941" x="1347.83" y="303.8583">materials_reserved means required stock was reserved but production has not started yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.5474" x="1347.83" y="319.1688">Actual material consumption happens through InventoryDocument(type=production) OUT lines.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="103" id="ent0029"><path d="M491.51,270.9783 L491.51,279.9683 L457.13,283.9683 L491.51,287.9683 L491.51,296.2888 A0,0 0 0 0 491.51,296.2888 L854.6931,296.2888 A0,0 0 0 0 854.6931,296.2888 L854.6931,280.9783 L844.6931,270.9783 L491.51,270.9783 A0,0 0 0 0 491.51,270.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M844.6931,270.9783 L844.6931,280.9783 L854.6931,280.9783 L844.6931,270.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.1831" x="497.51" y="288.5466">Describes bill of materials for manufactured products.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="107" id="ent0032"><path d="M394.99,613.1383 L394.99,628.9683 L360.2,632.9683 L394.99,636.9683 L394.99,653.7594 A0,0 0 0 0 394.99,653.7594 L765.2127,653.7594 A0,0 0 0 0 765.2127,653.7594 L765.2127,623.1383 L755.2127,613.1383 L394.99,613.1383 A0,0 0 0 0 394.99,613.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M755.2127,613.1383 L755.2127,623.1383 L765.2127,623.1383 L755.2127,613.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.2227" x="400.99" y="630.7066">material is also Product, but with canBePurchased=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.4917" x="400.99" y="646.0172">and usually canBeSold=false.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="112" id="ent0035"><path d="M381.79,916.4283 L381.79,970.9683 L346.69,974.9683 L381.79,978.9683 L381.79,1033.6021 A0,0 0 0 0 381.79,1033.6021 L970.4101,1033.6021 A0,0 0 0 0 970.4101,1033.6021 L970.4101,926.4283 L960.4101,916.4283 L381.79,916.4283 A0,0 0 0 0 381.79,916.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M960.4101,916.4283 L960.4101,926.4283 L970.4101,926.4283 L960.4101,916.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.0791" x="387.79" y="933.9966">Planned material list for a specific ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.7017" x="387.79" y="949.3072">Usually copied from ProductionRecipeItem at the moment production is created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="387.79" y="964.6177">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4028" x="387.79" y="979.9283">This preserves the plan even if the recipe changes later.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="473.1733" x="387.79" y="995.2388">Actual consumption is recorded by InventoryDocumentLine(direction=out).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.6138" x="387.79" y="1010.5494">Plan/fact comparison:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="567.6201" x="387.79" y="1025.8599">ProductionOrderMaterial.plannedQuantity vs actual OUT InventoryDocumentLine quantity.</text></g><g class="entity" data-qualified-name="GMN37" data-source-line="122" id="ent0038"><path d="M1215.32,574.8583 L1215.32,628.9683 L1181.07,632.9683 L1215.32,636.9683 L1215.32,692.0321 A0,0 0 0 0 1215.32,692.0321 L1888.8908,692.0321 A0,0 0 0 0 1888.8908,692.0321 L1888.8908,584.8583 L1878.8908,574.8583 L1215.32,574.8583 A0,0 0 0 0 1215.32,574.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1878.8908,574.8583 L1878.8908,584.8583 L1888.8908,584.8583 L1878.8908,574.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.6392" x="1221.32" y="592.4266">ProductionOrder plans manufacturing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="652.5708" x="1221.32" y="607.7372">createdBy/updatedBy/startedBy/completedBy/canceledBy are audit fields for production accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1221.32" y="623.0477">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="535.8438" x="1221.32" y="638.3583">recipe is optional, because production can be based on a recipe or created manually.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1221.32" y="653.6688">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="523.7769" x="1221.32" y="668.9794">ProductionOrderMaterial stores the planned material snapshot for this exact order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.8232" x="1221.32" y="684.2899">InventoryDocument(type=production) posts actual stock movements.</text></g><!--link Store to ProductionRecipe--><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="80" id="lnk9"><path codeLine="80" d="M392.28,119.8683 C392.28,140.3983 392.28,146.7883 392.28,177.9383" fill="none" id="Store-ProductionRecipe" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="388.28" x2="396.28" y1="115.8683" y2="115.8683"/><line style="stroke:#181818;stroke-width:1;" x1="388.28" x2="396.28" y1="118.8683" y2="118.8683"/><line style="stroke:#181818;stroke-width:1;" x1="392.28" x2="392.28" y1="119.8683" y2="111.8683"/><line style="stroke:#181818;stroke-width:1;" x1="392.28" x2="398.28" y1="18
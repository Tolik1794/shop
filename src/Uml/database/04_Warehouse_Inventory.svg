d-name="Product" data-source-line="183" id="ent0020"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="57.9736" x="285.75" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.9736" x="288.75" y="396.3434">Product</text><line style="stroke:#181818;stroke-width:0.5;" x1="286.75" x2="342.7236" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="286.75" x2="342.7236" y1="412.2966" y2="412.2966"/></g><!--class PurchaseEntry--><g class="entity" data-qualified-name="PurchaseEntry" data-source-line="186" id="ent0024"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="101.2383" x="482.12" y="791.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.2383" x="485.12" y="810.0034">PurchaseEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="483.12" x2="582.3583" y1="817.9566" y2="817.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="483.12" x2="582.3583" y1="825.9566" y2="825.9566"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="188" id="ent0027"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="2453.27" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="2456.27" y="396.3434">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="2454.27" x2="2497.2143" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2454.27" x2="2497.2143" y1="412.2966" y2="412.2966"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="189" id="ent0029"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="2533.4" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="2536.4" y="396.3434">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="2534.4" x2="2599.0826" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2534.4" x2="2599.0826" y1="412.2966" y2="412.2966"/></g><!--class ProductionOrder--><g class="entity" data-qualified-name="ProductionOrder" data-source-line="190" id="ent0031"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="118.2529" x="2634.61" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2529" x="2637.61" y="396.3434">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="2635.61" x2="2751.8629" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2635.61" x2="2751.8629" y1="412.2966" y2="412.2966"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="192" id="ent0034"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="2788.34" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="2791.34" y="396.3434">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="2789.34" x2="2854.1457" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2789.34" x2="2854.1457" y1="412.2966" y2="412.2966"/></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="204" id="ent0047"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="2737.99" y="791.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="2740.99" y="810.0034">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="2738.99" x2="2816.49" y1="817.9566" y2="817.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="2738.99" x2="2816.49" y1="825.9566" y2="825.9566"/></g><g class="entity" data-qualified-name="GMN54" data-source-line="212" id="ent0055"><path d="M1323.35,378.7483 L1323.35,419.3694 L1446.1347,419.3694 L1446.1347,388.7483 L1436.1347,378.7483 L1323.35,378.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1436.1347,378.7483 L1436.1347,388.7483 L1446.1347,388.7483 L1436.1347,378.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1329.35" y="396.3166">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7847" x="1329.35" y="411.6272">(store_id, name)</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="217" id="ent0058"><path d="M690.17,761.7783 L690.17,844.9083 L447.07,848.9083 L690.17,852.9083 L690.17,863.6416 A0,0 0 0 0 690.17,863.6416 L1337.3092,863.6416 A0,0 0 0 0 1337.3092,863.6416 L1337.3092,771.7783 L1327.3092,761.7783 L690.17,761.7783 A0,0 0 0 0 690.17,761.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1327.3092,761.7783 L1327.3092,771.7783 L1337.3092,771.7783 L1327.3092,761.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="696.17" y="779.3466">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5679" x="696.17" y="794.6572">(product_id, warehouse_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="696.17" y="809.9677">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="626.1392" x="696.17" y="825.2783">quantityOnHand and averageCost should be updated only through posted StockMovement records.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="570.8511" x="696.17" y="840.5888">reservedQuantity can be stored for speed or calculated from active StockReservation rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.0601" x="696.17" y="855.8994">availableQuantity should be calculated as quantityOnHand - reservedQuantity.</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="226" id="ent0061"><path d="M606.48,1200.1683 L606.48,1246.9083 L501.02,1250.9083 L606.48,1254.9083 L606.48,1302.0316 A0,0 0 0 0 606.48,1302.0316 L1379.0044,1302.0316 A0,0 0 0 0 1379.0044,1302.0316 L1379.0044,1210.1683 L1369.0044,1200.1683 L606.48,1200.1683 A0,0 0 0 0 606.48,1200.1683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1369.0044,1200.1683 L1369.0044,1210.1683 L1379.0044,1210.1683 L1369.0044,1200.1683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="608.1182" x="612.48" y="1217.7366">Batch belongs to WarehouseStock, so product and warehouse are derived from WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="751.5244" x="612.48" y="1233.0472">purchaseEntry is optional because batches can be created by purchase, production, return, adjustment, or initial stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.8516" x="612.48" y="1248.3577">Prefer createdByMovement as the universal source of a created batch.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="648.3496" x="612.48" y="1263.6683">unitCost is stored in Store.baseCurrency. Original supplier currency is kept in Purchase/PurchaseEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.2715" x="612.48" y="1278.9788">salePrice is an optional Store.baseCurrency sale-price snapshot from purchase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="508.1616" x="612.48" y="1294.2894">Stock-backed orders can use salePrice as the actual OrderEntry.unitPrice source.</text></g><g class="entity" data-qualified-name="GMN63" data-source-line="235" id="ent0064"><path d="M665.24,355.7783 L665.24,394.9083 L630.55,398.9083 L665.24,402.9083 L665.24,442.331 A0,0 0 0 0 665.24,442.331 L1288.239,442.331 A0,0 0 0 0 1288.239,442.331 L1288.239,365.7783 L1278.239,355.7783 L665.24,355.7783 A0,0 0 0 0 665.24,355.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1278.239,355.7783 L1278.239,365.7783 L1288.239,365.7783 L1278.239,355.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.5239" x="671.24" y="373.3466">draft = editable document, no stock effect.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.2314" x="671.24" y="388.6572">posted = immutable document; stock movements were created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="601.999" x="671.24" y="403.9677">canceled = document was canceled through reversal logic or became inactive by business flow.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="671.24" y="419.2783">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.6509" x="671.24" y="434.5888">Avoid editing posted documents directly.</text></g><g class="entity" data-qualified-name="GMN66" data-source-line="243" id="ent0067"><path d="M1952.65,562.7383 L1952.65,940.9083 L1751.82,944.9083 L1952.65,948.9083 L1952.65,1062.6758 A0,0 0 0 0 1952.65,1062.6758 L2702.8307,1062.6758 A0,0 0 0 0 2702.8307,1062.6758 L2702.8307,572.7383 L2692.8307,562.7383 L1952.65,562.7383 A0,0 0 0 0 1952.65,562.7383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2692.8307,562.7383 L2692.8307,572.7383 L2702.8307,572.7383 L2692.8307,562.7383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.7778" x="1958.65" y="580.3066">createdBy/updatedBy/postedBy/canceledBy are audit fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="729.1807" x="1958.65" y="595.6172">postedBy should be filled when status becomes posted; canceledBy should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="610.9277">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1958.65" y="626.2383">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.1748" x="1958.65" y="641.5488">(store_id, number)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="656.8594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.1763" x="1958.65" y="672.1699">Check constraint:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.252" x="1958.65" y="687.4805">only one of order_id, purchase_id, production_order_id can be not null.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="702.791">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.562" x="1958.65" y="718.1016">currency/exchangeRateToBase are optional because purely technical documents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.2749" x="1958.65" y="733.4121">like stock_adjustment may not have external monetary currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="690.4409" x="1958.65" y="748.7227">If present, amount fields without Base suffix are in document currency; Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="764.0332">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="441.9683" x="1958.65" y="779.3438">reason is optional, but recommended for write_off, stock_adjustment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.9849" x="1958.65" y="794.6543">production_loss, return and inventory_count scenarios.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="809.9648">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5425" x="1958.65" y="825.2754">Inventory count MVP approach:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.9487" x="1958.65" y="840.5859">do not create separate StockCount/StockCountLine tables yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="597.854" x="1958.65" y="855.8965">Use InventoryDocument(type=stock_adjustment) with InventoryReason(type=inventory_count).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="560.6821" x="1958.65" y="871.207">InventoryDocumentLine.quantity stores the adjustment difference, not the counted total.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.6914" x="1958.65" y="886.5176">Example: system has 10, counted 8 =&gt; OUT line quantity 2.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.1626" x="1958.65" y="901.8281">Direct editing of WarehouseStock quantities should be avoided.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="917.1387">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.7744" x="1958.65" y="932.4492">This is the main inventory operation document.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.1548" x="1958.65" y="947.7598">It replaces polymorphic source_type/source_id for stock logic.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="963.0703">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7793" x="1958.65" y="978.3809">Posted documents should not be edited directly.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="623.1685" x="1958.65" y="993.6914">Cancellation should create reversal document/movements instead of deleting original movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1958.65" y="1009.002">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.8042" x="1958.65" y="1024.3125">Only reversal documents should have reversedDocument filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="533.4697" x="1958.65" y="1039.623">reversedDocument points to the original posted document being canceled/reversed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="663.6729" x="1958.65" y="1054.9336">Do not add separate reversalDocument column; reverse lookup can be done by query or ORM mappedBy.</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="278" id="ent0070"><path d="M1966.92,317.4983 L1966.92,480.6038 L2418.5577,480.6038 L2418.5577,327.4983 L2408.5577,317.4983 L1966.92,317.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2408.5577,317.4983 L2408.5577,327.4983 L2418.5577,327.4983 L2408.5577,317.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.3496" x="1972.92" y="335.0666">Dictionary of reasons for inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.793" x="1972.92" y="350.3772">Useful for analytics and consistent grouping of write-offs,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.6377" x="1972.92" y="365.6877">stock adjustments, production losses, returns and inventory counts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1972.92" y="380.9983">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.002" x="1972.92" y="396.3088">Unique suggestion:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0903" x="1972.92" y="411.6194">(store_id, type, name)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1972.92" y="426.9299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.2573" x="1972.92" y="442.2405">Examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.1333" x="1972.92" y="457.551">&#1041;&#1088;&#1072;&#1082;, &#1087;&#1086;&#1096;&#1082;&#1086;&#1076;&#1078;&#1077;&#1085;&#1085;&#1103;, &#1086;&#1073;&#1088;&#1110;&#1079;&#1082;&#1080;, &#1110;&#1085;&#1074;&#1077;&#1085;&#1090;&#1072;&#1088;&#1080;&#1079;&#1072;&#1094;&#1110;&#1103;, &#1087;&#1077;&#1088;&#1077;&#1089;&#1086;&#1088;&#1090;,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.5254" x="1972.92" y="472.8616">&#1089;&#1090;&#1072;&#1088;&#1090;&#1086;&#1074;&#1110; &#1079;&#1072;&#1083;&#1080;&#1096;&#1082;&#1080;, &#1087;&#1086;&#1074;&#1077;&#1088;&#1085;&#1077;&#1085;&#1085;&#1103; &#1082;&#1083;&#1110;&#1108;&#1085;&#1090;&#1072;.</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="291" id="ent0073"><path d="M1750.12,1123.6083 L1750.12,1246.9083 L1715.6,1250.9083 L1750.12,1254.9083 L1750.12,1378.577 A0,0 0 0 0 1750.12,1378.577 L2287.3622,1378.577 A0,0 0 0 0 2287.3622,1378.577 L2287.3622,1133.6083 L2277.3622,1123.6083 L1750.12,1123.6083 A0,0 0 0 0 1750.12,1123.6083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2277.3622,1123.6083 L2277.3622,1133.6083 L2287.3622,1133.6083 L2277.3622,1123.6083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.6572" x="1756.12" y="1141.1766">One posted line creates one or more StockMovement records.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.0098" x="1756.12" y="1156.4872">Monetary fields without Base suffix follow InventoryDocument.currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.2246" x="1756.12" y="1171.7977">Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1756.12" y="1187.1083">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="466.8574" x="1756.12" y="1202.4188">Partial operations are represented by multiple lines/documents over time:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="453.8828" x="1756.12" y="1217.7294">- one OrderEntry can have several sale_shipment/customer_return lines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.1646" x="1756.12" y="1233.0399">- one PurchaseEntry can have several purchase_receipt/supplier_return lines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="516.2422" x="1756.12" y="1248.3505">OrderEntry/PurchaseEntry progress fields are cache, not the main source of truth.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1756.12" y="1263.661">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.5645" x="1756.12" y="1278.9716">For production documents use:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.9829" x="1756.12" y="1294.2821">- OUT lines for consumed materials</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.6812" x="1756.12" y="1309.5927">- IN lines for produced goods</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1756.12" y="1324.9032">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.436" x="1756.12" y="1340.2138">For transfer documents use paired lines:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.1724" x="1756.12" y="1355.5243">- OUT from source warehouse</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.3384" x="1756.12" y="1370.8348">- IN into destination warehouse</text></g><g class="entity" data-qualified-name="GMN75" data-source-line="310" id="ent0076"><path d="M571.79,1445.1583 L571.79,1522.9083 L537.36,1526.9083 L571.79,1530.9083 L571.79,1608.2638 A0,0 0 0 0 571.79,1608.2638 L1279.6826,1608.2638 A0,0 0 0 0 1279.6826,1608.2638 L1279.6826,1455.1583 L1269.6826,1445.1583 L571.79,1445.1583 A0,0 0 0 0 571.79,1445.1583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1269.6826,1445.1583 L1269.6826,1455.1583 L1279.6826,1455.1583 L1269.6826,1445.1583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.1377" x="577.79" y="1462.7266">quantityChange is signed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.644" x="577.79" y="1478.0372">positive = stock increase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.2866" x="577.79" y="1493.3477">negative = stock decrease</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="577.79" y="1508.6583">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.2773" x="577.79" y="1523.9688">Use warehouseStockBatch for FIFO/batch-level costing when needed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.7861" x="577.79" y="1539.2794">StockMovement.unitCost is always stored in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="641.2529" x="577.79" y="1554.5899">For average_cost method, StockMovement.unitCost stores the cost snapshot used for this movement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="577.79" y="1569.9005">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="686.8926" x="577.79" y="1585.211">In average_cost mode, OUT movement unitCost usually equals WarehouseStock.averageCost at posting time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="666.1484" x="577.79" y="1600.5216">In fifo mode, one InventoryDocumentLine may create multiple StockMovement rows for different batches.</text></g><g class="entity" data-qualified-name="GMN78" data-source-line="323" id="ent0079"><path d="M2145.53,1491.0883 L2145.53,1522.9083 L2110.51,1526.9083 L2145.53,1530.9083 L2145.53,1562.3305 A0,0 0 0 0 2145.53,1562.3305 L2663.945,1562.3305 A0,0 0 0 0 2663.945,1562.3305 L2663.945,1501.0883 L2653.945,1491.0883 L2145.53,1491.0883 A0,0 0 0 0 2145.53,1491.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2653.945,1491.0883 L2653.945,1501.0883 L2663.945,1501.0883 L2653.945,1491.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.4331" x="2151.53" y="1508.6566">Used when an order reserves stock before shipment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="487.9443" x="2151.53" y="1523.9672">WarehouseStock.reservedQuantity can be calculated from active reservations.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="497.415" x="2151.53" y="1539.2777">warehouseStockBatch is optional; when filled, it reserves a concrete FIFO batch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.1714" x="2151.53" y="1554.5883">and must match the reservation WarehouseStock.</text></g><!--link Store to Warehouse--><g class="link" data-entity-1="ent0016" data-entity-2="ent0008" data-link-type="crowfoot" data-source-line="180" id="lnk17"><path codeLine="180" d="M389.92,169.4883 C389.92,218.8683 389.92,327.9083 389.92,327.9083 C389.92,327.9083 336.89,327.9083 268.92,327.9083" fill="none" id="Store-Warehouse" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="385.92" x2="393.92" y1="165.4883" y2="165.4883"/><line style="stroke:#181818;stroke-width:1;" x1="385.92" x2="393.92" y1="168.4883" y2="168.4883"/><line style="stroke:#181818;stroke-width:1;" x1="389.92" x2="389.92" y1="169.4883" y2="161.4883"/><line style="stroke:#181818;stroke-width:1;" x1="258.92" x2="250.92" y1="327.9083" y2="333.9083"/><line style="stroke:#181818;stroke-width:1;" x1="258.92" x2="250.92" y1="327.9083" y2="321.9083"/><line style="stroke:#181818;stroke-width:1;" x1="258.92" x2="250.92" y1="327.9083" y2="327.9083"/><ellipse cx="264.92" cy="327.9083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="356.92" y="310.7666">owns</text></g><!--link Store to InventoryDocument--><g class="link" data-entity-1="ent0016" data-entity-2="ent0011" data-link-type="crowfoot" data-source-line="181" id="lnk18"><path codeLine="181" d="M425.61,139.9083 C574.8,139.9083 1465.46,139.9083 1465.46,139.9083 C1465.46,139.9083 1465.46,371.7483 1465.46,566.9283" fill="none" id="Store-InventoryDocument" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="421.61" x2="421.61" y1="143.9083" y2="135.9083"/><line style="stroke:#181818;stroke-widt
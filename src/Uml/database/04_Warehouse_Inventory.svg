just="spacing" textLength="229.4277" x="3903.29" y="1306.6031">warehouseStock: WarehouseStock</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="3894.29" cy="1319.3004" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.583" x="3903.29" y="1323.0914">orderEntry: OrderEntry</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="176" id="ent0016"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="1253.55" y="118.6883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="1256.55" y="137.2234">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="1254.55" x2="1293.4543" y1="145.1766" y2="145.1766"/><line style="stroke:#181818;stroke-width:0.5;" x1="1254.55" x2="1293.4543" y1="153.1766" y2="153.1766"/></g><!--class Product--><g class="entity" data-qualified-name="Product" data-source-line="179" id="ent0020"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="57.9736" x="2471.01" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.9736" x="2474.01" y="396.3434">Product</text><line style="stroke:#181818;stroke-width:0.5;" x1="2472.01" x2="2527.9836" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2472.01" x2="2527.9836" y1="412.2966" y2="412.2966"/></g><!--class PurchaseEntry--><g class="entity" data-qualified-name="PurchaseEntry" data-source-line="182" id="ent0024"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="101.2383" x="2332.38" y="791.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.2383" x="2335.38" y="810.0034">PurchaseEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="2333.38" x2="2432.6183" y1="817.9566" y2="817.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="2333.38" x2="2432.6183" y1="825.9566" y2="825.9566"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="184" id="ent0027"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="118.53" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="121.53" y="396.3434">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="119.53" x2="162.4743" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="119.53" x2="162.4743" y1="412.2966" y2="412.2966"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="185" id="ent0029"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="198.66" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="201.66" y="396.3434">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="199.66" x2="264.3426" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="199.66" x2="264.3426" y1="412.2966" y2="412.2966"/></g><!--class ProductionOrder--><g class="entity" data-qualified-name="ProductionOrder" data-source-line="186" id="ent0031"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="118.2529" x="299.87" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2529" x="302.87" y="396.3434">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="300.87" x2="417.1229" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="300.87" x2="417.1229" y1="412.2966" y2="412.2966"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="188" id="ent0034"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="453.6" y="377.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="456.6" y="396.3434">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="454.6" x2="519.4057" y1="404.2966" y2="404.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="454.6" x2="519.4057" y1="412.2966" y2="412.2966"/></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="200" id="ent0047"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="3688.25" y="791.4683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="3691.25" y="810.0034">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="3689.25" x2="3766.75" y1="817.9566" y2="817.9566"/><line style="stroke:#181818;stroke-width:0.5;" x1="3689.25" x2="3766.75" y1="825.9566" y2="825.9566"/></g><g class="entity" data-qualified-name="GMN53" data-source-line="207" id="ent0054"><path d="M2842.61,378.7483 L2842.61,394.9083 L2808.06,398.9083 L2842.61,402.9083 L2842.61,419.3694 A0,0 0 0 0 2842.61,419.3694 L2965.3947,419.3694 A0,0 0 0 0 2965.3947,419.3694 L2965.3947,388.7483 L2955.3947,378.7483 L2842.61,378.7483 A0,0 0 0 0 2842.61,378.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2955.3947,378.7483 L2955.3947,388.7483 L2965.3947,388.7483 L2955.3947,378.7483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2848.61" y="396.3166">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7847" x="2848.61" y="411.6272">(store_id, name)</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="212" id="ent0057"><path d="M2752.43,761.7783 L2752.43,808.9083 L2717.38,812.9083 L2752.43,816.9083 L2752.43,863.6416 A0,0 0 0 0 2752.43,863.6416 L3399.5692,863.6416 A0,0 0 0 0 3399.5692,863.6416 L3399.5692,771.7783 L3389.5692,761.7783 L2752.43,761.7783 A0,0 0 0 0 2752.43,761.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3389.5692,761.7783 L3389.5692,771.7783 L3399.5692,771.7783 L3389.5692,761.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2758.43" y="779.3466">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5679" x="2758.43" y="794.6572">(product_id, warehouse_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2758.43" y="809.9677">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="626.1392" x="2758.43" y="825.2783">quantityOnHand and averageCost should be updated only through posted StockMovement records.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="570.8511" x="2758.43" y="840.5888">reservedQuantity can be stored for speed or calculated from active StockReservation rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.0601" x="2758.43" y="855.8994">availableQuantity should be calculated as quantityOnHand - reservedQuantity.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="221" id="ent0060"><path d="M3075.74,1215.4783 L3075.74,1286.7205 L3848.2644,1286.7205 L3848.2644,1225.4783 L3838.2644,1215.4783 L3075.74,1215.4783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3838.2644,1215.4783 L3838.2644,1225.4783 L3848.2644,1225.4783 L3838.2644,1215.4783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="608.1182" x="3081.74" y="1233.0466">Batch belongs to WarehouseStock, so product and warehouse are derived from WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="751.5244" x="3081.74" y="1248.3572">purchaseEntry is optional because batches can be created by purchase, production, return, adjustment, or initial stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.8516" x="3081.74" y="1263.6677">Prefer createdByMovement as the universal source of a created batch.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="648.3496" x="3081.74" y="1278.9783">unitCost is stored in Store.baseCurrency. Original supplier currency is kept in Purchase/PurchaseEntry.</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="228" id="ent0063"><path d="M1813.5,355.7783 L1813.5,442.331 L2436.499,442.331 L2436.499,365.7783 L2426.499,355.7783 L1813.5,355.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2426.499,355.7783 L2426.499,365.7783 L2436.499,365.7783 L2426.499,355.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.5239" x="1819.5" y="373.3466">draft = editable document, no stock effect.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.2314" x="1819.5" y="388.6572">posted = immutable document; stock movements were created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="601.999" x="1819.5" y="403.9677">canceled = document was canceled through reversal logic or became inactive by business flow.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1819.5" y="419.2783">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.6509" x="1819.5" y="434.5888">Avoid editing posted documents directly.</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="236" id="ent0066"><path d="M1546.91,562.7383 L1546.91,710.9083 L952.18,714.9083 L1546.91,718.9083 L1546.91,1062.6758 A0,0 0 0 0 1546.91,1062.6758 L2297.0907,1062.6758 A0,0 0 0 0 2297.0907,1062.6758 L2297.0907,572.7383 L2287.0907,562.7383 L1546.91,562.7383 A0,0 0 0 0 1546.91,562.7383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2287.0907,562.7383 L2287.0907,572.7383 L2297.0907,572.7383 L2287.0907,562.7383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.7778" x="1552.91" y="580.3066">createdBy/updatedBy/postedBy/canceledBy are audit fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="729.1807" x="1552.91" y="595.6172">postedBy should be filled when status becomes posted; canceledBy should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="610.9277">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1552.91" y="626.2383">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.1748" x="1552.91" y="641.5488">(store_id, number)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="656.8594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.1763" x="1552.91" y="672.1699">Check constraint:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="450.252" x="1552.91" y="687.4805">only one of order_id, purchase_id, production_order_id can be not null.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="702.791">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="506.562" x="1552.91" y="718.1016">currency/exchangeRateToBase are optional because purely technical documents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.2749" x="1552.91" y="733.4121">like stock_adjustment may not have external monetary currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="690.4409" x="1552.91" y="748.7227">If present, amount fields without Base suffix are in document currency; Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="764.0332">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="441.9683" x="1552.91" y="779.3438">reason is optional, but recommended for write_off, stock_adjustment,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.9849" x="1552.91" y="794.6543">production_loss, return and inventory_count scenarios.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="809.9648">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5425" x="1552.91" y="825.2754">Inventory count MVP approach:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.9487" x="1552.91" y="840.5859">do not create separate StockCount/StockCountLine tables yet.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="597.854" x="1552.91" y="855.8965">Use InventoryDocument(type=stock_adjustment) with InventoryReason(type=inventory_count).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="560.6821" x="1552.91" y="871.207">InventoryDocumentLine.quantity stores the adjustment difference, not the counted total.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.6914" x="1552.91" y="886.5176">Example: system has 10, counted 8 =&gt; OUT line quantity 2.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.1626" x="1552.91" y="901.8281">Direct editing of WarehouseStock quantities should be avoided.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="917.1387">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.7744" x="1552.91" y="932.4492">This is the main inventory operation document.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.1548" x="1552.91" y="947.7598">It replaces polymorphic source_type/source_id for stock logic.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="963.0703">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7793" x="1552.91" y="978.3809">Posted documents should not be edited directly.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="623.1685" x="1552.91" y="993.6914">Cancellation should create reversal document/movements instead of deleting original movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1552.91" y="1009.002">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.8042" x="1552.91" y="1024.3125">Only reversal documents should have reversedDocument filled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="533.4697" x="1552.91" y="1039.623">reversedDocument points to the original posted document being canceled/reversed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="663.6729" x="1552.91" y="1054.9336">Do not add separate reversalDocument column; reverse lookup can be done by query or ORM mappedBy.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="271" id="ent0069"><path d="M1327.18,317.4983 L1327.18,480.6038 L1778.8177,480.6038 L1778.8177,327.4983 L1768.8177,317.4983 L1327.18,317.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1768.8177,317.4983 L1768.8177,327.4983 L1778.8177,327.4983 L1768.8177,317.4983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.3496" x="1333.18" y="335.0666">Dictionary of reasons for inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.793" x="1333.18" y="350.3772">Useful for analytics and consistent grouping of write-offs,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.6377" x="1333.18" y="365.6877">stock adjustments, production losses, returns and inventory counts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1333.18" y="380.9983">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.002" x="1333.18" y="396.3088">Unique suggestion:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0903" x="1333.18" y="411.6194">(store_id, type, name)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1333.18" y="426.9299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.2573" x="1333.18" y="442.2405">Examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.1333" x="1333.18" y="457.551">&#1041;&#1088;&#1072;&#1082;, &#1087;&#1086;&#1096;&#1082;&#1086;&#1076;&#1078;&#1077;&#1085;&#1085;&#1103;, &#1086;&#1073;&#1088;&#1110;&#1079;&#1082;&#1080;, &#1110;&#1085;&#1074;&#1077;&#1085;&#1090;&#1072;&#1088;&#1080;&#1079;&#1072;&#1094;&#1110;&#1103;, &#1087;&#1077;&#1088;&#1077;&#1089;&#1086;&#1088;&#1090;,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.5254" x="1333.18" y="472.8616">&#1089;&#1090;&#1072;&#1088;&#1090;&#1086;&#1074;&#1110; &#1079;&#1072;&#1083;&#1080;&#1096;&#1082;&#1080;, &#1087;&#1086;&#1074;&#1077;&#1088;&#1085;&#1077;&#1085;&#1085;&#1103; &#1082;&#1083;&#1110;&#1108;&#1085;&#1090;&#1072;.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="284" id="ent0072"><path d="M2503.38,1123.6083 L2503.38,1139.9083 L2077.58,1143.9083 L2503.38,1147.9083 L2503.38,1378.577 A0,0 0 0 0 2503.38,1378.577 L3040.6222,1378.577 A0,0 0 0 0 3040.6222,1378.577 L3040.6222,1133.6083 L3030.6222,1123.6083 L2503.38,1123.6083 A0,0 0 0 0 2503.38,1123.6083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3030.6222,1123.6083 L3030.6222,1133.6083 L3040.6222,1133.6083 L3030.6222,1123.6083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.6572" x="2509.38" y="1141.1766">One posted line creates one or more StockMovement records.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="454.0098" x="2509.38" y="1156.4872">Monetary fields without Base suffix follow InventoryDocument.currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.2246" x="2509.38" y="1171.7977">Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2509.38" y="1187.1083">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="466.8574" x="2509.38" y="1202.4188">Partial operations are represented by multiple lines/documents over time:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="453.8828" x="2509.38" y="1217.7294">- one OrderEntry can have several sale_shipment/customer_return lines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.1646" x="2509.38" y="1233.0399">- one PurchaseEntry can have several purchase_receipt/supplier_return lines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="516.2422" x="2509.38" y="1248.3505">OrderEntry/PurchaseEntry progress fields are cache, not the main source of truth.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2509.38" y="1263.661">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.5645" x="2509.38" y="1278.9716">For production documents use:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.9829" x="2509.38" y="1294.2821">- OUT lines for consumed materials</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.6812" x="2509.38" y="1309.5927">- IN lines for produced goods</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2509.38" y="1324.9032">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.436" x="2509.38" y="1340.2138">For transfer documents use paired lines:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.1724" x="2509.38" y="1355.5243">- OUT from source warehouse</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.3384" x="2509.38" y="1370.8348">- IN into destination warehouse</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="303" id="ent0075"><path d="M2468.05,1445.1583 L2468.05,1522.9083 L2433.62,1526.9083 L2468.05,1530.9083 L2468.05,1608.2638 A0,0 0 0 0 2468.05,1608.2638 L3175.9426,1608.2638 A0,0 0 0 0 3175.9426,1608.2638 L3175.9426,1455.1583 L3165.9426,1445.1583 L2468.05,1445.1583 A0,0 0 0 0 2468.05,1445.1583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3165.9426,1445.1583 L3165.9426,1455.1583 L3175.9426,1455.1583 L3165.9426,1445.1583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.1377" x="2474.05" y="1462.7266">quantityChange is signed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.644" x="2474.05" y="1478.0372">positive = stock increase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.2866" x="2474.05" y="1493.3477">negative = stock decrease</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2474.05" y="1508.6583">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.2773" x="2474.05" y="1523.9688">Use warehouseStockBatch for FIFO/batch-level costing when needed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.7861" x="2474.05" y="1539.2794">StockMovement.unitCost is always stored in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="641.2529" x="2474.05" y="1554.5899">For average_cost method, StockMovement.unitCost stores the cost snapshot used for this movement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2474.05" y="1569.9005">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="686.8926" x="2474.05" y="1585.211">In average_cost mode, OUT movement unitCost usually equals WarehouseStock.averageCost at posting time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="666.1484" x="2474.05" y="1600.5216">In fifo mode, one InventoryDocumentLine may create multiple StockMovement rows for different batches.</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="316" id="ent0078"><path d="M4173.53,1230.7883 L4173.53,1246.9083 L4138.95,1250.9083 L4173.53,1254.9083 L4173.53,1271.4094 A0,0 0 0 0 4173.53,1271.4094 L4682.4743,1271.4094 A0,0 0 0 0 4682.4743,1271.4094 L4682.4743,1240.7883 L4672.4743,1230.7883 L4173.53,1230.7883 A0,0 0 0 0 4173.53,1230.7883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M4672.4743,1230.7883 L4672.4743,1240.7883 L4682.4743,1240.7883 L4672.4743,1230.7883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.4331" x="4179.53" y="1248.3566">Used when an order reserves stock before shipment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="487.9443" x="4179.53" y="1263.6672">WarehouseStock.reservedQuantity can be calculated from active reservations.</text></g><!--link Store to Warehouse--><g class="link" data-entity-1="ent0016" data-entity-2="ent0008" data-link-type="crowfoot" data-source-line="176" id="lnk17"><path codeLine="176" d="M1284.23,169.5783 C1284.23,215.5883 1284.23,310.9083 1284.23,310.9083 C1284.23,310.9083 2205.01,310.9083 2546.05,310.9083" fill="none" id="Store-Warehouse" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1280.23" x2="1288.23" y1="165.5783" y2="165.5783"/><line style="stroke:#181818;stroke-width:1;" x1="1280.23" x2="1288.23" y1="168.5783" y2="168.5783"/><line style="stroke:#181818;stroke-width:1;" x1="1284.23" x2="1284.23" y1="169.5783" y2="161.5783"/><line style="stroke:#181818;stroke-width:1;" x1="2556.05" x2="2564.05" y1="310.9083" y2="304.9083"/><line style="stroke:#181818;stroke-width:1;" x1="2556.05" x2="2564.05" y1="310.9083" y2="316.9083"/><line style="stroke:#181818;stroke-width:1;" x1="2556.05" x2="2564.05" y1="310.9083" y2="310.9083"/><ellipse cx="2550.05" cy="310.9083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="1816.48" y="307.4766">owns</text></g><!--link Store to InventoryDocument--><g class="link" data-entity-1="ent0016" data-entity-2="ent0011" data-link-type="crowfoot" data-source-line="177" id="lnk18"><path codeLine="177" d="M1274,169.3583 C1274,266.6383 1274,653.9083 1274,653.9083 C1274,653.9083 1108.68,653.9083 970.29,653.9083" fill="none" id="Store-InventoryDocument" style="stroke:#181818;stroke-width:1;"/><lin
eStockBatch</text><line style="stroke:#181818;stroke-width:0.5;" x1="2736.04" x2="2887.7988" y1="560.9366" y2="560.9366"/><line style="stroke:#181818;stroke-width:0.5;" x1="2736.04" x2="2887.7988" y1="568.9366" y2="568.9366"/></g><!--class PaymentHistory--><g class="entity" data-qualified-name="PaymentHistory" data-source-line="128" id="ent0030"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.9297" x="1550.95" y="999.6783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9297" x="1553.95" y="1018.2134">PaymentHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="1551.95" x2="1661.8797" y1="1026.1666" y2="1026.1666"/><line style="stroke:#181818;stroke-width:0.5;" x1="1551.95" x2="1661.8797" y1="1034.1666" y2="1034.1666"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="129" id="ent0032"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="566.74" y="534.4483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="569.74" y="552.9834">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="567.74" x2="602.1052" y1="560.9366" y2="560.9366"/><line style="stroke:#181818;stroke-width:0.5;" x1="567.74" x2="602.1052" y1="568.9366" y2="568.9366"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="132" id="ent0036"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="2486.38" y="1258.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="2489.38" y="1277.3434">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="2487.38" x2="2652.4552" y1="1285.2966" y2="1285.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2487.38" x2="2652.4552" y1="1293.2966" y2="1293.2966"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="133" id="ent0038"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="121.5957" x="2688.12" y="1258.8083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5957" x="2691.12" y="1277.3434">StockReservation</text><line style="stroke:#181818;stroke-width:0.5;" x1="2689.12" x2="2808.7157" y1="1285.2966" y2="1285.2966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2689.12" x2="2808.7157" y1="1293.2966" y2="1293.2966"/></g><g class="entity" data-qualified-name="GMN40" data-source-line="136" id="ent0041"><path d="M1786.7,466.4883 L1786.7,551.2983 L1751.76,555.2983 L1786.7,559.2983 L1786.7,644.9043 A0,0 0 0 0 1786.7,644.9043 L2489.1399,644.9043 A0,0 0 0 0 2489.1399,644.9043 L2489.1399,476.4883 L2479.1399,466.4883 L1786.7,466.4883 A0,0 0 0 0 1786.7,466.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2479.1399,466.4883 L2479.1399,476.4883 L2489.1399,476.4883 L2479.1399,466.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6069" x="1792.7" y="484.0566">Customer is optional to allow quick one-time orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="1792.7" y="499.3672">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1792.7" y="514.6777">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.4399" x="1792.7" y="529.9883">customerNameSnapshot/customerPhoneSnapshot/customerEmailSnapshot store contact data at order time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.3242" x="1792.7" y="545.2988">Free-form communication is stored in OrderComment rows, not on Order itself.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.8506" x="1792.7" y="560.6094">Operational order timeline is stored in OrderHistory rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.3037" x="1792.7" y="575.9199">The visible admin history also merges linked PaymentHistory events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1792.7" y="591.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5068" x="1792.7" y="606.541">currency stores the original sale currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.2676" x="1792.7" y="621.8516">exchangeRateToBase is a snapshot: 1 order currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.8281" x="1792.7" y="637.1621">totalAmount is in original currency; totalAmountBase is in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN43" data-source-line="150" id="ent0044"><path d="M1072.08,947.0283 L1072.08,1017.2983 L1037.94,1021.2983 L1072.08,1025.2983 L1072.08,1094.8232 A0,0 0 0 0 1072.08,1094.8232 L1515.7514,1094.8232 A0,0 0 0 0 1515.7514,1094.8232 L1515.7514,957.0283 L1505.7514,947.0283 L1072.08,947.0283 A0,0 0 0 0 1072.08,947.0283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1505.7514,947.0283 L1505.7514,957.0283 L1515.7514,957.0283 L1505.7514,947.0283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.4209" x="1078.08" y="964.5966">Human discussion attached to an order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.8345" x="1078.08" y="979.9072">One order can have many comments from different users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="995.2177">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4604" x="1078.08" y="1010.5283">Comments are separate from operational history:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9297" x="1078.08" y="1025.8388">- OrderComment stores the message body.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.6714" x="1078.08" y="1041.1494">- OrderHistory records that a comment was added/edited/deleted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="1056.4599">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.7007" x="1078.08" y="1071.7705">deletedAt is optional soft delete so the UI can hide a comment</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2275" x="1078.08" y="1087.081">without destroying the audit trail.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="162" id="ent0047"><path d="M294.31,862.8183 L294.31,1017.2983 L259.33,1021.2983 L294.31,1025.2983 L294.31,1179.0292 A0,0 0 0 0 294.31,1179.0292 L753.5331,1179.0292 A0,0 0 0 0 753.5331,1179.0292 L753.5331,872.8183 L743.5331,862.8183 L294.31,862.8183 A0,0 0 0 0 294.31,862.8183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M743.5331,862.8183 L743.5331,872.8183 L753.5331,872.8183 L743.5331,862.8183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8452" x="300.31" y="880.3866">Dedicated append-only timeline for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.063" x="300.31" y="895.6972">This is richer than StatusHistory and is the source of truth</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="300.31" y="911.0077">for the future human-readable order activity feed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="926.3183">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.6421" x="300.31" y="941.6288">eventKey is a stable machine key, for example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.5283" x="300.31" y="956.9394">order.created, order.status_changed, order.comment_added,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068" x="300.31" y="972.2499">order.entry_updated, order.delivery_declaration_generated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="987.5605">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.3535" x="300.31" y="1002.871">source separates manual, system and integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.2231" x="300.31" y="1018.1816">actor can be null for automatic events; actorNameSnapshot preserves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.5581" x="300.31" y="1033.4921">the display name that should be shown later in the timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1048.8027">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.1836" x="300.31" y="1064.1132">title/description store ready-to-display human-readable snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.2202" x="300.31" y="1079.4238">changes stores structured before/after values for changed fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.7612" x="300.31" y="1094.7343">payload stores extra structured data for future features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1787" x="300.31" y="1110.0448">delivery service, declaration number, shipping payer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.7183" x="300.31" y="1125.3554">integration response, automation context and similar details.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1140.6659">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.2388" x="300.31" y="1155.9765">relatedEntityType/relatedEntityId can link future order-side records</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2197" x="300.31" y="1171.287">without changing the base timeline model each time.</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="185" id="ent0050"><path d="M1970.7,992.9583 L1970.7,1048.8899 L2457.1482,1048.8899 L2457.1482,1002.9583 L2447.1482,992.9583 L1970.7,992.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2447.1482,992.9583 L2447.1482,1002.9583 L2457.1482,1002.9583 L2447.1482,992.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.8096" x="1976.7" y="1010.5266">PaymentHistory rows are append-only financial timeline events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.4482" x="1976.7" y="1025.8372">They are displayed together with OrderHistory in the order admin history,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.04" x="1976.7" y="1041.1477">but Payment remains the financial source of truth.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="191" id="ent0053"><path d="M2026.83,105.4883 L2026.83,207.3516 L2791.0072,207.3516 L2791.0072,115.4883 L2781.0072,105.4883 L2026.83,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2781.0072,105.4883 L2781.0072,115.4883 L2791.0072,115.4883 L2781.0072,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2261" x="2032.83" y="123.0566">Recommended order flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="743.1772" x="2032.83" y="138.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship -&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2032.83" y="153.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.5801" x="2032.83" y="168.9883">canceled is for orders stopped before completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4312" x="2032.83" y="184.2988">partially_returned/returned are post-shipment states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="595.1309" x="2032.83" y="199.6094">Backorders usually use awaiting_stock until enough stock is produced, purchased or reserved.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="200" id="ent0056"><path d="M2862.36,893.4383 L2862.36,1017.2983 L2827.64,1021.2983 L2862.36,1025.2983 L2862.36,1148.407 A0,0 0 0 0 2862.36,1148.407 L3575.4767,1148.407 A0,0 0 0 0 3575.4767,1148.407 L3575.4767,903.4383 L3565.4767,893.4383 L2862.36,893.4383 A0,0 0 0 0 2862.36,893.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3565.4767,893.4383 L3565.4767,903.4383 L3575.4767,903.4383 L3565.4767,893.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.0229" x="2868.36" y="911.0066">Sales order line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="664.5171" x="2868.36" y="926.3172">Stores snapshot of product name, code, unit code/name, quantity and sale price at the moment of order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.3379" x="2868.36" y="941.6277">Monetary fields without Base suffix are in Order.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.7354" x="2868.36" y="956.9383">warehouseStockBatch is optional and identifies the FIFO batch used for stock-backed pricing/reservation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.2534" x="2868.36" y="972.2488">Search should expose different batches as separate stock options, ordered oldest first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.2773" x="2868.36" y="987.5594">Each stock-backed OrderEntry should keep one selected batch and one sale price snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1002.8699">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="615.564" x="2868.36" y="1018.1805">shippedQuantity, returnedQuantity and canceledQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="2868.36" y="1033.491">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="2868.36" y="1048.8016">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1064.1121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.1284" x="2868.36" y="1079.4227">Partial shipments are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.1353" x="2868.36" y="1094.7332">one OrderEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="692.1167" x="2868.36" y="1110.0437">Backordered quantity = quantity - shippedQuantity - canceledQuantity, with reservations handled separately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1125.3543">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.7251" x="2868.36" y="1140.6648">InventoryDocumentLine is created from this line when stock is shipped or returned.</text></g><!--link Store to Order--><g class="link" data-entity-1="ent0009" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="115" id="lnk10"><path codeLine="115" d="M1416.92,185.9283 C1416.92,248.7183 1416.92,419.2983 1416.92,419.2983 C1416.92,419.2983 1420.83,419.2983 1449.88,419.2983" fill="none" id="Store-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1412.92" x2="1420.92" y1="181.9283" y2="181.9283"/><line style="stroke:#181818;stroke-width:1;" x1="1412.92" x2="1420.92" y1="184.9283" y2="184.9283"/><line style="stroke:#181818;stroke-width:1;" x1="1416.92" x2="1416.92" y1="185.9283" y2="177.9283"/><line style="stroke:#181818;stroke-width:1;" x1="1459.88" x2="1467.88" y1="419.2983" y2="413.2983"/><line style="stroke:#181818;stroke-width:1;" x1="1459.88" x2="1467.88" y1="419.2983" y2="425.2983"/><line style="stroke:#181818;stroke-width:1;" x1="1459.88" x2="1467.88" y1="419.2983" y2="419.2983"/><ellipse cx="1453.88" cy="419.2983" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.8193" x="1365.92" y="320.6666">receives</text></g><!--link Currency to Order--><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="116" id="lnk12"><path codeLine="116" d="M1505.92,185.8883 C1505.92,216.0183 1505.92,248.1183 1505.92,309.8883" fill="none" id="Currency-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1501.92" x2="1509.92" y1="181.8883" y2="181.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1501.92" x2="1509.92" y1="184.8883
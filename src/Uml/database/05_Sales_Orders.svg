:#181818;stroke-width:0.5;" x1="8" x2="257.8389" y1="902.5066" y2="902.5066"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="916.2507" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="27" y="920.0417">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="257.8389" y1="926.9948" y2="926.9948"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="940.739" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.1133" x="27" y="944.53">eventKey: string(100)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="957.2273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.8057" x="27" y="961.0183">source: OrderHistorySource</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="973.7155" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.4551" x="27" y="977.5066">title: string(255)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.7012" x="27" y="993.9948">description: text?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.3945" x="27" y="1010.4831">changes: json?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="27" y="1026.9714">payload: json?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.0381" x="27" y="1043.4597">relatedEntityType: string(100)?</text><text fill="#000000" font-fam
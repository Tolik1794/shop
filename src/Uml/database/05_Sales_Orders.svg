y" data-source-line="127" id="ent0030"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.9297" x="1550.95" y="983.1883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9297" x="1553.95" y="1001.7234">PaymentHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="1551.95" x2="1661.8797" y1="1009.6766" y2="1009.6766"/><line style="stroke:#181818;stroke-width:0.5;" x1="1551.95" x2="1661.8797" y1="1017.6766" y2="1017.6766"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="128" id="ent0032"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="566.74" y="526.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="569.74" y="544.7434">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="567.74" x2="602.1052" y1="552.6966" y2="552.6966"/><line style="stroke:#181818;stroke-width:0.5;" x1="567.74" x2="602.1052" y1="560.6966" y2="560.6966"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="131" id="ent0036"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="2486.38" y="1242.3183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="2489.38" y="1260.8534">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="2487.38" x2="2652.4552" y1="1268.8066" y2="1268.8066"/><line style="stroke:#181818;stroke-width:0.5;" x1="2487.38" x2="2652.4552" y1="1276.8066" y2="1276.8066"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="132" id="ent0038"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="121.5957" x="2688.12" y="1242.3183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5957" x="2691.12" y="1260.8534">StockReservation</text><line style="stroke:#181818;stroke-width:0.5;" x1="2689.12" x2="2808.7157" y1="1268.8066" y2="1268.8066"/><line style="stroke:#181818;stroke-width:0.5;" x1="2689.12" x2="2808.7157" y1="1276.8066" y2="1276.8066"/></g><g class="entity" data-qualified-name="GMN40" data-source-line="135" id="ent0041"><path d="M1786.7,458.2383 L1786.7,543.8083 L1751.76,547.8083 L1786.7,551.8083 L1786.7,636.6543 A0,0 0 0 0 1786.7,636.6543 L2489.1399,636.6543 A0,0 0 0 0 2489.1399,636.6543 L2489.1399,468.2383 L2479.1399,458.2383 L1786.7,458.2383 A0,0 0 0 0 1786.7,458.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2479.1399,458.2383 L2479.1399,468.2383 L2489.1399,468.2383 L2479.1399,458.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6069" x="1792.7" y="475.8066">Customer is optional to allow quick one-time orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="1792.7" y="491.1172">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1792.7" y="506.4277">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.4399" x="1792.7" y="521.7383">customerNameSnapshot/customerPhoneSnapshot/customerEmailSnapshot store contact data at order time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.3242" x="1792.7" y="537.0488">Free-form communication is stored in OrderComment rows, not on Order itself.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.8506" x="1792.7" y="552.3594">Operational order timeline is stored in OrderHistory rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.3037" x="1792.7" y="567.6699">The visible admin history also merges linked PaymentHistory events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1792.7" y="582.9805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5068" x="1792.7" y="598.291">currency stores the original sale currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.2676" x="1792.7" y="613.6016">exchangeRateToBase is a snapshot: 1 order currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.8281" x="1792.7" y="628.9121">totalAmount is in original currency; totalAmountBase is in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN43" data-source-line="149" id="ent0044"><path d="M1072.08,930.5383 L1072.08,1000.8083 L1037.94,1004.8083 L1072.08,1008.8083 L1072.08,1078.3332 A0,0 0 0 0 1072.08,1078.3332 L1515.7514,1078.3332 A0,0 0 0 0 1515.7514,1078.3332 L1515.7514,940.5383 L1505.7514,930.5383 L1072.08,930.5383 A0,0 0 0 0 1072.08,930.5383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1505.7514,930.5383 L1505.7514,940.5383 L1515.7514,940.5383 L1505.7514,930.5383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.4209" x="1078.08" y="948.1066">Human discussion attached to an order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.8345" x="1078.08" y="963.4172">One order can have many comments from different users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="978.7277">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4604" x="1078.08" y="994.0383">Comments are separate from operational history:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9297" x="1078.08" y="1009.3488">- OrderComment stores the message body.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.6714" x="1078.08" y="1024.6594">- OrderHistory records that a comment was added/edited/deleted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="1039.9699">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.7007" x="1078.08" y="1055.2805">deletedAt is optional soft delete so the UI can hide a comment</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2275" x="1078.08" y="1070.591">without destroying the audit trail.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="161" id="ent0047"><path d="M294.31,846.3283 L294.31,1000.8083 L259.33,1004.8083 L294.31,1008.8083 L294.31,1162.5392 A0,0 0 0 0 294.31,1162.5392 L753.5331,1162.5392 A0,0 0 0 0 753.5331,1162.5392 L753.5331,856.3283 L743.5331,846.3283 L294.31,846.3283 A0,0 0 0 0 294.31,846.3283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M743.5331,846.3283 L743.5331,856.3283 L753.5331,856.3283 L743.5331,846.3283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8452" x="300.31" y="863.8966">Dedicated append-only timeline for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.063" x="300.31" y="879.2072">This is richer than StatusHistory and is the source of truth</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="300.31" y="894.5177">for the future human-readable order activity feed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="909.8283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.6421" x="300.31" y="925.1388">eventKey is a stable machine key, for example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.5283" x="300.31" y="940.4494">order.created, order.status_changed, order.comment_added,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068" x="300.31" y="955.7599">order.entry_updated, order.delivery_declaration_generated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="971.0705">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.3535" x="300.31" y="986.381">source separates manual, system and integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.2231" x="300.31" y="1001.6916">actor can be null for automatic events; actorNameSnapshot preserves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.5581" x="300.31" y="1017.0021">the display name that should be shown later in the timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1032.3127">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.1836" x="300.31" y="1047.6232">title/description store ready-to-display human-readable snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.2202" x="300.31" y="1062.9338">changes stores structured before/after values for changed fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.7612" x="300.31" y="1078.2443">payload stores extra structured data for future features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1787" x="300.31" y="1093.5548">delivery service, declaration number, shipping payer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.7183" x="300.31" y="1108.8654">integration response, automation context and similar details.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1124.1759">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.2388" x="300.31" y="1139.4865">relatedEntityType/relatedEntityId can link future order-side records</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2197" x="300.31" y="1154.797">without changing the base timeline model each time.</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="184" id="ent0050"><path d="M1970.7,976.4683 L1970.7,1032.3999 L2457.1482,1032.3999 L2457.1482,986.4683 L2447.1482,976.4683 L1970.7,976.4683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2447.1482,976.4683 L2447.1482,986.4683 L2457.1482,986.4683 L2447.1482,976.4683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.8096" x="1976.7" y="994.0366">PaymentHistory rows are append-only financial timeline events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.4482" x="1976.7" y="1009.3472">They are displayed together with OrderHistory in the order admin history,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.04" x="1976.7" y="1024.6577">but Payment remains the financial source of truth.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="190" id="ent0053"><path d="M2026.83,105.4883 L2026.83,207.3516 L2791.0072,207.3516 L2791.0072,115.4883 L2781.0072,105.4883 L2026.83,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2781.0072,105.4883 L2781.0072,115.4883 L2791.0072,115.4883 L2781.0072,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2261" x="2032.83" y="123.0566">Recommended order flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="743.1772" x="2032.83" y="138.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship -&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2032.83" y="153.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.5801" x="2032.83" y="168.9883">canceled is for orders stopped before completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4312" x="2032.83" y="184.2988">partially_returned/returned are post-shipment states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="595.1309" x="2032.83" y="199.6094">Backorders usually use awaiting_stock until enough stock is produced, purchased or reserved.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="199" id="ent0056"><path d="M2862.36,876.9483 L2862.36,1000.8083 L2827.64,1004.8083 L2862.36,1008.8083 L2862.36,1131.917 A0,0 0 0 0 2862.36,1131.917 L3575.4767,1131.917 A0,0 0 0 0 3575.4767,1131.917 L3575.4767,886.9483 L3565.4767,876.9483 L2862.36,876.9483 A0,0 0 0 0 2862.36,876.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3565.4767,876.9483 L3565.4767,886.9483 L3575.4767,886.9483 L3565.4767,876.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.0229" x="2868.36" y="894.5166">Sales order line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="664.5171" x="2868.36" y="909.8272">Stores snapshot of product name, code, unit code/name, quantity and sale price at the moment of order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.3379" x="2868.36" y="925.1377">Monetary fields without Base suffix are in Order.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.7354" x="2868.36" y="940.4483">warehouseStockBatch is optional and identifies the FIFO batch used for stock-backed pricing/reservation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.2534" x="2868.36" y="955.7588">Search should expose different batches as separate stock options, ordered oldest first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.2773" x="2868.36" y="971.0694">Each stock-backed OrderEntry should keep one selected batch and one sale price snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="986.3799">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="615.564" x="2868.36" y="1001.6905">shippedQuantity, returnedQuantity and canceledQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="2868.36" y="1017.001">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="2868.36" y="1032.3116">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1047.6221">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.1284" x="2868.36" y="1062.9327">Partial shipments are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.1353" x="2868.36" y="1078.2432">one OrderEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="692.1167" x="2868.36" y="1093.5538">Backordered quantity = quantity - shippedQuantity - canceledQuantity, with reservations handled separately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1108.8643">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.7251" x="2868.36" y="1124.1748">InventoryDocumentLine is created from this line when stock is shipped or returned.</text></g><!--link Store to Order--><g class="link" data-entity-1="ent0009" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="114" id="lnk10"><path codeLine="114" d="M1416.92,186.0083 C1416.92,248.1083 1416.92,414.8083 1416.92,414.8083 C1416.92,414.8083 1420.83,414.8083 1449.88,414.8083" fill="none" id="Store-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1412.92" x2="1420.92" y1="182.0083" y2="182.0083"/><line style="stroke:#181818;stroke-width:1;" x1="1412.92" x2="1420.92" y1="185.0083" y2="185.0083"/><line style="stroke:#181818;stroke-width:1;" x1="1416.92" x2="1416.92" y1="186.0083" y2="178.0083"/><line style="stroke:#181818;stroke-width:1;" x1="1459.88" x2="1467.88" y1="414.8083" y2="408.8083"/><line style="stroke:#181818;stroke-width:1;" x1="1459.88" x2="1467.88" y1="414.8083" y2="420.8083"/><line style="stroke:#181818;stroke-width:1;" x1="1459.88" x2="1467.88" y1="414.8083" y2="414.8083"/><ellipse cx="1453.88" cy="414.8083" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.8193" x="1365.92" y="318.4566">receives</text></g><!--link Currency to Order--><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="115" id="lnk12"><path codeLine="115" d="M1505.92,185.9983 C1505.92,216.2583 1505.92,248.5183 1505.92,309.9883" fill="none" id="Currency-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1501.92" x2="1509.92" y1="181.9983" y2="181.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1501.92" x2="1509.92" y1="184.9983" y2="184.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1505.92" x2="1505.92" y1="185.9983" y2="177.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1505.92" x2="1511.92" y1="319.9883" y2="327.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1505.92" x2="1499.92" y1="319.9883" y2="327.9883"/
3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="27" y="911.8017">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="257.8389" y1="918.7548" y2="918.7548"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="932.499" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.1133" x="27" y="936.29">eventKey: string(100)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="948.9873" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.8057" x="27" y="952.7783">source: OrderHistorySource</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="965.4755" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.4551" x="27" y="969.2666">title: string(255)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.7012" x="27" y="985.7548">description: text?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.3945" x="27" y="1002.2431">changes: json?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="27" y="1018.7314">payload: json?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.0381" x="27" y="1035.2197">relatedEntityType: string(100)?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.8467" x="27" y="1051.708">relatedEntityId: int?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1064.4052" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.9648" x="27" y="1068.1963">occurredAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.8389" x="27" y="1084.6845">actorNameSnapshot: string(255)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="1097.3818" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.4717" x="27" y="1101.1728">order: Order</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.5977" x="27" y="1117.6611">actor: User?</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="113" id="ent0009"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="993.47" y="135.1683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="996.47" y="153.7034">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="994.47" x2="1033.3743" y1="161.6566" y2="161.6566"/><line style="stroke:#181818;stroke-width:0.5;" x1="994.47" x2="1033.3743" y1="169.6566" y2="169.6566"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="114" id="ent0011"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="1069.52" y="135.1683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="1072.52" y="153.7034">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="1070.52" x2="1135.3257" y1="161.6566" y2="161.6566"/><line style="stroke:#181818;stroke-width:0.5;" x1="1070.52" x2="1135.3257" y1="169.6566" y2="169.6566"/></g><!--class Customer--><g class="entity" data-qualified-name="Customer" data-source-line="115" id="ent0013"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="71.9463" x="1170.95" y="135.1683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.9463" x="1173.95" y="153.7034">Customer</text><line style="stroke:#181818;stroke-width:0.5;" x1="1171.95" x2="1241.8963" y1="161.6566" y2="161.6566"/><line style="stroke:#181818;stroke-width:0.5;" x1="1171.95" x2="1241.8963" y1="169.6566" y2="169.6566"/></g><!--class Payment--><g class="entity" data-qualified-name="Payment" data-source-line="119" id="ent0018"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="63.5791" x="1551.13" y="974.9483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5791" x="1554.13" y="993.4834">Payment</text><line style="stroke:#181818;stroke-width:0.5;" x1="1552.13" x2="1613.7091" y1="1001.4366" y2="1001.4366"/><line style="stroke:#181818;stroke-width:0.5;" x1="1552.13" x2="1613.7091" y1="1009.4366" y2="1009.4366"/></g><!--class InventoryDocument--><g class="entity" data-qualified-name="InventoryDocument" data-source-line="120" id="ent0020"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="139.0752" x="1649.38" y="974.9483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0752" x="1652.38" y="993.4834">InventoryDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="1650.38" x2="1787.4552" y1="1001.4366" y2="1001.4366"/><line style="stroke:#181818;stroke-width:0.5;" x1="1650.38" x2="1787.4552" y1="1009.4366" y2="1009.4366"/></g><!--class Product--><g class="entity" data-qualified-name="Product" data-source-line="121" id="ent0022"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="57.9736" x="2120.93" y="526.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.9736" x="2123.93" y="544.7434">Product</text><line style="stroke:#181818;stroke-width:0.5;" x1="2121.93" x2="2177.9036" y1="552.6966" y2="552.6966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2121.93" x2="2177.9036" y1="560.6966" y2="560.6966"/></g><!--class Warehouse--><g class="entity" data-qualified-name="Warehouse" data-source-line="122" id="ent0024"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="80.1494" x="2213.84" y="526.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.1494" x="2216.84" y="544.7434">Warehouse</text><line style="stroke:#181818;stroke-width:0.5;" x1="2214.84" x2="2292.9894" y1="552.6966" y2="552.6966"/><line style="stroke:#181818;stroke-width:0.5;" x1="2214.84" x2="2292.9894" y1="560.6966" y2="560.6966"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="125" id="ent0028"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="708.74" y="526.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="711.74" y="544.7434">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="709.74" x2="744.1052" y1="552.6966" y2="552.6966"/><line style="stroke:#181818;stroke-width:0.5;" x1="709.74" x2="744.1052" y1="560.6966" y2="560.6966"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="128" id="ent0032"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="1976.38" y="1225.8283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="1979.38" y="1244.3634">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="1977.38" x2="2142.4552" y1="1252.3166" y2="1252.3166"/><line style="stroke:#181818;stroke-width:0.5;" x1="1977.38" x2="2142.4552" y1="1260.3166" y2="1260.3166"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="129" id="ent0034"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="121.5957" x="2178.12" y="1225.8283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5957" x="2181.12" y="1244.3634">StockReservation</text><line style="stroke:#181818;stroke-width:0.5;" x1="2179.12" x2="2298.7157" y1="1252.3166" y2="1252.3166"/><line style="stroke:#181818;stroke-width:0.5;" x1="2179.12" x2="2298.7157" y1="1260.3166" y2="1260.3166"/></g><g class="entity" data-qualified-name="GMN36" data-source-line="132" id="ent0037"><path d="M1383.7,465.8983 L1383.7,543.3183 L1348.76,547.3183 L1383.7,551.3183 L1383.7,629.0038 A0,0 0 0 0 1383.7,629.0038 L2086.1399,629.0038 A0,0 0 0 0 2086.1399,629.0038 L2086.1399,475.8983 L2076.1399,465.8983 L1383.7,465.8983 A0,0 0 0 0 1383.7,465.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2076.1399,465.8983 L2076.1399,475.8983 L2086.1399,475.8983 L2076.1399,465.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6069" x="1389.7" y="483.4666">Customer is optional to allow quick one-time orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="1389.7" y="498.7772">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1389.7" y="514.0877">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.4399" x="1389.7" y="529.3983">customerNameSnapshot/customerPhoneSnapshot/customerEmailSnapshot store contact data at order time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.3242" x="1389.7" y="544.7088">Free-form communication is stored in OrderComment rows, not on Order itself.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.771" x="1389.7" y="560.0194">Full order timeline is stored in OrderHistory rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1389.7" y="575.3299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5068" x="1389.7" y="590.6405">currency stores the original sale currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.2676" x="1389.7" y="605.951">exchangeRateToBase is a snapshot: 1 order currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.8281" x="1389.7" y="621.2616">totalAmount is in original currency; totalAmountBase is in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="145" id="ent0040"><path d="M1072.08,922.2983 L1072.08,992.3183 L1037.94,996.3183 L1072.08,1000.3183 L1072.08,1070.0932 A0,0 0 0 0 1072.08,1070.0932 L1515.7514,1070.0932 A0,0 0 0 0 1515.7514,1070.0932 L1515.7514,932.2983 L1505.7514,922.2983 L1072.08,922.2983 A0,0 0 0 0 1072.08,922.2983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1505.7514,922.2983 L1505.7514,932.2983 L1515.7514,932.2983 L1505.7514,922.2983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.4209" x="1078.08" y="939.8666">Human discussion attached to an order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.8345" x="1078.08" y="955.1772">One order can have many comments from different users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="970.4877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4604" x="1078.08" y="985.7983">Comments are separate from operational history:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9297" x="1078.08" y="1001.1088">- OrderComment stores the message body.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.6714" x="1078.08" y="1016.4194">- OrderHistory records that a comment was added/edited/deleted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="1031.7299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.7007" x="1078.08" y="1047.0405">deletedAt is optional soft delete so the UI can hide a comment</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2275" x="1078.08" y="1062.351">without destroying the audit trail.</text></g><g class="entity" data-qualified-name="GMN42" data-source-line="157" id="ent0043"><path d="M294.31,838.0883 L294.31,992.3183 L259.33,996.3183 L294.31,1000.3183 L294.31,1154.2992 A0,0 0 0 0 294.31,1154.2992 L753.5331,1154.2992 A0,0 0 0 0 753.5331,1154.2992 L753.5331,848.0883 L743.5331,838.0883 L294.31,838.0883 A0,0 0 0 0 294.31,838.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M743.5331,838.0883 L743.5331,848.0883 L753.5331,848.0883 L743.5331,838.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8452" x="300.31" y="855.6566">Dedicated append-only timeline for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.063" x="300.31" y="870.9672">This is richer than StatusHistory and is the source of truth</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="300.31" y="886.2777">for the future human-readable order activity feed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="901.5883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.6421" x="300.31" y="916.8988">eventKey is a stable machine key, for example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.5283" x="300.31" y="932.2094">order.created, order.status_changed, order.comment_added,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068" x="300.31" y="947.5199">order.entry_updated, order.delivery_declaration_generated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="962.8305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.3535" x="300.31" y="978.141">source separates manual, system and integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.2231" x="300.31" y="993.4516">actor can be null for automatic events; actorNameSnapshot preserves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.5581" x="300.31" y="1008.7621">the display name that should be shown later in the timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1024.0727">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.1836" x="300.31" y="1039.3832">title/description store ready-to-display human-readable snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.2202" x="300.31" y="1054.6938">changes stores structured before/after values for changed fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.7612" x="300.31" y="1070.0043">payload stores extra structured data for future features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1787" x="300.31" y="1085.3148">delivery service, declaration number, shipping payer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.7183" x="300.31" y="1100.6254">integration response, automation context and similar details.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1115.9359">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.2388" x="300.31" y="1131.2465">relatedEntityType/relatedEntityId can link future order-side records</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2197" x="300.31" y="1146.557">without changing the base timeline model each time.</text></g><g class="entity" data-qualified-name="GMN45" data-source-line="180" id="ent0046"><path d="M1623.83,105.4883 L1623.83,207.3516 L2388.0072,207.3516 L2388.0072,115.4883 L2378.0072,105.4883 L1623.83,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2378.0072,105.4883 L2378.0072,115.4883 L2388.0072,115.4883 L2378.0072,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2261" x="1629.83" y="123.0566">Recommended order flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="743.1772" x="1629.83" y="138.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship -&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1629.83" y="153.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.5801" x="1629.83" y="168.9883">canceled is for orders stopped before completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4312" x="1629.83" y="184.2988">partially_returned/returned are post-shipment states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="595.1309" x="1629.83" y="199.6094">Backorders usually use awaiting_stock until enough stock is produced, purchased or reserved.</text></g><g class="entity" data-qualified-name="GMN48" data-source-line="189" id="ent0049"><path d="M2325.36,891.6683 L2325.36,992.3183 L2290.74,996.3183 L2325.36,1000.3183 L2325.36,1100.7054 A0,0 0 0 0 2325.36,1100.7054 L3038.4767,1100.7054 A0,0 0 0 0 3038.4767,1100.7054 L3038.4767,901.6683 L3028.4767,891.6683 L2325.36,891.6683 A0,0 0 0 0 2325.36,891.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3028.4767,891.6683 L3028.4767,901.6683 L3038.4767,901.6683 L3028.4767,891.6683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.0229" x="2331.36" y="909.2366">Sales order line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="664.5171" x="2331.36" y="924.5472">Stores snapshot of product name, code, unit code/name, quantity and sale price at the moment of order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.3379" x="2331.36" y="939.8577">Monetary fields without Base suffix are in Order.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2331.36" y="955.1683">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="615.564" x="2331.36" y="970.4788">shippedQuantity, returnedQuantity and canceledQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="2331.36" y="985.7894">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="2331.36" y="1001.0999">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2331.36" y="1016.4105">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.1284" x="2331.36" y="1031.721">Partial shipments are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.1353" x="2331.36" y="1047.0316">one OrderEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="692.1167" x="2331.36" y="1062.3421">Backordered quantity = quantity - shippedQuantity - canceledQuantity, with reservations handled separately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2331.36" y="1077.6527">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.7251" x="2331.36" y="1092.9632">InventoryDocumentLine is created from this line when stock is shipped or returned.</text></g><!--link Store to Order--><g class="link" data-entity-1="ent0009" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="113" id="lnk10"><path codeLine="113" d="M1020.74,186.0483 C1020.74,248.2683 1020.74,415.3183 1020.74,415.3183 C1020.74,415.3183 1021.38,415.3183 1046.86,415.3183" fill="none" id="Store-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1016.74" x2="1024.74" y1="182.0483" y2="182.0483"/><line style="stroke:#181818;stroke-width:1;" x1="1016.74" x2="1024.74" y1="185.0483" y2="185.0483"/><line style="stroke:#181818;stroke-width:1;" x1="1020.74" x2="1020.74" y1="186.0483" y2="178.0483"/><line style="stroke:#181818;stroke-width:1;" x1="1056.86" x2="1064.86" y1="415.3183" y2="409.3183"/><line style="stroke:#181818;stroke-width:1;" x1="1056.86" x2="1064.86" y1="415.3183" y2="421.3183"/><line style="stroke:#181818;stroke-width:1;" x1="1056.86" x2="1064.86" y1="415.3183" y2="415.3183"/><ellipse cx="1050.86" cy="415.3183" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.8193" x="969.74" y="315.3066">receives</text></g><!--link Currency to Order--><g class="link" data-entity-1="ent0011" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="114" id="lnk12"><path codeLine="114" d="M1102.92,185.9983 C1102.92,216.2583 1102.92,248.5183 1102.92,309.9883" fill="none" id="Currency-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1098.92" x2="1106.92" y1="181.9983" y2="181.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1098.92" x2="1106.92" y1="184.9983" y2="184.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1102.92" x2="1102.92" y1="185.9983" y2="177.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1102.92" x2="1108.92" y1="319.9883" y2="327.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1102.92" x2="1096.92" y1="319.9883" y2="327.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1102.92" x2="1102.92" y1="319.9883" y2="327.9883"/><ellipse cx="1102.92" cy="313.9883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.2886" x="1009.92" y="249.5566">order currency</text></g><!--link Customer to Order--><g class="link" data-entity-1="ent0013" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="115" id="lnk14"><path codeLine="115" d="M1206.92,192.9983 C1206.92,223.2583 1206.92,248.5183 1206.92,309.9883" fill="none" id="Customer-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1206.92" x2="1206.92" y1="188.9983" y2="177.9983"/><ellipse cx="1206.92" cy="188.9983" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1202.92" x2="1210.92" y1="181.9983" y2="181.9983"/><line style="stroke:#181818;stroke-width:1;" x1="1206.92" x2="1212.92" y1="319.9883" y2="327.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1206.92" x2="1200.92" y1="319.9883" y2="327.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1206.92" x2="1206.92" y1="319.9883" y2="327.9883"/><ellipse cx="1206.92" cy="313.9883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.6475" x="1166.92" y="249.5566">places</text></g><!--link OrderStatus to Order--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="116" id="lnk15"><path codeLine="116" d="M1313.22,276.7283 C1313.22,295.5783 1313.22,289.6883 1313.22,310.1483" fill="none" id="OrderStatus-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1309.22" x2="1317.22" y1="272.7283" y2="272.7283"/><line style="stroke:#181818;stroke-width:1;" x1="1309.22" x2="1317.22" y1="275.7283" y2="275.7283"/><line style="stroke:#181818;stroke-width:1;" x1="1313.22" x2="1313.22" y1="276.7283" y2="268.7283"/><line style="stroke:#181818;stroke-width:1;" x1="1313.22" x2="1319.22" y1="320.1483" y2="328.1483"/><line style="stroke:#181818;stroke-width:1;" x1="1313.22" x2="1307.22" y1="320.1483" y2="328.1483"/><line style="stroke:#181818;stroke-width:1;" x1="1313.22" x2="1313.22" y1="320.1483" y2="328.1483"/><ellipse cx="1313.22" cy="314.1483" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.2637" x="1261.22" y="295.0066">controls</text></g><!--link PaymentStatusEnum to Order--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="117" id="lnk16"><path codeLine="117" d="M1516.92,227.0783 C1516.92,298.4583 1516.92,397.3183 1516.92,397.3183 C1516.92,397.3183 1448.39,397.3183 1366.76,397.3183" fill="none" id="PaymentStatusEnum-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1512.92" x2="1520.92" y1="223.0783" y2="223.0783"/><line style="stroke:#181818;stroke-width:1;" x1="1512.92" x2="1520.92" y1="226.0783" y2="226.0783"/><line style="stroke:#181818;stroke-width:1;" x1="1516.92" x2="1516.92"
 ProductDiscountRule--><g class="entity" data-qualified-name="ProductDiscountRule" data-source-line="168" id="ent0034"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="147.415" x="3400.82" y="534.4483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.415" x="3403.82" y="552.9834">ProductDiscountRule</text><line style="stroke:#181818;stroke-width:0.5;" x1="3401.82" x2="3547.235" y1="560.9366" y2="560.9366"/><line style="stroke:#181818;stroke-width:0.5;" x1="3401.82" x2="3547.235" y1="568.9366" y2="568.9366"/></g><!--class PaymentHistory--><g class="entity" data-qualified-name="PaymentHistory" data-source-line="172" id="ent0039"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.9297" x="1860.57" y="1040.8983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9297" x="1863.57" y="1059.4334">PaymentHistory</text><line style="stroke:#181818;stroke-width:0.5;" x1="1861.57" x2="1971.4997" y1="1067.3866" y2="1067.3866"/><line style="stroke:#181818;stroke-width:0.5;" x1="1861.57" x2="1971.4997" y1="1075.3866" y2="1075.3866"/></g><!--class User--><g class="entity" data-qualified-name="User" data-source-line="173" id="ent0041"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="36.3652" x="903.35" y="534.4483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3652" x="906.35" y="552.9834">User</text><line style="stroke:#181818;stroke-width:0.5;" x1="904.35" x2="938.7152" y1="560.9366" y2="560.9366"/><line style="stroke:#181818;stroke-width:0.5;" x1="904.35" x2="938.7152" y1="568.9366" y2="568.9366"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="177" id="ent0046"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="2821.99" y="1341.2483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="2824.99" y="1359.7834">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="2822.99" x2="2988.0652" y1="1367.7366" y2="1367.7366"/><line style="stroke:#181818;stroke-width:0.5;" x1="2822.99" x2="2988.0652" y1="1375.7366" y2="1375.7366"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="178" id="ent0048"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="121.5957" x="3023.73" y="1341.2483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5957" x="3026.73" y="1359.7834">StockReservation</text><line style="stroke:#181818;stroke-width:0.5;" x1="3024.73" x2="3144.3257" y1="1367.7366" y2="1367.7366"/><line style="stroke:#181818;stroke-width:0.5;" x1="3024.73" x2="3144.3257" y1="1375.7366" y2="1375.7366"/></g><!--class ProductionOrder--><g class="entity" data-qualified-name="ProductionOrder" data-source-line="179" id="ent0050"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="118.2529" x="3180.41" y="1341.2483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2529" x="3183.41" y="1359.7834">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="3181.41" x2="3297.6629" y1="1367.7366" y2="1367.7366"/><line style="stroke:#181818;stroke-width:0.5;" x1="3181.41" x2="3297.6629" y1="1375.7366" y2="1375.7366"/></g><g class="entity" data-qualified-name="GMN52" data-source-line="182" id="ent0053"><path d="M2033.31,466.4883 L2033.31,551.7383 L1998.37,555.7383 L2033.31,559.7383 L2033.31,644.9043 A0,0 0 0 0 2033.31,644.9043 L2735.7499,644.9043 A0,0 0 0 0 2735.7499,644.9043 L2735.7499,476.4883 L2725.7499,466.4883 L2033.31,466.4883 A0,0 0 0 0 2033.31,466.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2725.7499,466.4883 L2725.7499,476.4883 L2735.7499,476.4883 L2725.7499,466.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6069" x="2039.31" y="484.0566">Customer is optional to allow quick one-time orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="2039.31" y="499.3672">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="2039.31" y="514.6777">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.4399" x="2039.31" y="529.9883">customerNameSnapshot/customerPhoneSnapshot/customerEmailSnapshot store contact data at order time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.3242" x="2039.31" y="545.2988">Free-form communication is stored in OrderComment rows, not on Order itself.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.8506" x="2039.31" y="560.6094">Operational order timeline is stored in OrderHistory rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.3037" x="2039.31" y="575.9199">The visible admin history also merges linked PaymentHistory events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2039.31" y="591.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5068" x="2039.31" y="606.541">currency stores the original sale currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.2676" x="2039.31" y="621.8516">exchangeRateToBase is a snapshot: 1 order currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.8281" x="2039.31" y="637.1621">totalAmount is in original currency; totalAmountBase is in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="196" id="ent0056"><path d="M290.96,896.3883 L290.96,1057.7383 L256.56,1061.7383 L290.96,1065.7383 L290.96,1227.9098 A0,0 0 0 0 290.96,1227.9098 L764.0972,1227.9098 A0,0 0 0 0 764.0972,1227.9098 L764.0972,906.3883 L754.0972,896.3883 L290.96,896.3883 A0,0 0 0 0 290.96,896.3883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M754.0972,896.3883 L754.0972,906.3883 L764.0972,906.3883 L754.0972,896.3883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.4209" x="296.96" y="913.9566">Human discussion attached to an order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.8345" x="296.96" y="929.2672">One order can have many comments from different users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="296.96" y="944.5777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4604" x="296.96" y="959.8883">Comments are separate from operational history:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9297" x="296.96" y="975.1988">- OrderComment stores the message body.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.6714" x="296.96" y="990.5094">- OrderHistory records that a comment was added/edited/deleted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="296.96" y="1005.8199">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.7007" x="296.96" y="1021.1305">deletedAt is optional soft delete so the UI can hide a comment</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2275" x="296.96" y="1036.441">without destroying the audit trail.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="296.96" y="1051.7516">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="452.1372" x="296.96" y="1067.0621">type classifies the comment (general, manager, warehouse, accounting,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.1655" x="296.96" y="1082.3727">internal, call_result, callback_needed, complaint) so departmental</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.2993" x="296.96" y="1097.6832">comments are easy to spot. isImportant is an independent flag that</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.7163" x="296.96" y="1112.9938">visually highlights a comment regardless of its type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="296.96" y="1128.3043">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.7832" x="296.96" y="1143.6148">OrderCommentReadState stores one row per (order, user) with the last</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.8638" x="296.96" y="1158.9254">time that user viewed the order's comments. It powers the per-user</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.9702" x="296.96" y="1174.2359">unread indicator in the order list (no realtime; read on view).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.9033" x="296.96" y="1189.5465">A comment counts as unread for a user when it is newer than their</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.0039" x="296.96" y="1204.857">lastReadAt, authored by someone else, and either important or of a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.2925" x="296.96" y="1220.1676">type relevant to that user's role/permissions.</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="220" id="ent0059"><path d="M1365.92,904.0383 L1365.92,1057.7383 L1330.94,1061.7383 L1365.92,1065.7383 L1365.92,1220.2492 A0,0 0 0 0 1365.92,1220.2492 L1825.1431,1220.2492 A0,0 0 0 0 1825.1431,1220.2492 L1825.1431,914.0383 L1815.1431,904.0383 L1365.92,904.0383 A0,0 0 0 0 1365.92,904.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1815.1431,904.0383 L1815.1431,914.0383 L1825.1431,914.0383 L1815.1431,904.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8452" x="1371.92" y="921.6066">Dedicated append-only timeline for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.063" x="1371.92" y="936.9172">This is richer than StatusHistory and is the source of truth</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="1371.92" y="952.2277">for the future human-readable order activity feed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1371.92" y="967.5383">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.6421" x="1371.92" y="982.8488">eventKey is a stable machine key, for example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.5283" x="1371.92" y="998.1594">order.created, order.status_changed, order.comment_added,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068" x="1371.92" y="1013.4699">order.entry_updated, order.delivery_declaration_generated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1371.92" y="1028.7805">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.3535" x="1371.92" y="1044.091">source separates manual, system and integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.2231" x="1371.92" y="1059.4016">actor can be null for automatic events; actorNameSnapshot preserves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.5581" x="1371.92" y="1074.7121">the display name that should be shown later in the timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1371.92" y="1090.0227">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.1836" x="1371.92" y="1105.3332">title/description store ready-to-display human-readable snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.2202" x="1371.92" y="1120.6438">changes stores structured before/after values for changed fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.7612" x="1371.92" y="1135.9543">payload stores extra structured data for future features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1787" x="1371.92" y="1151.2648">delivery service, declaration number, shipping payer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.7183" x="1371.92" y="1166.5754">integration response, automation context and similar details.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1371.92" y="1181.8859">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.2388" x="1371.92" y="1197.1965">relatedEntityType/relatedEntityId can link future order-side records</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2197" x="1371.92" y="1212.507">without changing the base timeline model each time.</text></g><g class="entity" data-qualified-name="GMN61" data-source-line="243" id="ent0062"><path d="M2280.31,1034.1783 L2280.31,1090.1099 L2766.7582,1090.1099 L2766.7582,1044.1783 L2756.7582,1034.1783 L2280.31,1034.1783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2756.7582,1034.1783 L2756.7582,1044.1783 L2766.7582,1044.1783 L2756.7582,1034.1783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.8096" x="2286.31" y="1051.7466">PaymentHistory rows are append-only financial timeline events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.4482" x="2286.31" y="1067.0572">They are displayed together with OrderHistory in the order admin history,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.04" x="2286.31" y="1082.3677">but Payment remains the financial source of truth.</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="249" id="ent0065"><path d="M2273.44,105.4883 L2273.44,207.3516 L3037.6172,207.3516 L3037.6172,115.4883 L3027.6172,105.4883 L2273.44,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3027.6172,105.4883 L3027.6172,115.4883 L3037.6172,115.4883 L3027.6172,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2261" x="2279.44" y="123.0566">Recommended order flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="743.1772" x="2279.44" y="138.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship -&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2279.44" y="153.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.5801" x="2279.44" y="168.9883">canceled is for orders stopped before completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4312" x="2279.44" y="184.2988">partially_returned/returned are post-shipment states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="595.1309" x="2279.44" y="199.6094">Backorders usually use awaiting_stock until enough stock is produced, purchased or reserved.</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="258" id="ent0068"><path d="M3289.97,911.6983 L3289.97,1057.7383 L3255.82,1061.7383 L3289.97,1065.7383 L3289.97,1212.5987 A0,0 0 0 0 3289.97,1212.5987 L4003.0867,1212.5987 A0,0 0 0 0 4003.0867,1212.5987 L4003.0867,921.6983 L3993.0867,911.6983 L3289.97,911.6983 A0,0 0 0 0 3289.97,911.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3993.0867,911.6983 L3993.0867,921.6983 L4003.0867,921.6983 L3993.0867,911.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.0229" x="3295.97" y="929.2666">Sales order line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="664.5171" x="3295.97" y="944.5772">Stores snapshot of product name, code, unit code/name, quantity and sale price at the moment of order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.3379" x="3295.97" y="959.8877">Monetary fields without Base suffix are in Order.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.7354" x="3295.97" y="975.1983">warehouseStockBatch is optional and identifies the FIFO batch used for stock-backed pricing/reservation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.2534" x="3295.97" y="990.5088">Search should expose different batches as separate stock options, ordered oldest first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.2773" x="3295.97" y="1005.8194">Each stock-backed OrderEntry should keep one selected batch and one sale price snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="602.4941" x="3295.97" y="1021.1299">discountRule/discountPercent/discountMode record the configured or manual discount source.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.8989" x="3295.97" y="1036.4405">discountAmount remains the money snapshot used by totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="516.8833" x="3295.97" y="1051.751">Manual override and below-cost discounted lines require order.discount.override.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="3295.97" y="1067.0616">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="615.564" x="3295.97" y="1082.3721">shippedQuantity, returnedQuantity and canceledQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="3295.97" y="1097.6827">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="3295.97" y="1112.9932">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="3295.97" y="1128.3038">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.1284" x="3295.97" y="1143.6143">Partial shipments are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.1353" x="3295.97" y="1158.9248">one OrderEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="692.1167" x="3295.97" y="1174.2354">Backordered quantity = quantity - shippedQuantity - canceledQuantity, with reservations handled separately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="3295.97" y="1189.5459">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.7251" x="3295.97" y="1204.8565">InventoryDocumentLine is created from this line when stock is shipped or returned.</text></g><!--link Store to Order--><g class="link" data-entity-1="ent0013" data-entity-2="ent0008" data-link-type="crowfoot" data-source-line="155" id="lnk14"><path codeLine="155" d="M1663.53,185.9183 C1663.53,245.2283 1663.53,398.7383 1663.53,398.7383 C1663.53,398.7383 1667.44,398.7383 1696.49,398.7383" fill="none" id="Store-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1659.53" x2="1667.53" y1="181.9183" y2="181.9183"/><line style="stroke:#181818;stroke-width:1;" x1="1659.53" x2="1667.53" y1="184.9183" y2="184.9183"/><line style="stroke:#181818;stroke-width:1;" x1="1663.53" x2="1663.53" y1="185.9183" y2="177.9183"/><line style="stroke:#181818;stroke-width:1;" x1="1706.49" x2="1714.49" y1="398.7383" y2="392.7383"/><line style="stroke:#181818;stroke-width:1;" x1="1706.49" x2="1714.49" y1="398.7383" y2="404.7383"/><line style="stroke:#181818;stroke-width:1;" x1="1706.49" x2="1714.49" y1="398.7383" y2="398.7383"/><ellipse cx="1700.49" cy="398.7383" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.8193" x="1612.53" y="310.3766">receives</text></g><!--link Currency to Order--><g class="link" data-entity-1="ent0015" data-entity-2="ent0008" data-link-type="crowfoot" data-source-line="156" id="lnk16"><path codeLine="156" d="M1752.53,185.8883 C1752.53,216.0083 1752.53,248.1083 1752.53,309.8883" fill="none" id="Currency-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1748.53" x2="1756.53" y1="181.8883" y2="181.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1748.53" x2="1756.53" y1="184.8883" y2="184.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1752.53" x2="1752.53" y1="185.8883" y2="177.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1752.53" x2="1758.53" y1="319.8883" y2="327.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1752.53" x2="1746.53" y1="319.8883" y2="327.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1752.53" x2="1752.53" y1="319.8883" y2="327.8883"/><ellipse cx="1752.53" cy="313.8883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.2886" x="1659.53" y="249.4566">order currency</text></g><!--link Customer to Order--><g class="link" data-entity-1="ent0017" data-entity-2="ent0008" data-link-type="crowfoot" data-source-line="157" id="lnk18"><path codeLine="157" d="M1856.53,192.8883 C1856.53,223.0083 1856.53,248.1083 1856.53,309.8883" fill="none" id="Customer-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1856.53" x2="1856.53" y1="188.8883" y2="177.8883"/><ellipse cx="1856.53" cy="188.8883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1852.53" x2="1860.53" y1="181.8883" y2="181.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1856.53" x2="1862.53" y1="319.8883" y2="327.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1856.53" x2="1850.53" y1="319.8883" y2="327.8883"/><line style="stroke:#181818;stroke-width:1;" x1="1856.53" x2="1856.53" y1="319.8883" y2="327.8883"/><ellipse cx="1856.53" cy="313.8883" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.6475" x="1816.53" y="249.4566">places</text></g><!--link OrderStatus to Order--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="crowfoot" data-source-line="158" id="l
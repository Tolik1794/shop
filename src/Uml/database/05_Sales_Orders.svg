"#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="2486.38" y="1324.7583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="2489.38" y="1343.2934">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="2487.38" x2="2652.4552" y1="1351.2466" y2="1351.2466"/><line style="stroke:#181818;stroke-width:0.5;" x1="2487.38" x2="2652.4552" y1="1359.2466" y2="1359.2466"/></g><!--class StockReservation--><g class="entity" data-qualified-name="StockReservation" data-source-line="144" id="ent0041"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="121.5957" x="2688.12" y="1324.7583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5957" x="2691.12" y="1343.2934">StockReservation</text><line style="stroke:#181818;stroke-width:0.5;" x1="2689.12" x2="2808.7157" y1="1351.2466" y2="1351.2466"/><line style="stroke:#181818;stroke-width:0.5;" x1="2689.12" x2="2808.7157" y1="1359.2466" y2="1359.2466"/></g><g class="entity" data-qualified-name="GMN43" data-source-line="147" id="ent0044"><path d="M1784.7,466.4883 L1784.7,551.2483 L1749.76,555.2483 L1784.7,559.2483 L1784.7,644.9043 A0,0 0 0 0 1784.7,644.9043 L2487.1399,644.9043 A0,0 0 0 0 2487.1399,644.9043 L2487.1399,476.4883 L2477.1399,466.4883 L1784.7,466.4883 A0,0 0 0 0 1784.7,466.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2477.1399,466.4883 L2477.1399,476.4883 L2487.1399,476.4883 L2477.1399,466.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6069" x="1790.7" y="484.0566">Customer is optional to allow quick one-time orders.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="1790.7" y="499.3672">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1790.7" y="514.6777">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="681.4399" x="1790.7" y="529.9883">customerNameSnapshot/customerPhoneSnapshot/customerEmailSnapshot store contact data at order time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="505.3242" x="1790.7" y="545.2988">Free-form communication is stored in OrderComment rows, not on Order itself.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.8506" x="1790.7" y="560.6094">Operational order timeline is stored in OrderHistory rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.3037" x="1790.7" y="575.9199">The visible admin history also merges linked PaymentHistory events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1790.7" y="591.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5068" x="1790.7" y="606.541">currency stores the original sale currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.2676" x="1790.7" y="621.8516">exchangeRateToBase is a snapshot: 1 order currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="495.8281" x="1790.7" y="637.1621">totalAmount is in original currency; totalAmountBase is in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="161" id="ent0047"><path d="M1072.08,979.9983 L1072.08,1050.2483 L1037.94,1054.2483 L1072.08,1058.2483 L1072.08,1127.7932 A0,0 0 0 0 1072.08,1127.7932 L1515.7514,1127.7932 A0,0 0 0 0 1515.7514,1127.7932 L1515.7514,989.9983 L1505.7514,979.9983 L1072.08,979.9983 A0,0 0 0 0 1072.08,979.9983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1505.7514,979.9983 L1505.7514,989.9983 L1515.7514,989.9983 L1505.7514,979.9983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.4209" x="1078.08" y="997.5666">Human discussion attached to an order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.8345" x="1078.08" y="1012.8772">One order can have many comments from different users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="1028.1877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.4604" x="1078.08" y="1043.4983">Comments are separate from operational history:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9297" x="1078.08" y="1058.8088">- OrderComment stores the message body.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.6714" x="1078.08" y="1074.1194">- OrderHistory records that a comment was added/edited/deleted.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1078.08" y="1089.4299">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.7007" x="1078.08" y="1104.7405">deletedAt is optional soft delete so the UI can hide a comment</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.2275" x="1078.08" y="1120.051">without destroying the audit trail.</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="173" id="ent0050"><path d="M294.31,895.7983 L294.31,1050.2483 L259.33,1054.2483 L294.31,1058.2483 L294.31,1212.0092 A0,0 0 0 0 294.31,1212.0092 L753.5331,1212.0092 A0,0 0 0 0 753.5331,1212.0092 L753.5331,905.7983 L743.5331,895.7983 L294.31,895.7983 A0,0 0 0 0 294.31,895.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M743.5331,895.7983 L743.5331,905.7983 L753.5331,905.7983 L743.5331,895.7983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8452" x="300.31" y="913.3666">Dedicated append-only timeline for Order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.063" x="300.31" y="928.6772">This is richer than StatusHistory and is the source of truth</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="300.31" y="943.9877">for the future human-readable order activity feed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="959.2983">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.6421" x="300.31" y="974.6088">eventKey is a stable machine key, for example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.5283" x="300.31" y="989.9194">order.created, order.status_changed, order.comment_added,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068" x="300.31" y="1005.2299">order.entry_updated, order.delivery_declaration_generated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1020.5405">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.3535" x="300.31" y="1035.851">source separates manual, system and integration events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.2231" x="300.31" y="1051.1616">actor can be null for automatic events; actorNameSnapshot preserves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.5581" x="300.31" y="1066.4721">the display name that should be shown later in the timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1081.7827">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.1836" x="300.31" y="1097.0932">title/description store ready-to-display human-readable snapshots.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.2202" x="300.31" y="1112.4038">changes stores structured before/after values for changed fields.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.7612" x="300.31" y="1127.7143">payload stores extra structured data for future features:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.1787" x="300.31" y="1143.0248">delivery service, declaration number, shipping payer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.7183" x="300.31" y="1158.3354">integration response, automation context and similar details.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="300.31" y="1173.6459">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="426.2388" x="300.31" y="1188.9565">relatedEntityType/relatedEntityId can link future order-side records</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2197" x="300.31" y="1204.267">without changing the base timeline model each time.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="196" id="ent0053"><path d="M1970.7,1025.9383 L1970.7,1081.8699 L2457.1482,1081.8699 L2457.1482,1035.9383 L2447.1482,1025.9383 L1970.7,1025.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2447.1482,1025.9383 L2447.1482,1035.9383 L2457.1482,1035.9383 L2447.1482,1025.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.8096" x="1976.7" y="1043.5066">PaymentHistory rows are append-only financial timeline events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="465.4482" x="1976.7" y="1058.8172">They are displayed together with OrderHistory in the order admin history,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.04" x="1976.7" y="1074.1277">but Payment remains the financial source of truth.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="202" id="ent0056"><path d="M2024.83,105.4883 L2024.83,207.3516 L2789.0072,207.3516 L2789.0072,115.4883 L2779.0072,105.4883 L2024.83,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2779.0072,105.4883 L2779.0072,115.4883 L2789.0072,115.4883 L2779.0072,105.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.2261" x="2030.83" y="123.0566">Recommended order flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="743.1772" x="2030.83" y="138.3672">draft -&gt; confirmed -&gt; awaiting_stock -&gt; ready_to_ship -&gt; partially_shipped -&gt; shipped -&gt; delivered -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2030.83" y="153.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.5801" x="2030.83" y="168.9883">canceled is for orders stopped before completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4312" x="2030.83" y="184.2988">partially_returned/returned are post-shipment states.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="595.1309" x="2030.83" y="199.6094">Backorders usually use awaiting_stock until enough stock is produced, purchased or reserved.</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="211" id="ent0059"><path d="M2862.36,903.4483 L2862.36,1050.2483 L2827.64,1054.2483 L2862.36,1058.2483 L2862.36,1204.3487 A0,0 0 0 0 2862.36,1204.3487 L3575.4767,1204.3487 A0,0 0 0 0 3575.4767,1204.3487 L3575.4767,913.4483 L3565.4767,903.4483 L2862.36,903.4483 A0,0 0 0 0 2862.36,903.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3565.4767,903.4483 L3565.4767,913.4483 L3575.4767,913.4483 L3565.4767,903.4483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.0229" x="2868.36" y="921.0166">Sales order line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="664.5171" x="2868.36" y="936.3272">Stores snapshot of product name, code, unit code/name, quantity and sale price at the moment of order.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="605.3379" x="2868.36" y="951.6377">Monetary fields without Base suffix are in Order.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="667.7354" x="2868.36" y="966.9483">warehouseStockBatch is optional and identifies the FIFO batch used for stock-backed pricing/reservation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="548.2534" x="2868.36" y="982.2588">Search should expose different batches as separate stock options, ordered oldest first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.2773" x="2868.36" y="997.5694">Each stock-backed OrderEntry should keep one selected batch and one sale price snapshot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="602.4941" x="2868.36" y="1012.8799">discountRule/discountPercent/discountMode record the configured or manual discount source.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.8989" x="2868.36" y="1028.1905">discountAmount remains the money snapshot used by totals.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="516.8833" x="2868.36" y="1043.501">Manual override and below-cost discounted lines require order.discount.override.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1058.8116">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="615.564" x="2868.36" y="1074.1221">shippedQuantity, returnedQuantity and canceledQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="2868.36" y="1089.4327">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="2868.36" y="1104.7432">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1120.0538">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.1284" x="2868.36" y="1135.3643">Partial shipments are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="512.1353" x="2868.36" y="1150.6748">one OrderEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="692.1167" x="2868.36" y="1165.9854">Backordered quantity = quantity - shippedQuantity - canceledQuantity, with reservations handled separately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2868.36" y="1181.2959">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="527.7251" x="2868.36" y="1196.6065">InventoryDocumentLine is created from this line when stock is shipped or returned.</text></g><!--link Store to Order--><g class="link" data-entity-1="ent0010" data-entity-2="ent0006" data-link-type="crowfoot" data-source-line="125" id="lnk11"><path codeLine="125" d="M1414.92,185.9283 C1414.92,248.6983 1414.92,419.2483 1414.92,419.2483 C1414.92,419.2483 1418.83,419.2483 1447.88,419.2483" fill="none" id="Store-Order" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1410.92" x2="1418.92" y1="181.9283" y2="181.9283"/><line style="stroke:#181818;stroke-width:1;" x1="1410.92" x2="1418.92" y1="184.9283" y2="184.9283"/><line style="stroke:#181818;stroke-width:1;" x1="1414.92" x2="1414.92" y1="185.92
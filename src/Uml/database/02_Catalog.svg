tyle="stroke:#181818;stroke-width:0.5;" x1="1157.29" x2="1196.1943" y1="103.7066" y2="103.7066"/></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="202" id="ent0039"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="780.99" y="653.4283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="783.99" y="671.9634">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="781.99" x2="859.49" y1="679.9166" y2="679.9166"/><line style="stroke:#181818;stroke-width:0.5;" x1="781.99" x2="859.49" y1="687.9166" y2="687.9166"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="204" id="ent0042"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="108.34" y="653.4283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="111.34" y="671.9634">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="109.34" x2="174.1457" y1="679.9166" y2="679.9166"/><line style="stroke:#181818;stroke-width:0.5;" x1="109.34" x2="174.1457" y1="687.9166" y2="687.9166"/></g><g class="entity" data-qualified-name="GMN50" data-source-line="213" id="ent0051"><path d="M2223.48,296.8883 L2223.48,320.8783 L2152.8,324.8783 L2223.48,328.8783 L2223.48,352.8199 A0,0 0 0 0 2223.48,352.8199 L2581.9912,352.8199 A0,0 0 0 0 2581.9912,352.8199 L2581.9912,306.8883 L2571.9912,296.8883 L2223.48,296.8883 A0,0 0 0 0 2223.48,296.8883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2571.9912,296.8883 L2571.9912,306.8883 L2581.9912,306.8883 L2571.9912,296.8883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2229.48" y="314.4566">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.5112" x="2229.48" y="329.7672">(store_id, parent_id, name) when parent_id is not null</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.9624" x="2229.48" y="345.0777">(store_id, name) when parent_id is null</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="219" id="ent0054"><path d="M2807.02,654.3583 L2807.02,670.8783 L2772.08,674.8783 L2807.02,678.8783 L2807.02,694.9794 A0,0 0 0 0 2807.02,694.9794 L3098.4682,694.9794 A0,0 0 0 0 3098.4682,694.9794 L3098.4682,664.3583 L3088.4682,654.3583 L2807.02,654.3583 A0,0 0 0 0 2807.02,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3088.4682,654.3583 L3088.4682,664.3583 L3098.4682,664.3583 L3088.4682,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2813.02" y="671.9266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.4482" x="2813.02" y="687.2372">(store_id, additional_name_id, category_id)</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="224" id="ent0057"><path d="M3523.61,654.3583 L3523.61,670.8783 L3488.43,674.8783 L3523.61,678.8783 L3523.61,694.9794 A0,0 0 0 0 3523.61,694.9794 L3813.8649,694.9794 A0,0 0 0 0 3813.8649,694.9794 L3813.8649,664.3583 L3803.8649,654.3583 L3523.61,654.3583 A0,0 0 0 0 3523.61,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3803.8649,654.3583 L3803.8649,664.3583 L3813.8649,664.3583 L3803.8649,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="3529.61" y="671.9266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2549" x="3529.61" y="687.2372">(category_id, product_parameter_name_id)</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="229" id="ent0060"><path d="M2006.67,600.7783 L2006.67,748.5732 L2486.8087,748.5732 L2486.8087,610.7783 L2476.8087,600.7783 L2006.67,600.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2476.8087,600.7783 L2476.8087,610.7783 L2486.8087,610.7783 L2476.8087,600.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2012.67" y="618.3466">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.2271" x="2012.67" y="633.6572">(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2012.67" y="648.9677">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5024" x="2012.67" y="664.2783">unit is a reference to Unit to avoid inconsistent text values like:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.7896" x="2012.67" y="679.5888">&#1096;&#1090;, &#1096;&#1090;., &#1096;&#1090;&#1091;&#1082;, pcs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2012.67" y="694.8994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.7988" x="2012.67" y="710.2099">baseSalePrice is recommended to be stored in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.1387" x="2012.67" y="725.5205">It is a denormalized quick access value for the current regular sale price.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2686" x="2012.67" y="740.831">ProductPrice stores price history and special price types.</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="241" id="ent0063"><path d="M1268.08,547.1883 L1268.08,670.8783 L1161.68,674.8783 L1268.08,678.8783 L1268.08,802.157 A0,0 0 0 0 1268.08,802.157 L1971.3896,802.157 A0,0 0 0 0 1971.3896,802.157 L1971.3896,557.1883 L1961.3896,547.1883 L1268.08,547.1883 A0,0 0 0 0 1268.08,547.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1961.3896,547.1883 L1961.3896,557.1883 L1971.3896,557.1883 L1961.3896,547.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.6821" x="1274.08" y="564.7566">Product is used as a universal stock/catalog item:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.5688" x="1274.08" y="580.0672">- material: purchased and consumed in production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0542" x="1274.08" y="595.3777">- finished_product: manufactured and sold</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.8203" x="1274.08" y="610.6883">- resale_product: purchased and sold without manufacturing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.5859" x="1274.08" y="625.9988">- semi_finished_product: produced and later consumed/finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="511.9131" x="1274.08" y="641.3094">- service: can be sold, but usually should not create WarehouseStock movements</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1274.08" y="656.6199">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4751" x="1274.08" y="671.9305">Recommended flag rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.9209" x="1274.08" y="687.241">material: canBePurchased=true, canBeSold=false, canBeManufactured=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.3291" x="1274.08" y="702.5516">finished_product: canBeSold=true, canBeManufactured=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="517.5181" x="1274.08" y="717.8621">resale_product: canBePurchased=true, canBeSold=true, canBeManufactured=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="682.3096" x="1274.08" y="733.1727">semi_finished_product: canBeManufactured=true and canBePurchased/canBeSold depends on business case</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.2681" x="1274.08" y="748.4832">service: canBeSold=true, but should normally not be stocked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1274.08" y="763.7938">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.0356" x="1274.08" y="779.1043">Avoid splitting Product/Material/Item at this stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.0366" x="1274.08" y="794.4148">Use productKind + flags to control behavior in forms and business rules.</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="260" id="ent0066"><path d="M285.76,921.1383 L285.76,1036.8783 L250.79,1040.8783 L285.76,1044.8783 L285.76,1160.7965 A0,0 0 0 0 285.76,1160.7965 L837.7097,1160.7965 A0,0 0 0 0 837.7097,1160.7965 L837.7097,931.1383 L827.7097,921.1383 L285.76,921.1383 A0,0 0 0 0 285.76,921.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M827.7097,921.1383 L827.7097,931.1383 L837.7097,931.1383 L827.7097,921.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7822" x="291.76" y="938.7066">Product price history and future price support.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="291.76" y="954.0172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4893" x="291.76" y="969.3277">price is in ProductPrice.currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="530.9497" x="291.76" y="984.6383">priceBase is in Store.baseCurrency using the exchange rate at creation/update time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="291.76" y="999.9488">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.6792" x="291.76" y="1015.2594">Suggested rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.3755" x="291.76" y="1030.5699">- regular = default catalog price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4956" x="291.76" y="1045.8805">- sale = promotional price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2236" x="291.76" y="1061.191">- wholesale = wholesale price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.5371" x="291.76" y="1076.5016">- custom = manual/special price list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="291.76" y="1091.8121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.1768" x="291.76" y="1107.1227">Only one active price interval should overlap for the same:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0679" x="291.76" y="1122.4332">(store_id, product_id, type, currency_id).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="291.76" y="1137.7438">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.1724" x="291.76" y="1153.0543">OrderEntry.unitPrice remains the final price snapshot used in a specific order.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="278" id="ent0069"><path d="M411.22,250.9583 L411.22,320.8783 L376.59,324.8783 L411.22,328.8783 L411.22,398.7532 A0,0 0 0 0 411.22,398.7532 L836.2674,398.7532 A0,0 0 0 0 836.2674,398.7532 L836.2674,260.9583 L826.2674,250.9583 L411.22,250.9583 A0,0 0 0 0 411.22,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M826.2674,250.9583 L826.2674,260.9583 L836.2674,260.9583 L826.2674,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.3809" x="417.22" y="268.5266">Product/category discount rules define which percent discounts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.1958" x="417.22" y="283.8372">can be selected in sales order rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="417.22" y="299.1477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.0474" x="417.22" y="314.4583">isDefault means the rule is auto-selected when a new order row</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.4409" x="417.22" y="329.7688">matches it. If several defaults match, product target wins over</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3062" x="417.22" y="345.0794">category target; closer category wins over ancestor category;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.1631" x="417.22" y="360.3899">for equal specificity the higher percent wins.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="417.22" y="375.7005">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.9126" x="417.22" y="391.011">percent must be &gt; 0 and &lt;= 100.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="290" id="ent0072"><path d="M1242.5,997.6983 L1242.5,1036.8783 L1207.68,1040.8783 L1242.5,1044.8783 L1242.5,1084.251 A0,0 0 0 0 1242.5,1084.251 L1708.9849,1084.251 A0,0 0 0 0 1708.9849,1084.251 L1708.9849,1007.6983 L1698.9849,997.6983 L1242.5,997.6983 A0,0 0 0 0 1242.5,997.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1698.9849,997.6983 L1698.9849,1007.6983 L1708.9849,1007.6983 L1698.9849,997.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5654" x="1248.5" y="1015.2666">Exactly one target is filled:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.5601" x="1248.5" y="1030.5772">- targetType=product requires product and no category.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.4478" x="1248.5" y="1045.8877">- targetType=category requires category and no product.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1248.5" y="1061.1983">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.4849" x="1248.5" y="1076.5088">Category targets include descendants when includeDescendants=true.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="298" id="ent0075"><path d="M1421.45,250.9583 L1421.45,320.8783 L1386.98,324.8783 L1421.45,328.8783 L1421.45,398.7532 A0,0 0 0 0 1421.45,398.7532 L1874.0208,398.7532 A0,0 0 0 0 1874.0208,398.7532 L1874.0208,260.9583 L1864.0208,250.9583 L1421.45,250.9583 A0,0 0 0 0 1421.45,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1864.0208,250.9583 L1864.0208,260.9583 L1874.0208,260.9583 L1864.0208,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1427.45" y="268.5266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.2271" x="1427.45" y="283.8372">(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1427.45" y="299.1477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.5708" x="1427.45" y="314.4583">precision defines how many decimal places are allowed for this unit.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.2573" x="1427.45" y="329.7688">Examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.689" x="1427.45" y="345.0794">&#1096;&#1090; -&gt; 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.0327" x="1427.45" y="360.3899">&#1082;&#1075; -&gt; 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.7417" x="1427.45" y="375.7005">&#1084; -&gt; 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.9619" x="1427.45" y="391.011">&#1084;2 -&gt; 3</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="310" id="ent0078"><path d="M2134.06,1020.6583 L2134.06,1036.8783 L2099.5,1040.8783 L2134.06,1044.8783 L2134.06,1061.2794 A0,0 0 0 0 2134.06,1061.2794 L2419.4272,1061.2794 A0,0 0 0 0 2419.4272,1061.2794 L2419.4272,1030.6583 L2409.4272,1020.6583 L2134.06,1020.6583 A0,0 0 0 0 2134.06,1020.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2409.4272,1020.6583 L2409.4272,1030.6583 L2419.4272,1030.6583 L2409.4272,1020.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2140.06" y="1038.2266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3672" x="2140.06" y="1053.5372">(product_id, product_parameter_name_id)</text></g><g class="entity" data-qualified-name="GMN80" data-source-line="315" id="ent0081"><path d="M2731.68,959.4183 L2731.68,1036.8783 L2696.95,1040.8783 L2731.68,1044.8783 L2731.68,1122.5238 A0,0 0 0 0 2731.68,1122.5238 L3141.7977,1122.5238 A0,0 0 0 0 3141.7977,1122.5238 L3141.7977,969.4183 L3131.7977,959.4183 L2731.68,959.4183 A0,0 0 0 0 2731.68,959.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3131.7977,959.4183 L3131.7977,969.4183 L3141.7977,969.4183 L3131.7977,959.4183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.9761" x="2737.68" y="976.9866">Related products (table -&gt; chairs, legs, hardware).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2737.68" y="992.2972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2737.68" y="1007.6077">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.3633" x="2737.68" y="1022.9183">(product_id, related_product_id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2737.68" y="1038.2288">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.9014" x="2737.68" y="1053.5394">Relations are bidirectional (mirrored): a relation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.3594" x="2737.68" y="1068.8499">product -&gt; relatedProduct is kept in sync with an inverse</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.6611" x="2737.68" y="1084.1605">relatedProduct -&gt; product of the same type. Both products</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.1177" x="2737.68" y="1099.471">must belong to the same store. ON DELETE CASCADE on both</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.5488" x="2737.68" y="1114.7816">foreign keys removes relations when a product is deleted.</text></g><!--link Store to Category--><g class="link" data-entity-1="ent0019" data-entity-2="ent0007" data-link-type="crowfoot" data-source-line="183" id="lnk20"><path codeLine="183" d="M1176.74,119.9883 C1176.74,153.1283 1176.74,204.8783 1176.74,204.8783 C1176.74,204.8783 1654.88,204.8783 1890.84,204.8783" fill="none" id="Store-Category" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1172.74" x2="1180.74" y1="115.9883" y2="115.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1172.74" x2="1180.74" y1="118.9883" y2="118.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1176.74" x2="1176.74" y1="119.9883" y2="111.9883"/><line style="stroke:#181818;stroke-width:1;" x1="1900.84" x2="1908.84" y1="204.8783" y2="198.8783"/><line style="stroke:#181818;stroke-width:1;" x1="1900.84" x2="1908.84" y1="204.8783" y2="210.8783"/><line style="stroke:#181818;stroke-width:1;" x1="1900.84" x2="1908.84" y1="204.8783" y2="204.8783"/><ellipse cx="1894.84" cy="204.8783" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="1463.34" y="201.4466">owns</text></g><!--link Store to CategoryAdditionalName--><g class="link" data-entity-1="ent0019" data-entity-2="ent0009" data-link-type="crowfoot" data-source-line="184" id="lnk21"><path codeLine="184" d="M1186.97,119.9483 C1186.97,137.6583 1186.97,151.8783 1186.97,151.8783 C1186.97,151.8783 2635.02,151.8783 2635.02,151.8783 C2635.02,151.8783 2635.02,468.2983 2635.02,602.1983" fill="none" id="Store-CategoryAdditionalName" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1182.97" x2="1190.97" y1="115.9483" y2="115.9483"/><line style="stroke:#181818;stroke-width:1;" x1="1182.97" x2="1190.97" y1="118.9483" y2="118.9483"/><line style="stroke:#181818;stroke-width:1;" x1="1186.97" x2="1186.97" y1="119.9483" y2="111.9483"/><line style="stroke:#181818;stroke-width:1;" x1="2635.02" x2="2641.02" y1="612.1983" y2="620.1983"/><line style="stroke:#181818;stroke-width:1;" x1="2635.02" x2="2629.02" y1="612.1983" y2="620.1983"/><line style="stroke:#181818;stroke-width:1;" x1="2635.02" x2="2635.02" y1="612.1983" y2="620.1983"/><ellipse cx="2635.02" cy="606.1983" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fi
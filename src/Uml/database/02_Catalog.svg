e</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2984.19" cy="726.3938" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.9961" x="2993.19" y="730.1848">category: Category</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="167" id="ent0017"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="772.18" y="69.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="775.18" y="87.7534">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="773.18" x2="812.0843" y1="95.7066" y2="95.7066"/><line style="stroke:#181818;stroke-width:0.5;" x1="773.18" x2="812.0843" y1="103.7066" y2="103.7066"/></g><!--class OrderEntry--><g class="entity" data-qualified-name="OrderEntry" data-source-line="186" id="ent0037"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.5" x="274.89" y="653.4283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.5" x="277.89" y="671.9634">OrderEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="275.89" x2="353.39" y1="679.9166" y2="679.9166"/><line style="stroke:#181818;stroke-width:0.5;" x1="275.89" x2="353.39" y1="687.9166" y2="687.9166"/></g><!--class Currency--><g class="entity" data-qualified-name="Currency" data-source-line="188" id="ent0040"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.8057" x="1001.23" y="653.4283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8057" x="1004.23" y="671.9634">Currency</text><line style="stroke:#181818;stroke-width:0.5;" x1="1002.23" x2="1067.0357" y1="679.9166" y2="679.9166"/><line style="stroke:#181818;stroke-width:0.5;" x1="1002.23" x2="1067.0357" y1="687.9166" y2="687.9166"/></g><g class="entity" data-qualified-name="GMN45" data-source-line="194" id="ent0046"><path d="M2062.38,296.8883 L2062.38,352.8199 L2420.8912,352.8199 L2420.8912,306.8883 L2410.8912,296.8883 L2062.38,296.8883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2410.8912,296.8883 L2410.8912,306.8883 L2420.8912,306.8883 L2410.8912,296.8883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2068.38" y="314.4566">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.5112" x="2068.38" y="329.7672">(store_id, parent_id, name) when parent_id is not null</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.9624" x="2068.38" y="345.0777">(store_id, name) when parent_id is null</text></g><g class="entity" data-qualified-name="GMN48" data-source-line="200" id="ent0049"><path d="M674.91,654.3583 L674.91,670.8783 L639.98,674.8783 L674.91,678.8783 L674.91,694.9794 A0,0 0 0 0 674.91,694.9794 L966.3582,694.9794 A0,0 0 0 0 966.3582,694.9794 L966.3582,664.3583 L956.3582,654.3583 L674.91,654.3583 A0,0 0 0 0 674.91,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M956.3582,654.3583 L956.3582,664.3583 L966.3582,664.3583 L956.3582,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="680.91" y="671.9266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.4482" x="680.91" y="687.2372">(store_id, additional_name_id, category_id)</text></g><g class="entity" data-qualified-name="GMN51" data-source-line="205" id="ent0052"><path d="M3363.51,654.3583 L3363.51,670.8783 L3328.32,674.8783 L3363.51,678.8783 L3363.51,694.9794 A0,0 0 0 0 3363.51,694.9794 L3653.7649,694.9794 A0,0 0 0 0 3653.7649,694.9794 L3653.7649,664.3583 L3643.7649,654.3583 L3363.51,654.3583 A0,0 0 0 0 3363.51,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3643.7649,654.3583 L3643.7649,664.3583 L3653.7649,664.3583 L3643.7649,654.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="3369.51" y="671.9266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2549" x="3369.51" y="687.2372">(category_id, product_parameter_name_id)</text></g><g class="entity" data-qualified-name="GMN54" data-source-line="210" id="ent0055"><path d="M2119.57,600.7783 L2119.57,748.5732 L2599.7087,748.5732 L2599.7087,610.7783 L2589.7087,600.7783 L2119.57,600.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2589.7087,600.7783 L2589.7087,610.7783 L2599.7087,610.7783 L2589.7087,600.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2125.57" y="618.3466">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.2271" x="2125.57" y="633.6572">(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2125.57" y="648.9677">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5024" x="2125.57" y="664.2783">unit is a reference to Unit to avoid inconsistent text values like:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.7896" x="2125.57" y="679.5888">&#1096;&#1090;, &#1096;&#1090;., &#1096;&#1090;&#1091;&#1082;, pcs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2125.57" y="694.8994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.7988" x="2125.57" y="710.2099">baseSalePrice is recommended to be stored in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.1387" x="2125.57" y="725.5205">It is a denormalized quick access value for the current regular sale price.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2686" x="2125.57" y="740.831">ProductPrice stores price history and special price types.</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="222" id="ent0058"><path d="M1380.98,547.1883 L1380.98,670.8783 L1346.64,674.8783 L1380.98,678.8783 L1380.98,802.157 A0,0 0 0 0 1380.98,802.157 L2084.2896,802.157 A0,0 0 0 0 2084.2896,802.157 L2084.2896,557.1883 L2074.2896,547.1883 L1380.98,547.1883 A0,0 0 0 0 1380.98,547.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2074.2896,547.1883 L2074.2896,557.1883 L2084.2896,557.1883 L2074.2896,547.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.6821" x="1386.98" y="564.7566">Product is used as a universal stock/catalog item:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.5688" x="1386.98" y="580.0672">- material: purchased and consumed in production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0542" x="1386.98" y="595.3777">- finished_product: manufactured and sold</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.8203" x="1386.98" y="610.6883">- resale_product: purchased and sold without manufacturing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.5859" x="1386.98" y="625.9988">- semi_finished_product: produced and later consumed/finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="511.9131" x="1386.98" y="641.3094">- service: can be sold, but usually should not create WarehouseStock movements</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1386.98" y="656.6199">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4751" x="1386.98" y="671.9305">Recommended flag rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.9209" x="1386.98" y="687.241">material: canBePurchased=true, canBeSold=false, canBeManufactured=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.3291" x="1386.98" y="702.5516">finished_product: canBeSold=true, canBeManufactured=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="517.5181" x="1386.98" y="717.8621">resale_product: canBePurchased=true, canBeSold=true, canBeManufactured=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="682.3096" x="1386.98" y="733.1727">semi_finished_product: canBeManufactured=true and canBePurchased/canBeSold depends on business case</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.2681" x="1386.98" y="748.4832">service: canBeSold=true, but should normally not be stocked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1386.98" y="763.7938">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.0356" x="1386.98" y="779.1043">Avoid splitting Product/Material/Item at this stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.0366" x="1386.98" y="794.4148">Use productKind + flags to control behavior in forms and business rules.</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="241" id="ent0061"><path d="M757.66,921.1383 L757.66,1036.8783 L722.69,1040.8783 L757.66,1044.8783 L757.66,1160.7965 A0,0 0 0 0 757.66,1160.7965 L1309.6097,1160.7965 A0,0 0 0 0 1309.6097,1160.7965 L1309.6097,931.1383 L1299.6097,921.1383 L757.66,921.1383 A0,0 0 0 0 757.66,921.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1299.6097,921.1383 L1299.6097,931.1383 L1309.6097,931.1383 L1299.6097,921.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7822" x="763.66" y="938.7066">Product price history and future price support.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="763.66" y="954.0172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4893" x="763.66" y="969.3277">price is in ProductPrice.currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="530.9497" x="763.66" y="984.6383">priceBase is in Store.baseCurrency using the exchange rate at creation/update time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="763.66" y="999.9488">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.6792" x="763.66" y="1015.2594">Suggested rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.3755" x="763.66" y="1030.5699">- regular = default catalog price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4956" x="763.66" y="1045.8805">- sale = promotional price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2236" x="763.66" y="1061.191">- wholesale = wholesale price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.5371" x="763.66" y="1076.5016">- custom = manual/special price list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="763.66" y="1091.8121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.1768" x="763.66" y="1107.1227">Only one active price interval should overlap for the same:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0679" x="763.66" y="1122.4332">(store_id, product_id, type, currency_id).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="763.66" y="1137.7438">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.1724" x="763.66" y="1153.0543">OrderEntry.unitPrice remains the final price snapshot used in a specific order.</text></g><g class="entity" data-qualified-name="GMN63" data-source-line="259" id="ent0064"><path d="M2456.11,250.9583 L2456.11,398.7532 L2881.1574,398.7532 L2881.1574,260.9583 L2871.1574,250.9583 L2456.11,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2871.1574,250.9583 L2871.1574,260.9583 L2881.1574,260.9583 L2871.1574,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.3809" x="2462.11" y="268.5266">Product/category discount rules define which percent discounts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.1958" x="2462.11" y="283.8372">can be selected in sales order rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2462.11" y="299.1477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.0474" x="2462.11" y="314.4583">isDefault means the rule is auto-selected when a new order row</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.4409" x="2462.11" y="329.7688">matches it. If several defaults match, product target wins over</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3062" x="2462.11" y="345.0794">category target; closer category wins over ancestor category;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.1631" x="2462.11" y="360.3899">for equal specificity the higher percent wins.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2462.11" y="375.7005">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.9126" x="2462.11" y="391.011">percent must be &gt; 0 and &lt;= 100.</text></g><g class="entity" data-qualified-name="GMN66" data-source-line="271" id="ent0067"><path d="M1827.39,997.6983 L1827.39,1036.8783 L1792.58,1040.8783 L1827.39,1044.8783 L1827.39,1084.251 A0,0 0 0 0 1827.39,1084.251 L2293.8749,1084.251 A0,0 0 0 0 2293.8749,1084.251 L2293.8749,1007.6983 L2283.8749,997.6983 L1827.39,997.6983 A0,0 0 0 0 1827.39,997.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2283.8749,997.6983 L2283.8749,1007.6983 L2293.8749,1007.6983 L2283.8749,997.6983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5654" x="1833.39" y="1015.2666">Exactly one target is filled:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.5601" x="1833.39" y="1030.5772">- targetType=product requires product and no category.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.4478" x="1833.39" y="1045.8877">- targetType=category requires category and no product.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1833.39" y="1061.1983">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.4849" x="1833.39" y="1076.5088">Category targets include descendants when includeDescendants=true.</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="279" id="ent0070"><path d="M1574.35,250.9583 L1574.35,398.7532 L2026.9208,398.7532 L2026.9208,260.9583 L2016.9208,250.9583 L1574.35,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2016.9208,250.9583 L2016.9208,260.9583 L2026.9208,260.9583 L2016.9208,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1580.35" y="268.5266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.2271" x="1580.35" y="283.8372">(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1580.35" y="299.1477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.5708" x="1580.35" y="314.4583">precision defines how many decimal places are allowed for this unit.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.2573" x="1580.35" y="329.7688">Examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.689" x="1580.35" y="345.0794">&#1096;&#1090; -&gt; 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.0327" x="1580.35" y="360.3899">&#1082;&#1075; -&gt; 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.7417" x="1580.35" y="375.7005">&#1084; -&gt; 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.9619" x="1580.35" y="391.011">&#1084;2 -&gt; 3</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="291" id="ent0073"><path d="M3518.95,1020.6583 L3518.95,1036.8783 L3484.4,1040.8783 L3518.95,1044.8783 L3518.95,1061.2794 A0,0 0 0 0 3518.95,1061.2794 L3804.3172,1061.2794 A0,0 0 0 0 3804.3172,1061.2794 L3804.3172,1030.6583 L3794.3172,1020.6583 L3518.95,1020.6583 A0,0 0 0 0 3518.95,1020.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3794.3172,1020.6583 L3794.3172,1030.6583 L3804.3172,1030.6583 L3794.3172,1020.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="3524.95" y="1038.2266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3672" x="3524.95" y="1053.5372">(product_id, product_parameter_name_id)</text></g><!--link Store to Category--><g class="link" data-entity-1="ent0017" data-entity-2="ent0006" data-link-type="crowfoot" data-source-line="167" id="lnk18"><path codeLine="167" d="M796.73,119.9883 C796.73,153.1283 796.73,204.8783 796.73,204.8783 C796.73,204.8783 1070.31,204.8783 1241.73,204.8783" fill="
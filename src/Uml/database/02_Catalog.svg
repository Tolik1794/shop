e:#181818;stroke-width:0.5;"/><path d="M1664.1587,600.7783 L1664.1587,610.7783 L1674.1587,610.7783 L1664.1587,600.7783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1200.02" y="618.3466">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.2271" x="1200.02" y="633.6572">(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1200.02" y="648.9677">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.5024" x="1200.02" y="664.2783">unit is a reference to Unit to avoid inconsistent text values like:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.7896" x="1200.02" y="679.5888">&#1096;&#1090;, &#1096;&#1090;., &#1096;&#1090;&#1091;&#1082;, pcs.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1200.02" y="694.8994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.7988" x="1200.02" y="710.2099">baseSalePrice is recommended to be stored in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.1387" x="1200.02" y="725.5205">It is a denormalized quick access value for the current regular sale price.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2686" x="1200.02" y="740.831">ProductPrice stores price history and special price types.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="187" id="ent0048"><path d="M1709.43,547.1883 L1709.43,569.8783 L1159.08,573.8783 L1709.43,577.8783 L1709.43,802.157 A0,0 0 0 0 1709.43,802.157 L2412.7396,802.157 A0,0 0 0 0 2412.7396,802.157 L2412.7396,557.1883 L2402.7396,547.1883 L1709.43,547.1883 A0,0 0 0 0 1709.43,547.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2402.7396,547.1883 L2402.7396,557.1883 L2412.7396,557.1883 L2402.7396,547.1883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.6821" x="1715.43" y="564.7566">Product is used as a universal stock/catalog item:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.5688" x="1715.43" y="580.0672">- material: purchased and consumed in production</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.0542" x="1715.43" y="595.3777">- finished_product: manufactured and sold</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.8203" x="1715.43" y="610.6883">- resale_product: purchased and sold without manufacturing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.5859" x="1715.43" y="625.9988">- semi_finished_product: produced and later consumed/finished</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="511.9131" x="1715.43" y="641.3094">- service: can be sold, but usually should not create WarehouseStock movements</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1715.43" y="656.6199">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4751" x="1715.43" y="671.9305">Recommended flag rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="479.9209" x="1715.43" y="687.241">material: canBePurchased=true, canBeSold=false, canBeManufactured=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.3291" x="1715.43" y="702.5516">finished_product: canBeSold=true, canBeManufactured=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="517.5181" x="1715.43" y="717.8621">resale_product: canBePurchased=true, canBeSold=true, canBeManufactured=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="682.3096" x="1715.43" y="733.1727">semi_finished_product: canBeManufactured=true and canBePurchased/canBeSold depends on business case</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.2681" x="1715.43" y="748.4832">service: canBeSold=true, but should normally not be stocked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1715.43" y="763.7938">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.0356" x="1715.43" y="779.1043">Avoid splitting Product/Material/Item at this stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.0366" x="1715.43" y="794.4148">Use productKind + flags to control behavior in forms and business rules.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="206" id="ent0051"><path d="M719.11,921.1383 L719.11,1036.8783 L684.14,1040.8783 L719.11,1044.8783 L719.11,1160.7965 A0,0 0 0 0 719.11,1160.7965 L1271.0597,1160.7965 A0,0 0 0 0 1271.0597,1160.7965 L1271.0597,931.1383 L1261.0597,921.1383 L719.11,921.1383 A0,0 0 0 0 719.11,921.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1261.0597,921.1383 L1261.0597,931.1383 L1271.0597,931.1383 L1261.0597,921.1383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7822" x="725.11" y="938.7066">Product price history and future price support.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="725.11" y="954.0172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4893" x="725.11" y="969.3277">price is in ProductPrice.currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="530.9497" x="725.11" y="984.6383">priceBase is in Store.baseCurrency using the exchange rate at creation/update time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="725.11" y="999.9488">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.6792" x="725.11" y="1015.2594">Suggested rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.3755" x="725.11" y="1030.5699">- regular = default catalog price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.4956" x="725.11" y="1045.8805">- sale = promotional price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2236" x="725.11" y="1061.191">- wholesale = wholesale price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.5371" x="725.11" y="1076.5016">- custom = manual/special price list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="725.11" y="1091.8121">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.1768" x="725.11" y="1107.1227">Only one active price interval should overlap for the same:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.0679" x="725.11" y="1122.4332">(store_id, product_id, type, currency_id).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="725.11" y="1137.7438">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="490.1724" x="725.11" y="1153.0543">OrderEntry.unitPrice remains the final price snapshot used in a specific order.</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="224" id="ent0054"><path d="M1659.8,250.9583 L1659.8,398.7532 L2112.3708,398.7532 L2112.3708,260.9583 L2102.3708,250.9583 L1659.8,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2102.3708,250.9583 L2102.3708,260.9583 L2112.3708,260.9583 L2102.3708,250.9583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="1665.8" y="268.5266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.2271" x="1665.8" y="283.8372">(store_id, code)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1665.8" y="299.1477">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.5708" x="1665.8" y="314.4583">precision defines how many decimal places are allowed for this unit.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.2573" x="1665.8" y="329.7688">Examples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.689" x="1665.8" y="345.0794">&#1096;&#1090; -&gt; 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.0327" x="1665.8" y="360.3899">&#1082;&#1075; -&gt; 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.7417" x="1665.8" y="375.7005">&#1084; -&gt; 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.9619" x="1665.8" y="391.011">&#1084;2 -&gt; 3</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="236" id="ent0057"><path d="M2544.41,1020.6583 L2544.41,1036.8783 L2509.85,1040.8783 L2544.41,1044.8783 L2544.41,1061.2794 A0,0 0 0 0 2544.41,1061.2794 L2829.7772,1061.2794 A0,0 0 0 0 2829.7772,1061.2794 L2829.7772,1030.6583 L2819.7772,1020.6583 L2544.41,1020.6583 A0,0 0 0 0 2544.41,1020.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2819.7772,1020.6583 L2819.7772,1030.6583 L2829.7772,1030.6583 L2819.7772,1020.6583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.439" x="2550.41" y="1038.2266">Unique:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.3672" x="2550.41" y="1053.5372">(product_id, product_parameter_name_id)</text></g><!--link Store to Category--><g class="link" data-entity-1="ent0014" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="138" id="lnk15"><path codeLine="138" d="M524.09,119.9883 C524.09,153.1283 524.09,204.8783 524.09,204.8783 C524.09,204.8783 720.3,204.8783 861.92,204.8783" fill="none" id="Store-Category" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="520.09" x2="528.09" y1="115.9883" y2="115.9883"/><line style="stroke:#181818;stroke-width:1;" x1="520.09" x2="528.09" y1="118.9883" y2="118.9883"/><line style="stroke:#181818;stroke-width:1;" x1="524.09" x2="524.09" y1="119.9883" y2="111.9883"/><line style="stroke:#181818;stroke-width:1;" x1="871.92" x2="879.92" y1="204.8783" y2="198.8783"/><line style="stroke:#181818;stroke
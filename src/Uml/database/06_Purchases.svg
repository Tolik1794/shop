house</text><line style="stroke:#181818;stroke-width:0.5;" x1="218.11" x2="296.2594" y1="519.7166" y2="519.7166"/><line style="stroke:#181818;stroke-width:0.5;" x1="218.11" x2="296.2594" y1="527.7166" y2="527.7166"/></g><!--class WarehouseStockBatch--><g class="entity" data-qualified-name="WarehouseStockBatch" data-source-line="89" id="ent0023"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="153.7588" x="31.31" y="1225.8283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7588" x="34.31" y="1244.3634">WarehouseStockBatch</text><line style="stroke:#181818;stroke-width:0.5;" x1="32.31" x2="184.0688" y1="1252.3166" y2="1252.3166"/><line style="stroke:#181818;stroke-width:0.5;" x1="32.31" x2="184.0688" y1="1260.3166" y2="1260.3166"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="90" id="ent0025"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="219.65" y="1225.8283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="222.65" y="1244.3634">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="220.65" x2="385.7252" y1="1252.3166" y2="1252.3166"/><line style="stroke:#181818;stroke-width:0.5;" x1="220.65" x2="385.7252" y1="1260.3166" y2="1260.3166"/></g><g class="entity" data-qualified-name="GMN27" data-source-line="93" id="ent0028"><path d="M1407.53,448.2283 L1407.53,510.3183 L1373.34,514.3183 L1407.53,518.3183 L1407.53,580.7127 A0,0 0 0 0 1407.53,580.7127 L2114.8386,580.7127 A0,0 0 0 0 2114.8386,580.7127 L2114.8386,458.2283 L2104.8386,448.2283 L1407.53,448.2283 A0,0 0 0 0 1407.53,448.2283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2104.8386,448.2283 L2104.8386,458.2283 L2114.8386,458.2283 L2104.8386,448.2283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.4536" x="1413.53" y="465.7966">Supplier is optional to allow quick/manual purchases.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="1413.53" y="481.1072">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1413.53" y="496.4177">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="686.3086" x="1413.53" y="511.7283">supplierNameSnapshot/supplierPhoneSnapshot/supplierEmailSnapshot store supplier data at purchase time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1413.53" y="527.0388">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.0449" x="1413.53" y="542.3494">currency stores the original purchase currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="513.5635" x="1413.53" y="557.6599">exchangeRateToBase is a snapshot: 1 purchase currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.8398" x="1413.53" y="572.9705">totalAmount/deliveryCost are in original currency; *Base fields are in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="104" id="ent0031"><path d="M509.74,88.4083 L509.74,127.3183 L474.68,131.3183 L509.74,135.3183 L509.74,174.961 A0,0 0 0 0 509.74,174.961 L1000.6443,174.961 A0,0 0 0 0 1000.6443,174.961 L1000.6443,98.4083 L990.6443,88.4083 L509.74,88.4083 A0,0 0 0 0 509.74,88.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M990.6443,88.4083 L990.6443,98.4083 L1000.6443,98.4083 L990.6443,88.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.522" x="515.74" y="105.9766">Recommended purchase flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.5269" x="515.74" y="121.2872">draft -&gt; ordered -&gt; partially_received -&gt; received -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="515.74" y="136.5977">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.9043" x="515.74" y="151.9083">partially_returned/returned are used when goods are returned to supplier.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.4224" x="515.74" y="167.2188">canceled is for purchases stopped before they are completed.</text></g><g class="entity" data-qualified-name="GMN33" data-source-line="112" id="ent0034"><path d="M372.74,883.4283 L372.74,984.3183 L337.66,988.3183 L372.74,992.3183 L372.74,1092.4654 A0,0 0 0 0 372.74,1092.4654 L1167.6399,1092.4654 A0,0 0 0 0 1167.6399,1092.4654 L1167.6399,893.4283 L1157.6399,883.4283 L372.74,883.4283 A0,0 0 0 0 372.74,883.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1157.6399,883.4283 L1157.6399,893.4283 L1167.6399,893.4283 L1157.6399,883.4283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.4009" x="378.74" y="900.9966">Purchase line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="773.8999" x="378.74" y="916.3072">Stores snapshot of product name, code, unit code/name, quantity, unit cost, delivery cost and optional planned sale price.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="625.5234" x="378.74" y="931.6177">Monetary fields without Base suffix are in Purchase.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="378.74" y="946.9283">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.792" x="378.74" y="962.2388">receivedQuantity and returnedQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="378.74" y="977.5494">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="378.74" y="992.8599">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="378.74" y="1008.1705">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.4497" x="378.74" y="1023.481">Partial receipts are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="532.3208" x="378.74" y="1038.7916">one PurchaseEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="633.8071" x="378.74" y="1054.1021">Open quantity = quantity - receivedQuantity + returnedQuantity, depending on final business rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="378.74" y="1069.4127">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="617.0493" x="378.74" y="1084.7232">InventoryDocumentLine and WarehouseStockBatch are created when purchase is posted/received.</text></g><!--link Store to Purchase--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="79" id="lnk7"><path codeLine="79" d="M1234.19,161.3583 C1234.19,187.6183 1234.19,208.8083 1234.19,260.5983" fill="none" id="Store-Purchase" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1230.19" x2="1238.19" y1="157.3583" y2="157.3583"/><line style="stroke:#181818;stroke-width:1;" x1="1230.19" x2="1238.19" y1="160.3583" y2="160.3583"/><line style="stroke:#181818;stroke-width:1;" x1="1234.19" x2="1234.19" y1="161.3583" y2="153.3583"/><line style="stroke:#181818;stroke-width:1;" x1="1234.19" x2="1240.19" y1="270.5983" y2="278.5983"/><line style="stroke:#181818;stroke-width:1;" x1="1234.19" x2="1228.19" y1="270.5983" y2="278.5983"/><line style="stroke:#181818;stroke-width:1;" x1="1234.19" x2="1234.19" y1="270.5983" y2="278.5983"/><ellipse cx="1234.19" cy="264.5983" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.1318" x="1188.19" y="212.5466">creates</text></g><!--link Currency to Purchase--><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="80" id="lnk9"><path codeLine="80" d="M1323.19,161.3583 C1323.19,187.6183 1323.19,208.8083 1323.19,260.5983" fill="none" id="Currency-Purchase" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1319.19" x2="1327.19" y1="157.3583" y2="157.3583"/><line style="stroke:#181818;stroke-width:1;" x1="1319.19" x2="1327.19" y1="160.3583" y2="160.3583"/><line style="stroke:#181818;stroke-width:1;" x1="1323.19" x2="1323.19" y1="161
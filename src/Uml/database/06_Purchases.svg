entity" data-qualified-name="Product" data-source-line="89" id="ent0021"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="57.9736" x="124.2" y="501.4783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.9736" x="127.2" y="520.0134">Product</text><line style="stroke:#181818;stroke-width:0.5;" x1="125.2" x2="181.1736" y1="527.9666" y2="527.9666"/><line style="stroke:#181818;stroke-width:0.5;" x1="125.2" x2="181.1736" y1="535.9666" y2="535.9666"/></g><!--class Warehouse--><g class="entity" data-qualified-name="Warehouse" data-source-line="90" id="ent0023"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="80.1494" x="217.11" y="501.4783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.1494" x="220.11" y="520.0134">Warehouse</text><line style="stroke:#181818;stroke-width:0.5;" x1="218.11" x2="296.2594" y1="527.9666" y2="527.9666"/><line style="stroke:#181818;stroke-width:0.5;" x1="218.11" x2="296.2594" y1="535.9666" y2="535.9666"/></g><!--class WarehouseStockBatch--><g class="entity" data-qualified-name="WarehouseStockBatch" data-source-line="91" id="ent0025"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="153.7588" x="31.31" y="1242.3183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7588" x="34.31" y="1260.8534">WarehouseStockBatch</text><line style="stroke:#181818;stroke-width:0.5;" x1="32.31" x2="184.0688" y1="1268.8066" y2="1268.8066"/><line style="stroke:#181818;stroke-width:0.5;" x1="32.31" x2="184.0688" y1="1276.8066" y2="1276.8066"/></g><!--class InventoryDocumentLine--><g class="entity" data-qualified-name="InventoryDocumentLine" data-source-line="92" id="ent0027"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.0752" x="219.65" y="1242.3183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0752" x="222.65" y="1260.8534">InventoryDocumentLine</text><line style="stroke:#181818;stroke-width:0.5;" x1="220.65" x2="385.7252" y1="1268.8066" y2="1268.8066"/><line style="stroke:#181818;stroke-width:0.5;" x1="220.65" x2="385.7252" y1="1276.8066" y2="1276.8066"/></g><g class="entity" data-qualified-name="GMN29" data-source-line="95" id="ent0030"><path d="M1798.53,448.8183 L1798.53,518.8083 L1764.34,522.8083 L1798.53,526.8083 L1798.53,596.6132 A0,0 0 0 0 1798.53,596.6132 L2505.8386,596.6132 A0,0 0 0 0 2505.8386,596.6132 L2505.8386,458.8183 L2495.8386,448.8183 L1798.53,448.8183 A0,0 0 0 0 1798.53,448.8183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2495.8386,448.8183 L2495.8386,458.8183 L2505.8386,458.8183 L2495.8386,448.8183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.4536" x="1804.53" y="466.3866">Supplier is optional to allow quick/manual purchases.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="470.1265" x="1804.53" y="481.6972">createdBy/updatedBy/canceledBy are audit fields for admin accountability.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0039" x="1804.53" y="497.0077">canceledAt should be filled when status becomes canceled.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="686.3086" x="1804.53" y="512.3183">supplierNameSnapshot/supplierPhoneSnapshot/supplierEmailSnapshot store supplier data at purchase time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1804.53" y="527.6288">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.0449" x="1804.53" y="542.9394">currency stores the original purchase currency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="513.5635" x="1804.53" y="558.2499">exchangeRateToBase is a snapshot: 1 purchase currency = X Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="564.8398" x="1804.53" y="573.5605">totalAmount/deliveryCost are in original currency; *Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="524.3228" x="1804.53" y="588.871">The visible admin history merges status history with linked PaymentHistory events.</text></g><g class="entity" data-qualified-name="GMN32" data-source-line="107" id="ent0033"><path d="M1349.24,976.4683 L1349.24,1000.8083 L1314.52,1004.8083 L1349.24,1008.8083 L1349.24,1032.3999 A0,0 0 0 0 1349.24,1032.3999 L1925.1331,1032.3999 A0,0 0 0 0 1925.1331,1032.3999 L1925.1331,986.4683 L1915.1331,976.4683 L1349.24,976.4683 A0,0 0 0 0 1349.24,976.4683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1915.1331,976.4683 L1915.1331,986.4683 L1925.1331,986.4683 L1915.1331,976.4683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.8096" x="1355.24" y="994.0366">PaymentHistory rows are append-only financial timeline events.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="554.8931" x="1355.24" y="1009.3472">They are displayed together with purchase status history in the purchase admin history,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.04" x="1355.24" y="1024.6577">but Payment remains the financial source of truth.</text></g><g class="entity" data-qualified-name="GMN35" data-source-line="113" id="ent0036"><path d="M900.74,88.4083 L900.74,127.8083 L865.68,131.8083 L900.74,135.8083 L900.74,174.961 A0,0 0 0 0 900.74,174.961 L1391.6443,174.961 A0,0 0 0 0 1391.6443,174.961 L1391.6443,98.4083 L1381.6443,88.4083 L900.74,88.4083 A0,0 0 0 0 900.74,88.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1381.6443,88.4083 L1381.6443,98.4083 L1391.6443,98.4083 L1381.6443,88.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.522" x="906.74" y="105.9766">Recommended purchase flow:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.5269" x="906.74" y="121.2872">draft -&gt; ordered -&gt; partially_received -&gt; received -&gt; completed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="906.74" y="136.5977">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.9043" x="906.74" y="151.9083">partially_returned/returned are used when goods are returned to supplier.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.4224" x="906.74" y="167.2188">canceled is for purchases stopped before they are completed.</text></g><g class="entity" data-qualified-name="GMN38" data-source-line="121" id="ent0039"><path d="M372.74,899.9183 L372.74,1000.8083 L337.66,1004.8083 L372.74,1008.8083 L372.74,1108.9554 A0,0 0 0 0 372.74,1108.9554 L1167.6399,1108.9554 A0,0 0 0 0 1167.6399,1108.9554 L1167.6399,909.9183 L1157.6399,899.9183 L372.74,899.9183 A0,0 0 0 0 372.74,899.9183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1157.6399,899.9183 L1157.6399,909.9183 L1167.6399,909.9183 L1157.6399,899.9183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.4009" x="378.74" y="917.4866">Purchase line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="773.8999" x="378.74" y="932.7972">Stores snapshot of product name, code, unit code/name, quantity, unit cost, delivery cost and optional planned sale price.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="625.5234" x="378.74" y="948.1077">Monetary fields without Base suffix are in Purchase.currency. Base fields are in Store.baseCurrency.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="378.74" y="963.4183">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.792" x="378.74" y="978.7288">receivedQuantity and returnedQuantity are denormalized progress/cache fields</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="584.1113" x="378.74" y="994.0394">for fast UI and filtering. Source of truth is InventoryDocumentLine + posted StockMovement.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="500.7412" x="378.74" y="1009.3499">If cache becomes inconsistent, recalculate it from posted inventory documents.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="378.74" y="1024.6605">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.4497" x="378.74" y="1039.971">Partial receipts are allowed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="532.3208" x="378.74" y="1055.2816">one PurchaseEntry can be linked to multiple InventoryDocumentLine rows over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="633.8071" x="378.74" y="1070.5921">Open quantity = quantity - receivedQuantity + returnedQuantity, depending on final business rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="378.74" y="1085.9027">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="617.0493" x="378.74" y="1101.2132">InventoryDocumentLine and WarehouseStockBatch are created when purchase is posted/received.</text></g><!--link Store to Purchase--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="80" id="lnk7"><path codeLine="80" d="M1625.19,161.2683 C1625.19,187.4483 1625.19,208.5783 1625.19,260.6183" fill="none" id="Store-Purchase" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1621.19" x2="1629.19" y1="157.2683" y2="157.2683"/><line style="stroke:#181818;stroke-width:1;" x1="1621.19" x2="1629.19" y1="160.2683" y2="160.2683"/><line style="stroke:#181818;stroke-width:1;" x1="1625.19" x2="1625.19" y1="161.2683" y2="153.2683"/><line style="stroke:#181818;stroke-width:1;" x1="1625.19" x2="1631.19" y1="270.6183" y2="278.6183"/><line style="stroke:#181818;stroke-width:1;" x1="1625.19" x2="1619.19" y1="270.6183" y2="278.6183"/><line style="stroke:#181818;stroke-width:1;" x1="1625.19" x2="1625.19" y1="270.6183" y2="278.6183"/><ellipse cx="1625.19" cy="264.6183" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.1318" x="1579.19" y="212.5066">creates</text></g><!--link Currency to Purchase--><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" data-link-type="crowfoot" data-source-line="81" id="lnk9"><path codeLine="81" d="M1714.19,161.2683 C1714.19,187.4483 1714.19,208.5783 1714.19,260.6183" fill="none" id="
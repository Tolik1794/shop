ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="101.2383" x="495.95" y="435.5183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.2383" x="498.95" y="454.0534">PurchaseEntry</text><line style="stroke:#181818;stroke-width:0.5;" x1="496.95" x2="596.1883" y1="462.0066" y2="462.0066"/><line style="stroke:#181818;stroke-width:0.5;" x1="496.95" x2="596.1883" y1="470.0066" y2="470.0066"/></g><g class="entity" data-qualified-name="GMN32" data-source-line="93" id="ent0033"><path d="M933.87,359.8983 L933.87,452.9183 L899.2,456.9183 L933.87,460.9183 L933.87,553.6248 A0,0 0 0 0 933.87,553.6248 L1393.2709,553.6248 A0,0 0 0 0 1393.2709,553.6248 L1393.2709,369.8983 L1383.2709,359.8983 L933.87,359.8983 A0,0 0 0 0 933.87,359.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1383.2709,359.8983 L1383.2709,369.8983 L1393.2709,369.8983 L1383.2709,359.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="939.87" y="377.4666">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.77" x="939.87" y="392.7772">- InventoryDocument is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.77" x="939.87" y="408.0877">- InventoryDocumentLine is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.7695" x="939.87" y="423.3983">- StockMovement is not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3887" x="939.87" y="438.7088">- WarehouseStock exists, but stock changes are still manual.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="939.87" y="454.0194">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="939.87" y="469.3299">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.583" x="939.87" y="484.6405">- Draft document does not affect stock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.4009" x="939.87" y="499.951">- Posting creates StockMovement rows and updates WarehouseStock.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.5225" x="939.87" y="515.2616">- Canceling reverses movements or creates reversal movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.0142" x="939.87" y="530.5721">- Document lines are the source of stock changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.2715" x="939.87" y="545.8827">- WarehouseStock quantities are cached state.</text></g><g class="entity" data-qualified-name="GMN35" data-source-line="108" id="ent0036"><path d="M697.48,941.1683 L697.48,1058.3421 L1131.6553,1058.3421 L1131.6553,951.1683 L1121.6553,941.1683 L697.48,941.1683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1121.6553,941.1683 L1121.6553,951.1683 L1131.6553,951.1683 L1121.6553,941.1683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="703.48" y="958.7366">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.1826" x="703.48" y="974.0472">- Movement is append-only after posting.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.1304" x="703.48" y="989.3577">- OUT movement cannot make quantityOnHand negative,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.4277" x="711.7066" y="1004.6683">except if a future explicit backorder rule allows it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.1753" x="703.48" y="1019.9788">- average_cost method recalculates WarehouseStock.averageCost</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.9609" x="711.7066" y="1035.2894">on incoming movements.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4067" x="703.48" y="1050.5999">- unitCost is always in Store.baseCurrency.</text></g><g class="entity" data-qualified-name="GMN38" data-source-line="118" id="ent0039"><path d="M728.42,1146.9483 L728.42,1401.917 L1100.7247,1401.917 L1100.7247,1156.9483 L1090.7247,1146.9483 L728.42,1146.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1090.7247,1146.9483 L1090.7247,1156.9483 L1100.7247,1156.9483 L1090.7247,1146.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="734.42" y="1164.5166">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="734.42" y="1179.8272">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.373" x="734.42" y="1195.1377">1. Add InventoryDocument, InventoryDocumentLine,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.9648" x="746.7598" y="1210.4483">StockMovement and InventoryReason entities/enums.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.3608" x="734.42" y="1225.7588">2. Add InventoryPostingService:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.8789" x="746.7598" y="1241.0694">post(document), cancel(document).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.9487" x="734.42" y="1256.3799">3. Implement initial_stock and stock_adjustment first.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.0005" x="734.42" y="1271.6905">4. Add purchase_receipt from PurchaseEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.9556" x="734.42" y="1287.001">5. Add sale_shipment from OrderEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.4258" x="734.42" y="1302.3116">6. Add tests for:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.7881" x="746.7598" y="1317.6221">non-negative stock,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.9653" x="746.7598" y="1332.9327">average cost recalculation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.8799" x="746.7598" y="1348.2432">movement immutability,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.9268" x="746.7598" y="1363.5538">document canceling.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="734.42" y="1378.8643">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.1021" x="734.42" y="1394.1748">This is the central stock module.</text></g><!--link Store to InventoryDocument--><g class="link" data-entity-1="ent0009" data-entity-2="ent0005" data-link-type="crowfoot" data-source-line="77" id="lnk10"><path codeLine="77" d="M687.57,186.0183 C687.57,217.6283 687.57,252.9383 687.57,310.0383" fill="none" id="Store-InventoryDocument" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="683.57" x2="691.57" y1="182.0183" y2="182.0183"/><line style="stroke:#181818;stroke-width:1;" x1="683.57" x2="691.57" y1="185.0183" y2="185.0183"/><line style="stroke:#181818;stroke-width:1;" x1="687.57" x2="687.57" y1="186.0183" y2="178.0183"/><line style="stroke:#181818;stroke-width:1;" x1="687.57" x2="693.57" y1="320.0383" y2="328.0383"/><line style="stroke:#181818;stroke-width:1;" x1="687.57" x2="681.57" y1="320.0383" y2="328.0383"/><line style="stroke:#181818;stroke-width:1;" x1="687.57" x2="687.57" y1="320.0383" y2="328.0383"/><ellipse cx="687.57" cy="314.0383" fill="none" rx="4" ry="4" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="654.57" y="249.5966">owns</text></g><!--link InventoryDocument to InventoryDocumentLine--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="crowfoot" data-source-line="78" id="lnk11"><path codeLine="78" d="M645.54,593.6283 C645.54,639.9183 645.54,672.9183 645.54,672.9183 C645.54,672.9183 619.52,672.9183 570.5,672.9183" fill="none" id="InventoryDocument-InventoryDocumentLine" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="641.54" x2="649.54" y1="589.6283" y2="589.6283"/><line style="stroke:#181818;stroke-width:1;" x1="641.54" x2="649.54" y1="592.6283" y2="592.6283"/><line style="stroke:#181818;stroke-width:1;" x1="645.54" x2="645.54" y1="593.6283" y2="585.6283"/><line style="stroke:#181818;stroke-width:1;" x1="560.5" x2="552.5" y1="672.9183" y2="678.9183"/><line style="stroke:#181818;stroke-width:1;" x1="560.5" x2="552.5" y1="672.9183" y2="666.9183"/><line style="stroke:#181818;stroke-width:1;" x1="560.5
nt-size="14" lengthAdjust="spacing" textLength="178.2744" x="591.23" y="1445.3463">RecalculateProgressAction</text><line style="stroke:#181818;stroke-width:0.5;" x1="589.23" x2="771.5044" y1="1453.2994" y2="1453.2994"/><line style="stroke:#181818;stroke-width:0.5;" x1="589.23" x2="771.5044" y1="1461.2994" y2="1461.2994"/></g><!--class Order--><g class="entity" data-qualified-name="Order" data-source-line="86" id="ent0025"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="44.9443" x="1941.9" y="414.9883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.9443" x="1944.9" y="433.5234">Order</text><line style="stroke:#181818;stroke-width:0.5;" x1="1942.9" x2="1985.8443" y1="441.4766" y2="441.4766"/><line style="stroke:#181818;stroke-width:0.5;" x1="1942.9" x2="1985.8443" y1="449.4766" y2="449.4766"/></g><!--class Purchase--><g class="entity" data-qualified-name="Purchase" data-source-line="87" id="ent0027"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="66.6826" x="2022.03" y="414.9883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6826" x="2025.03" y="433.5234">Purchase</text><line style="stroke:#181818;stroke-width:0.5;" x1="2023.03" x2="2087.7126" y1="441.4766" y2="441.4766"/><line style="stroke:#181818;stroke-width:0.5;" x1="2023.03" x2="2087.7126" y1="449.4766" y2="449.4766"/></g><!--class InventoryDocument--><g class="entity" data-qualified-name="InventoryDocument" data-source-line="88" id="ent0029"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="139.0752" x="2123.83" y="414.9883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0752" x="2126.83" y="433.5234">InventoryDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="2124.83" x2="2261.9052" y1="441.4766" y2="441.4766"/><line style="stroke:#181818;stroke-width:0.5;" x1="2124.83" x2="2261.9052" y1="449.4766" y2="449.4766"/></g><!--class ProductionOrder--><g class="entity" data-qualified-name="ProductionOrder" data-source-line="89" id="ent0031"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="118.2529" x="2298.24" y="414.9883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2529" x="2301.24" y="433.5234">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="2299.24" x2="2415.4929" y1="441.4766" y2="441.4766"/><line style="stroke:#181818;stroke-width:0.5;" x1="2299.24" x2="2415.4929" y1="449.4766" y2="449.4766"/></g><g class="entity" data-qualified-name="GMN58" data-source-line="123" id="ent0059"><path d="M1539.7,43.4883 L1539.7,167.1583 L1504.96,171.1583 L1539.7,175.1583 L1539.7,298.457 A0,0 0 0 0 1539.7,298.457 L1959.0345,298.457 A0,0 0 0 0 1959.0345,298.457 L1959.0345,53.4883 L1949.0345,43.4883 L1539.7,43.4883 A0,0 0 0 0 1539.7,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1949.0345,43.4883 L1949.0345,53.4883 L1959.0345,53.4883 L1949.0345,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.7065" x="1545.7" y="61.0566">Stable orchestration core.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1545.7" y="76.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.7686" x="1545.7" y="91.6777">Responsibilities:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.3071" x="1545.7" y="106.9883">1. Resolve workflow definition by subject.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7979" x="1545.7" y="122.2988">2. Resolve transition by key.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8452" x="1545.7" y="137.6094">3. Check current status is allowed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.188" x="1545.7" y="152.9199">4. Run guard pipeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4414" x="1545.7" y="168.2305">5. Run before-actions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5571" x="1545.7" y="183.541">6. Change status.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.0728" x="1545.7" y="198.8516">7. Run after-actions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.208" x="1545.7" y="214.1621">8. Delegate history recording.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.312" x="1545.7" y="229.4727">9. Dispatch domain event.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1545.7" y="244.7832">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.9302" x="1545.7" y="260.0938">It must not contain entity-specific if/else branches.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.3345" x="1545.7" y="275.4043">New entities and new transitions are added through definitions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.5371" x="1545.7" y="290.7148">and handlers, not by editing this service.</text></g><g class="entity" data-qualified-name="GMN61" data-source-line="142" id="ent0062"><path d="M2754.49,801.5783 L2754.49,926.0627 L856.77,930.1583 L2754.49,934.0627 L2754.49,934.0627 A0,0 0 0 0 2754.49,934.0627 L3196.2444,934.0627 A0,0 0 0 0 3196.2444,934.0627 L3196.2444,811.5783 L3186.2444,801.5783 L2754.49,801.5783 A0,0 0 0 0 2754.49,801.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3186.2444,801.5783 L3186.2444,811.5783 L3196.2444,811.5783 L3186.2444,801.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.5439" x="2760.49" y="819.1466">Use named transitions, not direct status assignment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2760.49" y="834.4572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.6304" x="2760.49" y="849.7677">Example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.103" x="2760.49" y="865.0783">- confirm: draft -&gt; confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.4473" x="2760.49" y="880.3888">- return_to_draft: confirmed -&gt; draft</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2760.49" y="895.6994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.5259" x="2760.49" y="911.0099">Forward and backward transitions are separate business rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.7544" x="2760.49" y="926.3205">A reverse transition is not automatically the mirror of forward one.</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="153" id="ent0065"><path d="M1651.78,574.0083 L1651.78,644.1583 L1616.99,648.1583 L1651.78,652.1583 L1651.78,721.8032 A0,0 0 0 0 1651.78,721.8032 L2018.9558,721.8032 A0,0 0 0 0 2018.9558,721.8032 L2018.9558,584.0083 L2008.9558,574.0083 L1651.78,574.0083 A0,0 0 0 0 1651.78,574.0083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2008.9558,574.0083 L2008.9558,584.0083 L2018.9558,584.0083 L2008.9558,574.0083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.876" x="1657.78" y="591.5766">Per-entity extension point.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1657.78" y="606.8872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.0396" x="1657.78" y="622.1977">A workflow definition owns:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.4917" x="1657.78" y="637.5083">- allowed transitions for one subject type</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.0015" x="1657.78" y="652.8188">- selected guards/actions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9141" x="1657.78" y="668.1294">- history recorder choice</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1657.78" y="683.4399">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.1758" x="1657.78" y="698.7505">Future entities plug in by adding a new definition class</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.3408" x="1657.78" y="714.061">and registering it in WorkflowRegistry.</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="165" id="ent0068"><path d="M2301.36,809.2383 L2301.36,926.4121 L2719.3678,926.4121 L2719.3678,819.2383 L2709.3678,809.2383 L2301.36,809.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2709.3678,809.2383 L2709.3678,819.2383 L2719.3678,819.2383 L2709.3678,809.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0225" x="2307.36" y="826.8066">History strategy extension point.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2307.36" y="842.1172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.0078" x="2307.36" y="857.4277">- OrderHistoryRecorder writes rich OrderHistory timeline rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5972" x="2307.36" y="872.7383">- GenericStatusHistoryRecorder writes StatusHistory rows</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.3462" x="2315.5866" y="888.0488">for Purchase, InventoryDocument and ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2307.36" y="903.3594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.9644" x="2307.36" y="918.6699">The core transition service does not know which table is used.</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="175" id="ent0071"><path d="M2337.94,1013.8383 L2337.94,1268.807 L2682.7974,1268.807 L2682.7974,1023.8383 L2672.7974,1013.8383 L2337.94,1013.8383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2672.7974,1013.8383 L2672.7974,1023.8383 L2682.7974,1023.8383 L2672.7974,1013.8383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.0786" x="2343.94" y="1031.4066">Execution pipeline:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2343.94" y="1046.7172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.2568" x="2343.94" y="1062.0277">apply(subject, transitionKey, context)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.0044" x="2352.1666" y="1077.3383">-&gt; workflowRegistry.getFor(subject)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.063" x="2352.1666" y="1092.6488">-&gt; definition.getTransition(transitionKey)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1279" x="2352.1666" y="1107.9594">-&gt; guards.assertAllowed(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0059" x="2352.1666" y="1123.2699">-&gt; begin transaction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.8472" x="2352.1666" y="1138.5805">-&gt; beforeActions.execute(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.6597" x="2352.1666" y="1153.891">-&gt; subject.setStatusValue(toStatus)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.4785" x="2352.1666" y="1169.2016">-&gt; afterActions.execute(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.167" x="2352.1666" y="1184.5121">-&gt; historyRecorder.record(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.5068" x="2352.1666" y="1199.8227">-&gt; commit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.166" x="2352.1666" y="1215.1332">-&gt; dispatch domain event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2343.94" y="1230.4438">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.8574" x="2343.94" y="1245.7543">can(...) runs the same resolution and guard checks,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.0259" x="2343.94" y="1261.0648">but never mutates the subject.</text></g><g class="entity" data-qualified-name="GMN73" data-source-line="194" id="ent0074"><path d="M2295.67,1328.8083 L2295.67,1553.1559 L2725.0719,1553.1559 L2725.0719,1338.8083 L2715.0719,1328.8083 L2295.67,1328.8083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2715.0719,1328.8083 L2715.0719,1338.8083 L2725.0719,1338.8083 L2715.0719,1328.8083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.0317" x="2301.67" y="1346.3766">Suggested implementation rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2301.67" y="1361.6872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.7275" x="2301.67" y="1376.9977">1. Prefer explicit handler classes over anonymous callbacks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.439" x="2314.0098" y="1392.3083">for business rules that matter.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.4019" x="2301.67" y="1407.6188">2. Builder/DSL may be used only to assemble definitions cleanly.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.7119" x="2301.67" y="1422.9294">3. Keep workflow definitions declarative;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.4404" x="2314.0098" y="1438.2399">put heavy business logic into guard/action services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.8115" x="2301.67" y="1453.5505">4. Keep transition keys stable once exposed to UI/API.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.52" x="2301.67" y="1468.861">5. Every direct status write outside the service should be treated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.6543" x="2314.0098" y="1484.1716">as a bug unless it is object construction/default initialization.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.7007" x="2301.67" y="1499.4821">6. Add tests at three levels:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3989" x="2314.0098" y="1514.7927">- definition graph tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.022" x="2314.0098" y="1530.1032">- guard/action unit tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.7329" x="2314.0098" y="1545.4138">- service integration tests with history assertions.</text></g><!--reverse link WorkflowSubjectInterface to Order--><g class="link" data-entity-1="ent0002" data-entity-2="ent0025" data-link-type="extension" data-source-line="86" id="lnk26"><path codeLine="86" d="M2006.31,235.1683 C2006.31,311.1383 2006.31,436.1583 2006.31,436.1583 C2006.31,436.1583 1997.09,436.1583 1987.3,436.1583" fill="none" id="WorkflowSubjectInterface-backto-Order" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="2006.31,217.1683,2000.31,235.1683,2012.31,235.1683,2006.31,217.1683" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link WorkflowSubjectInterface to Purchase--><g class="link" data-entity-1="ent0002" data-entity-2="ent0027" data-link-type="extension" data-source-line="87" id="lnk28"><path codeLine="87" d="M2055.37,235.1783 C2055.37,293.0683 2055.37,371.8683 2055.37,414.7083" fill="none" id="WorkflowSubjectInterface-backto-Purchase" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="2055.37,217.1783,2049.37,235.1783,2061.37,235.1783,2055.37,217.1783" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link WorkflowSubjectInterface to InventoryDocument--><g class="link" data-entity-1="ent0002" data-entity-2="ent0029" data-link-type="extension" data-source-line="88" id="lnk30"><path codeLine="88" d="M2189.45,235.1783 C2189.45,293.0683 2189.45,371.8683 2189.45,414.7083" fill="none" id="WorkflowSubjectInterface-backto-InventoryDocument" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="2189.45,217.1783,2183.45,235.1783,2195.45,235.1783,2189.45,217.1783" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link WorkflowSubjectInterface to ProductionOrder--><g class="link" data-entity-1="ent0002" data-entity-2="ent0031" data-link-type="extension" data-source-line="89" id="lnk32"><path codeLine="89" d="M2273.51,171.1583 C2326.49,171.1583 2357.37,171.1583 2357.37,171.1583 C2357.37,171.1583 2357.37,351.2283 2357.37,414.5383" fill="none" id="WorkflowSubjectInterface-backto-ProductionOrder" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="2255.51,171.1583,2273.51,177.1583,2273.51,165.1583,2255.51,171.1583" style="stroke:#181818;stroke-width:1;"/></g><!--link StatusTransitionService to WorkflowRegistry--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="91" id="lnk33"><path codeLine="91" d="M1356.54,216.2683 C1356.54,267.9083 1356.54,345.3583 1356.54,393.2483" fill="none" id="StatusTransitionService-to-WorkflowRegistry" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1356.54,399.2483,1360.54,390.2483,1356.54,394.2483,1352.54,390.2483,1356.54,399.2483" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.4756" x="1249.54" y="304.3266">resolve workflow</text></g><!--link StatusTransitionService to TransitionContext--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" data-link-type="dependency" data-source-line="92" id="lnk34"><path codeLine="92" d="M1153.09,215.9783 C1153.09,273.8983 1153.09,367.1583 1153.09,367.1583 C1153.09,367.1583 1108.64,367.1583 1055.23,367.1583" fill="none" id="StatusTransitionService-to-TransitionContext" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1049.23,367.1583,1058.23,371.1583,1054.23,367.1583,1058.23,363.1583,1049.23,367.1583" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.5645" x="1124.09" y="340.0766">uses</text></g><!--link StatusTransitionService to TransitionResult--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="93" id="lnk35"><path codeLine="93" d="M1200.19,216.2683 C1200.19,259.9183 1200.19,320.2983 1200.19,368.7083" fill="none" id="StatusTransitionService-to-TransitionResult" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1200.19,374.7083,1204.19,365.7083,1200.19,369.7083,1196.19,365.7083,1200.19,374.7083" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.5063" x="1154.19" y="292.0566
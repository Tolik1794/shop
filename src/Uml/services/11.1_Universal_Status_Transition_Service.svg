 x="2329.57" y="433.5234">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="2327.57" x2="2443.8229" y1="441.4766" y2="441.4766"/><line style="stroke:#181818;stroke-width:0.5;" x1="2327.57" x2="2443.8229" y1="449.4766" y2="449.4766"/></g><g class="entity" data-qualified-name="GMN68" data-source-line="133" id="ent0069"><path d="M1568.03,43.4883 L1568.03,166.6183 L1533.3,170.6183 L1568.03,174.6183 L1568.03,298.457 A0,0 0 0 0 1568.03,298.457 L1987.3645,298.457 A0,0 0 0 0 1987.3645,298.457 L1987.3645,53.4883 L1977.3645,43.4883 L1568.03,43.4883 A0,0 0 0 0 1568.03,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1977.3645,43.4883 L1977.3645,53.4883 L1987.3645,53.4883 L1977.3645,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.7065" x="1574.03" y="61.0566">Stable orchestration core.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1574.03" y="76.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.7686" x="1574.03" y="91.6777">Responsibilities:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.3071" x="1574.03" y="106.9883">1. Resolve workflow definition by subject.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7979" x="1574.03" y="122.2988">2. Resolve transition by key.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8452" x="1574.03" y="137.6094">3. Check current status is allowed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.188" x="1574.03" y="152.9199">4. Run guard pipeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4414" x="1574.03" y="168.2305">5. Run before-actions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5571" x="1574.03" y="183.541">6. Change status.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.0728" x="1574.03" y="198.8516">7. Run after-actions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.208" x="1574.03" y="214.1621">8. Delegate history recording.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.312" x="1574.03" y="229.4727">9. Dispatch domain event.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1574.03" y="244.7832">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.9302" x="1574.03" y="260.0938">It must not contain entity-specific if/else branches.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.3345" x="1574.03" y="275.4043">New entities and new transitions are added through definitions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.5371" x="1574.03" y="290.7148">and handlers, not by editing this service.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="152" id="ent0072"><path d="M483.82,801.5783 L483.82,863.6183 L449.08,867.6183 L483.82,871.6183 L483.82,934.0627 A0,0 0 0 0 483.82,934.0627 L925.5744,934.0627 A0,0 0 0 0 925.5744,934.0627 L925.5744,811.5783 L915.5744,801.5783 L483.82,801.5783 A0,0 0 0 0 483.82,801.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M915.5744,801.5783 L915.5744,811.5783 L925.5744,811.5783 L915.5744,801.5783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.5439" x="489.82" y="819.1466">Use named transitions, not direct status assignment.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="489.82" y="834.4572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.6304" x="489.82" y="849.7677">Example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.103" x="489.82" y="865.0783">- confirm: draft -&gt; confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.4473" x="489.82" y="880.3888">- return_to_draft: confirmed -&gt; draft</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="489.82" y="895.6994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.5259" x="489.82" y="911.0099">Forward and backward transitions are separate business rules.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.7544" x="489.82" y="926.3205">A reverse transition is not automatically the mirror of forward one.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="163" id="ent0075"><path d="M1680.11,574.0083 L1680.11,643.6183 L1645.33,647.6183 L1680.11,651.6183 L1680.11,721.8032 A0,0 0 0 0 1680.11,721.8032 L2047.2858,721.8032 A0,0 0 0 0 2047.2858,721.8032 L2047.2858,584.0083 L2037.2858,574.0083 L1680.11,574.0083 A0,0 0 0 0 1680.11,574.0083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2037.2858,574.0083 L2037.2858,584.0083 L2047.2858,584.0083 L2037.2858,574.0083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.876" x="1686.11" y="591.5766">Per-entity extension point.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1686.11" y="606.8872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.0396" x="1686.11" y="622.1977">A workflow definition owns:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.4917" x="1686.11" y="637.5083">- allowed transitions for one subject type</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.0015" x="1686.11" y="652.8188">- selected guards/actions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9141" x="1686.11" y="668.1294">- history recorder choice</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1686.11" y="683.4399">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.1758" x="1686.11" y="698.7505">Future entities plug in by adding a new definition class</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.3408" x="1686.11" y="714.061">and registering it in WorkflowRegistry.</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="175" id="ent0078"><path d="M2162.7,809.2383 L2162.7,863.6183 L2127.64,867.6183 L2162.7,871.6183 L2162.7,926.4121 A0,0 0 0 0 2162.7,926.4121 L2580.7078,926.4121 A0,0 0 0 0 2580.7078,926.4121 L2580.7078,819.2383 L2570.7078,809.2383 L2162.7,809.2383 A0,0 0 0 0 2162.7,809.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2570.7078,809.2383 L2570.7078,819.2383 L2580.7078,819.2383 L2570.7078,809.2383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.0225" x="2168.7" y="826.8066">History strategy extension point.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2168.7" y="842.1172">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.0078" x="2168.7" y="857.4277">- OrderHistoryRecorder writes rich OrderHistory timeline rows.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5972" x="2168.7" y="872.7383">- GenericStatusHistoryRecorder writes StatusHistory rows</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.3462" x="2176.9266" y="888.0488">for Purchase, InventoryDocument and ProductionOrder.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2168.7" y="903.3594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.9644" x="2168.7" y="918.6699">The core transition service does not know which table is used.</text></g><g class="entity" data-qualified-name="GMN80" data-source-line="185" id="ent0081"><path d="M2102.52,1132.8183 L2102.52,1265.3027 L2524.8823,1265.3027 L2524.8823,1142.8183 L2514.8823,1132.8183 L2102.52,1132.8183" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2514.8823,1132.8183 L2514.8823,1142.8183 L2524.8823,1142.8183 L2514.8823,1132.8183" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.5562" x="2108.52" y="1150.3866">Order cancel side effect.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2108.52" y="1165.6972">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.2036" x="2108.52" y="1181.0077">If shippedQuantity - returnedQuantity &gt; 0,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.0273" x="2108.52" y="1196.3183">create one draft CUSTOMER_RETURN with IN lines.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2108.52" y="1211.6288">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.8379" x="2108.52" y="1226.9394">It never posts stock immediately.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.3623" x="2108.52" y="1242.2499">Existing draft customer return lines are skipped per order entry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.3369" x="2108.52" y="1257.5605">to keep cancel idempotent for open warehouse work.</text></g><g class="entity" data-qualified-name="GMN83" data-source-line="196" id="ent0084"><path d="M2141.27,1325.2983 L2141.27,1580.267 L2486.1274,1580.267 L2486.1274,1335.2983 L2476.1274,1325.2983 L2141.27,1325.2983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2476.1274,1325.2983 L2476.1274,1335.2983 L2486.1274,1335.2983 L2476.1274,1325.2983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.0786" x="2147.27" y="1342.8666">Execution pipeline:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2147.27" y="1358.1772">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.2568" x="2147.27" y="1373.4877">apply(subject, transitionKey, context)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.0044" x="2155.4966" y="1388.7983">-&gt; workflowRegistry.getFor(subject)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.063" x="2155.4966" y="1404.1088">-&gt; definition.getTransition(transitionKey)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1279" x="2155.4966" y="1419.4194">-&gt; guards.assertAllowed(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0059" x="2155.4966" y="1434.7299">-&gt; begin transaction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.8472" x="2155.4966" y="1450.0405">-&gt; beforeActions.execute(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.6597" x="2155.4966" y="1465.351">-&gt; subject.setStatusValue(toStatus)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.4785" x="2155.4966" y="1480.6616">-&gt; afterActions.execute(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.167" x="2155.4966" y="1495.9721">-&gt; historyRecorder.record(...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.5068" x="2155.4966" y="1511.2827">-&gt; commit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.166" x="2155.4966" y="1526.5932">-&gt; dispatch domain event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2147.27" y="1541.9038">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.8574" x="2147.27" y="1557.2143">can(...) runs the same resolution and guard checks,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.0259" x="2147.27" y="1572.5248">but never mutates the subject.</text></g><g class="entity" data-qualified-name="GMN86" data-source-line="215" id="ent0087"><path d="M2099,1640.2683 L2099,1864.6159 L2528.4019,1864.6159 L2528.4019,1650.2683 L2518.4019,1640.2683 L2099,1640.2683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2518.4019,1640.2683 L2518.4019,1650.2683 L2528.4019,1650.2683 L2518.4019,1640.2683" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.0317" x="2105" y="1657.8366">Suggested implementation rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="2105" y="1673.1472">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.7275" x="2105" y="1688.4577">1. Prefer explicit handler classes over anonymous callbacks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.439" x="2117.3398" y="1703.7683">for business rules that matter.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.4019" x="2105" y="1719.0788">2. Builder/DSL may be used only to assemble definitions cleanly.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.7119" x="2105" y="1734.3894">3. Keep workflow definitions declarative;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.4404" x="2117.3398" y="1749.6999">put heavy business logic into guard/action services.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.8115" x="2105" y="1765.0105">4. Keep transition keys stable once exposed to UI/API.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.52" x="2105" y="1780.321">5. Every direct status write outside the service should be treated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.6543" x="2117.3398" y="1795.6316">as a bug unless it is object construction/default initialization.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.7007" x="2105" y="1810.9421">6. Add tests at three levels:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3989" x="2117.3398" y="1826.2527">- definition graph tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.022" x="2117.3398" y="1841.5632">- guard/action unit tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.7329" x="2117.3398" y="1856.8738">- service integration tests with history assertions.</text></g><!--reverse link WorkflowSubjectInterface to Order--><g class="link" data-entity-1="ent0002" data-entity-2="ent0029" data-link-type="extension" data-source-line="90" id="lnk30"><path codeLine="90" d="M2034.64,235.2483 C2034.64,311.3583 2034.64,436.6183 2034.64,436.6183 C2034.64,436.6183 2025.42,436.6183 2015.63,436.6183" fill="none" id="WorkflowSubjectInterface-backto-Order" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="2034.64,217.2483,2028.64,235.2483,2040.64,235.2483,2034.64,217.2483" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link WorkflowSubjectInterface to Purchase--><g class="link" data-entity-1="ent0002" data-entity-2="ent0031" data-link-type="extension" data-source-line="91" id="lnk32"><path codeLine="91" d="M2083.7,235.1783 C2083.7,293.0683 2083.7,371.8683 2083.7,414.7083" fill="none" id="WorkflowSubjectInterface-backto-Purchase" style="stroke:#181818;stroke-width:1;stroke-dasharray
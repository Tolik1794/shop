<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="794px" preserveAspectRatio="none" style="width:1799px;height:794px;background:#FFFFFF;" version="1.1" viewBox="0 0 1799 794" width="1799px" zoomAndPan="magnify"><title>10. Production recipes and production orders</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="327.7764" x="729.0075" y="23.5352">10. Production recipes and production orders</text></g><!--class ProductionOrderStatus--><g class="entity" data-qualified-name="ProductionOrderStatus" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="141.418" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="159.8223" x="183.68" y="164.0805"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.8223" x="186.68" y="182.6156">ProductionOrderStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="184.68" x2="342.5023" y1="190.5688" y2="190.5688"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32.6553" x="189.68" y="208.1039">draft</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.5781" x="189.68" y="224.5922">planned</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.5791" x="189.68" y="241.0805">materials_reserved</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.4063" x="189.68" y="257.5688">in_progress</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.3467" x="189.68" y="274.057">completed</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.219
modifier="IE_MANDATORY"><ellipse cx="389.01" cy="270.026" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="398.01" y="273.817">store: Store</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.5449" x="398.01" y="290.3053">createdAt: DateTimeImmutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.1572" x="398.01" y="306.7936">updatedAt: DateTimeImmutable</text></g><!--class ProductionRecipeItem--><g class="entity" data-qualified-name="ProductionRecipeItem" data-source-line="27" id="ent0004"><rect fill="#F1F1F1" height="108.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.0068" x="857.59" y="414.9605"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.9297" x="880.6286" y="433.4956">ProductionRecipeItem</text><line style="stroke:#181818;stroke-width:0.5;" x1="858.59" x2="1050.5968" y1="441.4488" y2="441.4488"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="868.59" cy="455.1929" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="877.59" y="458.9839">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="858.59" x2="1050.5968" y1="465.937" y2="465.937"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="868.59" cy="479.6812" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.3838" x="877.59" y="483.4722">quantity: decimal(14,4)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="868.59" cy="496.1695" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.0068" x="877.59" y="499.9605">recipe: ProductionRecipe</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="868.59" cy="512.6577" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.2246" x="877.59" y="516.4488">material: Product</text></g><!--class ProductionOrder--><g class="entity" data-qualified-name="ProductionOrder" data-source-line="35" id="ent0005"><rect fill="#F1F1F1" height="190.8828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="262.7012" x="368.24" y="373.7405"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.2529" x="443.4641" y="392.2756">ProductionOrder</text><line style="stroke:#181818;stroke-width:0.5;" x1="369.24" x2="629.9412" y1="400.2288" y2="400.2288"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="379.24" cy="413.9729" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="388.24" y="417.7639">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="369.24" x2="629.9412" y1="424.717" y2="424.717"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="379.24" cy="438.4612" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.876" x="388.24" y="442.2522">number: string(255)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="379.24" cy="454.9495" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.8477" x="388.24" y="458.7405">status: ProductionOrderStatus</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="379.24" cy="471.4377" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.0264" x="388.24" y="475.2288">plannedQuantity: decimal(14,4)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.7012" x="388.24" y="491.717">completedQuantity: decimal(14,4)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="379.24" cy="504.4143" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.8799" x="388.24" y="508.2053">product: Product</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.875" x="388.24" y="524.6936">warehouse: Warehouse?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.9131" x="388.24" y="541.1819">recipe: ProductionRecipe?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="379.24" cy="553.8791" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2646" x="388.24" y="557.6702">store: Store</text></g><!--class ProductionOrderMaterial--><g class="entity" data-qualified-name="ProductionOrderMaterial" data-source-line="48" id="ent0006"><rect fill="#F1F1F1" height="141.418" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="261.3203" x="823.93" y="635.4705"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.6328" x="871.2738" y="654.0056">ProductionOrderMaterial</text><line style="stroke:#181818;stroke-width:0.5;" x1="824.93" x2="1084.2503" y1="661.9588" y2="661.9588"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="834.93" cy="675.7029" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6895" x="843.93" y="679.4939">id: int</text><line style="stroke:#181818;stroke-width:1;" x1="824.93" x2="1084.2503" y1="686.447" y2="686.447"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="834.93" cy="700.1912" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.0264" x="843.93" y="703.9822">plannedQuantity: decimal(14,4)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.3203" x="843.93" y="720.4705">consumedQuantity: decimal(14,4)?</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="834.93" cy="733.1677" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234.4385" x="843.93" y="736.9588">productionOrder: ProductionOrder</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="834.93" cy="749.656" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.2246" x="843.93" y="753.447">material: Product</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234.1924" x="843.93" y="769.9353">recipeItem: ProductionRecipeItem?</text></g><!--class Store--><g class="entity" data-qualified-name="Store" data-source-line="58" id="ent0007"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="40.9043" x="237.14" y="53.3505"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.9043" x="240.14" y="71.8856">Store</text><line style="stroke:#181818;stroke-width:0.5;" x1="238.14" x2="277.0443" y1="79.8388" y2="79.8388"/><line style="stroke:#181818;stroke-width:0.5;" x1="238.14" x2="277.0443" y1="87.8388" y2="87.8388"/></g><!--class Product--><g class="entity" data-qualified-name="Product" data-source-line="60" id="ent0010"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="57.9736" x="920.6" y="53.3505"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.9736" x="923.6" y="71.8856">Product</text><line style="stroke:#181818;stroke-width:0.5;" x1="921.6" x2="977.5736" y1="79.8388" y2="79.8388"/><line style="stroke:#181818;stroke-width:0.5;" x1="921.6" x2="977.5736" y1="87.8388" y2="87.8388"/></g><!--class InventoryDocument--><g class="entity" data-qualified-name="InventoryDocument" data-source-line="69" id="ent0020"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="139.0752" x="430.05" y="684.9305"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0752" x="433.05" y="703.4656">InventoryDocument</text><line style="stroke:#181818;stroke-width:0.5;" x1="431.05" x2="568.1252" y1="711.4188" y2="711.4188"/><line style="stroke:#181818;stroke-width:0.5;" x1="431.05" x2="568.1252" y1="719.4188" y2="719.4188"/></g><!--class Warehouse--><g class="entity" data-qualified-name="Warehouse" data-source-line="70" id="ent0022"><rect fill="#F1F1F1" height="42.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="80.1494" x="68.52" y="213.5405"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.1494" x="71.52" y="232.0756">Warehouse</text><line style="stroke:#181818;stroke-width:0.5;" x1="69.52" x2="147.6694" y1="240.0287" y2="240.0287"/><line style="stroke:#181818;stroke-width:0.5;" x1="69.52" x2="147.6694" y1="248.0287" y2="248.0287"/></g><g class="entity" data-qualified-name="GMN24" data-source-line="73" id="ent0025"><path d="M727.96,160.8905 L727.96,205.7305 L621.66,209.7305 L727.96,213.7305 L727.96,308.6854 A0,0 0 0 0 727.96,308.6854 L1171.2124,308.6854 A0,0 0 0 0 1171.2124,308.6854 L1171.2124,170.8905 L1161.2124,160.8905 L727.96,160.8905 A0,0 0 0 0 727.96,160.8905" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1161.2124,160.8905 L1161.2124,170.8905 L1171.2124,170.8905 L1161.2124,160.8905" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6445" x="733.96" y="178.4588">Current project status:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.1626" x="733.96" y="193.7694">- Production entities are not implemented.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.9487" x="733.96" y="209.0799">- Product has canBeManufactured and productKind.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="733.96" y="224.3905">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="733.96" y="239.701">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.0928" x="733.96" y="255.0116">- Recipe belongs to produced product and store.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.1997" x="733.96" y="270.3221">- Recipe items are material/component products.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.2524" x="733.96" y="285.6327">- Product with productKind=service should not be material/output</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.3423" x="742.1866" y="300.9432">unless business rules explicitly allow it.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="85" id="ent0028"><path d="M1348.39,418.2505 L1348.39,520.1138 L1792.7914,520.1138 L1792.7914,428.2505 L1782.7914,418.2505 L1348.39,418.2505" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1782.7914,418.2505 L1782.7914,428.2505 L1792.7914,428.2505 L1782.7914,418.2505" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.9043" x="1354.39" y="435.8188">Required behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.3647" x="1354.39" y="451.1294">- Order copies recipe items into ProductionOrderMaterial.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.4932" x="1354.39" y="466.4399">- Materials can be reserved before production.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="417.2505" x="1354.39" y="481.7505">- Starting production consumes materials via InventoryDocument.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.0239" x="1354.39" y="497.061">- Completing production posts output via InventoryDocument.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.4014" x="1354.39" y="512.3716">- Losses/extra consumption are stock documents, not direct edits.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="94" id="ent0031"><path d="M1353.37,624.6205 L1353.37,787.7259 L1787.8119,787.7259 L1787.8119,634.6205 L1777.8119,624.6205 L1353.37,624.6205" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1777.8119,624.6205 L1777.8119,634.6205 L1787.8119,634.6205 L1777.8119,624.6205" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.5581" x="1359.37" y="642.1888">Suggested implementation steps:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1359.37" y="657.4994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.4751" x="1359.37" y="672.8099">1. Add ProductionRecipe and ProductionRecipeItem CRUD.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.1616" x="1359.37" y="688.1205">2. Add ProductionOrder and ProductionOrderMaterial entities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.3618" x="1359.37" y="703.431">3. Add service to create ProductionOrder from recipe.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.2603" x="1359.37" y="718.7416">4. Integrate material reservation after StockReservation stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.855" x="1359.37" y="734.0521">5. Integrate consumption/output after InventoryDocument stage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.4419" x="1359.37" y="749.3627">6. Add tests for recipe copy, status transitions and stock posting.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1359.37" y="764.6732">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.8955" x="1359.37" y="779.9838">This stage should be done after inventory and reservations.</text></g><!--link Store to ProductionRecipe--><g class="link" data-entity-1="ent0007" data-entit